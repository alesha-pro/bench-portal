<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hanafubuki</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='28' fill='%23f3b7c4'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-BMrPgIA0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DprE0Wbv.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="grade"></div>
  <div id="letterbox" aria-hidden="true"><i></i><i></i></div>
  <div id="hurt"></div>

  <div id="hud">
    <div class="brand">
      <div class="jp">花吹雪</div>
      <div class="meta" id="duel">Duel 1  /  3</div>
    </div>
    <div id="banner"></div>
    <div class="plate player">
      <div class="name">Aoi</div>
      <div class="track"><span id="php"></span></div>
      <div class="track thin"><span id="ppost"></span></div>
    </div>
    <div class="plate foe" id="foe" hidden>
      <div class="name" id="fname">Ronin</div>
      <div class="track foe-hp"><span id="ehp"></span></div>
      <div class="track thin"><span id="epost"></span></div>
    </div>
    <div id="hint">WASD move · click cut · right click parry · shift dash · H hides the frame</div>
    <div id="chevron" hidden></div>
  </div>

  <div id="title">
    <div class="veil"></div>
    <div class="title-inner">
      <p class="eyebrow">South Court</p>
      <h1>花吹雪</h1>
      <p class="romaji">Hanafubuki</p>
      <p class="tag">A duel beneath a sky of falling flowers.</p>
      <button id="start" type="button">Enter the court</button>
      <ul class="keys">
        <li><b>WASD</b> move</li>
        <li><b>Click</b> cut</li>
        <li><b>Right click</b> parry</li>
        <li><b>Shift</b> dash</li>
      </ul>
    </div>
  </div>

  <div id="end" hidden>
    <div class="veil"></div>
    <div class="title-inner">
      <p class="eyebrow">South Court</p>
      <h2 id="end-title"></h2>
      <p id="end-body"></p>
      <button id="again" type="button">Again</button>
    </div>
  </div>

  <div id="probe"></div>
</body>
</html>
