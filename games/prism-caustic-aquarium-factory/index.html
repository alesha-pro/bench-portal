<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Aquarium</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#04060a;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
#c.move{cursor:move}
#c.drag{cursor:grabbing}
#c.drag.aim{cursor:crosshair}
#hint{position:fixed;left:0;right:0;bottom:26px;padding:0 24px;text-align:center;font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(215,232,255,.62);pointer-events:none;opacity:0;transition:opacity 1.6s ease;text-shadow:0 0 14px rgba(0,0,0,.9)}
#hint span{display:inline-block;white-space:nowrap;margin:0 .9em}
#hint.show{opacity:1;transition:opacity .5s ease}
#mode{position:fixed;left:0;right:0;top:22px;text-align:center;font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.26em;text-transform:uppercase;color:rgba(215,232,255,.55);pointer-events:none;opacity:0;transition:opacity .6s ease;text-shadow:0 0 14px rgba(0,0,0,.9)}
#mode.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mode">move light · L</div>
<div id="hint"><span>drag · orbit</span><span>wheel · zoom</span><span>shift / right-drag / L · move light</span><span>shift+wheel · distance</span><span>1 2 3 · lighting</span><span>R · reset light</span><span>space · pause</span></div>
<script>
"use strict";
// PRISM AQUARIUM - single-file WebGL2. One SDF scene (glass tank, water, rotating glass cube, crystal
// prism) raymarched per spectral channel for dispersion; chromatic caustics are real photon traces
// splatted into a light map; volumetric beam + drifting dust motes; ACES tone map + bloom.
// The spotlight is a movable fixture orbiting the tank (it always aims at the tank centre): beam,
// caustics, shadows and the dispersion fan are all re-traced from its current position every frame.
const $ = (id) => document.getElementById(id);
const canvas = $('c'), hint = $('hint'), modeTag = $('mode');
const HINT_HTML = hint.innerHTML;
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'high-performance'});
if (!gl) { hint.textContent = 'WebGL2 is not available in this browser'; hint.classList.add('show'); throw new Error('WebGL2 unavailable'); }
const extF = gl.getExtension('EXT_color_buffer_float');
const HDR_FMT = extF ? gl.RGBA16F : gl.RGBA8, HDR_TYPE = extF ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
const CAUSTIC_SCALE = extF ? 1.0 : 4.0;

// ================================================================== GLSL: shared scene / SDF / marching
const SDF = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler3D;
const int M_AIR=0,M_WATER=1,M_TANK=2,M_CUBE=3,M_PRISM=4,M_BUBBLE=5;
const int ID_TANK=1,ID_WATER=2,ID_CUBE=3,ID_PRISM=4,ID_SAND=5,ID_PEBBLE=6,ID_BUBBLE=7,ID_FRAME=8,ID_TABLE=9,ID_BULB=10;
const vec3 TANK_C=vec3(0.0,1.82,0.0);
const vec3 TANK_H=vec3(3.0,1.7,1.8);
const vec3 TANK_IH=vec3(2.93,1.63,1.73);
const float WATER_TOP=3.12;
const float FLOOR_Y=0.19;
const vec3 BOUND_C=vec3(0.0,1.5,0.0);
const float BOUND_R=6.6;
const vec2 BUB_COL=vec2(-2.15,-1.1);
const vec2 PEB_CS=vec2(1.47,1.15);
const vec2 PEB_ORG=vec2(-2.94,-1.15);
const float BULB_R=0.06;
uniform float uTime;
// Movable spotlight (a follow spot). uLightDir is the beam direction (scene -> fixture, as for a distant
// light); the fixture uLightPos always aims at the tank centre, uLightDist away. Far from the tank the
// beam is collimated, with an elliptical cross-section uLightFoot along uLightT1 (vertical plane) and
// uLightT2 (horizontal). Brought close, the same beam turns into a cone from the bulb: uLightLens is the
// fraction of the cross-section the lens still has, and the rays converge on a virtual apex uLightApex
// (uLightConeP = apex -> fixture, apex -> aim point distances; uLightCone selects the perspective maths).
uniform vec3 uLightDir;
uniform vec3 uLightPos;
uniform vec3 uLightT1;
uniform vec3 uLightT2;
uniform vec2 uLightFoot;
uniform float uLightDist,uLightLens,uBulbSolid;
uniform vec3 uLightApex;
uniform vec2 uLightConeP;
uniform float uLightCone;
uniform vec3 uLightCol;
uniform vec3 uWaterAbs;
uniform mat3 uCubeM;
uniform vec3 uCubePos;
uniform mat3 uPrismM;
uniform vec3 uPrismPos;
int gCh;

float hash11(float p){p=fract(p*0.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float sdRoundBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r;}
float sdRect2(vec2 p){return length(max(p,0.0))+min(max(p.x,p.y),0.0);}
// Spotlight beam seen from the fixture: full inside 70% of the elliptical cross-section, soft edge to
// the rim, and nothing upstream of the fixture (that is where the beam starts).
float spotW(vec3 p){
  vec3 v=p-uLightPos;
  vec2 q;
  if(uLightCone<0.5){
    q=vec2(dot(v,uLightT1),dot(v,uLightT2))/uLightFoot;
  }else{
    // cone: the cross-section grows linearly with the distance from the virtual apex
    vec3 w=p-uLightApex;
    q=vec2(dot(w,uLightT1),dot(w,uLightT2))/uLightFoot*(uLightConeP.y/max(uLightConeP.x-dot(v,uLightDir),1e-4));
  }
  return (1.0-smoothstep(0.7,1.0,dot(q,q)))*step(dot(v,uLightDir),0.0);
}
// Where the light ray through q (a point of the water) lands on the light map plane (y = 0).
vec2 shadowXZ(vec3 q){
  if(uLightCone<0.5)return q.xz-uLightDir.xz*(q.y/uLightDir.y);
  return uLightApex.xz+(q.xz-uLightApex.xz)*(uLightApex.y/max(uLightApex.y-q.y,1e-3));
}

float waveH(vec2 q){
  float t=uTime,h=0.0;
  h+=0.030*sin(dot(q,vec2(2.1,1.3))+t*0.9);
  h+=0.024*sin(dot(q,vec2(-1.6,2.4))+t*1.25);
  h+=0.020*sin(dot(q,vec2(3.7,-2.9))+t*1.6);
  h+=0.016*sin(dot(q,vec2(-5.3,-4.1))+t*2.0);
  h+=0.010*sin(dot(q,vec2(8.1,6.3))+t*2.5);
  return h;
}
vec3 waveN(vec2 q){
  float t=uTime;vec2 g=vec2(0.0);
  g+=0.030*cos(dot(q,vec2(2.1,1.3))+t*0.9)*vec2(2.1,1.3);
  g+=0.024*cos(dot(q,vec2(-1.6,2.4))+t*1.25)*vec2(-1.6,2.4);
  g+=0.020*cos(dot(q,vec2(3.7,-2.9))+t*1.6)*vec2(3.7,-2.9);
  g+=0.016*cos(dot(q,vec2(-5.3,-4.1))+t*2.0)*vec2(-5.3,-4.1);
  g+=0.010*cos(dot(q,vec2(8.1,6.3))+t*2.5)*vec2(8.1,6.3);
  return normalize(vec3(-g.x,1.0,-g.y));
}
float sandH(vec2 q){
  return FLOOR_Y+0.20+0.05*sin(q.x*5.0+1.7*sin(q.y*1.9))+0.035*sin(q.y*4.0+1.3*sin(q.x*2.3))+0.010*sin(q.x*21.0+3.0*sin(q.y*6.0));
}
float sdTank(vec3 p){
  vec3 q=p-TANK_C;
  float o=sdRoundBox(q,TANK_H,0.03);
  float i=sdRoundBox(q,TANK_IH,0.02);
  return max(max(o,-i),p.y-(TANK_C.y+TANK_H.y));
}
float sdWater(vec3 p){
  float b=sdRoundBox(p-TANK_C,TANK_IH,0.02);
  if(p.y>WATER_TOP-0.7){
    vec2 q=p.xz;
    return max(b,(p.y-WATER_TOP-waveH(q))*waveN(q).y);
  }
  return max(b,p.y-WATER_TOP+0.12);
}
float sdCube(vec3 p){return sdRoundBox(uCubeM*(p-uCubePos),vec3(0.6),0.06);}
float sdEqTri(vec2 p,float r){
  const float k=1.7320508;
  p.x=abs(p.x)-r;
  p.y=p.y+r/k;
  if(p.x+k*p.y>0.0)p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.0;
  p.x-=clamp(p.x,-2.0*r,0.0);
  return -length(p)*sign(p.y);
}
float sdPrism(vec3 p){vec3 q=uPrismM*(p-uPrismPos);return max(sdEqTri(q.xy,0.58),abs(q.z)-0.55);}
float sdSand(vec3 p){return max(p.y-sandH(p.xz),sdRoundBox(p-TANK_C,TANK_IH,0.02));}
float sdPebbles(vec3 p){
  vec2 g=(p.xz-PEB_ORG)/PEB_CS;
  vec2 id=floor(g);
  vec2 f=fract(g)-0.5;
  vec2 h2=hash22(id);
  float on=step(0.3,hash12(id+7.3));
  vec2 c=(h2-0.5)*0.5;
  float r=0.07+0.11*hash12(id+3.1);
  vec3 rr=r*vec3(0.85+0.5*hash12(id+1.0),0.62+0.25*hash12(id+4.4),0.85+0.4*hash12(id+2.0));
  vec2 cxz=PEB_ORG+(id+0.5+c)*PEB_CS;
  on*=step(abs(cxz.x),TANK_IH.x-0.05)*step(abs(cxz.y),TANK_IH.z-0.05);
  vec3 ctr=vec3(cxz.x,sandH(cxz)+rr.y*0.35-10.0*(1.0-on),cxz.y);
  vec3 pp=(p-ctr)/rr;
  return (length(pp)-1.0)*min(rr.x,min(rr.y,rr.z));
}
float sdBubbles(vec3 p){
  float d=1e9;
  for(int k=0;k<6;k++){
    float fk=float(k);
    float hs=hash11(fk+1.7);
    float ph=fract(uTime*(0.085+0.05*hs)+fk*0.37+hs);
    float y=0.42+ph*(WATER_TOP-0.62);
    vec2 wob=(0.05+0.06*hs)*vec2(sin(y*4.0+fk*1.3+uTime*0.7),cos(y*3.3+fk*2.1+uTime*0.5));
    float r=(0.026+0.034*ph)*(0.7+0.6*hash11(fk+4.2))*smoothstep(0.0,0.05,ph)*(1.0-smoothstep(0.95,1.0,ph));
    d=min(d,length(p-vec3(BUB_COL+wob,y))-r);
  }
  return d;
}
float sdFrame(vec3 p){
  float d=sdRoundBox(p-vec3(0.0,0.06,0.0),vec3(3.12,0.06,1.92),0.02);
  vec2 q=abs(p.xz)-vec2(TANK_H.x-0.045,TANK_H.z-0.045);
  float ring=abs(sdRect2(q))-0.05;
  ring=max(ring,-(q.x+0.085));
  ring=max(ring,-(q.y+0.085));
  d=min(d,max(ring,abs(p.y-1.83)-1.71));
  vec2 q2=abs(p.xz)-vec2(TANK_H.x+0.01,TANK_H.z+0.01);
  float rim=abs(sdRect2(q2))-0.055;
  d=min(d,max(rim,abs(p.y-3.57)-0.07));
  return d;
}
float sdTable(vec3 p){return sdRoundBox(p-vec3(0.0,-0.2,0.0),vec3(5.0,0.2,3.5),0.03);}
float map(vec3 p,out int id){
  float d=abs(sdTank(p));id=ID_TANK;
  float t=sdTable(p);if(t<d){d=t;id=ID_TABLE;}
  float f=sdFrame(p);if(f<d){d=f;id=ID_FRAME;}
  float w=abs(sdWater(p));if(w<d){d=w;id=ID_WATER;}
  float b=length(p-uCubePos)-1.15;
  if(b<d){float c=abs(sdCube(p));if(c<d){d=c;id=ID_CUBE;}}
  b=length(p-uPrismPos)-0.82;
  if(b<d){float c=abs(sdPrism(p));if(c<d){d=c;id=ID_PRISM;}}
  if(p.y-0.8<d){
    float s=abs(sdSand(p));if(s<d){d=s;id=ID_SAND;}
    float pb=abs(sdPebbles(p));if(pb<d){d=pb;id=ID_PEBBLE;}
  }
  if(p.y-(WATER_TOP-0.1)<d&&0.35-p.y<d&&length(p.xz-BUB_COL)-0.15<d){
    float bb=abs(sdBubbles(p));if(bb<d){d=bb;id=ID_BUBBLE;}
  }
  return d;
}
bool march(vec3 ro,vec3 rd,int steps,float eps,out float t,out int id){
  vec3 oc=ro-BOUND_C;
  float b=dot(oc,rd);
  float c=dot(oc,oc)-BOUND_R*BOUND_R;
  float h=b*b-c;
  if(h<0.0)return false;
  h=sqrt(h);
  float t0=max(-b-h,0.0);
  float t1=min(-b+h,60.0);
  if(t0>t1)return false;
  t=t0;
  for(int i=0;i<128;i++){
    if(i>=steps)break;
    float m=map(ro+rd*t,id);
    if(m<eps*clamp(t,1.0,4.0))return true;
    t+=m*0.9;
    if(t>t1)break;
  }
  return false;
}
float sdObj(int id,vec3 p){
  if(id==ID_TANK)return sdTank(p);
  if(id==ID_WATER)return sdWater(p);
  if(id==ID_CUBE)return sdCube(p);
  if(id==ID_PRISM)return sdPrism(p);
  if(id==ID_SAND)return sdSand(p);
  if(id==ID_PEBBLE)return sdPebbles(p);
  if(id==ID_BUBBLE)return sdBubbles(p);
  if(id==ID_FRAME)return sdFrame(p);
  if(id==ID_BULB)return length(p-uLightPos)-BULB_R;
  return sdTable(p);
}
vec3 calcNormal(vec3 p,int id){
  if(id==ID_WATER&&p.y>WATER_TOP-0.3)return waveN(p.xz);
  const float e=0.002;
  return normalize(vec3(sdObj(id,p+vec3(e,0.0,0.0))-sdObj(id,p-vec3(e,0.0,0.0)),sdObj(id,p+vec3(0.0,e,0.0))-sdObj(id,p-vec3(0.0,e,0.0)),sdObj(id,p+vec3(0.0,0.0,e))-sdObj(id,p-vec3(0.0,0.0,e))));
}
bool isOpaque(int id){return id==ID_SAND||id==ID_PEBBLE||id==ID_FRAME||id==ID_TABLE||id==ID_BULB;}
int medOf(int id){if(id==ID_WATER)return M_WATER;if(id==ID_TANK)return M_TANK;if(id==ID_CUBE)return M_CUBE;if(id==ID_PRISM)return M_PRISM;return M_BUBBLE;}
float iorOf(int med,int ch){
  float d=float(ch-1);
  if(med==M_WATER)return 1.333+0.003*d;
  if(med==M_TANK)return 1.50+0.007*d;
  if(med==M_CUBE)return 1.52+0.009*d;
  if(med==M_PRISM)return 1.78+0.018*d;
  return 1.0;
}
float absorbOf(int med,int ch){
  if(med==M_WATER)return ch==0?uWaterAbs.r:(ch==1?uWaterAbs.g:uWaterAbs.b);
  if(med==M_PRISM)return ch==0?0.05:(ch==1?0.012:0.03);
  if(med==M_CUBE)return 0.02;
  if(med==M_TANK)return 0.03;
  return 0.0;
}
int mediumAt(vec3 q){
  if(sdCube(q)<0.0)return M_CUBE;
  if(sdPrism(q)<0.0)return M_PRISM;
  if(sdBubbles(q)<0.0)return M_BUBBLE;
  if(sdWater(q)<0.0)return M_WATER;
  if(sdTank(q)<0.0)return M_TANK;
  return M_AIR;
}
float fresnel(float cosI,float eta){
  float sin2T=eta*eta*(1.0-cosI*cosI);
  if(sin2T>=1.0)return 1.0;
  float cosT=sqrt(1.0-sin2T);
  float rs=(eta*cosI-cosT)/(eta*cosI+cosT);
  float rp=(cosI-eta*cosT)/(cosI+eta*cosT);
  return 0.5*(rs*rs+rp*rp);
}
struct Hit{float t;int id;vec3 p;vec3 n;int med;float F;vec3 refr;};
// Interface data for a hit on a transparent surface (normal facing the ray, medium beyond, Fresnel, refraction).
void setupInterface(inout Hit h,vec3 rd,int med){
  vec3 n=calcNormal(h.p,h.id);
  bool entering=dot(n,rd)<0.0;
  h.n=entering?n:-n;
  h.med=entering?medOf(h.id):mediumAt(h.p-h.n*0.02);
  float eta=iorOf(med,gCh)/iorOf(h.med,gCh);
  h.F=fresnel(dot(-rd,h.n),eta);
  h.refr=refract(rd,h.n,eta);
}
// The emitter bulb: a small emissive sphere at the fixture, intersected analytically (the marcher never
// pays for it). Photons ignore it, so the bulb cannot shadow its own beam.
bool intersect(vec3 ro,vec3 rd,int med,int steps,float eps,out Hit h){
  if(uBulbSolid>0.5){
    vec3 oc=ro-uLightPos;
    float b=dot(oc,rd),c=dot(oc,oc)-BULB_R*BULB_R,d=b*b-c;
    if(d>0.0){
      float tb=-b-sqrt(d);
      if(tb>0.002){h.t=tb;h.id=ID_BULB;h.p=ro+rd*tb;return true;}
    }
  }
  float t;int id;
  if(!march(ro,rd,steps,eps,t,id))return false;
  h.t=t;h.id=id;h.p=ro+rd*t;
  if(!isOpaque(id))setupInterface(h,rd,med);
  return true;
}
// A tank wall just entered is crossed analytically: the far face is parallel, 0.07 away.
// Falls back to marching whenever the geometry does not match (corners, grazing rays).
bool wallExit(vec3 ro,vec3 rd,vec3 n,int med,out Hit h){
  float c=-dot(rd,n);
  if(c<0.08)return false;
  float t=0.07/c;
  vec3 p=ro+rd*t;
  if(abs(sdTank(p))>0.004)return false;
  vec3 n0=calcNormal(p,ID_TANK);
  if(dot(n0,n)>-0.8)return false;
  h.t=t;h.id=ID_TANK;h.p=p;
  setupInterface(h,rd,med);
  return true;
}
`;

// ================================================================== GLSL: main raymarched scene
const MAIN = SDF + `
uniform sampler2D uCaustic;
uniform sampler3D uDust;
uniform vec3 uCamPos,uCamRight,uCamUp,uCamFwd;
uniform float uFl;
uniform vec2 uRes;
uniform vec3 uAmbient,uBgTop,uBgBot,uEnvADir,uEnvACol,uEnvBDir,uEnvBCol;
uniform float uSoftbox,uScatter,uTableAlb,uCausticScale,uDustGain,uBulb,uSoftboxW;
out vec4 fragColor;
bool gVol;
float pick(vec3 v){return gCh==0?v.r:(gCh==1?v.g:v.b);}
// The room seen from ro. (1) The studio softbox the glass and water reflect: a distant source, so it
// follows the beam direction; it fades out as the fixture is brought up to the tank (the softbox gives
// way to the bare bulb). (2) The bulb's share of a reflection that is not worth a full trace - the bulb
// itself is real geometry, see intersect(). No halo here: rays passing next to it would pick that up.
vec3 env(vec3 ro,vec3 rd){
  vec3 c=mix(uBgBot,uBgTop,smoothstep(-0.5,0.8,rd.y));
  c+=uLightCol*smoothstep(0.90,0.985,dot(rd,uLightDir))*uSoftbox*uSoftboxW;
  vec3 lv=uLightPos-ro;
  float ll=max(length(lv),1e-3);
  float ca=dot(rd,lv/ll);
  float br=min(BULB_R*BULB_R/(ll*ll),0.01);
  float bl=smoothstep(1.0-0.61*br,1.0-0.5*br,ca);
  c+=uLightCol/max(dot(uLightCol,vec3(0.2126,0.7152,0.0722)),1e-3)*(bl*bl*uBulb);
  c+=uEnvACol*pow(max(dot(rd,uEnvADir),0.0),110.0);
  c+=uEnvBCol*pow(max(dot(rd,uEnvBDir),0.0),160.0);
  return c;
}
float envc(vec3 ro,vec3 rd){return pick(env(ro,rd));}
vec3 sampleCaustic(vec2 xz,float lod){return textureLod(uCaustic,xz/12.0+0.5,lod).rgb*uCausticScale;}
float mediumTint(int med){
  if(med==M_WATER)return pick(exp(-2.0*uWaterAbs));
  if(med==M_PRISM)return 0.92;
  return 1.0;
}
vec3 pebbleColor(vec3 p){
  vec2 id=floor((p.xz-PEB_ORG)/PEB_CS);
  float h=hash12(id+5.5);
  vec3 a=vec3(0.55,0.50,0.46),b=vec3(0.78,0.56,0.50),c=vec3(0.30,0.38,0.46);
  return h<0.4?mix(a,b,h/0.4):mix(b,c,(h-0.4)/0.6);
}
vec3 shadeOpaque(vec3 p,vec3 n,vec3 rd,int id,out float rw){
  rw=0.0;
  vec3 L=uLightDir;
  vec3 H=normalize(L-rd);
  if(id==ID_BULB)return uLightCol/max(dot(uLightCol,vec3(0.2126,0.7152,0.0722)),1e-3)*uBulb;
  if(id==ID_SAND){
    vec3 alb=vec3(0.80,0.72,0.56)*(0.94+0.09*hash12(floor(p.xz*22.0)));
    vec3 E=sampleCaustic(p.xz,0.0)*(0.6+0.4*max(n.y,0.0));
    return alb*(E+uAmbient*0.45);
  }
  if(id==ID_PEBBLE){
    vec3 alb=pebbleColor(p);
    vec3 C=sampleCaustic(p.xz,0.5);
    vec3 E=C*(0.4+0.6*max(dot(n,L),0.0)/max(L.y,0.3));
    float spec=pow(max(dot(n,H),0.0),80.0)*2.0;
    return alb*(E+uAmbient*0.5)+C*spec;

// Light shafts come from the light map projected along the beam; dust motes from a 3D texture.
vec3 gVolRo=vec3(0.0),gVolRd=vec3(0.0);

vec3 integrateVolume(vec3 ro,vec3 rd,float len){

  float ph=0.45+1.6*pow(max(dot(rd,-L),0.0),3.0);

  vec3 c0=sampleCaustic(shadowXZ(mid),2.5);
  if(c0.r+c0.g+c0.b<0.01)return vec3(0.0);

  float T=1.0;
  vec3 drift=vec3(uTime*0.0045,-uTime*0.0075,uTime*0.003);
  for(int i=0;i<N;i++){
    vec3 q=ro+rd*(jit+dt*float(i));
    T*=exp(-dt*uWaterAbs.g);
    float dc=dot(q-uCubePos,q-uCubePos);
    if(dc<1.32&&sdCube(q)<0.0)continue;

    if(dc<0.7&&sdPrism(q)<0.0)continue;

    vec3 sw=vec3(0.006*sin(uTime*0.4+q.y*1.3),0.0,0.006*cos(uTime*0.33+q.x*1.1));

float tracePath(vec3 ro,vec3 rd){

// ================================================================== programs
function sh(type, src, name) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const l = gl.getShaderInfoLog(s); console.error(name + ' shader error: ' + l); throw new Error(name + ': ' + l); }

}
function prog(vsSrc, fsSrc, name) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc, name + '.vs'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc, name + '.fs'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { const l = gl.getProgramInfoLog(p); console.error(name + ' link error: ' + l); throw new Error(name + ': ' + l); }
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}

function makeTarget(w, h, hdr, mip) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, hdr ? HDR_FMT : gl.RGBA8, w, h, 0, gl.RGBA, hdr ? HDR_TYPE : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);

function makeDust(N) {
  const data = new Uint8Array(N * N * N);
  let s = 0x9E3779B9 | 0;
  const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) | 0; return (s >>> 0) / 4294967296; };
  const cells = N >> 1, R = 2, sig = 0.55, K = 2 * R + 1;
  const ker = new Float32Array(K * K * K);
  for (let z = -R; z <= R; z++) for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++)
    ker[((z + R) * K + (y + R)) * K + (x + R)] = Math.exp(-(x * x + y * y + z * z) / (2 * sig * sig));
  for (let cz = 0; cz < cells; cz++) for (let cy = 0; cy < cells; cy++) for (let cx = 0; cx < cells; cx++) {
    const r1 = rnd(), r2 = rnd(), r3 = rnd(), r4 = rnd(), r5 = rnd();
    if (r1 > 0.5) continue;
    const px = (cx + r2) * 2, py = (cy + r3) * 2, pz = (cz + r4) * 2;
    const amp = 70 + 185 * r5 * r5;
    const bx = Math.floor(px), by = Math.floor(py), bz = Math.floor(pz);
    for (let dz = -R; dz <= R; dz++) for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const ex = bx + dx - px, ey = by + dy - py, ez = bz + dz - pz;

  gl.uniform1f(u.uSoftbox, cur.softbox); gl.uniform1f(u.uScatter, cur.scat); gl.uniform1f(u.uTableAlb, cur.tab);
  gl.uniform1f(u.uCausticScale, CAUSTIC_SCALE); gl.uniform1f(u.uDustGain, cur.dust);
  gl.uniform1f(u.uBulb, bulb); gl.uniform1f(u.uSoftboxW, softboxW);
  bindTex(0, gl.TEXTURE_2D, caus[causIdx].tex); gl.uniform1i(u.uCaustic, 0);
  bindTex(1, gl.TEXTURE_3D, dustTex); gl.uniform1i(u.uDust, 1);
  draw(fbScene);

  // bloom chain: bright-pass/downsample, then separable Gaussian blur per level
  for (let i = 0; i < 3; i++) {
    const L = bloom[i];
    gl.useProgram(bright.p);
    bindTex(0, gl.TEXTURE_2D, i === 0 ? fbScene.tex : bloom[i - 1].a.tex); gl.uniform1i(bright.u.uTex, 0);
    gl.uniform2f(bright.u.uSize, L.w, L.h); gl.uniform1f(bright.u.uThr, i === 0 ? (extF ? cur.thr : Math.min(cur.thr, 0.6)) : 0.0);
    draw(L.a);
    gl.useProgram(blur.p);
    bindTex(0, gl.TEXTURE_2D, L.a.tex); gl.uniform1i(blur.u.uTex, 0);
    gl.uniform2f(blur.u.uSize, L.w, L.h); gl.uniform2f(blur.u.uDir, 1, 0); draw(L.b);
    bindTex(0, gl.TEXTURE_2D, L.b.tex); gl.uniform2f(blur.u.uDir, 0, 1); draw(L.a);
  }
  gl.useProgram(composite.p);
  bindTex(0, gl.TEXTURE_2D, fbScene.tex); gl.uniform1i(composite.u.uScene, 0);
  for (let i = 0; i < 3; i++) { bindTex(1 + i, gl.TEXTURE_2D, bloom[i].a.tex); gl.uniform1i(composite.u['uB' + i], 1 + i); }
  gl.uniform2f(composite.u.uSize, W, H); gl.uniform1f(composite.u.uExposure, cur.exp);
  gl.uniform1f(composite.u.uBloom, cur.bloom); gl.uniform1f(composite.u.uTime, t);
  draw(fbLDR);
  gl.useProgram(fxaa.p);
  bindTex(0, gl.TEXTURE_2D, fbLDR.tex); gl.uniform1i(fxaa.u.uTex, 0);
  gl.uniform2f(fxaa.u.uSize, W, H);
  draw(null);
}

// ================================================================== adaptive resolution + main loop
// Resolution follows the fraction of frames that miss the 20 ms budget. Long hitches (tab switches,
// screen capture) are ignored so a single stall never changes quality.
const hist = [];
let lastAdapt = 0, lastDown = -100, upAt = -100, fails = 0;
const started = perf();
function adapt(dt, now) {
  const ms = dt * 1000;
  if (ms > 60) return;
  hist.push({ t: now, ms });
  while (hist.length && now - hist[0].t > 3) hist.shift();
  if (now - started < 2.5 || now - lastAdapt < 1) return;
  const slow = (win) => { let n = 0, s = 0; for (const h of hist) if (now - h.t <= win) { n++; if (h.ms > 20) s++; } return n >= 60 ? s / n : (n ? 1 : 0); };
  if (scale > 0.5 && slow(2) > 0.4) {
    if (now - upAt < 2.5) fails++;
    scale = Math.max(0.5, scale - 0.1); resize(); lastAdapt = now; lastDown = now;
  } else if (scale < 1 && now - lastDown > 5 && fails < 2 && slow(3) < 0.03) {
    scale = Math.min(1, scale + 0.1); resize(); lastAdapt = now; upAt = now;
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastNow) lastNow = now;
  const dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;
  const dts = paused ? 0 : dt;
  simTime += dts;
  frameNo++;
  updateCamera(dt, dts);
  updateLight(dt);
  lerpPreset(dt);
  adapt(dt, now / 1000);
  renderFrame(now);
}
// warm up the light map so the caustics are present from the first visible frame
cubeM = transpose(axisAngle(0.267, 0.935, 0.235, 0));
prismM = transpose(mul3(basisFromZ(0.85, 0.3, 0.45), axisAngle(0, 0, 1, 0)));
updateLight(0);
for (let i = 0; i < 24; i++) { causAlpha = i < 6 ? 0.5 : 0.2; renderCaustics(0); frameNo++; }
causAlpha = 0.1;
requestAnimationFrame(frame);
</script>
