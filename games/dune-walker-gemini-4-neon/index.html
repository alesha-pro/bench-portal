<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DUNE WALKER</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23d9a85b'/><circle cx='16' cy='16' r='8' fill='%237d2317'/></svg>" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0906;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0906;
      overflow: hidden;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: min(100vh, calc(100vw / 2.39));
      max-width: calc(100vh * 2.39);
      background: #ddb474;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      transform: translateX(-50%);
      color: rgba(246, 224, 178, 0.72);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 8px rgba(42, 24, 10, 0.55);
      opacity: 1;
      transition: opacity 1.1s ease;
      white-space: nowrap;
    }

    #hint.hidden {
      opacity: 0;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div id="viewport"></div>
  </div>
  <div id="hint">drag to look · tap</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
