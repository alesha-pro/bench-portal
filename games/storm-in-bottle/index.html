<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171c1b" />
    <title>Storm in a Bottle · Pelagic Archive</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%231b2523'/%3E%3Cpath d='m20 4 4 12 12 4-12 4-4 12-4-12-12-4 12-4z' fill='%23d5b67a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="rose" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width=".8" />
          <circle cx="24" cy="24" r="13.5" fill="none" stroke="currentColor" stroke-width=".55" />
          <g fill="currentColor">
            <path
              d="m24 1 3.25 18.9L24 24l-3.3-4.1zM47 24l-18.9 3.25L24 24l4.1-3.3zM24 47l-3.25-18.9L24 24l3.3 4.1zM1 24l18.9-3.25L24 24l-4.1 3.3z"
            />
            <path d="m11 11 11 8-3 3zm26 0-8 11-3-3zm0 26-11-8 3-3zm-26 0 8-11 3 3z" opacity=".8" />
          </g>
        </symbol>
        <symbol id="expand" viewBox="0 0 24 24">
          <path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4" />
        </symbol>
        <symbol id="reset-icon" viewBox="0 0 24 24"><path d="M5 9a7.5 7.5 0 1 1-.1 6M4 4v5h5" /></symbol>
        <symbol id="wave" viewBox="0 0 24 24">
          <path d="M2 9q3 3.5 6 0t6 0 6 0l2-1m-20 6q3 3.5 6 0t6 0 6 0l2-1" />
        </symbol>
        <symbol id="tilt" viewBox="0 0 24 24">
          <path
            d="m7.5 12 5-5 4.5 4.5-5 5q-1 1-2 0l-2.5-2.5q-1-1 0-2zm5.7-4.3 2.2-2.3 3.2 3.2-2.3 2.2M3 11q-1 4 2 7m13-15q3 1 4 4"
          />
        </symbol>
        <symbol id="orbit" viewBox="0 0 24 24">
          <ellipse cx="12" cy="12" rx="10" ry="4.7" transform="rotate(-28 12 12)" />
          <circle cx="12" cy="12" r="1.6" fill="currentColor" />
        </symbol>
        <symbol id="sliders" viewBox="0 0 24 24">
          <path d="M3 6h5m4 0h9M3 12h11m4 0h3M3 18h2m4 0h12" />
          <circle cx="10" cy="6" r="2" />
          <circle cx="16" cy="12" r="2" />
          <circle cx="7" cy="18" r="2" />
        </symbol>
        <symbol id="play" viewBox="0 0 24 24">
          <path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="pause" viewBox="0 0 24 24"><path d="M8.5 5v14m7-14v14" stroke-width="3" /></symbol>
      </defs>
    </svg>
    <main id="stage" aria-label="Interactive ship in a bottle">
      <canvas
        id="ocean"
        aria-label="A miniature galleon sailing inside an antique bottle"
        tabindex="0"
      ></canvas>
    </main>
    <div class="chrome">
      <header>
        <div class="brand">
          <svg class="mark"><use href="#rose" /></svg><span>Pelagic Archive</span>
        </div>
        <span class="collection">Collection of Maritime Curiosities</span>
        <div class="header-right">
          <span class="live"><i></i> LIVE SIMULATION</span
          ><button
            id="fullscreen"
            class="icon-button"
            aria-label="Toggle fullscreen"
            title="Toggle fullscreen"
          >
            <svg><use href="#expand" /></svg>
          </button>
        </div>
      </header>
      <div class="heading">
        <div class="catalog">
          <span class="gold-rule"></span>PLATE &nbsp;017 <b>/</b> OCEANIC PHENOMENA
        </div>
        <h1>Storm <em>in a</em> Bottle</h1>
      </div>
      <aside id="panel">
        <div class="panel-head">
          <span class="section-icon"
            ><svg><use href="#sliders" /></svg
          ></span>
          <h2>Sea conditions</h2>
          <button
            class="icon-button"
            id="reset"
            title="Restore initial view and conditions"
            aria-label="Restore initial view and conditions"
          >
            <svg><use href="#reset-icon" /></svg>
          </button>
        </div>
        <div class="control">
          <label for="storm">Storm intensity</label><output id="storm-value" for="storm">Gale</output
          ><input id="storm" type="range" min="0" max="100" value="46" />
          <div class="scale"><span>Calm breeze</span><span>Kraken tempest</span></div>
        </div>
        <div class="control">
          <label for="caustics">Spectral caustics</label
          ><output id="caustics-value" for="caustics">78%</output
          ><input id="caustics" type="range" min="0" max="100" value="78" />
        </div>
        <div class="control tint">
          <label for="clarity">Water clarity</label><output id="clarity-value" for="clarity">64%</output
          ><input id="clarity" type="range" min="0" max="100" value="64" />
          <div class="scale"><span>Jade</span><span>Glacial</span></div>
        </div>
        <button id="shake" class="shake">
          <svg><use href="#tilt" /></svg>Shake / Tilt Bottle
        </button>
      </aside>
      <div class="stage-hint">
        <svg><use href="#orbit" /></svg><span>Drag to orbit</span><i></i><span>Scroll to zoom</span
        ><i></i><span>Drag glass to tilt</span>
      </div>
      <footer>
        <button id="showcase" aria-label="Play 30-second auto showcase">
          <span class="play-icon"
            ><svg><use id="play-glyph" href="#play" /></svg></span
          ><span>Auto showcase</span>
        </button>
        <div class="time"><span id="time">00:00</span> <span class="muted">/ 00:30</span></div>
        <div class="transport">
          <input
            type="range"
            id="timeline"
            aria-label="Showcase time in seconds"
            min="0"
            max="30"
            step=".01"
            value="0"
          />
          <div class="notches"></div>
        </div>
        <div id="chapter"><i></i><span>Free exploration</span></div>
      </footer>
    </div>
    <div id="loading">Opening the exhibit…</div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
