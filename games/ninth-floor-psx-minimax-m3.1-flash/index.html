/* ==========================================================================
   RENDER TARGETS
   ========================================================================== */
const RT = {};
function makeRT( w, h ){
  const rt = new THREE.WebGLRenderTarget( Math.max(2,w|0), Math.max(2,h|0), {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false, stencilBuffer: false, generateMipmaps: false, samples: 0
  });
  rt.texture.colorSpace = THREE.NoColorSpace;
  return rt;
}
function buildTargets( w, h ){
  for (const k in RT) if (RT[k]) { RT[k].dispose(); RT[k] = null; }
  const filt = LOWRES ? THREE.NearestFilter : THREE.LinearFilter;
  const scene = new THREE.WebGLRenderTarget( w, h, {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: filt, magFilter: filt,
    depthBuffer: true, stencilBuffer: false, generateMipmaps: false, samples: (PARAMS.get('noaa')?0:4)
  });
  scene.texture.colorSpace = THREE.NoColorSpace;
  const dt = new THREE.DepthTexture( w, h );
  dt.type = THREE.UnsignedIntType;
  dt.format = THREE.DepthFormat;
  dt.minFilter = THREE.NearestFilter; dt.magFilter = THREE.NearestFilter;
  scene.depthTexture = dt;
  RT.scene = scene;
  const hw = Math.max(2, w>>1), hh = Math.max(2, h>>1);
  const qw = Math.max(2, w>>2), qh = Math.max(2, h>>2);
  RT.ao     = makeRT(hw,hh);
  RT.aoBlur = makeRT(hw,hh);
  RT.vol    = makeRT(hw,hh);
  RT.b0 = makeRT(hw,hh); RT.b1 = makeRT(hw,hh);
  RT.b2 = makeRT(qw,qh); RT.b3 = makeRT(qw,qh);
}

/* ==========================================================================
   POST MATERIALS
   ========================================================================== */
const QUAD_VERT = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }`;

const VS = `
precision highp float;
varying vec2 vUv;
void main(){
  float d = texture2D(tDepth, vUv).x;
  vec4 c = uInvProj * vec4( vUv*2.0-1.0, d*2.0-1.0, 1.0 );
  vP = c.xyz/c.w;
  gl_Position = vec4( position.xy, 0.0, 1.0 );
}`;
const VS_HEAD = `
precision highp float;
uniform mat4 uInvProj;
uniform sampler2D tDepth;
varying vec3 vP;`;

/* ---------------- SSAO ---------------- */
const aoMat = new THREE.ShaderMaterial({
  uniforms:{ tDepth:{value:null}, uInvProj:{value:new THREE.Matrix4()}, uProj:{value:new THREE.Matrix4()},
             uRes:{value:new THREE.Vector2()}, uRadius:{value:0.28}, uStrength:{value:0.85} },
  vertexShader: VS_HEAD + VS,
  fragmentShader:`
precision highp float;
uniform mat4 uProj, uInvProj; uniform sampler2D tDepth; uniform vec2 uRes; uniform float uRadius, uStrength;
varying vec3 vP; varying vec2 vUv;
float hash12( vec2 p ){
  vec3 p3 = fract( vec3(p.xyx) * 0.1031 );
  p3 += dot( p3, p3.yzx + 33.33 );
  return fract( (p3.x+p3.y)*p3.z );
}
void main(){
  vec3 P = vP;
  if ( P.z > -0.06 ){ gl_FragColor = vec4(1.0,1.0,1.0,1.0); return; }
  vec3 dx = dFdx(P), dy = dFdy(P);
  vec3 cr = cross(dx,dy);
  float cl = length(cr);
  if ( cl < 1e-12 ){ gl_FragColor = vec4(1.0,1.0,1.0,1.0); return; }
  vec3 N = cr/cl;
  if ( dot(N, -P) < 0.0 ) N = -N;
  vec3 up = abs(N.z) < 0.92 ? vec3(0.0,0.0,1.0) : vec3(1.0,0.0,0.0);
  vec3 T = normalize( cross(up,N) );
  vec3 B = cross(N,T);
  float rnd = hash12( vUv*uRes );
  float occ = 0.0;
  const int NS = 12;
  for (int i=0;i<NS;i++){
    float fi = float(i);
    float a  = (fi + rnd) * 2.39996323;
    float r  = uRadius * (0.35 + 0.65*fract(rnd*13.71 + fi*0.6180339));
    float hz = 0.25 + 0.75*fract(rnd*7.13 + fi*0.4142);
    vec3 sp = P + N*(r*hz) + (T*cos(a) + B*sin(a))*(r*0.75);
    vec4 cp = uProj * vec4(sp,1.0);
    vec2 suv = cp.xy/cp.w*0.5+0.5;
    if (suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0) continue;
    vec4 c2 = uInvProj * vec4(suv*2.0-1.0, texture2D(tDepth,suv).x*2.0-1.0, 1.0);
    float sz = c2.z/c2.w;
    float diff = sz - sp.z;
    float rng = smoothstep(0.0,1.0, uRadius/max(abs(P.z-sz),1e-4));
    occ += (diff > 0.015 ? 1.0 : 0.0) * rng;
  }
  float ao = 1.0 - occ/float(NS)*uStrength;
  ao = mix(1.0, ao, smoothstep(-45.0, -5.0, P.z));
  ao = clamp(ao,0.0,1.0);
  ao = (ao == ao) ? ao : 1.0;
  gl_FragColor = vec4(ao,0.0,0.0,1.0);
}`
});

/* ---------------- separable blur ---------------- */
const blurMat = new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uDir:{value:new THREE.Vector2()} },
  vertexShader: QUAD_VERT,
  fragmentShader:`
precision highp float;
uniform sampler2D tSrc; uniform vec2 uDir;
varying vec2 vUv;
void main(){
  vec3 s = texture2D(tSrc,vUv).rgb*0.2270270270;
  s += (texture2D(tSrc,vUv+uDir*1.3846153846).rgb + texture2D(tSrc,vUv-uDir*1.3846153846).rgb)*0.3162162162;
  s += (texture2D(tSrc,vUv+uDir*3.2307692308).rgb + texture2D(tSrc,vUv-uDir*3.2307692308).rgb)*0.0702702703;
  gl_FragColor = vec4(s,1.0);
}`
});

/* ---------------- volumetric shafts through the shadow map ---------------- */
const volMat = new THREE.ShaderMaterial({
  uniforms:{
    tDepth:{value:null}, tNoise:{value:TEX.smoke},
    uShadowMap:{value:null}, uShadowMatrix:{value:new THREE.Matrix4()},
    uInvProj:{value:new THREE.Matrix4()}, uCamWorld:{value:new THREE.Matrix4()}, uCamPos:{value:new THREE.Vector3()},
    uSunDir:U.uSunDir, uSunColor:U.uSunColor,
    uDensity:{value:0.55}, uTime:{value:0}, uSteps:{value:40}, uMaxDist:{value:6.0}, uWallZ:{value:0.10},
    uVolMin:{value:new THREE.Vector3(-1.30, 0.30, -0.30)}, uVolMax:{value:new THREE.Vector3(0.95, 2.50, 1.85)}
  },
  vertexShader:`
precision highp float;
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`
precision highp float;
uniform sampler2D tDepth, tNoise, uShadowMap;
uniform mat4 uShadowMatrix, uInvProj, uCamWorld;
uniform vec3 uCamPos, uSunDir, uSunColor;
uniform vec3 uVolMin, uVolMax;
uniform float uDensity, uTime, uSteps, uMaxDist, uWallZ;
varying vec2 vUv;
const vec4 UnpackFactors4 = vec4( 0.99609375/16777216.0, 0.99609375/65536.0, 0.99609375/256.0, 0.99609375 );
float shadowAt( vec3 wp ){
  vec4 sc = uShadowMatrix * vec4(wp,1.0);
  vec3 p = sc.xyz / sc.w;
  p = p*0.5 + 0.5;
  if ( p.z > 1.0 || p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 ) return 1.0;
  float d = dot( texture2D(uShadowMap,p.xy), UnpackFactors4 );
  return ( p.z - 0.0032 > d ) ? 0.0 : 1.0;
}
float hg( float c, float g ){
  float g2 = g*g;
  return (1.0-g2) / (12.5663706 * pow(max(1.0+g2-2.0*g*c, 1e-4), 1.5));
}
/* analytic sunlight test : does the ray from this point to the sun pass
   through the window opening ?  (the bars cut the beam into shafts) */
float windowLight( vec3 p ){
  if ( p.z < 0.105 ) return 0.0;
  float t = (0.105 - p.z) / (uSunDir.z + 1e-6);
  if ( t < 0.0 ) return 0.0;
  vec3 hit = p + uSunDir * t;
  if ( hit.x < -0.38 || hit.x > 0.60 ) return 0.0;
  if ( hit.y < 1.14 || hit.y > 1.90 ) return 0.0;
  if ( abs(hit.x - 0.02) < 0.030 ) return 0.0;   /* the mullion */
  if ( abs(hit.y - 1.68) < 0.032 ) return 0.0;   /* the transom */
  return 1.0;
}
void main(){
  vec4 v4 = uInvProj * vec4(vUv*2.0-1.0, 1.0, 1.0);
  vec3 vr = normalize( v4.xyz/v4.w );
  vec3 ray = normalize( mat3(uCamWorld) * vr );
  vec4 c = uInvProj * vec4(vUv*2.0-1.0, texture2D(tDepth,vUv).x*2.0-1.0, 1.0);
  float tScene = length( c.xyz/c.w );
  /* the participating medium only exists in the room's air */
  vec3 inv = 1.0 / (abs(ray) + vec3(1e-5)) * sign(ray + vec3(1e-9));
  vec3 ta = (uVolMin - uCamPos) * inv;
  vec3 tb = (uVolMax - uCamPos) * inv;
  vec3 tn = min(ta,tb), tf = max(ta,tb);
  float tEnter = max(max(tn.x,tn.y),tn.z);
  float tExit  = min(min(tf.x,tf.y),tf.z);
  float tStart = max(tEnter, 0.0);
  float tEnd   = min(tExit, min(tScene, uMaxDist));
  if ( tEnd <= tStart ){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }
  float ph = hg( dot(ray, uSunDir), 0.80 );
  float dt = (tEnd - tStart) / uSteps;
  vec3 acc = vec3(0.0);
  for (int i=0;i<48;i++){
    if ( float(i) >= uSteps ) break;
    float t = tStart + (float(i)+0.5)*dt;
    vec3 p = uCamPos + ray*t;
    float sh = windowLight(p);
    float n1 = texture2D(tNoise, p.xy*0.62 + p.z*0.33 + vec2(uTime*0.012, uTime*0.008)).a;
    float n2 = texture2D(tNoise, p.xz*1.05 - vec2(uTime*0.019, uTime*0.004)).r;
    float dens = uDensity * (0.35 + 1.05*n1 + 0.55*n2);
    acc += sh * dens * dt * ph * uSunColor * vec3(1.0,0.52,0.20) * 0.95;
  }
  acc = clamp(acc, vec3(0.0), vec3(24.0));
  acc = mix(vec3(0.0), acc, vec3(equal(acc,acc)));
  gl_FragColor = vec4(acc,1.0);
}`
});

/* ---------------- bright pass ---------------- */
const brightMat = new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uThresh:{value:2.9} },
  vertexShader: QUAD_VERT,
  fragmentShader:`
precision highp float;
uniform sampler2D tSrc; uniform float uThresh;
varying vec2 vUv;
void main(){
  vec3 c = texture2D(tSrc,vUv).rgb;
  /* clamp : a blown-out sill patch must not turn into a huge white disc */
  c = min(c, vec3(1.8));
  float l = max(max(c.r,c.g),c.b);
  float s = clamp((l-uThresh)/(uThresh*0.9+1e-4), 0.0, 1.0);
  gl_FragColor = vec4(c*s*s, 1.0);
}`
});

/* ---------------- final composite ---------------- */
const compMat = new THREE.ShaderMaterial({
  uniforms:{
    tScene:{value:null}, tBloom:{value:null}, tBloom2:{value:null}, tVol:{value:null}, tAO:{value:null},
    uExposure:{value:1.0}, uBloom:{value:0.13}, uVol:{value:1.0}, uAOAmt:{value:0.70},
    uGrain:{value:0.035}, uVig:{value:0.55}, uDitherScale:{value:2.0}, uTime:{value:0}, uFade:{value:1.0},
    uGolden:{value:0.0},
    uRes:{value:new THREE.Vector2()}
  },
  vertexShader: QUAD_VERT,
  fragmentShader:`
precision highp float;
uniform sampler2D tScene, tBloom, tBloom2, tVol, tAO;
uniform float uExposure, uBloom, uVol, uAOAmt, uGrain, uVig, uDitherScale, uTime, uFade, uGolden;
uniform vec2 uRes;
varying vec2 vUv;
vec3 aces( vec3 x ){
  const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14;
  return clamp( (x*(a*x+b)) / (x*(c*x+d)+e), 0.0, 1.0 );
}
float bayer2( vec2 a ){ a = floor(a); return fract( dot(a, vec2(0.5, a.y*0.75)) ); }
float bayer4( vec2 a ){ return bayer2(0.5*a)*0.25 + bayer2(a); }
float hash12( vec2 p ){
  vec3 p3 = fract( vec3(p.xyx) * 0.1031 );
  p3 += dot( p3, p3.yzx + 33.33 );
  return fract( (p3.x+p3.y)*p3.z );
}
vec3 toSRGB( vec3 c ){
  return mix( c*12.92, 1.055*pow(max(c,vec3(0.0)), vec3(0.41666))-0.055, step(0.0031308, c) );
}
void main(){
  vec3 col = texture2D(tScene, vUv).rgb;
  float ao = texture2D(tAO, vUv).r;
  ao = (ao == ao) ? ao : 1.0;
  ao = clamp(ao, 0.0, 1.0);
  col *= mix(1.0, ao, uAOAmt);
  vec3 bl = texture2D(tBloom,vUv).rgb*0.62 + texture2D(tBloom2,vUv).rgb*0.55;
  bl = clamp(bl, vec3(0.0), vec3(24.0));
  bl = mix(vec3(0.0), bl, vec3(equal(bl,bl)));
  col += bl * uBloom;
  vec3 vl = texture2D(tVol,vUv).rgb;
  vl = clamp(vl, vec3(0.0), vec3(24.0));
  vl = mix(vec3(0.0), vl, vec3(equal(vl,vl)));
  col += vl * uVol;
  col *= uExposure;
  col = aces(col);
  /* warm grade : shadows to brown, highlights to amber */
  float lum = dot(col, vec3(0.2126,0.7152,0.0722));
  col = mix(col, vec3(lum), 0.055);
  /* the whole day is shot on warm film */
  col = mix(col, col*vec3(1.09,0.99,0.86), 0.75);
  /* golden hour : saturate, push the highlights to amber, deepen the shadows */
  col = mix(vec3(lum), col, 1.0 + 0.40*uGolden);
  col = mix(col, col*vec3(1.13,0.94,0.72), uGolden*0.80);
  col *= mix(1.0, smoothstep(0.02,0.42,lum), uGolden*0.62);
  col += vec3(0.030,0.010,-0.016) * (1.0-lum)*(1.0-lum);
  col *= mix(vec3(0.93,0.955,1.02), vec3(1.055,1.0,0.905), lum);
  col = toSRGB( max(col, vec3(0.0)) );
  /* 15 bit colour with a 4x4 ordered dither */
  float d = bayer4( floor(gl_FragCoord.xy / uDitherScale) );
  col = floor( clamp(col,0.0,1.0)*31.0 + d ) / 31.0;
  /* film grain */
  float g = hash12( gl_FragCoord.xy + vec2(uTime*61.7, uTime*37.3) );
  col += (g-0.5)*uGrain;
  /* vignette */
  float v = smoothstep(1.30, 0.32, length((vUv-0.5)*vec2(1.08,1.0)) );
  col *= mix(1.0, v, uVig);
  col *= uFade;
  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`
});

/* ==========================================================================
   SOUND  —  everything synthesised, nothing sampled
   ========================================================================== */
const SND = (()=>{
  let ctx = null, master = null, ready = false, noiseBuf = null;
  let windGain = null, courtGain = null;
  let nextEvt = 0, nextTick = 0;

  function mkNoise(){
    const n = Math.floor(ctx.sampleRate*3);
    const b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i=0;i<n;i++){
      const w = Math.random()*2-1;
      last = 0.985*last + 0.015*w;
      d[i] = w*0.55 + last*2.2;
    }
    return b;
  }
  function loopSrc(){
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf; s.loop = true; s.start();
    return s;
  }
  function init(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    noiseBuf = mkNoise();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    /* wind */
    const wf = ctx.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=430; wf.Q.value=0.55;
    windGain = ctx.createGain(); windGain.gain.value=0.0;
    loopSrc().connect(wf); wf.connect(windGain); windGain.connect(master);
    const l1 = ctx.createOscillator(); l1.frequency.value=0.061;
    const g1 = ctx.createGain(); g1.gain.value=240;
    l1.connect(g1); g1.connect(wf.frequency); l1.start();
    const l2 = ctx.createOscillator(); l2.frequency.value=0.037;
    const g2 = ctx.createGain(); g2.gain.value=0.028;
    l2.connect(g2); g2.connect(windGain.gain); l2.start();
    /* distant courtyard murmur */
    const cf = ctx.createBiquadFilter(); cf.type='bandpass'; cf.frequency.value=720; cf.Q.value=0.9;
    courtGain = ctx.createGain(); courtGain.gain.value=0.0;
    loopSrc().connect(cf); cf.connect(courtGain); courtGain.connect(master);
    const l3 = ctx.createOscillator(); l3.frequency.value=0.21;
    const g3 = ctx.createGain(); g3.gain.value=0.014;
    l3.connect(g3); g3.connect(courtGain.gain); l3.start();
    const l4 = ctx.createOscillator(); l4.frequency.value=0.11;
    const g4 = ctx.createGain(); g4.gain.value=0.010;
    l4.connect(g4); g4.connect(courtGain.gain); l4.start();
    windGain.gain.setTargetAtTime(0.055, ctx.currentTime, 2.5);
    courtGain.gain.setTargetAtTime(0.020, ctx.currentTime, 4.0);
    ready = true;
    nextEvt = ctx.currentTime + 1.2;
    nextTick = ctx.currentTime + 2.5;
  }
  function burst( dur, freq, Q, gain, when ){
    const t = when === undefined ? ctx.currentTime : when;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.playbackRate.value = 0.8 + Math.random()*0.8;
    const f = ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=Q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t+Math.min(0.02,dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random()*2); s.stop(t+dur+0.05);
  }
  function kids(){
    const n = 3 + (Math.random()*5|0);
    const base = ctx.currentTime + Math.random()*0.6;
    for (let i=0;i<n;i++){
      const t = base + i*(0.10+Math.random()*0.10);
      const o = ctx.createOscillator(); o.type='triangle';
      const f0 = 300 + Math.random()*540;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0*(0.72+Math.random()*0.6), t+0.10);
      const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500; f.Q.value=0.8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.020+Math.random()*0.018, t+0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t); o.stop(t+0.18);
    }
  }
  function bell(){
    const t = ctx.currentTime;
    const parts = [[1660,0.040],[2215,0.024],[3310,0.010]];
    for (const [f0,gn] of parts){
      const o = ctx.createOscillator(); o.type='sine'; o.frequency.value=f0;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gn, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+1.9);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+2.0);
    }
  }
  function pigeons(){
    const n = 4 + (Math.random()*7|0);
    const base = ctx.currentTime;
    for (let i=0;i<n;i++){
      const t = base + i*(0.065+Math.random()*0.07);
      burst(0.07, 2000+Math.random()*1500, 9, 0.016, t);
    }
  }
  function crackle(){
    const n = 5 + (Math.random()*8|0);
    for (let i=0;i<n;i++) burst(0.05+Math.random()*0.05, 2400+Math.random()*2600, 1.4, 0.020+Math.random()*0.02, ctx.currentTime+i*0.03);
  }
  function breath( inh, amp, dur ){
    if (!ready) return;
    const t = ctx.currentTime;
    const d = dur || (inh ? 1.15 : 1.7);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime( inh?420:1150, t);
    f.frequency.linearRampToValueAtTime( inh?1250:330, t+d);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(amp, t+d*0.38);
    g.gain.linearRampToValueAtTime(0.0001, t+d);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t+d+0.06);
  }
  function tap( freq, gain ){
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq*0.45, t+0.045);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.075);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.09);
    burst(0.06, freq*1.4, 3, gain*0.6);
  }
  function tick(){
    if (!ready) return;
    const now = ctx.currentTime;
    if (now > nextEvt){
      const r = Math.random();
      if (r < 0.36) kids();
      else if (r < 0.58) pigeons();
      else if (r < 0.64) bell();
      nextEvt = now + 1.5 + Math.random()*4.2;
    }
    if (now > nextTick){
      tap( 2300 + Math.random()*900, 0.010 );
      nextTick = now + 2.2 + Math.random()*6.5;
    }
  }
  return {
    init, tick,
    drag(){ if (!ready) return; crackle(); breath(true, 0.020, 1.0); },
    exhale(a){ if (!ready) return; breath(false, 0.045*(a||1), (a||1)>1.2 ? 2.6 : 1.6); },
    ash(){ if (!ready) return; tap(1500, 0.045); }
  };
})();

/* ==========================================================================
   DISTRICT ANIMATION
   ========================================================================== */
const _pm = new THREE.Matrix4(), _pq = new THREE.Quaternion(), _pv = new THREE.Vector3(),
      _ps = new THREE.Vector3(1,1,1), _pe = new THREE.Euler(), _sq = new THREE.Quaternion(),
      _se = new THREE.Euler();

function updateProps( dt, t ){
  /* avenue traffic */
  for (const c of DIST.cars){
    c.m.position.x += c.dir*c.spd*dt;
    if (c.m.position.x >  430) c.m.position.x = -430;
    if (c.m.position.x < -430) c.m.position.x =  430;
  }
  for (const tr of DIST.trams){
    tr.m.position.x += tr.dir*tr.spd*dt;
    if (tr.m.position.x >  540) tr.m.position.x = -540;
    if (tr.m.position.x < -540) tr.m.position.x =  540;
  }
  /* pedestrians */
  const ppl = DIST.people;
  for (let i=0;i<ppl.length;i++){
    const p = ppl[i];
    p.x += p.dx*dt; p.z += p.dz*dt;
    if (Math.abs(p.x) > 66){ p.dx *= -1; p.x = Math.sign(p.x)*66; }
    if (p.z < -108 || p.z > -16){ p.dz *= -1; p.z = clamp(p.z,-108,-16); }
    _pv.set(p.x, GY + Math.abs(Math.sin(t*6.2 + p.ph))*0.035, p.z);
    _pq.setFromEuler( _pe.set(0, Math.atan2(p.dx, p.dz), 0) );
    _pm.compose(_pv,_pq,_ps);
    DIST.pB.setMatrixAt(i,_pm); DIST.pH.setMatrixAt(i,_pm);
  }
  if (DIST.pB){ DIST.pB.instanceMatrix.needsUpdate = true; DIST.pH.instanceMatrix.needsUpdate = true; }
  /* pigeons */
  const B = DIST.birds;
  if (B){
    const pos = B.mesh.geometry.attributes.position.array;
    for (let i=0;i<B.st.length;i++){
      const b = B.st[i];
      if (b.fly > 0){
        b.fly -= dt;
        b.v.y += (1.4 - b.v.y)*dt*0.7;
        b.v.x += Math.sin(t*3.0+i)*0.6*dt;
        b.p.addScaledVector(b.v, dt);
        if (b.fly <= 0){ b.p.copy(b.home); b.v.set(0,0,0); }
      } else {
        if (Math.random() < dt*0.05){ b.fly = 2.6+Math.random()*3.2; b.v.set((Math.random()-0.5)*5, 3+Math.random()*3, (Math.random()-0.5)*5); }
        b.p.copy(b.home);
        b.p.x += Math.sin(t*1.4 + b.home.z)*0.28;
      }
      pos[i*3] = b.p.x; pos[i*3+1] = b.p.y + 0.10; pos[i*3+2] = b.p.z;
    }
    B.mesh.geometry.attributes.position.needsUpdate = true;
  }
  /* foliage sway */
  if (DIST.leaves){
    const arr = DIST.leaves.instanceMatrix.array, n = DIST.leaves.count;
    for (let i=0;i<n;i++){
      _pm.fromArray(arr, i*16);
      _pm.decompose(_pv,_pq,_ps);
      _se.set( Math.sin(t*0.85 + i*0.73)*0.05, 0, Math.sin(t*1.12 + i*1.31)*0.05 );
      _pq.multiply( _sq.setFromEuler(_se) );
      _pm.compose(_pv,_pq,_ps);
      _pm.toArray(arr, i*16);
    }
    DIST.leaves.instanceMatrix.needsUpdate = true;
  }
  /* laundry flap */
  if (DIST.laundryMesh){
    const arr = DIST.laundryMesh.instanceMatrix.array, n = DIST.laundryMesh.count;
    for (let i=0;i<n;i++){
      _pm.fromArray(arr, i*16);
      _pm.decompose(_pv,_pq,_ps);
      _se.set( 0, 0, Math.sin(t*3.1 + i*0.9)*0.22 );
      _pq.multiply( _sq.setFromEuler(_se) );
      _pm.compose(_pv,_pq,_ps);
      _pm.toArray(arr, i*16);
    }
    DIST.laundryMesh.instanceMatrix.needsUpdate = true;
  }
  /* cloud shadows race over the district */
  U.uCloudOff.value.set( t*3.4, t*1.1 );
}

/* ==========================================================================
   PROJECTOR + SHADOW UNIFORMS
   ========================================================================== */
const _projDir = new THREE.Vector3();
function updateProjector(){
  const azr = TL.az*DEG;
  _projDir.set( -Math.sin(azr)*1.05, -0.30, -0.72 ).normalize();
  U.uProjDir.value.copy(_projDir);
  projLight.position.copy( projLight.target.position ).addScaledVector(_projDir, -2.6);
  projLight.target.updateMatrixWorld();
  const enter = clamp((TL.el + 2.0)/18.0, 0, 1);
  /* the bounce that paints the window cross on the wall only exists for a low sun */
  const lowSun = clamp((26.0 - TL.el)/24.0, 0, 1);
  const k = TL.sunInt * 0.62 * enter * (0.10 + 0.90*lowSun);
  U.uProjColor.value.copy( TL.sunCol ).multiplyScalar( k*2.60 );
  U.uProjSun.value.copy( TL.sunCol ).multiplyScalar( k*3.40 );
  sillBounce.intensity = TL.sunInt * 0.22 * enter * (0.18 + 0.58*lowSun);
  sillBounce.color.copy( TL.sunCol );
  roomLamp.intensity = TL.lampOn * 1.05;
  roomLamp.color.setRGB( 1.0, 0.72, 0.42 );
  handFill.intensity = ( 0.12 + 0.62*clamp(TL.sunInt/2.4,0,1) ) * ( 0.50 + 0.50*TL.golden );
  handFill.color.copy( TL.sunCol ).lerp( new THREE.Color(1.0,0.80,0.60), 0.35 );
}
function updateShadowUniforms(){
  if (sunRoom.shadow.map){
    SU.uShadowMap.value = sunRoom.shadow.map.texture;
    SU.uShadowMatrix.value.copy( sunRoom.shadow.matrix );
  }
  if (projLight.shadow.map){
    SU.uShadowMap2.value = projLight.shadow.map.texture;
    SU.uShadowMatrix2.value.copy( projLight.shadow.matrix );
  }
}

/* ==========================================================================
   INIT
   ========================================================================== */
const emit = { dragged:{}, wisp:0 };
const wind = new THREE.Vector3(0.02, 0.0, 0.0);

function buildWindowInstances( dg ){
  const n = DIST.windows.length;
  const geo = new THREE.PlaneGeometry(1,1);
  const mat = new THREE.ShaderMaterial({
    vertexShader: WINDOW_VERT, fragmentShader: WINDOW_FRAG, fog:false,
    uniforms:{
      uSunDir:U.uSunDir, uSunColor:U.uSunColor, uAmbient:U.uAmbient,
      uFogColor:U.uFogColor, uFogSunColor:U.uFogSunColor,
      uLitFrac:{value:0.0}, uTime:SU.uTime, uFogDensity:{value:0.0068}
    }
  });
  const mesh = new THREE.InstancedMesh( geo, mat, n );
  for (let i=0;i<n;i++) mesh.setMatrixAt(i, DIST.windows[i]);
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  dg.add(mesh);
  DIST.winMesh = mesh;
  DIST.winMat = mat;
  /* laundry */
  if (DIST.laundry.length){
    const lgeo = new THREE.PlaneGeometry(1,1);
    const lmesh = new THREE.InstancedMesh( lgeo, MAT.laundry, DIST.laundry.length );
    for (let i=0;i<DIST.laundry.length;i++) lmesh.setMatrixAt(i, DIST.laundry[i]);
    lmesh.instanceMatrix.needsUpdate = true;
    lmesh.castShadow = true;
    lmesh.frustumCulled = false;
    dg.add(lmesh);
    DIST.laundryMesh = lmesh;
  }
}

function init(){
  scene.add( buildWindow() );
  scene.add( buildCurtain() );
  scene.add( buildCorner() );
  scene.add( buildSillProps() );
  scene.add( buildShell() );
  scene.add( buildHand() );
  buildSmoke();
  scene.add( SMOKE.pts );
  const dg = buildDistrict();
  scene.add(dg);
  DIST.group = dg;
  buildWindowInstances(dg);
  const pg = buildProps();
  scene.add(pg);
  DIST.sky = makeSky();
  scene.add(DIST.sky);
  /* the district shares the one sun, so no layer split is needed */
  if (sunDistrict) sunDistrict.visible = false;
  /* the room's own shadow map is fitted to what we actually see */
  sunRoom.shadow.camera.updateProjectionMatrix();
  fillShadowBoxes();
}

/* the 14 nearest panel blocks become analytic shadow casters for the courtyard */
function fillShadowBoxes(){
  const list = DIST.boxes.slice().sort((a,b)=>{
    const da = a.min[0]*a.min[0] + a.min[2]*a.min[2];
    const db = b.min[0]*b.min[0] + b.min[2]*b.min[2];
    return da - db;
  }).slice(0, NBOX);
  for (let i=0;i<NBOX;i++){
    const b = list[i];
    if (b){
      U.uBoxMin.value[i].set(b.min[0], b.min[1], b.min[2]);
      U.uBoxMax.value[i].set(b.max[0], b.max[1], b.max[2]);
    } else {
      U.uBoxMin.value[i].set(0, 1e5, 0);
      U.uBoxMax.value[i].set(0,-1e5, 0);
    }
  }
}

/* ==========================================================================
   RESIZE
   ========================================================================== */
let CW = 1, CH = 1, RW = 1, RH = 1;
function onResize(){
  const w = Math.max(2, window.innerWidth), h = Math.max(2, window.innerHeight);
  renderer.setPixelRatio( Math.min(window.devicePixelRatio||1, 2) );
  renderer.setSize( w, h );
  const dpr = renderer.getPixelRatio();
  CW = Math.max(2, Math.floor(w*dpr)); CH = Math.max(2, Math.floor(h*dpr));
  if (LOWRES){
    RH = LOWRES; RW = Math.max(2, Math.round(LOWRES * CW / CH));
  } else {
    RW = CW; RH = CH;
  }
  buildTargets(RW, RH);
  compMat.uniforms.uDitherScale.value = 2.0 * (CH/1080.0);
  compMat.uniforms.uRes.value.set(CW, CH);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

/* ==========================================================================
   RENDER
   ========================================================================== */
function renderFrame(){
  renderer.setRenderTarget(RT.scene);
  renderer.clear();
  renderer.render(scene, camera);
  updateShadowUniforms();

  /* SSAO */
  aoMat.uniforms.tDepth.value = RT.scene.depthTexture;
  aoMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  aoMat.uniforms.uProj.value.copy(camera.projectionMatrix);
  aoMat.uniforms.uRes.value.set(RT.ao.width, RT.ao.height);
  blit(aoMat, RT.ao);
  blurMat.uniforms.tSrc.value = RT.ao.texture;
  blurMat.uniforms.uDir.value.set(1/RT.ao.width, 0);
  blit(blurMat, RT.aoBlur);
  blurMat.uniforms.tSrc.value = RT.aoBlur.texture;
  blurMat.uniforms.uDir.value.set(0, 1/RT.ao.height);
  blit(blurMat, RT.ao);

  /* volumetric shafts */
  volMat.uniforms.tDepth.value = RT.scene.depthTexture;
  volMat.uniforms.uShadowMap.value = SU.uShadowMap.value;
  volMat.uniforms.uShadowMatrix.value.copy(SU.uShadowMatrix.value);
  volMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  volMat.uniforms.uCamWorld.value.copy(camera.matrixWorld);
  volMat.uniforms.uCamPos.value.copy(camera.position);
  volMat.uniforms.uTime.value = SU.uTime.value;
  volMat.uniforms.uDensity.value = 0.085 + 0.30*TL.golden + 0.05*clamp(TL.sunInt/2.4,0,1);
  volMat.uniforms.uSteps.value = 40;
  blit(volMat, RT.vol);

  /* bloom */
  brightMat.uniforms.tSrc.value = RT.scene.texture;
  blit(brightMat, RT.b0);
  blurMat.uniforms.tSrc.value = RT.b0.texture;
  blurMat.uniforms.uDir.value.set(1/RT.b0.width, 0);
  blit(blurMat, RT.b1);
  blurMat.uniforms.tSrc.value = RT.b1.texture;
  blurMat.uniforms.uDir.value.set(0, 1/RT.b0.height);
  blit(blurMat, RT.b0);
  blurMat.uniforms.tSrc.value = RT.b0.texture;
  blurMat.uniforms.uDir.value.set(1.6/RT.b2.width, 0);
  blit(blurMat, RT.b2);
  blurMat.uniforms.tSrc.value = RT.b2.texture;
  blurMat.uniforms.uDir.value.set(0, 1.6/RT.b2.height);
  blit(blurMat, RT.b3);
  blurMat.uniforms.tSrc.value = RT.b3.texture;
  blurMat.uniforms.uDir.value.set(1.6/RT.b2.width, 0);
  blit(blurMat, RT.b2);

  /* composite */
  compMat.uniforms.tScene.value = RT.scene.texture;
  compMat.uniforms.tBloom.value = RT.b0.texture;
  compMat.uniforms.tBloom2.value = RT.b2.texture;
  compMat.uniforms.tVol.value = RT.vol.texture;
  compMat.uniforms.tAO.value = RT.ao.texture;
  compMat.uniforms.uExposure.value = TL.exposure;
  compMat.uniforms.uTime.value = SU.uTime.value;
  compMat.uniforms.uFade.value = TL.fade;
  compMat.uniforms.uGolden.value = TL.golden;
  blit(compMat, null);
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
let simT = 0, lastNow = performance.now(), started = false;

function stepSim( dt, t ){
  updateTimeline(t, dt);
  updateHand(t, dt, emit);
  updateSmoke(dt, t, wind);
  updateProps(dt, t);
  if (DIST.plume) updateSteam(DIST.plume, dt, t);
  SU.uTime.value += dt;
}

function frame( now ){
  requestAnimationFrame(frame);
  window.__NF_FRAME = (window.__NF_FRAME||0) + 1;
  const dt = Math.min(0.06, Math.max(0.0005, (now - lastNow)/1000));
  lastNow = now;

  if (!isNaN(FREEZE_T)){
    /* frozen : the world is simulated up to that moment once, then held */
    if (!started){
      started = true;
      let ft = 0;
      const fdt = 1/30;
      while (ft < FREEZE_T){
        ft += fdt;
        stepSim(fdt, ft);
      }
      simT = FREEZE_T;
    }
  } else {
    simT += dt;
    if (simT > 60) simT -= 60;
    stepSim(dt, simT);
  }

  /* camera : breathing + a very slow gaze drift */
  const t = simT;
  const br = Math.sin(t*0.87)*0.0042 + Math.sin(t*2.31+0.7)*0.0016;
  camera.position.set( CAM_BASE.pos.x + br*0.7, CAM_BASE.pos.y + br, CAM_BASE.pos.z + br*0.5 );
  const drift = ( Math.sin(t*0.108)*3.0 + Math.sin(t*0.041+1.3)*1.1 )*DEG;
  camera.rotation.set( -12*DEG + Math.sin(t*0.171)*0.22*DEG, drift, Math.sin(t*0.129+0.7)*0.18*DEG );

  updateProjector();
  camera.updateMatrixWorld();
  renderFrame();
  if (SND) SND.tick();
}

/* ==========================================================================
   GO
   ========================================================================== */
init();
onResize();
requestAnimationFrame(frame);

window.addEventListener('pointerdown', ()=>{ SND.init(); }, { passive:true });
window.addEventListener('keydown', ()=>{ SND.init(); }, { passive:true });
window.addEventListener('touchstart', ()=>{ SND.init(); }, { passive:true });

/* the room's shadow map has to be tight around what we see */
sunRoom.shadow.camera.updateProjectionMatrix();

window.__NF_DEBUG = { scene, camera, THREE, U, SU, TL, HAND, SMOKE, DIST, MAT, renderer, RT, post:{compMat, aoMat, volMat, brightMat, blurMat}, lights:{sunRoom, projLight, sillBounce, hemi, amb, LAMPS} };
window.__NF_READY = true;
window.__NF_INFO = { three:'0.160.0', lowres:LOWRES, freeze:isNaN(FREEZE_T)?null:FREEZE_T };

</script>
