<script type="module">
import * as THREE from 'three';

/* ============================================================================
   NINTH FLOOR  —  a PSX-era first-person vignette, rendered crisp & modern.
   Everything procedural: geometry, textures, shaders, sound.
   ========================================================================== */

const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const clamp = (x,a,b)=> x<a?a:(x>b?b:x);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const smoother = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*t*(t*(t*6-15)+10); };

/* ---------------------------------------------------------------- random */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20260915);

/* value noise (tileable) */
function makeNoise(seed){
  const rnd = mulberry32(seed);
  const T = new Float32Array(256*256);
  for (let i=0;i<T.length;i++) T[i] = rnd();
  const g = (x,y)=> T[((y & 255) << 8) | (x & 255)];
  return (x,y)=>{
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x-xi, yf = y-yi;
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    const a = g(xi,yi), b = g(xi+1,yi), c = g(xi,yi+1), d = g(xi+1,yi+1);
    return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
  };
}
function fbm(n, x, y, oct=4, lac=2, gain=0.5){
  let s=0, a=0.5, f=1, norm=0;
  for (let i=0;i<oct;i++){ s += a*n(x*f, y*f); norm += a; a*=gain; f*=lac; }
  return s/norm;
}
const N1 = makeNoise(11), N2 = makeNoise(29), N3 = makeNoise(47), N4 = makeNoise(83);

/* ---------------------------------------------------------------- textures */
function makeTex(w, h, fn, opt={}){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w,h);
  const d = img.data;
  for (let y=0;y<h;y++){
    for (let x=0;x<w;x++){
      const i = (y*w+x)*4;
      const o = fn(x,y,w,h);
      d[i]   = o[0]; d[i+1] = o[1]; d[i+2] = o[2]; d[i+3] = o[3]===undefined?255:o[3];
    }
  }
  g.putImageData(img,0,0);
  if (opt.draw) opt.draw(g,w,h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = opt.mip ? THREE.NearestMipmapNearestFilter : THREE.NearestFilter;
  t.generateMipmaps = !!opt.mip;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 1;
  t.colorSpace = THREE.SRGBColorSpace;
  if (opt.repeat) t.repeat.set(opt.repeat[0], opt.repeat[1]);
  return t;
}
const rgb = (r,g,b)=>[r,g,b];
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function shade(c,k){ return [clamp(c[0]*k,0,255), clamp(c[1]*k,0,255), clamp(c[2]*k,0,255)]; }

/* worn painted wood -------------------------------------------------- */
function texPaintedWood(base, seed, wear=0.5){
  const n = makeNoise(seed);
  const b = base;
  return makeTex(64,64,(x,y)=>{
    const grain = fbm(n, x*0.35, y*0.06, 3);
    const crack = fbm(n, x*0.09+13, y*0.09+7, 3);
    let k = 0.86 + grain*0.26;
    // flaking paint -> wood underneath
    let fl = fbm(n, x*0.22+31, y*0.22+5, 4);
    let c = shade(b, k);
    if (fl < 0.30*wear){
      const t = clamp((0.30*wear - fl)/0.10, 0, 1);
      c = mixc(c, [120,92,60], t*0.85);
    }
    // fine cracks in the paint
    if (crack > 0.735) c = shade(c, 0.62);
    if (crack < 0.215) c = shade(c, 1.07);
    // yellowing gradient
    const yel = (y/64)*0.10;
    c = mixc(c, [c[0]*1.03, c[1]*1.0, c[2]*0.88], yel);
    const gr = (fbm(n,x*0.9+3,y*0.9+9,2)-0.5)*14;
    return [c[0]+gr, c[1]+gr, c[2]+gr];
  });
}

/* natural wood grain ------------------------------------------------- */
function texWood(base, seed){
  const n = makeNoise(seed);
  return makeTex(64,64,(x,y)=>{
    const rings = Math.sin((y*0.55 + fbm(n,x*0.14,y*0.05,3)*7.0))*0.5+0.5;
    const fine  = fbm(n, x*0.8, y*0.12, 3);
    let k = 0.72 + rings*0.26 + fine*0.18;
    const knot = fbm(n, x*0.07+61, y*0.07+17, 3);
    if (knot > 0.78) k *= 0.72;
    const c = shade(base, k);
    const gr = (fbm(n,x*1.3+5,y*1.3+2,2)-0.5)*16;
    return [c[0]+gr, c[1]+gr, c[2]+gr];
  });
}

/* faded floral wallpaper --------------------------------------------- */
function texWallpaper(){
  const n = makeNoise(5);
  const W=128,H=128;
  const base=[214,198,166], faded=[196,176,150];
  return makeTex(W,H,(x,y)=>{
    let c = mixc(base, faded, fbm(n,x*0.09,y*0.09,3));
    // vertical stripes
    if (Math.floor(x/16)%2===0) c = shade(c, 1.035);
    // tiny speckles
    const sp = fbm(n,x*1.7+11,y*1.7+4,2);
    if (sp>0.80) c = shade(c, 0.90);
    return c;
  }, { draw:(g,w,h)=>{
      // vertical floral sprigs, faded
      for (let col=0; col<8; col++){
        const cx = col*16 + 8;
        for (let k=0; k<4; k++){
          const cy = (k*32 + (col%2)*16 + 8) % h;
          g.save();
          g.translate(cx, cy);
          g.globalAlpha = 0.30;
          // stem
          g.strokeStyle = '#8f9c74'; g.lineWidth = 1;
          g.beginPath(); g.moveTo(0,-6); g.quadraticCurveTo(1.5,0,0,6); g.stroke();
          // leaves
          g.fillStyle = '#93a077';
          g.beginPath(); g.ellipse(-2.4,1.4,1.9,1.0,-0.5,0,TAU); g.fill();
          g.beginPath(); g.ellipse( 2.6,-1.2,1.8,0.9, 0.5,0,TAU); g.fill();
          // faded rose
          g.globalAlpha = 0.26; g.fillStyle = '#b5828c';
          g.beginPath(); g.ellipse(0,-4.5,2.4,2.0,0,0,TAU); g.fill();
          g.globalAlpha = 0.16; g.fillStyle = '#c69aa0';
          g.beginPath(); g.ellipse(0.4,-5.2,1.3,1.1,0.4,0,TAU); g.fill();
          g.restore();
        }
      }
      // grime at the bottom
      const grad = g.createLinearGradient(0,h*0.72,0,h);
      grad.addColorStop(0,'rgba(120,96,64,0)');
      grad.addColorStop(1,'rgba(120,96,64,0.22)');
      g.fillStyle = grad; g.fillRect(0,h*0.72,w,h*0.28);
    }});
}

/* red ornamental wool carpet ----------------------------------------- */
function texCarpet(){
  const W=128,H=128;
  const n = makeNoise(23);
  return makeTex(W,H,(x,y)=>{
    const f = fbm(n,x*0.9,y*0.9,3);
    let c = [146,40,32];
    c = shade(c, 0.86+f*0.3);
    return c;
  }, { draw:(g,w,h)=>{
      const ochre='#c9a044', cream='#ddc9a4', dark='#5e1c18';
      g.fillStyle=dark; g.fillRect(0,0,3,h); g.fillRect(w-3,0,3,h);
      g.fillRect(0,0,w,3); g.fillRect(0,h-3,w,3);
      g.fillStyle=ochre; g.globalAlpha=0.85;
      g.fillRect(4,4,2,h-8); g.fillRect(w-6,4,2,h-8);
      g.fillRect(4,4,w-8,2); g.fillRect(4,h-6,w-8,2);
      // diamond medallions
      g.globalAlpha=0.72;
      for (let cy=16; cy<h-8; cy+=32){
        for (let cx=16; cx<w-8; cx+=32){
          g.save(); g.translate(cx,cy);
          g.strokeStyle=ochre; g.lineWidth=1.4;
          g.beginPath(); g.moveTo(0,-9); g.lineTo(7,0); g.lineTo(0,9); g.lineTo(-7,0); g.closePath(); g.stroke();
          g.fillStyle=cream; g.globalAlpha=0.5;
          g.beginPath(); g.moveTo(0,-4); g.lineTo(3,0); g.lineTo(0,4); g.lineTo(-3,0); g.closePath(); g.fill();
          g.restore();
        }
      }
      // little crosses
      g.globalAlpha=0.45; g.fillStyle=cream;
      for (let cy=0; cy<h; cy+=16){
        for (let cx=0; cx<w; cx+=16){
          g.fillRect(cx,cy+7,2,2); g.fillRect(cx+7,cy,2,2);
        }
      }
      g.globalAlpha=1;
      // fibre noise
      const id = g.getImageData(0,0,w,h), d=id.data;
      for (let i=0;i<d.length;i+=4){
        const k=(R()-0.5)*34;
        d[i]=clamp(d[i]+k,0,255); d[i+1]=clamp(d[i+1]+k*0.8,0,255); d[i+2]=clamp(d[i+2]+k*0.7,0,255);
      }
      g.putImageData(id,0,0);
    }});
}

/* knitted sweater ----------------------------------------------------- */
function texKnit(base){
  const W=64,H=64;
  const n = makeNoise(97);
  return makeTex(W,H,(x,y)=>{
    const row = Math.floor(y/8);
    const off = (row%2)*4;
    const u = ((x+off)%8)/8, v = ((y%8)/8);
    // V stitch
    const d1 = Math.abs(u-0.5+v*0.35);
    let k = 0.80 + smoothstep(0.34,0.10,d1)*0.30;
    k *= 0.92 + fbm(n,x*0.7,y*0.7,3)*0.2;
    return shade(base,k);
  });
}

/* concrete panel ------------------------------------------------------ */
function texConcrete(base, seed, seam){
  const n = makeNoise(seed);
  return makeTex(64,64,(x,y)=>{
    const f = fbm(n,x*0.55,y*0.55,4);
    const sp = fbm(n,x*2.1,y*2.1,2);
    let k = 0.84 + f*0.30 + (sp-0.5)*0.12;
    let c = shade(base,k);
    // vertical weather streaks
    const st = fbm(n, x*0.28+3, y*0.02+9, 3);
    if (st>0.62) c = shade(c, 0.90);
    if (seam){
      if (x===0||x===63||y===0||y===63) c = shade(c,0.74);
      if (x===1||x===62||y===1||y===62) c = shade(c,0.93);
    }
    return c;
  });
}

/* brick --------------------------------------------------------------- */
function texBrick(base){
  const W=64,H=64, bw=16, bh=8;
  const n = makeNoise(31);
  return makeTex(W,H,(x,y)=>{
    const row = Math.floor(y/bh);
    const off = (row%2)*bw/2;
    const bx = Math.floor((x+off)/bw);
    const lx = ((x+off)%bw), ly = (y%bh);
    const mortar = (lx<1||lx>=bw-1||ly<1);
    const v = N1(bx*7+row*13, row*5);
    let c = mortar ? [176,168,150] : shade(base, 0.82+v*0.36);
    c = shade(c, 0.88+fbm(n,x*1.4,y*1.4,2)*0.24);
    return c;
  });
}

/* foliage clump ------------------------------------------------------- */
function texFoliage(base){
  const n = makeNoise(53);
  return makeTex(32,32,(x,y)=>{
    const f = fbm(n,x*0.45,y*0.45,4);
    let c = shade(base, 0.7+f*0.6);
    return c;
  });
}

/* skin ---------------------------------------------------------------- */
function texSkin(){
  const n = makeNoise(71);
  return makeTex(32,32,(x,y)=>{
    const f = fbm(n,x*0.6,y*0.6,3);
    let c = shade([214,168,138], 0.88+f*0.24);
    if (fbm(n,x*1.8+3,y*1.8+9,2)>0.74) c = shade(c,1.06);
    return c;
  });
}

/* tulle / sheer curtain (alpha + pattern) ----------------------------- */
function texTulle(){
  const W=64,H=64;
  const n = makeNoise(131);
  return makeTex(W,H,(x,y)=>{
    const mesh = (Math.sin(x*Math.PI/2)*0.5+0.5)*(Math.sin(y*Math.PI/2)*0.5+0.5);
    const f = fbm(n,x*0.5,y*0.5,3);
    const a = clamp(0.14 + mesh*0.20 + f*0.26, 0, 1);
    const c = shade([248,242,230], 0.9+f*0.2);
    return [c[0],c[1],c[2], Math.round(a*255)];
  }, { draw:(g,w,h)=>{
      // woven floral sprigs
      g.globalAlpha = 0.85;
      for (let col=0; col<6; col++){
        const cx = col*11+5;
        for (let k=0;k<3;k++){
          const cy = (k*22+(col%2)*11+4)%h;
          g.save(); g.translate(cx,cy);
          g.fillStyle='#e8dcc4';
          g.beginPath(); g.ellipse(0,0,2.6,3.4,0,0,TAU); g.fill();
          g.fillStyle='#dcd0b4';
          g.beginPath(); g.ellipse(-2.4,2.6,2.0,1.1,-0.6,0,TAU); g.fill();
          g.beginPath(); g.ellipse( 2.4,2.6,2.0,1.1, 0.6,0,TAU); g.fill();
          g.restore();
        }
      }
      g.globalAlpha = 1;
    }});
}
/* tulle shadow mask: mostly opaque threads so the shadow shows a pattern */
function texTulleShadow(){
  const W=64,H=64;
  return makeTex(W,H,(x,y)=>{
    const mesh = (Math.sin(x*Math.PI/2)*0.5+0.5)*(Math.sin(y*Math.PI/2)*0.5+0.5);
    let a = mesh>0.34 ? 235 : 70;
    // floral shapes punched out (the flowers let more light through)
    const fx = ((x+3)%11)-5.5, fy = ((y+5)%22)-11;
    const d = Math.sqrt(fx*fx*1.6 + fy*fy);
    if (d < 4.2) a = 40;
    return [255,255,255, a];
  });
}

/* soft wispy sprite for smoke ----------------------------------------- */
function texSmoke(){
  const W=32,H=32;
  const n = makeNoise(199);
  return makeTex(W,H,(x,y)=>{
    const u = (x+0.5)/W*2-1, v=(y+0.5)/H*2-1;
    const r = Math.sqrt(u*u+v*v);
    const fall = clamp(1-r,0,1);
    const f = fbm(n, x*0.42, y*0.42, 4);
    let a = Math.pow(fall,1.35) * (0.30 + f*1.05);
    a = clamp(a,0,1);
    a = Math.pow(a, 1.25);
    const l = 0.82 + f*0.3;
    return [255*l, 252*l, 248*l, Math.round(a*255)];
  });
}

/* generic soft dot --------------------------------------------------- */
function texDot(){
  return makeTex(16,16,(x,y)=>{
    const u=(x+0.5)/16*2-1, v=(y+0.5)/16*2-1;
    const a = clamp(1-Math.sqrt(u*u+v*v),0,1);
    return [255,255,255, Math.round(Math.pow(a,1.6)*255)];
  });
}

/* cloud alpha (for the racing cloud shadows) -------------------------- */
function texCloud(){
  const W=128,H=128;
  const n = makeNoise(311);
  return makeTex(W,H,(x,y)=>{
    const f = fbm(n, x*0.055, y*0.055, 5, 2.1, 0.55);
    const a = smoothstep(0.44,0.66,f);
    return [255,255,255, Math.round(a*255)];
  });
}

/* asphalt / ground ---------------------------------------------------- */
function texAsphalt(base){
  const n = makeNoise(401);
  return makeTex(64,64,(x,y)=>{
    const f = fbm(n,x*0.9,y*0.9,3);
    const sp = fbm(n,x*2.6,y*2.6,2);
    let c = shade(base, 0.85+f*0.26+(sp-0.5)*0.16);
    return c;
  });
}

/* rust / painted metal ------------------------------------------------ */
function texMetal(base, seed){
  const n = makeNoise(seed);
  return makeTex(32,32,(x,y)=>{
    const f = fbm(n,x*0.6,y*0.6,4);
    let c = shade(base, 0.82+f*0.34);
    if (f>0.72) c = mixc(c,[126,72,42],0.55);
    return c;
  });
}

/* book spines --------------------------------------------------------- */
function texBooks(){
  const W=64,H=32;
  const cols = [[142,58,44],[88,74,52],[62,86,96],[126,102,54],[92,52,66],[58,72,54]];
  return makeTex(W,H,(x,y)=>{
    const i = Math.floor(x/10) % cols.length;
    const c = cols[i];
    const n = makeNoise(500+i*13);
    let k = 0.82 + fbm(n,x*1.2,y*1.2,3)*0.3;
    if (x%10<1) k*=0.7;
    return shade(c,k);
  }, { draw:(g,w,h)=>{
      g.globalAlpha=0.5;
      for (let i=0;i<6;i++){
        g.fillStyle='#e8dcc0';
        g.fillRect(i*10+2, 4+ (i%3)*3, 6, 1);
        g.fillRect(i*10+2, h-8-(i%3)*2, 5, 1);
      }
      g.globalAlpha=1;
  }});
}

/* grass / dirt ground -------------------------------------------------- */
function texGround(){
  const W=64,H=64;
  const n = makeNoise(601);
  return makeTex(W,H,(x,y)=>{
    const f = fbm(n,x*0.28,y*0.28,4);
    const p = fbm(n,x*1.1,y*1.1,3);
    let c = mixc([118,116,86],[152,140,104], f);
    c = shade(c, 0.9+p*0.24);
    return c;
  });
}

/* small utility textures */
const TEX = {
  framePaint : texPaintedWood([214,205,182], 3, 0.85),
  framePaint2: texPaintedWood([206,196,172], 9, 0.7),
  wood       : texWood([150,112,70], 17),
  woodDark   : texWood([104,76,48], 19),
  wallpaper  : texWallpaper(),
  carpet     : texCarpet(),
  knit       : texKnit([142,118,78]),
  concrete   : texConcrete([186,178,162], 23, true),
  concrete2  : texConcrete([168,160,146], 29, false),
  brick      : texBrick([162,96,68]),
  leaf       : texFoliage([176,148,58]),
  leaf2      : texFoliage([198,124,48]),
  leaf3      : texFoliage([128,142,64]),
  skin       : texSkin(),
  tulle      : texTulle(),
  tulleSh    : texTulleShadow(),
  smoke      : texSmoke(),
  dot        : texDot(),
  cloud      : texCloud(),
  asphalt    : texAsphalt([104,100,94]),
  metalGreen : texMetal([126,142,116], 41),
  metalRust  : texMetal([150,96,64], 43),
  books      : texBooks(),
  ground     : texGround(),
  soil       : texAsphalt([122,102,78]),
};
TEX.tulleSh.colorSpace = THREE.NoColorSpace;

/* ---------------------------------------------------------------- shared uniforms */
const U = {
  uSunDir      : { value: new THREE.Vector3(0.3,0.4,-0.86).normalize() }, // direction TO the sun
  uSunColor    : { value: new THREE.Color(1,0.82,0.6) },
  uAmbient     : { value: new THREE.Color(0.30,0.34,0.44) },
  uFogColor    : { value: new THREE.Color(0.72,0.60,0.48) },
  uFogSunColor : { value: new THREE.Color(1.0,0.72,0.40) },
  uFogDensity  : { value: 0.0075 },
  uGrid        : { value: new THREE.Vector2(320,180) },
  uGlintPos    : { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
  uGlintParam  : { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
  uGlintColor  : { value: new THREE.Color(1,0.8,0.5) },
  uLampOn      : { value: 0 },
};

/* ==========================================================================
   MATERIAL FACTORY  —  PSX vertex snap + affine UV + directional fog + glints
   ========================================================================== */
const FOG_PARS = `
  uniform vec3 uSunDir;
  uniform vec3 uSunColor;
  uniform vec3 uAmbient;
  uniform vec3 uFogColor;
  uniform vec3 uFogSunColor;
  uniform vec3 uGlintPos[4];
  uniform vec3 uGlintParam[4];
  uniform vec3 uGlintColor;
  varying vec3 vWorldP;
  varying vec3 vWorldDir;
`;

const GLSL_WINLIGHT = `
float winLight( vec3 p ){
  if ( p.z < 0.105 ) return 0.0;
  float t = (0.105 - p.z) / ( uSunDir.z + 1e-6 );
  if ( t < 0.0 ) return 0.0;
  vec3 hit = p + uSunDir * t;
  if ( hit.x < -0.38 || hit.x > 0.60 ) return 0.0;
  if ( hit.y < 1.14  || hit.y > 1.90  ) return 0.0;
  if ( abs(hit.x - 0.02) < 0.030 ) return 0.0;   /* the mullion */
  if ( abs(hit.y - 1.68) < 0.032 ) return 0.0;   /* the transom */
  return 1.0;
}`;

function psxMaterial( opt ){
  const affine = !!opt.affine;
  const key = 'psx1|' + (affine?'A':'N') + (opt.glint?'G':'') + (opt.flat?'F':'');
  const m = new THREE.MeshStandardMaterial( opt.std || {} );
  const std = opt.std || {};
  m.onBeforeCompile = (sh)=>{
    sh.uniforms.uSunDir      = U.uSunDir;
    sh.uniforms.uSunColor    = U.uSunColor;
    sh.uniforms.uAmbient     = U.uAmbient;
    sh.uniforms.uFogColor    = U.uFogColor;
    sh.uniforms.uFogSunColor = U.uFogSunColor;
    sh.uniforms.uGlintPos    = U.uGlintPos;
    sh.uniforms.uGlintParam  = U.uGlintParam;
    sh.uniforms.uGlintColor  = U.uGlintColor;
    sh.uniforms.uGrid        = U.uGrid;
    sh.uniforms.uProjColor   = U.uProjColor;
    sh.uniforms.uProjSun     = U.uProjSun;
    sh.uniforms.uProjDir     = U.uProjDir;
    sh.uniforms.uShadowMap2  = SU.uShadowMap2;
    sh.uniforms.uShadowMatrix2 = SU.uShadowMatrix2;
    sh.uniforms.uShadowBias2 = SU.uShadowBias2;
    sh.uniforms.uProjMask    = { value: opt.bounce === false ? 0.0 : 1.0 };

    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform vec2 uGrid;
        varying vec3 vWorldP;
        varying vec3 vWorldDir;
        varying vec3 vWorldN;
        ${affine ? 'varying float vAffW;' : ''}
      `)
      .replace('#include <project_vertex>', `#include <project_vertex>
        {
          vec4 wp4 = modelMatrix * vec4( transformed, 1.0 );
          vWorldP  = wp4.xyz;
          vWorldDir = wp4.xyz - cameraPosition;
          vWorldN   = normalize( mat3(modelMatrix) * objectNormal );
          /* PSX vertex snapping : quantise clip space to a virtual 480-line grid */
          vec4 pc = gl_Position;
          if ( pc.w > 1e-4 ){
            vec2 ndc = pc.xy / pc.w;
            ndc = clamp( ndc, vec2(-4.0), vec2(4.0) );
            ndc = floor( ndc * uGrid + 0.5 ) / uGrid;
            pc.xy = ndc * pc.w;
          }
          gl_Position = pc;
          ${affine ? `
          #ifdef USE_MAP
            vAffW = gl_Position.w;
            vMapUv = vMapUv / gl_Position.w;
          #endif` : ''}
        }
      `);

    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        ${FOG_PARS}
        ${GLSL_WINLIGHT}
        ${affine ? 'varying float vAffW;' : ''}
        varying vec3 vWorldN;
        uniform sampler2D uShadowMap2;
        uniform mat4 uShadowMatrix2;
        uniform float uShadowBias2;
        uniform vec3 uProjColor, uProjSun, uProjDir;
        uniform float uProjMask;
        const vec4 UnpackFactors4 = vec4( 0.99609375/16777216.0, 0.99609375/65536.0, 0.99609375/256.0, 0.99609375 );`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          if ( uProjMask > 0.0 ){
            vec3 Nw = normalize(vWorldN);
            /* the bounce that paints the window cross on the wall and the hand */
            float ndlB = max( dot( Nw, -uProjDir ), 0.0 );
            if ( ndlB > 0.0 ){
              vec4 sc2 = uShadowMatrix2 * vec4( vWorldP, 1.0 );
              vec3 p2 = sc2.xyz / sc2.w;
              p2 = p2*0.5 + 0.5;
              float sh2 = 1.0;
              if ( p2.z <= 1.0 && p2.x >= 0.0 && p2.x <= 1.0 && p2.y >= 0.0 && p2.y <= 1.0 ){
                float d2 = dot( texture2D(uShadowMap2, p2.xy), UnpackFactors4 );
                sh2 = ( p2.z - uShadowBias2 > d2 ) ? 0.0 : 1.0;
              }
              reflectedLight.directDiffuse += uProjColor * ndlB * sh2 * uProjMask * RECIPROCAL_PI * material.diffuseColor;
            }
            /* the low sun coming straight through the opening : hard stripes */
            float ndlS = max( dot( Nw, uSunDir ), 0.0 );
            if ( ndlS > 0.0 ){
              float wl = winLight( vWorldP );
              if ( wl > 0.0 ) reflectedLight.directDiffuse += uProjSun * ndlS * wl * uProjMask * RECIPROCAL_PI * material.diffuseColor;
            }
          }
        }
        /*PROJ_END*/`)
      .replace('#include <map_fragment>', affine ? `
        #ifdef USE_MAP
          vec4 sampledDiffuseColor = texture2D( map, vMapUv * vAffW );
          diffuseColor *= sampledDiffuseColor;
        #endif
      ` : '#include <map_fragment>')
      .replace('#include <fog_fragment>', `
        {
          #ifdef USE_FOG
            float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
            vec3 vdir = normalize( vWorldDir );
            float sunAmt = max( dot( vdir, uSunDir ), 0.0 );
            vec3 fc = mix( uFogColor, uFogSunColor, pow( sunAmt, 3.0 ) );
            gl_FragColor.rgb = mix( gl_FragColor.rgb, fc, fogFactor );
          #endif
          /* moving sun glints reflected off the opposite blocks */
          {
            vec3 gp0 = vWorldP - uGlintPos[0];
            vec3 gp1 = vWorldP - uGlintPos[1];
            vec3 gp2 = vWorldP - uGlintPos[2];
            vec3 gp3 = vWorldP - uGlintPos[3];
            float g0 = uGlintParam[0].x * exp( -dot(gp0,gp0) / max(uGlintParam[0].y*uGlintParam[0].y, 1e-5) );
            float g1 = uGlintParam[1].x * exp( -dot(gp1,gp1) / max(uGlintParam[1].y*uGlintParam[1].y, 1e-5) );
            float g2 = uGlintParam[2].x * exp( -dot(gp2,gp2) / max(uGlintParam[2].y*uGlintParam[2].y, 1e-5) );
            float g3 = uGlintParam[3].x * exp( -dot(gp3,gp3) / max(uGlintParam[3].y*uGlintParam[3].y, 1e-5) );
            gl_FragColor.rgb += uGlintColor * (g0+g1+g2+g3);
          }
        }
      `);
  };
  m.customProgramCacheKey = ()=> key;
  if (opt.name) m.name = opt.name;
  return m;
}

/* plain (non-patched) standard material for things that never need the look */
function plainMaterial( o ){
  const m = new THREE.MeshStandardMaterial(o);
  m.onBeforeCompile = (sh)=>{
    sh.uniforms.uSunDir = U.uSunDir; sh.uniforms.uAmbient = U.uAmbient;
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      uniform vec3 uSunDir; uniform vec3 uAmbient; varying vec3 vWorldDir;`)
      .replace('#include <fog_fragment>', `
        {
          #ifdef USE_FOG
            float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
            vec3 vdir = normalize( vWorldDir );
            float sunAmt = max( dot( vdir, uSunDir ), 0.0 );
            vec3 fc = mix( uFogColor, uFogSunColor, pow( sunAmt, 3.0 ) );
            gl_FragColor.rgb = mix( gl_FragColor.rgb, fc, fogFactor );
          #endif
        }`);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWorldDir;`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        { vWorldDir = ( modelMatrix * vec4(transformed,1.0) ).xyz - cameraPosition; }`);
    sh.uniforms.uFogColor = U.uFogColor; sh.uniforms.uFogSunColor = U.uFogSunColor;
  };
  m.customProgramCacheKey = ()=> 'plain1';
  return m;
}

/* ==========================================================================
   SKY  —  physically based single scattering (Rayleigh + Mie)
   ========================================================================== */
const SKY_VERT = `
varying vec3 vDir;
void main(){
  vDir = position;
  vec4 mv = modelViewMatrix * vec4( position, 1.0 );
  gl_Position = projectionMatrix * mv;
}`;
const SKY_FRAG = `
precision highp float;
uniform vec3  uSunDir;
uniform vec3  uSunColor;
uniform vec3  uGroundHaze;
uniform float uSunLevel;
uniform float uSunLow;
varying vec3 vDir;

const float PI = 3.14159265359;
const float Rg = 6360000.0;
const float Ra = 6460000.0;

float raySphere( vec3 o, vec3 d, float r ){
  float b = dot(o,d);
  float c = dot(o,o) - r*r;
  float h = b*b - c;
  if ( h < 0.0 ) return -1.0;
  return -b + sqrt(h);
}

vec3 atmosphere( vec3 rd, vec3 sd ){
  vec3 betaR = vec3(5.8e-6, 13.5e-6, 33.1e-6);
  float betaM = 21e-6;
  float Hr = 8000.0, Hm = 1200.0;
  vec3 ro = vec3(0.0, Rg + 240.0, 0.0);

  float tMax = raySphere(ro, rd, Ra);
  float tg   = raySphere(ro, rd, Rg);
  if ( tg > 0.0 ) tMax = tg;
  if ( tMax < 0.0 ) tMax = 0.0;

  const int N = 10;
  float dt = tMax / float(N);
  float mu = dot(rd, sd);
  float pr = 3.0/(16.0*PI) * (1.0 + mu*mu);
  float g = 0.78;
  float pm = 3.0/(8.0*PI) * ((1.0-g*g)*(1.0+mu*mu)) / ((2.0+g*g)*pow(max(1.0+g*g-2.0*g*mu, 1e-4), 1.5));

  vec3 sumR = vec3(0.0), sumM = vec3(0.0);
  float odR = 0.0, odM = 0.0;

  for ( int i=0; i<N; i++ ){
    vec3 p = ro + rd * ( dt * (float(i) + 0.5) );
    float h = max( length(p) - Rg, 0.0 );
    float dR = exp(-h/Hr) * dt;
    float dM = exp(-h/Hm) * dt;
    odR += dR; odM += dM;

    float lMax = raySphere(p, sd, Ra);
    float lg   = raySphere(p, sd, Rg);
    if ( lg > 0.0 ) lMax = lg;
    const int NL = 4;
    float ldt = lMax / float(NL);
    float lodR = 0.0, lodM = 0.0;
    bool blocked = false;
    for ( int j=0; j<NL; j++ ){
      vec3 q = p + sd * ( ldt * (float(j)+0.5) );
      float hh = length(q) - Rg;
      if ( hh < 0.0 ){ blocked = true; break; }
      lodR += exp(-hh/Hr) * ldt;
      lodM += exp(-hh/Hm) * ldt;
    }
    if ( blocked ) continue;
    vec3 tau = betaR*(odR+lodR) + vec3(betaM*1.15)*(odM+lodM);
    vec3 att = exp(-tau);
    sumR += att * dR;
    sumM += att * dM;
  }
  return 21.0 * ( sumR*betaR*pr + sumM*betaM*pm );
}

void main(){
  vec3 rd = normalize( vDir );
  vec3 sd = normalize( uSunDir );
  vec3 col = atmosphere( rd, sd );

  /* below the horizon -> haze */
  float below = smoothstep( 0.02, -0.06, rd.y );
  col = mix( col, uGroundHaze, below );
  /* never let the dome become a white haze : cap the radiance */
  float aboveH = smoothstep(-0.12, 0.03, sd.y);
  col = min( col, mix( vec3(3.4,2.0,1.15), vec3(0.30,0.15,0.08), uSunLow*aboveH ) );

  /* the painted sunset : orange at the horizon by the sun, peach, violet above */
  float el  = max(rd.y, 0.0);
  float elDeg = degrees(asin(clamp(el, -1.0, 1.0)));
  float toSun = max(dot(normalize(vec3(rd.x,0.0,rd.z)), normalize(vec3(sd.x,0.0,sd.z))), 0.0);
  /* the sky away from the sun keeps a cool violet cast */
  vec3 farLow  = vec3(0.42,0.15,0.11);
  vec3 farMid  = vec3(0.25,0.14,0.30);
  vec3 farHigh = vec3(0.10,0.08,0.26);
  /* the sky around the sun burns orange */
  vec3 sunLow  = vec3(1.05,0.13,0.02);
  vec3 sunMid  = vec3(0.60,0.13,0.10);
  vec3 sunHigh = vec3(0.28,0.11,0.34);
  float w = pow(toSun, 2.2);
  vec3 lowC  = mix(farLow,  sunLow,  w);
  vec3 midC  = mix(farMid,  sunMid,  w);
  vec3 highC = mix(farHigh, sunHigh, w);
  vec3 painted = mix(lowC, midC, smoothstep(0.0, 11.0, elDeg));
  painted = mix(painted, highC, smoothstep(10.0, 38.0, elDeg));
  col = mix(col, painted, clamp(uSunLow*1.30, 0.0, 1.0) * aboveH);
  /* the whole dome dims as the sun sinks, so the sunset keeps its colour
     instead of blowing out to a white haze */
  col *= mix(0.30, 1.0, clamp((sd.y + 0.06) * 3.4, 0.0, 1.0));

  /* dusk / night : deep blue zenith with a warm band low in the west */
  float dusk = 1.0 - clamp(uSunLevel*1.6, 0.0, 1.0);
  if ( dusk > 0.001 ){
    float horiz = pow( 1.0 - clamp(rd.y,0.0,1.0), 5.0 );
    float toSun = pow( max(dot(normalize(vec3(rd.x,0.0,rd.z)), normalize(vec3(sd.x,0.0,sd.z))), 0.0), 3.0 );
    vec3 deep = vec3(0.015,0.020,0.062);
    vec3 warmBand = mix(vec3(0.045,0.042,0.082), vec3(0.26,0.11,0.055), toSun);
    vec3 duskCol = mix(deep, warmBand, horiz*0.85);
    col = mix(col, duskCol, dusk);
  }

  /* sun disc + halo : an orange sun, not a white blob */
  float cd = dot( rd, sd );
  float disc = smoothstep( 0.99922, 0.99960, cd );
  float halo = pow( max(cd,0.0), 1800.0 );
  float wide = pow( max(cd,0.0), 40.0 );
  float glow = pow( max(cd,0.0), 6.0 );
  vec3 discCol = mix( uSunColor, vec3(1.0,0.020,0.0), uSunLow );
  vec3 haloCol = mix( uSunColor, vec3(1.0,0.10,0.01), uSunLow );
  col += discCol * ( disc*mix(2.2,3.10,uSunLow) ) * uSunLevel;
  col += haloCol * ( halo*0.10 + wide*0.030 + glow*0.010 ) * uSunLevel;

  gl_FragColor = vec4( col, 1.0 );
}`;

function makeSky(){
  const geo = new THREE.SphereGeometry(2600, 32, 20);
  const mat = new THREE.ShaderMaterial({
    vertexShader: SKY_VERT, fragmentShader: SKY_FRAG,
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    uniforms: {
      uSunDir: U.uSunDir, uSunColor: U.uSunColor,
      uGroundHaze: U.uFogColor, uSunLevel: { value: 1 }, uSunLow: { value: 0 }
    }
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = -1000;
  m.frustumCulled = false;
  return m;
}

   ========================================================================== */
const WALL_Z_IN  = 0.10,  WALL_Z_OUT = -0.22;
const GLASS_Z_IN = 0.02,  GLASS_Z_OUT = -0.10;
const WIN_X0 = -0.38, WIN_X1 = 0.60, WIN_Y0 = 1.14, WIN_Y1 = 1.90;
const HOLE_X0 = WIN_X0-0.07, HOLE_X1 = WIN_X1+0.07, HOLE_Y0 = WIN_Y0-0.07, HOLE_Y1 = WIN_Y1+0.07;
const ROOM = { x0:-1.62, x1:1.78, z0:-0.22, z1:3.40, y0:0.0, y1:2.62 };
const GY = -27.0;                       /* ground level, we are on the 9th floor */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb59a78, 0.0068);

const camera = new THREE.PerspectiveCamera(60, 16/9, 0.03, 4200);
camera.position.set(0, 1.65, 0.92);
camera.rotation.set(-12*DEG, 0, 0);
camera.layers.enable(1);                 /* sodium lamps live on layer 1 */
const CAM_BASE = { pos: camera.position.clone(), rot: camera.rotation.clone() };

/* ---- geometry helpers ---- */
function mkBox(w,h,d,mat,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); if(ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function mkPlane(w,h,mat,x,y,z,rx,ry,uvs){
  const g = new THREE.PlaneGeometry(w,h);
  if (uvs){
    const uv = g.attributes.uv;
    for (let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*uvs[0], uv.getY(i)*uvs[1]);
  }
  const m = new THREE.Mesh(g, mat);
  m.position.set(x,y,z);
  if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry;
  m.receiveShadow = true;
  return m;
}
function mkCyl(rt,rb,h,seg,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg,1), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ---- materials for the room ---- */

/* ---------------------------------------------------------------- window */
let windowFortochka = null;
function buildWindow(){
  const g = new THREE.Group();

  /* wall (inner face + reveal + outer face) */
  const wallT = WALL_Z_IN - WALL_Z_OUT;
  const wz = (WALL_Z_IN+WALL_Z_OUT)/2;
  g.add(mkBox(HOLE_X0-ROOM.x0, ROOM.y1-ROOM.y0, wallT, MAT.plaster, (ROOM.x0+HOLE_X0)/2, ROOM.y1/2, wz));
  g.add(mkBox(ROOM.x1-HOLE_X1, ROOM.y1-ROOM.y0, wallT, MAT.plaster, (HOLE_X1+ROOM.x1)/2, ROOM.y1/2, wz));
  g.add(mkBox(HOLE_X1-HOLE_X0, ROOM.y1-HOLE_Y1, wallT, MAT.plaster, (HOLE_X0+HOLE_X1)/2, (HOLE_Y1+ROOM.y1)/2, wz));
  g.add(mkBox(HOLE_X1-HOLE_X0, HOLE_Y0-ROOM.y0, wallT, MAT.plaster, (HOLE_X0+HOLE_X1)/2, (HOLE_Y0+ROOM.y0)/2, wz));

  /* wallpapered inner face */
  const uvs = (w,h)=>[w/1.25, h/1.25];
  const lp = mkPlane(HOLE_X0-ROOM.x0, ROOM.y1-ROOM.y0, MAT.wallpaper, (ROOM.x0+HOLE_X0)/2, ROOM.y1/2, WALL_Z_IN+0.001, 0,0, uvs(HOLE_X0-ROOM.x0,ROOM.y1));
  const rp = mkPlane(ROOM.x1-HOLE_X1, ROOM.y1-ROOM.y0, MAT.wallpaper, (HOLE_X1+ROOM.x1)/2, ROOM.y1/2, WALL_Z_IN+0.001, 0,0, uvs(ROOM.x1-HOLE_X1,ROOM.y1));
  const tp = mkPlane(HOLE_X1-HOLE_X0, ROOM.y1-HOLE_Y1, MAT.wallpaper, (HOLE_X0+HOLE_X1)/2, (HOLE_Y1+ROOM.y1)/2, WALL_Z_IN+0.001, 0,0, uvs(HOLE_X1-HOLE_X0,ROOM.y1-HOLE_Y1));
  const bp = mkPlane(HOLE_X1-HOLE_X0, HOLE_Y0-ROOM.y0, MAT.wallpaper, (HOLE_X0+HOLE_X1)/2, ROOM.y0/2, WALL_Z_IN+0.001, 0,0, uvs(HOLE_X1-HOLE_X0,HOLE_Y0));
  [lp,rp,tp,bp].forEach(m=>{m.receiveShadow=true; g.add(m);});

  /* reveal (the wall thickness around the opening) */
  const rv = mkBox(0.02, WIN_Y1-WIN_Y0, wallT, MAT.framePaint2, HOLE_X0+0.01, (WIN_Y0+WIN_Y1)/2, wz);
  g.add(rv);
  g.add(mkBox(0.02, WIN_Y1-WIN_Y0, wallT, MAT.framePaint2, HOLE_X1-0.01, (WIN_Y0+WIN_Y1)/2, wz));
  g.add(mkBox(HOLE_X1-HOLE_X0, 0.02, wallT, MAT.framePaint2, (HOLE_X0+HOLE_X1)/2, WIN_Y1+0.01, wz));
  g.add(mkBox(HOLE_X1-HOLE_X0, 0.02, wallT, MAT.framePaint2, (HOLE_X0+HOLE_X1)/2, WIN_Y0-0.01, wz));

  /* inner frame */
  const fw = 0.075;
  function frameRing(z0,z1,mat){
    const d = z1-z0, cz=(z0+z1)/2;
    const o = new THREE.Group();
    o.add(mkBox(fw, WIN_Y1-WIN_Y0+fw*2, d, mat, WIN_X0-fw/2, (WIN_Y0+WIN_Y1)/2, cz));
    o.add(mkBox(fw, WIN_Y1-WIN_Y0+fw*2, d, mat, WIN_X1+fw/2, (WIN_Y0+WIN_Y1)/2, cz));

    o.add(mkBox(WIN_X1-WIN_X0, fw, d, mat, (WIN_X0+WIN_X1)/2, WIN_Y1+fw/2, cz));

  }
  g.add(frameRing(WALL_Z_IN-0.085, WALL_Z_IN, MAT.framePaint));
  g.add(frameRing(WALL_Z_OUT+0.02, WALL_Z_OUT+0.105, MAT.framePaint2));

  g.add(fort);
  windowFortochka = fort;

  /* ---- the two layers of glass (12 cm apart) ---- */
  const gIn = makeGlassMaterial(0.35), gOut = makeGlassMaterial(0.75);
  MAT.glassInner = gIn; MAT.glassOuter = gOut;
  /* inner: lower pane (under the transom) */

                      (fortX1+WIN_X1)/2, (transY+WIN_Y1-0.03)/2, GLASS_Z_IN, 0,0, [1.0,1.0]);
  gi2.renderOrder = 6;
  g.add(gi2);
  /* the fortochka pane swings with the vent */
  const fg = mkPlane(fW-0.07, fH-0.05, gIn, 0, -fH/2-0.0175, 0, 0,0, [1,1]);
  fg.renderOrder = 7;
  fort.add(fg);
  /* outer: one big sheet over the whole opening */
  const go = mkPlane(WIN_X1-WIN_X0-0.02, WIN_Y1-WIN_Y0-0.02, gOut,
                     (WIN_X0+WIN_X1)/2, (WIN_Y0+WIN_Y1)/2, GLASS_Z_OUT, 0,0, [2.2,2.2]);
  go.renderOrder = 5;

  /* latch handles */
  const handle = (x,y,z,flip)=>{
    const h = new THREE.Group();
    h.add(mkBox(0.022,0.085,0.018, MAT.metal, x, y, z));
    h.add(mkBox(0.075,0.020,0.016, MAT.metal, x+(flip?0.03:-0.03), y-0.028, z+0.012));
    h.add(mkCyl(0.018,0.018,0.012,8, MAT.brass, x, y+0.028, z+0.006));

  g.add(handle(mullX-0.055, 1.40, WALL_Z_IN-0.012, false));
  g.add(handle(mullX+0.055, 1.40, WALL_Z_IN-0.012, true));
  g.add(mkBox(0.06,0.09,0.016, MAT.metal, mullX, 1.40, WALL_Z_IN-0.006));

  g.add(rad);

  return g;
}

/* ---------------------------------------------------------------- glass */
function makeGlassMaterial(dirty){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide, fog:false,
    blending:THREE.CustomBlending, blendSrc:THREE.OneFactor, blendDst:THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha:THREE.OneFactor, blendDstAlpha:THREE.OneMinusSrcAlphaFactor,
    uniforms:{
      uDust:{value:TEX.smoke}, uSunDir:U.uSunDir, uSunColor:U.uSunColor,
      uSky:U.uFogSunColor, uDirty:{value:dirty}, uOpacity:{value:1}, uRoom:{value:new THREE.Color(0,0,0)}
    },
    vertexShader:`
      varying vec3 vWP; varying vec3 vNW; varying vec2 vUvg;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWP = wp.xyz;
        vNW = normalize(mat3(modelMatrix) * normal);
        vUvg = uv;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D uDust; uniform vec3 uSunDir, uSunColor, uSky, uRoom; uniform float uDirty;
      varying vec3 vWP; varying vec3 vNW; varying vec2 vUvg;
      void main(){
        vec3 V = normalize(cameraPosition - vWP);
        vec3 N = normalize(vNW);
        float fres = pow(1.0 - max(dot(N,V),0.0), 3.5);
        float dust = texture2D(uDust, vUvg*vec2(4.0,5.0)).a;
        float grime = texture2D(uDust, vUvg*vec2(1.3,1.7)).a;
        vec3 col = uSky * (0.038 + fres*0.15);
        /* the room (and the ember) reflected faintly in the double glass */
        col += uRoom * (0.10 + fres*0.42);
        vec3 H = normalize(uSunDir + V);
        float spec = pow(max(dot(N,H),0.0), 240.0);
        col += uSunColor * spec * 0.22 * vec3(1.0,0.72,0.42);
        float a = 0.022 + fres*0.045 + dust*0.020*uDirty + grime*0.016*uDirty;
        a = clamp(a, 0.0, 0.32);
        gl_FragColor = vec4(col * a, a);
      }`
  });
}

/* ---------------------------------------------------------------- curtain */
function buildCurtain(){
  const g = new THREE.Group();
  /* rod */
  g.add(mkCyl(0.011,0.011, 1.45, 6, MAT.metal, 0.08, 2.055, 0.075).rotateZ(Math.PI/2));
  const curtainMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide, fog:false,
    uniforms:{ uSunDir:U.uSunDir, uSunColor:U.uSunColor, uAmb:U.uAmbient, uMap:{value:TEX.tulle}, uLamp:U.uLampOn },
    vertexShader:`
      varying vec3 vWP; varying vec3 vNW; varying vec2 vUvg;
      void main(){
        vec4 wp = modelMatrix*vec4(position,1.0);
        vWP = wp.xyz; vNW = normalize(mat3(modelMatrix)*normal); vUvg = uv;
        gl_Position = projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D uMap; uniform vec3 uSunDir,uSunColor,uAmb; uniform float uLamp;
      varying vec3 vWP; varying vec3 vNW; varying vec2 vUvg;
      void main(){
        vec4 t = texture2D(uMap, vUvg);
        vec3 N = normalize(vNW);
        vec3 V = normalize(cameraPosition - vWP);
        float ndl = abs(dot(N, uSunDir));
        float back = pow(ndl, 1.2);
        float side = pow(max(dot(N,uSunDir),0.0), 1.2);
        vec3 col = uAmb*1.25 + vec3(1.0,0.94,0.84)*(0.06 + back*0.22) + uSunColor*(side*0.16 + back*0.30);
        col += vec3(1.0,0.72,0.38)*uLamp*0.42;
        float a = t.a*(0.46 + back*0.40 + side*0.18);
        gl_FragColor = vec4(col, clamp(a,0.0,0.74));
      }`
  });
  /* gathered sheer, pulled to the right */
  const CW = 0.215, CH = 1.02, SX = 18, SY = 14;
  const geo = new THREE.PlaneGeometry(CW, CH, SX, SY);
  const pos = geo.attributes.position;
  const cx = WIN_X1-0.055, cy = 1.52, cz = 0.055;
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    const u = (x+CW/2)/CW;
    const fold = Math.sin(u*Math.PI*6.0)*0.011 + Math.sin(u*Math.PI*2.6+1.1)*0.008;
    const sag  = Math.sin(u*Math.PI*1.4)*0.010;
    pos.setZ(i, fold);
    pos.setX(i, x + fold*0.45);
    pos.setY(i, y - sag*Math.abs(u-0.5)*2.0);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, curtainMat);
  m.position.set(cx, cy, cz);
  m.castShadow = true;
  m.customDepthMaterial = new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking, alphaMap: TEX.tulleSh, alphaTest: 0.4, side:THREE.DoubleSide
  });
  g.add(m);
  return g;
}

/* ==========================================================================
   SHARED SHADOW LOOKUP (three r160 packs depth into RGBA)
   ========================================================================== */
const SU = {
  uShadowMap  : { value: null },
  uShadowMatrix:{ value: new THREE.Matrix4() },
  uShadowBias : { value: 0.0022 },
  uSunDir     : U.uSunDir,
  uSunColor   : U.uSunColor,
  uAmbient    : U.uAmbient,
  uFogColor   : U.uFogColor,
  uFogSunColor: U.uFogSunColor,
  uTime       : { value: 0 },
  uPixelRatio : { value: 1 },
  uLamp       : U.uLampOn
};
const GLSL_SHADOW = `
uniform sampler2D uShadowMap;
uniform mat4 uShadowMatrix;
uniform float uShadowBias;
const vec4 UnpackFactors4 = vec4( 0.99609375/16777216.0, 0.99609375/65536.0, 0.99609375/256.0, 0.99609375 );
float shadowLookup( vec3 wp, float ndl ){
  vec4 sc = uShadowMatrix * vec4( wp, 1.0 );
  vec3 p = sc.xyz / sc.w;
  p = p * 0.5 + 0.5;
  if ( p.z > 1.0 || p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 ) return 1.0;
  float d = dot( texture2D( uShadowMap, p.xy ), UnpackFactors4 );
  float bias = uShadowBias * ( 1.0 + ( 1.0 - ndl ) * 3.0 );
  return ( p.z - bias > d ) ? 0.0 : 1.0;
}`;

function taperedBox(w,h,d, taper, mat, x,y,z){
  const g = new THREE.BoxGeometry(w,h,d);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const py = p.getY(i);
    const f = (py > 0) ? taper : 1.0;
    p.setX(i, p.getX(i)*f); p.setZ(i, p.getZ(i)*(1.0 + (f-1.0)*0.35));
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  return m;
}

function makeFinger( segLens, rads, bends, mat ){
  const root = new THREE.Group();
  let parent = root;
  for (let i=0;i<segLens.length;i++){
    const seg = new THREE.Group();
    const geo = new THREE.CylinderGeometry(rads[i+1], rads[i], segLens[i], 5, 1, false);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = segLens[i]*0.5;
    mesh.castShadow = true; mesh.receiveShadow = true;
    seg.add(mesh);
    /* knuckle */
    const kn = new THREE.Mesh(new THREE.SphereGeometry(rads[i+1]*1.18, 5, 4), mat);
    kn.position.y = segLens[i]; kn.castShadow = true;
    seg.add(kn);
    if (i>0) seg.position.y = segLens[i-1]*0.94;
    seg.rotation.x = bends[i];
    parent.add(seg);
    parent = seg;
  }
  return root;
}

  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.075, armLen*0.92, 8, 1), MAT.knit);
  sleeve.material = psxMaterial({ name:'knitArm', std:{ map:TEX.knit, color:0x8d7f6a, roughness:0.98 }, affine:true });
  sleeve.position.copy(elbow).addScaledVector(dir, 0.46);
  sleeve.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  sleeve.castShadow = true; sleeve.receiveShadow = true;
  g.add(sleeve);
  /* cuff */
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.050,0.035,8,1), MAT.knit);
  cuff.material = sleeve.material;
  cuff.position.copy(elbow).addScaledVector(dir, 0.92);
  cuff.quaternion.copy(sleeve.quaternion);
  cuff.castShadow = true;
  g.add(cuff);

  /* ---- hand local frame ---- */
  const hand = new THREE.Group();
  const Y = new THREE.Vector3(-0.40, 0.78, -0.47).normalize();   // finger direction
  const Z = new THREE.Vector3(0.16, 0.10, 0.98).normalize();     // back of the hand
  const X = new THREE.Vector3().crossVectors(Y, Z).normalize();
  const Zc = new THREE.Vector3().crossVectors(X, Y).normalize();
  hand.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Zc));
  hand.position.copy(wrist);
  hand.scale.setScalar(0.90);
  g.add(hand);

  /* palm : bevelled low-poly block */
  const palm = taperedBox(0.082, 0.086, 0.036, 0.86, MAT.skin, 0, 0.043, 0);
  hand.add(palm);
  /* thenar bulge (base of the thumb) */
  const thenar = new THREE.Mesh(new THREE.SphereGeometry(0.020, 6, 5), MAT.skin);
  thenar.scale.set(1.0, 1.5, 0.72);
  thenar.position.set(-0.034, 0.028, -0.004);
  thenar.castShadow = true; thenar.receiveShadow = true;
  hand.add(thenar);

  /* wrist / cuff end */
  hand.add(taperedBox(0.056,0.036,0.030,1.0, MAT.skin, 0, 0.012, 0));

  /* ---- fingers : index + middle hold the cigarette ---- */
  const skin = MAT.skin;
  const mk = (x, segLens, rads, bends, splay)=>{
    const f = makeFinger(segLens, rads, bends, skin);
    f.position.set(x, 0.082, 0.002);
    f.rotation.z = splay;
    hand.add(f);
    return f;
  };
  /* the back of the hand faces the camera, the fingers curl AWAY from it
     (negative X rotation = curling toward the palm side, -Z local)            */
  /* index : gently bent, about 22 deg per joint, it carries the cigarette */
  mk(-0.0222, [0.031,0.025,0.019], [0.0086,0.0080,0.0072,0.0064], [-0.44,-0.46,-0.30], 0.06);
  /* middle : the same, a touch straighter */
  mk(-0.0045, [0.033,0.027,0.020], [0.0088,0.0083,0.0075,0.0066], [-0.40,-0.44,-0.28], 0.00);
  /* ring : curled in, 60-65 deg per joint */
  mk(0.0130, [0.030,0.025,0.020], [0.0080,0.0075,0.0068,0.0060], [-1.05,-1.10,-0.78], -0.07);
  /* pinky : curled tighter still */
  mk(0.0288, [0.025,0.020,0.017], [0.0070,0.0065,0.0058,0.0051], [-1.12,-1.18,-0.84], -0.14);
  /* thumb : tucked under the index, lying across the palm */
  const th = makeFinger([0.033,0.027], [0.0096,0.0085,0.0073], [-0.55,-0.45], skin);
  th.position.set(-0.036, 0.024, -0.013);
  th.rotation.set(-0.28, 0.0, -1.30);
  hand.add(th);

  /* ---- cigarette ---- */
  const cig = new THREE.Group();
  /* it lies along the first segments of index + middle and tilts away,
     so it reads as held between the fingers and pointing at the window */
  const dirLocal = new THREE.Vector3(-0.165, 0.855, -0.490).normalize();
  const cigLen = 0.132, cigR = 0.0056, filtLen = 0.032;
  const filt = new THREE.Mesh(new THREE.CylinderGeometry(cigR, cigR*1.02, filtLen, 7, 1), MAT.cigFilter);
  filt.position.y = filtLen*0.5; filt.castShadow = true;
  cig.add(filt);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(cigR*1.03, cigR*1.03, 0.005, 7, 1), MAT.cigPaper);
  band.position.y = filtLen + 0.0025;
  cig.add(band);
  const paper = new THREE.Mesh(new THREE.CylinderGeometry(cigR, cigR, cigLen-filtLen-0.005, 7, 1), MAT.cigPaper);
  paper.position.y = filtLen + 0.005 + (cigLen-filtLen-0.005)*0.5;
  paper.castShadow = true;
  cig.add(paper);
  /* char line */
  const charLine = new THREE.Mesh(new THREE.CylinderGeometry(cigR*1.05, cigR*1.01, 0.009, 7, 1), psxMaterial({name:'char',std:{color:0x241d1a,roughness:0.98},affine:true}));
  cig.add(charLine);
  /* ember */
  const emberMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 0.62, 0.10), toneMapped:false });
  const ember = new THREE.Mesh(new THREE.IcosahedronGeometry(0.0042, 1), emberMat);
  cig.add(ember);
  /* ember glow sprite (always faces the camera) */
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.dot, blending: THREE.AdditiveBlending, transparent:true,
    depthWrite:false, depthTest:false, toneMapped:false,
    color: new THREE.Color(1.0,0.22,0.04)
  }));
  glow.scale.set(0.011, 0.011, 1);
  glow.renderOrder = 20;
  cig.add(glow);
  /* ash */
  const ashMat = psxMaterial({name:'ashMat', std:{ color:0xa8a49c, roughness:0.98 }, affine:true });
  const ash = new THREE.Group();
  for (let i=0;i<3;i++){
    const a = new THREE.Mesh(new THREE.CylinderGeometry(0.0034-i*0.0007, 0.0040-i*0.0008, 0.006, 5, 1), ashMat);
    a.position.y = 0.012 + i*0.0062;
    a.rotation.z = (i-1)*0.22; a.rotation.x = (i%2)*0.2;
    a.castShadow = true;
    ash.add(a);
  }
  cig.add(ash);

  cig.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirLocal);
  /* the filter is pinched between the first segments of index + middle */
  cig.position.set(-0.0155, 0.0640, 0.0140);
  hand.add(cig);

  /* ember glow light : very weak, it must only kiss the fingers */
  const emberLight = new THREE.PointLight(0xff7a24, 0.0, 0.26, 2.0);
  hand.add(emberLight);

  HAND.group = g; HAND.hand = hand; HAND.cig = cig; HAND.ember = ember; HAND.emberMat = emberMat;
  HAND.emberLight = emberLight; HAND.ash = ash; HAND.paper = paper; HAND.filt = filt;
  HAND.charLine = charLine; HAND.cigLen = cigLen; HAND.filtLen = filtLen; HAND.cigR = cigR; HAND.glow = glow;
  HAND.cigDirLocal = dirLocal; HAND.dirLocal = dirLocal;
  HAND.base = hand.position.clone(); HAND.baseQ = hand.quaternion.clone();
  HAND.elbow = elbow; HAND.wrist = wrist;
  HAND.Y = Y; HAND.X = X; HAND.Z = Zc;
  return g;
}

/* ==========================================================================
   SMOKE  —  soft noise sprites, sun-lit, shadow aware
   ========================================================================== */
const SMOKE = { pts:null, n:0, parts:[], mat:null, geo:null, emitAcc:0 };

function buildSmoke(){
  const N = 460;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const size = new Float32Array(N);
  const life = new Float32Array(N);
  const seed = new Float32Array(N);
  const type = new Float32Array(N);
  const alpha = new Float32Array(N);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size,1));
  geo.setAttribute('aLife', new THREE.BufferAttribute(life,1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  geo.setAttribute('aType', new THREE.BufferAttribute(type,1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha,1));
  geo.setDrawRange(0,0);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0,1.5,0.6), 12);

  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, depthTest:true, blending:THREE.NormalBlending, fog:false,
    uniforms:{
      uNoise:{value:TEX.smoke}, uSunDir:U.uSunDir, uSunColor:U.uSunColor, uAmbient:U.uAmbient,
      uShadowMap:SU.uShadowMap, uShadowMatrix:SU.uShadowMatrix, uShadowBias:SU.uShadowBias,
      uTime:SU.uTime, uPR:SU.uPixelRatio, uFogColor:U.uFogColor, uFogSunColor:U.uFogSunColor,
      uLamp:U.uLampOn
    },
    vertexShader:`
      attribute float aSize; attribute float aLife; attribute float aSeed; attribute float aType; attribute float aAlpha;
      uniform float uPR;
      varying vec3 vWP; varying float vSeed; varying float vType; varying float vAlpha; varying float vLife;
      void main(){
        vWP = (modelMatrix * vec4(position,1.0)).xyz;
        vSeed = aSeed; vType = aType; vAlpha = aAlpha; vLife = aLife;
        vec4 mv = viewMatrix * vec4(vWP,1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPR * ( 520.0 / max(-mv.z, 0.05) );
        gl_PointSize = clamp(gl_PointSize, 1.0, 900.0);
      }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D uNoise; uniform vec3 uSunDir,uSunColor,uAmbient,uFogColor,uFogSunColor;
      uniform float uTime, uLamp;
      varying vec3 vWP; varying float vSeed; varying float vType; varying float vAlpha; varying float vLife;
      ${GLSL_SHADOW}
      void main(){
        vec2 p = gl_PointCoord - 0.5;
        float ang = vSeed*6.283 + uTime*0.35*vSeed;
        float c = cos(ang), s = sin(ang);
        vec2 q = vec2( p.x*c - p.y*s, p.x*s + p.y*c );
        float a1 = texture2D(uNoise, q*1.5 + 0.5 + vec2(vSeed, vSeed*0.7)).a;
        float a2 = texture2D(uNoise, q*3.1 - 0.3 + vec2(vSeed*0.3, 0.4)).a;
        float a = a1 * 0.72 + a2 * 0.45;
        a = clamp(a, 0.0, 1.0);
        float rad = length(p)*2.0;
        a *= smoothstep(1.0, 0.05, rad);
        a *= vAlpha;
        if ( a < 0.004 ) discard;

        vec3 V = normalize(cameraPosition - vWP);
        float ndl = max(dot(-V*0.0 + uSunDir, uSunDir), 0.0);
        float sh = shadowLookup( vWP, ndl );
        /* analytic window light : the sun only reaches the room through the opening */
        float tw = (0.02 - vWP.z) / (uSunDir.z + 1e-6);
        if ( tw > 0.0 ){
          vec3 hit = vWP + uSunDir*tw;
          float ok = step(-0.38,hit.x)*step(hit.x,0.60)*step(1.14,hit.y)*step(hit.y,1.90);
          ok *= step(0.050, abs(hit.y-1.68));
          ok *= step(0.032, abs(hit.x-0.02));
          sh = max(sh, ok);
        }
        float ct = dot(-V, uSunDir);
        float g = 0.55;
        float ph = (1.0-g*g) / (12.5664 * pow(max(1.0+g*g-2.0*g*ct, 1e-3), 1.5));
        vec3 sun = uSunColor * sh * ph * 4.2 * vec3(1.0, 0.52, 0.20);
        vec3 amb = uAmbient * 1.55 + vec3(0.040,0.046,0.062);
        vec3 col = amb + sun;
        col += vec3(1.0,0.62,0.26) * uLamp * 0.35;
        /* fog */
        float d = length(vWP - cameraPosition);
        float fg = 1.0 - exp(-0.0068*0.0068*d*d);
        col = mix(col, mix(uFogColor,uFogSunColor,0.35), fg*0.6);
        gl_FragColor = vec4(col, a*0.72);
      }`
  });

  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = 10;

  SMOKE.geo = geo; SMOKE.mat = mat; SMOKE.pts = pts; SMOKE.n = N;
  for (let i=0;i<N;i++) SMOKE.parts.push({ live:false, p:new THREE.Vector3(), v:new THREE.Vector3(), t:0, life:1, s0:1, s1:2, seed:Math.random(), type:0, drag:1.0 });
  return pts;
}

const _emberWorld = new THREE.Vector3();
function smokeSpawn( p, v, life, s0, s1, type ){
  for (let i=0;i<SMOKE.n;i++){
    const q = SMOKE.parts[i];
    if (!q.live){
      q.live = true; q.p.copy(p); q.v.copy(v); q.t = 0; q.life = life; q.s0 = s0; q.s1 = s1; q.type = type;
      q.seed = Math.random();
      q.drag = type===0 ? 0.72 : 1.25;
      return;
    }
  }
}

function updateSmoke( dt, t, wind ){
  const g = SMOKE.geo;
  const pos = g.attributes.position.array, size = g.attributes.aSize.array;
  const lifeA = g.attributes.aLife.array, seedA = g.attributes.aSeed.array;
  const typeA = g.attributes.aType.array, alphaA = g.attributes.aAlpha.array;
  let count = 0;
  for (let i=0;i<SMOKE.n;i++){
    const q = SMOKE.parts[i];
    if (!q.live) continue;
    q.t += dt;
    const f = q.t/q.life;
    if (f>=1){ q.live=false; continue; }
    /* turbulence */
    const s = q.seed*31.4;
    const cx = Math.sin(q.p.y*5.1 + t*0.9 + s)*0.10 + Math.sin(q.p.z*7.3 - t*0.6 + s)*0.06;
    const cy = Math.cos(q.p.x*6.2 + t*1.1 + s*1.7)*0.07 + Math.sin(q.p.z*4.4 + t*0.8)*0.05;
    const cz = Math.sin(q.p.x*5.3 - t*0.7 + s*2.3)*0.08;
    if (q.type===0){
      q.v.x += (cx*0.9 - q.v.x*0.9)*dt;
      q.v.y += (0.30 + cy*0.7 - q.v.y*0.85)*dt;      /* buoyancy */
      q.v.z += (cz*0.8 - q.v.z*0.9)*dt;
    } else {
      q.v.x += (cx*1.5 - q.v.x*1.25)*dt;
      q.v.y += (0.055 + cy*1.1 - q.v.y*1.25)*dt;
      q.v.z += (cz*1.2 - q.v.z*1.25)*dt;
    }
    q.p.addScaledVector(q.v, dt);
    /* spread against the glass */
    if (q.p.z < GLASS_Z_IN+0.02 && q.type===1){ q.p.z = GLASS_Z_IN+0.02; q.v.z *= 0.3; q.v.x += 0.04*dt; }
    if (q.p.z < WALL_Z_OUT-0.02){ q.live=false; continue; }
    /* fade in / out */
    const fade = Math.min(f*7.0, 1.0) * Math.min((1.0-f)*2.6, 1.0);
    const i3 = count*3;
    pos[i3]=q.p.x; pos[i3+1]=q.p.y; pos[i3+2]=q.p.z;
    size[count] = q.s0 + (q.s1-q.s0)*f;
    lifeA[count] = f; seedA[count]=q.seed; typeA[count]=q.type; alphaA[count]=fade*(q.type===0?0.105:0.135);
    count++;
  }
  g.setDrawRange(0,count);
  g.attributes.position.needsUpdate = true;
  g.attributes.aSize.needsUpdate = true;
  g.attributes.aLife.needsUpdate = true;
  g.attributes.aSeed.needsUpdate = true;
  g.attributes.aType.needsUpdate = true;
  g.attributes.aAlpha.needsUpdate = true;
}

/* ==========================================================================
   DISTRICT  —  a late-Soviet microdistrict, read as low-poly silhouettes
   ========================================================================== */
const DIST = { group:null, windows:[], winMesh:null, laundry:[], cars:[], people:[], birds:[], trams:[], plume:null, cloud:null, cloudMat:null, boxes:[] };

/* hash based per-window state in the shader */
const WINDOW_VERT = `
varying vec3 vWP; varying vec3 vN; varying vec2 vUvw;
void main(){
  vUvw = uv;
  vec4 wp = modelMatrix * instanceMatrix * vec4(position,1.0);
  vWP = wp.xyz;
  vN = normalize( mat3(modelMatrix) * mat3(instanceMatrix) * normal );
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const WINDOW_FRAG = `
precision highp float;
uniform vec3 uSunDir, uSunColor, uAmbient, uFogColor, uFogSunColor;
uniform float uLitFrac, uTime, uFogDensity;
varying vec3 vWP; varying vec3 vN; varying vec2 vUvw;
float hash( vec3 p ){
  p = fract(p*0.3183099 + vec3(0.71,0.113,0.419));
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
void main(){
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vWP);
  float h = hash( floor(vWP*4.0) );
  /* glass base : sky reflection */
  float fres = pow(1.0 - max(dot(N,V),0.0), 4.0);
  vec3 sky = mix(uFogColor, uFogSunColor, 0.5);
  vec3 col = sky * (0.20 + fres*0.9);
  /* sun flash off the glass */
  vec3 H = normalize(uSunDir + V);
  float spec = pow(max(dot(N,H),0.0), 180.0);
  float flash = spec * step(0.55, h);
  col += uSunColor * flash * 22.0;
  /* night : warm / bluish interiors */
  float lit = step(h, uLitFrac);
  float blink = 1.0;
  if ( h > 0.93 ) blink = step(0.35, fract(uTime*0.63 + h*11.0));
  vec3 warm = vec3(1.0,0.60,0.20);
  vec3 blue = vec3(0.52,0.66,1.0);
  vec3 inner = (h>0.84) ? blue : warm;
  inner *= 0.55 + 0.45*sin(uTime*1.7 + h*40.0);
  col += inner * lit * blink * 2.6;
  /* frame */
  float d = length(vUvw-0.5);
  col *= smoothstep(0.52,0.42,d)*0.9 + 0.1;
  float fg = 1.0 - exp(-uFogDensity*uFogDensity*length(vWP-cameraPosition)*length(vWP-cameraPosition));
  col = mix(col, mix(uFogColor,uFogSunColor,0.4), fg);
  gl_FragColor = vec4(col,1.0);
}`;

function buildDistrict(){
  const g = new THREE.Group();
  const add = o => { g.add(o); return o; };

  /* ---------- our own building below the window ---------- */
  const own = new THREE.Mesh(new THREE.BoxGeometry(3.9, 27.4, 0.62), MAT.ownFacade);
  own.position.set(0.1, GY+13.7, 0.02);
  own.castShadow = true; own.receiveShadow = true;
  add(own);

  /* ---------- ground ---------- */
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400,1400,1,1), MAT.ground);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, GY, -260);
  ground.receiveShadow = true;
  add(ground);

  /* ---------- prefab panel blocks ---------- */
  const concrete = MAT.blockA, concrete2 = MAT.blockB, concrete3 = MAT.blockC;
  function block(w,d,floors,x,z,mat,opt){
    opt = opt||{};
    const fh = 2.86, h = floors*fh;
    const b = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    body.position.set(x, GY+h/2, z);
    body.castShadow = true; body.receiveShadow = true;
    b.add(body);
    /* roof slab */
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.5,0.34,d+0.5), MAT.roof);
    roof.position.set(x, GY+h+0.17, z);
    roof.castShadow = true; roof.receiveShadow = true;
    b.add(roof);
    /* windows on the faces we can see */
    const winGeo = new THREE.PlaneGeometry(1,1);
    const faces = [];
    faces.push({ n:[0,0,1], o:[x, GY, z+d/2+0.02], r:[1,0,0] });
    if (x > 0) faces.push({ n:[-1,0,0], o:[x-w/2-0.02, GY, z], r:[0,0,1] });
    else        faces.push({ n:[1,0,0],  o:[x+w/2+0.02, GY, z], r:[0,0,-1] });
    const bays = Math.max(2, Math.floor(w/3.0));
    for (const f of faces){
      const span = (f.n[0]!==0) ? d : w;
      const nb = Math.max(2, Math.floor(span/3.0));
      for (let fl=0; fl<floors; fl++){
        for (let i=0;i<nb;i++){
          if (opt.noWin && ((fl*7+i*3)%11===0)) continue;
          const t = (i+0.5)/nb - 0.5;
          const px = f.o[0] + f.r[0]*t*span;
          const pz = f.o[2] + f.r[2]*t*span;
          const py = GY + 1.55 + fl*fh;
          const m = new THREE.Matrix4();
          const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.atan2(f.n[0], f.n[2]), 0));
          const s = new THREE.Vector3(1.35, 1.45, 1);
          m.compose(new THREE.Vector3(px,py,pz), q, s);
          DIST.windows.push(m);
        }
      }
    }
    /* balconies on some blocks */
    if (opt.balcony){
      const nb = Math.max(2, Math.floor(w/3.0));
      const by = GY + 1.55 + Math.floor(floors*0.45)*fh;
      const bw = spanOf(w, nb);
      const bal = new THREE.Mesh(new THREE.BoxGeometry(bw, 2.35, 1.15), MAT.balcony);
      bal.position.set(x + (w*0.25), by, z + d/2 + 0.55);
      bal.castShadow = true; bal.receiveShadow = true;
      b.add(bal);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(bw+0.1, 0.12, 1.25), MAT.balcony2);
      rail.position.set(bal.position.x, by+1.22, bal.position.z);
      b.add(rail);
      /* laundry */
      const nl = 5;
      for (let i=0;i<nl;i++){
        const lm = new THREE.Matrix4();
        lm.compose(new THREE.Vector3(x + w*0.25 - bw*0.42 + bw*0.84*i/(nl-1), by-0.15, z+d/2+1.05),
          new THREE.Quaternion(), new THREE.Vector3(0.5+Math.random()*0.25, 0.8, 0.06));
        DIST.laundry.push(lm);
      }
    }
    /* antenna */
    if (opt.antenna){
      const an = new THREE.Mesh(new THREE.BoxGeometry(0.09, 4.2, 0.09), MAT.metal);
      an.position.set(x+w*0.3, GY+h+2.3, z-d*0.2); an.castShadow=true;
      b.add(an);
      for (let i=0;i<3;i++){
        const cr = new THREE.Mesh(new THREE.BoxGeometry(1.5-i*0.35, 0.06, 0.06), MAT.metal);
        cr.position.set(x+w*0.3, GY+h+1.6+i*0.7, z-d*0.2);
        b.add(cr);
      }
    }
    add(b);
    DIST.boxes.push({ min:[x-w/2, GY, z-d/2], max:[x+w/2, GY+h, z+d/2] });
    return b;

  function spanOf(w,nb){ return w/nb*1.0; }

U.uCloudTex = { value: TEX.cloud };

U.uCloudOff = { value: new THREE.Vector2() };

function distMat(opt){
  opt.bounce = false;
  const m = psxMaterial(opt);
  const inner = m.onBeforeCompile;
  m.onBeforeCompile = (sh)=>{
    inner(sh);
    sh.uniforms.uCloudTex = U.uCloudTex;
    sh.uniforms.uCloudAmt = U.uCloudAmt;
    sh.uniforms.uCloudOff = U.uCloudOff;
    sh.uniforms.uBoxMin = U.uBoxMin;
    sh.uniforms.uBoxMax = U.uBoxMax;
    sh.uniforms.uBlockShadow = { value: opt.noBlockShadow ? 0.0 : 1.0 };
    sh.fragmentShader = sh.fragmentShader
      .replace('const vec4 UnpackFactors4 = vec4( 0.99609375/16777216.0, 0.99609375/65536.0, 0.99609375/256.0, 0.99609375 );',
               `const vec4 UnpackFactors4 = vec4( 0.99609375/16777216.0, 0.99609375/65536.0, 0.99609375/256.0, 0.99609375 );
        uniform sampler2D uCloudTex; uniform float uCloudAmt; uniform vec2 uCloudOff;
        uniform vec3 uBoxMin[${NBOX}];
        uniform vec3 uBoxMax[${NBOX}];
        uniform float uBlockShadow;
        float cloudShade( vec3 p ){
          float c1 = texture2D(uCloudTex, (p.xz + uCloudOff)*0.0016).r;
          float c2 = texture2D(uCloudTex, (p.xz + uCloudOff)*0.0042 + 0.37).r;
          float m = c1*0.72 + c2*0.40;
          return 1.0 - uCloudAmt * smoothstep(0.44, 0.86, m);
        }
        /* analytic long shadows of the panel blocks */
        float blockShadow( vec3 p, vec3 L ){
          for (int i=0;i<${NBOX};i++){
            vec3 bmin = uBoxMin[i], bmax = uBoxMax[i];
            vec3 dd = L + vec3(1e-4);
            vec3 t0 = (bmin - p)/dd;
            vec3 t1 = (bmax - p)/dd;
            vec3 tn = min(t0,t1), tf = max(t0,t1);
            float tN = max(max(tn.x,tn.y),tn.z);
            float tF = min(min(tf.x,tf.y),tf.z);
            if ( tF >= max(tN, 0.08) ) return 0.0;
          }
          return 1.0;
        }`)
      .replace('/*PROJ_END*/', `/*PROJ_END*/
        {
          float cf = cloudShade( vWorldP );
          reflectedLight.directDiffuse *= cf;
          reflectedLight.directSpecular *= cf;
          float bs = mix( 1.0, blockShadow( vWorldP, uSunDir ), uBlockShadow );
          reflectedLight.directDiffuse *= bs;
          reflectedLight.directSpecular *= bs;
        }`);
  };
  m.customProgramCacheKey = ()=> 'psx1c|'+(opt.affine?'A':'N')+(opt.glint?'G':'');
  return m;
}

function buildProps(){
  const g = new THREE.Group();
  const rnd = mulberry32(9182);

  /* ---------------- trees ---------------- */
  const trunkGeo = new THREE.CylinderGeometry(0.16, 0.28, 1, 5);
  trunkGeo.translate(0, 0.5, 0);
  const leafGeo  = new THREE.IcosahedronGeometry(1, 0);
  const treeSpots = [];
  const push = (x,z)=>treeSpots.push([x,z]);
  for (let i=0;i<9;i++) push(-26+i*6.5, -54 - (i%2)*4);
  for (let i=0;i<8;i++) push(22+i*7, -62 + (i%2)*5);
  for (let i=0;i<7;i++) push(-42+i*7, -78 + (i%3)*5);
  for (let i=0;i<6;i++) push(46+i*8, -92 + (i%2)*6);
  for (let i=0;i<5;i++) push(-18+i*9, -116 + (i%2)*5);
  for (let i=0;i<6;i++) push(-300+i*110, -150 - (i%3)*18);
  const N = treeSpots.length;
  const trunks = new THREE.InstancedMesh(trunkGeo, MAT.treeTrunk, N);
  const leaves = new THREE.InstancedMesh(leafGeo, MAT.leaf, N*3);
  const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), tmpS = new THREE.Vector3();
  const col = new THREE.Color();
  for (let i=0;i<N;i++){
    const [x,z] = treeSpots[i];
    const birch = (i%3)===0;
    const h = birch ? 7.5+rnd()*3 : 10+rnd()*5;
    const r = birch ? 0.26 : 0.32;
    tmpV.set(x, GY, z); tmpQ.setFromEuler(new THREE.Euler(0, rnd()*6.28, 0));
    tmpS.set(r, h, r);
    tmpM.compose(tmpV, tmpQ, tmpS);
    trunks.setMatrixAt(i, tmpM);
    if (birch){ col.setHex(0xe0dacb); trunks.setColorAt(i, col); }
    const nc = 3;
    for (let c=0;c<nc;c++){
      const ch = birch ? 0.62+rnd()*0.12 : 0.55+rnd()*0.16;
      const cs = (birch? 1.5 : 1.7) * (0.8+rnd()*0.5);
      tmpV.set(x + (rnd()-0.5)*1.3, GY + h*ch, z + (rnd()-0.5)*1.3);
      tmpQ.setFromEuler(new THREE.Euler(rnd()*3, rnd()*6.28, rnd()*3));
      tmpS.set(cs*(0.8+rnd()*0.4), cs*0.72, cs*(0.8+rnd()*0.4));
      tmpM.compose(tmpV, tmpQ, tmpS);
      leaves.setMatrixAt(i*nc+c, tmpM);
      /* early autumn colours : gold, amber, rust */
      const pick = rnd();
      if (pick<0.42) col.setHSL(0.11+0.03*rnd(), 0.72, 0.48+0.12*rnd());
      else if (pick<0.78) col.setHSL(0.085+0.03*rnd(), 0.66, 0.42+0.12*rnd());
      else col.setHSL(0.03+0.03*rnd(), 0.55, 0.34+0.1*rnd());
      leaves.setColorAt(i*nc+c, col);
    }
  }
  trunks.castShadow = true; trunks.receiveShadow = true;
  leaves.castShadow = true; leaves.receiveShadow = true;
  g.add(trunks, leaves);
  DIST.leaves = leaves; DIST.leafM = leaves.instanceMatrix.array.slice();

  /* ---------------- cars ---------------- */
  const carBodyGeo = new THREE.BoxGeometry(4.0, 1.05, 1.75);
  const carCabGeo  = new THREE.BoxGeometry(2.0, 0.85, 1.6);
  carCabGeo.translate(-0.15, 0.9, 0);
  const carSpots = [
    [-19,-50,0.1],[8,-53,-0.05],[-3,-51,3.1],[26,-56,1.6],[44,-62,-0.3],[52,-63,3.1],
    [-38,-66,0.0],[-42,-67,3.1],[30,-72,1.57],[-120,-150,0.2],[-124,-152,0.2],
    [-160,-157,0.4],[40,-160,3.14],[90,-162,3.14],[160,-159,0.05],[-210,-156,0.05]
  ];
  const NC = carSpots.length;
  const carB = new THREE.InstancedMesh(carBodyGeo, MAT.carBody, NC);

function buildSteamPlume(){
  const N = 260;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3), sz = new Float32Array(N), al = new Float32Array(N), sd = new Float32Array(N);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sz,1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(al,1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(sd,1));
  geo.setDrawRange(0,0);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(-152, GY+80, -392), 120);
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.NormalBlending, fog:false,
    uniforms:{ uNoise:{value:TEX.smoke}, uSunDir:U.uSunDir, uSunColor:U.uSunColor, uAmbient:U.uAmbient,
               uTime:SU.uTime, uPR:SU.uPixelRatio, uFogColor:U.uFogColor, uFogSunColor:U.uFogSunColor },
    vertexShader:`
      attribute float aSize; attribute float aAlpha; attribute float aSeed;
      uniform float uPR; varying vec3 vWP; varying float vA; varying float vS;
      void main(){
        vWP = (modelMatrix*vec4(position,1.0)).xyz; vA = aAlpha; vS = aSeed;
        vec4 mv = viewMatrix*vec4(vWP,1.0);
        gl_Position = projectionMatrix*mv;
        gl_PointSize = clamp(aSize*uPR*(620.0/max(-mv.z,0.1)), 1.0, 230.0);
      }`,
    fragmentShader:`
      precision highp float;
      uniform sampler2D uNoise; uniform vec3 uSunDir,uSunColor,uAmbient,uFogColor,uFogSunColor; uniform float uTime;
      varying vec3 vWP; varying float vA; varying float vS;
      void main(){
        vec2 p = gl_PointCoord-0.5;
        float a1 = texture2D(uNoise, p*1.6+0.5+vec2(vS,0.3)).a;
        float a2 = texture2D(uNoise, p*3.3-0.2+vec2(0.7,vS)).a;
        float a = (a1*0.75+a2*0.4) * smoothstep(1.0,0.1,length(p)*2.0) * vA;
        if (a<0.005) discard;
        vec3 V = normalize(cameraPosition - vWP);
        float ct = dot(-V, uSunDir);
        float g = 0.62;
        float ph = (1.0-g*g)/(12.5664*pow(max(1.0+g*g-2.0*g*ct,1e-3),1.5));
        vec3 col = uAmbient*0.80 + uSunColor*ph*1.85*vec3(1.0,0.66,0.38);
        float d = length(vWP-cameraPosition);
        float fg = 1.0-exp(-0.0068*0.0068*d*d);
        col = mix(col, mix(uFogColor,uFogSunColor,0.45), fg);
        gl_FragColor = vec4(col, a);
      }`
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  const st = { geo, mat, pts, n:N, parts:[], acc:0 };
  for (let i=0;i<N;i++) st.parts.push({ live:false, p:new THREE.Vector3(), v:new THREE.Vector3(), t:0, life:1, s0:1, s1:2, seed:Math.random() });
  return st;
}

function updateSteam( st, dt, t ){
  st.acc += dt*26;
  const stacks = [ [-170,-392,GY+78], [-134,-392,GY+62] ];
  while (st.acc > 1){
    st.acc -= 1;
    const s = stacks[(Math.random()*2)|0];
    for (let i=0;i<st.n;i++){
      const q = st.parts[i];
      if (!q.live){
        q.live = true;
        q.p.set(s[0]+(Math.random()-0.5)*3, s[2], s[1]+(Math.random()-0.5)*3);
        q.v.set((Math.random()-0.5)*0.7, 5.5+Math.random()*3.5, (Math.random()-0.5)*0.7);
        q.t=0; q.life=7+Math.random()*5; q.s0=7+Math.random()*5; q.s1=44+Math.random()*26; q.seed=Math.random();
        break;
      }
    }
  }
  const pos = st.geo.attributes.position.array, sz = st.geo.attributes.aSize.array;
  const al = st.geo.attributes.aAlpha.array, sd = st.geo.attributes.aSeed.array;
  let c=0;
  for (let i=0;i<st.n;i++){
    const q = st.parts[i];
    if (!q.live) continue;
    q.t += dt;
    const f = q.t/q.life;
    if (f>=1){ q.live=false; continue; }
    const s = q.seed*27.3;
    q.v.x += (Math.sin(q.p.y*0.25 + t*0.8 + s)*1.6 - q.v.x*0.55)*dt;
    q.v.z += (Math.cos(q.p.y*0.21 - t*0.6 + s*1.7)*1.4 - q.v.z*0.55)*dt;
    q.v.y += (1.4 - q.v.y*0.22)*dt;
    q.p.addScaledVector(q.v, dt);
    const i3=c*3;
    pos[i3]=q.p.x; pos[i3+1]=q.p.y; pos[i3+2]=q.p.z;
    sz[c]=q.s0+(q.s1-q.s0)*Math.pow(f,0.6);
    al[c]=Math.min(f*4.0,1.0)*Math.min((1.0-f)*1.8,1.0)*0.34;
    sd[c]=q.seed;
    c++;
  }
  st.geo.setDrawRange(0,c);
  st.geo.attributes.position.needsUpdate=true;
  st.geo.attributes.aSize.needsUpdate=true;
  st.geo.attributes.aAlpha.needsUpdate=true;
  st.geo.attributes.aSeed.needsUpdate=true;
}

};

function lerpKeys( keys, t ){
  let a = keys[0], b = keys[keys.length-1];
  for (let i=0;i<keys.length-1;i++){
    if (t>=keys[i].t && t<=keys[i+1].t){ a=keys[i]; b=keys[i+1]; break; }
  }
  const f = (b.t===a.t)?0:Math.min(1,Math.max(0,(t-a.t)/(b.t-a.t)));
  const s = f*f*(3-2*f);
  const out = {};
  for (const k in a){ if (typeof a[k]==='number') out[k] = a[k] + (b[k]-a[k])*s; }
  return out;
}
function colAt( keys, t, name ){
  let a = keys[0], b = keys[keys.length-1];
  for (let i=0;i<keys.length-1;i++){
    if (t>=keys[i].t && t<=keys[i+1].t){ a=keys[i]; b=keys[i+1]; break; }
  }
  const f = (b.t===a.t)?0:Math.min(1,Math.max(0,(t-a.t)/(b.t-a.t)));
  const s = f*f*(3-2*f);
  return new THREE.Color(a[name]).lerp(new THREE.Color(b[name]), s);
}

function updateTimeline( t, dt ){
  TL.t = t;
  const k = lerpKeys(SUNKEY, t);
  TL.az = k.az; TL.el = k.el;
  const azr = TL.az*DEG, elr = TL.el*DEG;
  TL.dir.set(Math.cos(elr)*Math.sin(azr), Math.sin(elr), -Math.cos(elr)*Math.cos(azr)).normalize();

  const pk = lerpKeys(PALKEY, t);
  const fogC   = colAt(PALKEY, t, 'fog');
  const ambC   = colAt(PALKEY, t, 'amb');
  const skyC   = colAt(PALKEY, t, 'sky');
  const sunC   = colAt(PALKEY, t, 'sun');
  TL.sunInt = pk.int;
  TL.sunCol.copy(sunC);

  /* sun & sky uniforms */
  U.uSunDir.value.copy(TL.dir);
  U.uSunColor.value.setRGB(sunC.r*pk.int, sunC.g*pk.int, sunC.b*pk.int);
  U.uAmbient.value.setRGB(ambC.r*0.42, ambC.g*0.42, ambC.b*0.46);
  U.uFogColor.value.copy(fogC);
  U.uFogSunColor.value.copy(fogC).lerp(sunC, 0.50).multiplyScalar(0.45 + pk.int*0.20);
  scene.fog.color.copy(fogC);
  scene.fog.density = 0.0021 + 0.0011*Math.min(1, pk.int/2.5);

  /* lights */
  sunRoom.color.copy(sunC);
  sunRoom.intensity = pk.int*1.30;
  sunRoom.position.copy(TL.dir).multiplyScalar(6.0).add(sunRoom.target.position);
  sunDistrict.color.copy(sunC);
  sunDistrict.intensity = pk.int*1.5;
  sunDistrict.position.copy(TL.dir).multiplyScalar(420).add(sunDistrict.target.position);

  /* sky fill */
  const dayness = Math.min(1, Math.max(0, (TL.el+8)/16));
  /* golden hour : 1 when the sun sits low, the room falls into warm shadow */
  const golden = Math.min(1, Math.max(0, 1 - Math.abs(TL.el-8)/9));
  TL.golden = golden;
  hemi.color.copy(skyC).lerp(sunC, 0.38);
  hemi.groundColor.setRGB(0.42,0.33,0.24);
  const nightK = clamp( (2.0 - TL.el)/8.0, 0, 1 );
  hemi.intensity = (0.15 + 0.20*dayness) * (1.0 - 0.94*golden) * (1.0 - 0.86*nightK);
  amb.color.copy(ambC).lerp(sunC, 0.34); amb.intensity = (0.09 + 0.11*dayness) * (1.0 - 0.94*golden) * (1.0 - 0.90*nightK);

  /* sky dome */
  const sky = DIST.sky;
  if (sky){
    sky.material.uniforms.uSunLevel.value = Math.min(1, Math.max(0, (TL.el+1.5)/4));
    sky.material.uniforms.uSunLow.value = Math.min(1, Math.max(0, (22.0 - TL.el)/13.0));
    sky.material.uniforms.uGroundHaze.value.copy(fogC);
    sky.material.uniforms.uSunColor.value.setRGB(sunC.r*pk.int*0.9, sunC.g*pk.int*0.9, sunC.b*pk.int*0.9);
    sky.position.copy(camera.position);
  }

  /* window lights */
  const night = 1 - Math.min(1, Math.max(0, (TL.el+3)/10));
  TL.litFrac = night*0.85;
  if (DIST.winMat) DIST.winMat.uniforms.uLitFrac.value = TL.litFrac;

  /* lamps */
  const lampT = Math.min(1, Math.max(0, (t-49.5)/3.0));
  TL.lampOn = lampT;
  if (lampT > 0.01){
    amb.color.lerp(new THREE.Color(1.0,0.66,0.36), lampT*0.55);
    amb.intensity += lampT*0.045;
  }

  MAT.lampHead.emissiveIntensity = lampT*1.5;
  MAT.fabricIn.emissiveIntensity = lampT*0.30;
  MAT.fabric.emissiveIntensity = lampT*0.18;
  if (DIST.lamps) for (const l of DIST.lamps) l.material.emissiveIntensity = lampT*2.2;
  if (DIST.lampGlows) for (const l of DIST.lampGlows) l.material.opacity = lampT*0.85;
  for (const pl of LAMPS) pl.intensity = lampT*40;

  /* the room reflected faintly in the double glass (dusk / ember) */
  if (MAT.glassInner && MAT.glassOuter){
    const rc = MAT.glassInner.uniforms.uRoom.value;
    rc.copy(ambC).multiplyScalar(0.13);
    rc.r += lampT*0.34; rc.g += lampT*0.20; rc.b += lampT*0.09;
    MAT.glassOuter.uniforms.uRoom.value.copy(rc);
  }

  /* exposure adaptation */
  const dark = 1 - Math.min(1, Math.max(0, (TL.el+6)/20));
  TL.exposureTarget = (0.92 + dark*0.34) * (1.0 - 0.30*Math.min(1, pk.int/2.9)) * (1.0 - 0.28*golden);
  TL.exposure += (TL.exposureTarget - TL.exposure)*Math.min(1, dt*0.55);

  /* fade to black at the very end */
  TL.fade = (t<57)?1:Math.max(0, 1-(t-57)/3);

  /* world clock */
  const cf = Math.min(1, Math.max(0,(t-2)/54));
  const cs = cf*cf*(3-2*cf);
  TL.clockH = 5.5 + cs*16.0;

  /* moving glints on the room wall */
  const gi = Math.min(1, Math.max(0,(TL.el-1)/14));
  for (let i=0;i<4;i++){
    const u = (Math.sin(t*0.13 + i*1.9)*0.5+0.5);
    const x = -0.80 + u*0.36;
    const y = 1.34 + 0.42*Math.sin(t*0.21 + i*2.4);
    U.uGlintPos.value[i].set(x, y, WALL_Z_IN+0.004);
    U.uGlintParam.value[i].set(gi*0.26*(0.55+0.45*Math.sin(t*0.7+i)), 0.026+0.012*((i%2)?1:0), 0);
  }
  U.uGlintColor.value.copy(sunC).multiplyScalar(0.50*gi);
}

   ========================================================================== */
const DRAGS = [4, 18, 31, 44, 53];
const EXHALES = [4.55, 18.55, 31.55, 44.55, 53.55];
function bump(x, w){ const d=Math.abs(x); return d<w ? Math.pow(Math.cos(d/w*Math.PI*0.5), 2.0) : 0; }

const _handQ = new THREE.Quaternion();
const _mouthDir = new THREE.Vector3(-0.46, 0.40, 0.70).normalize();
let lastExhaleIdx = 0;

function updateHand( t, dt, emit ){
  /* --- drag amount --- */
  let drag = 0;
  for (const d of DRAGS) drag = Math.max(drag, bump(t-d, 0.95));
  /* --- ash flick --- */
  const flick = bump(t-26.0, 1.15);
  /* --- hand lift at 47 --- */
  const lift = bump(t-47.0, 2.6)*0.9;

  const g = HAND.group, hand = HAND.hand;
  const p = HAND.base.clone();
  p.addScaledVector(_mouthDir, 0.085*drag);
  p.y += 0.028*lift;
  p.x += 0.012*lift;
  /* ash flick : dip toward the ashtray */
  const ashTarget = new THREE.Vector3(-0.20, 1.22, 0.02);
  if (flick>0.001){
    const k = flick*flick;
    p.lerp(ashTarget, 0.55*k);
  }
  hand.position.copy(p);
  _handQ.copy(HAND.baseQ);
  const eul = new THREE.Euler(-0.22*drag - 0.30*flick + 0.10*lift, 0.16*drag + 0.42*flick, 0.06*drag);
  _handQ.multiply(new THREE.Quaternion().setFromEuler(eul));
  hand.quaternion.copy(_handQ);
  /* elbow follows */
  const sleeve = g.children[0];
  const elbow = HAND.elbow.clone();
  elbow.y -= 0.035*lift;
  elbow.x -= 0.02*drag;
  const dir = HAND.wrist.clone().sub(elbow);
  sleeve.position.copy(elbow).addScaledVector(dir, 0.46);
  sleeve.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  g.children[1].position.copy(elbow).addScaledVector(dir, 0.92);
  g.children[1].quaternion.copy(sleeve.quaternion);

  /* --- burn down the cigarette --- */
  const burn = Math.min(1, Math.max(0, (t-0.5)/56));
  const fullLen = HAND.cigLen - HAND.filtLen - 0.005;
  const remain  = fullLen*(1 - burn*0.68);
  HAND.paper.scale.y = Math.max(0.12, remain/fullLen);
  HAND.paper.position.y = HAND.filtLen + 0.005 + remain*0.5;
  const tipLocal = HAND.filtLen + 0.005 + remain;
  HAND.ember.position.y = tipLocal + 0.002;
  HAND.charLine.position.y = tipLocal + 0.001;
  HAND.charLine.scale.y = 0.7;
  HAND.ash.position.y = tipLocal - 0.030;
  const ashScale = 0.25 + burn*1.5;
  HAND.ash.scale.set(1, ashScale, 1);
  HAND.ash.visible = burn > 0.02;

  /* --- ember brightness : flares on each drag --- */
  let flare = 0;
  for (const d of DRAGS) flare = Math.max(flare, bump(t-d-0.15, 0.55));
  const flicker = 0.75 + 0.25*Math.sin(t*37.0) + 0.12*Math.sin(t*61.0);
  const emberI = (0.9 + flare*3.4)*flicker*(1 - burn*0.25);
  const ex = Math.max(0.45, TL.exposure);
  HAND.emberMat.color.setRGB(1.80*emberI/ex, 0.40*emberI/ex, 0.055*emberI/ex);
  HAND.glow.position.y = tipLocal + 0.005;
  HAND.glow.material.color.setRGB(0.95*emberI/ex, 0.22*emberI/ex, 0.035*emberI/ex);
  HAND.emberLight.intensity = emberI*0.0016*(1 - Math.min(1,Math.max(0,(TL.el-4)/22)));
  HAND.emberLight.position.set(0, tipLocal+0.004, 0.006);

  /* --- smoke --- */
  HAND.ember.getWorldPosition(_emberWorld);
  const rate = 42 + flare*80 + (1-burn)*8;
  emit.wisp += rate*dt;
  while (emit.wisp > 1){
    emit.wisp -= 1;
    const j = new THREE.Vector3((Math.random()-0.5)*0.004, 0, (Math.random()-0.5)*0.004);
    smokeSpawn(_emberWorld.clone().add(j),
      new THREE.Vector3((Math.random()-0.5)*0.05, 0.10+Math.random()*0.05, (Math.random()-0.5)*0.05),
      3.0+Math.random()*2.0, 0.020, 0.090+Math.random()*0.070, 0);
  }
  /* exhale clouds */
  for (let i=0;i<EXHALES.length;i++){
    if (t>=EXHALES[i] && lastExhaleIdx<=i){
      lastExhaleIdx = i+1;
      const big = (i===EXHALES.length-1);
      const n = big?70:44;
      for (let k=0;k<n;k++){
        const p0 = new THREE.Vector3((Math.random()-0.5)*0.10, 1.30+ (Math.random()-0.5)*0.06, 0.34+(Math.random()-0.5)*0.05);
        const v0 = new THREE.Vector3((Math.random()-0.5)*0.16, 0.05+Math.random()*0.10, -0.32-Math.random()*0.22);
        smokeSpawn(p0, v0, 4.6+Math.random()*3.0, 0.055, 0.170+Math.random()*0.110, 1);
      }
      if (SND) SND.exhale(big?1.25:1.0);
    }
  }
  if (t < EXHALES[0]) lastExhaleIdx = 0;
  /* drag sounds */
  for (const d of DRAGS){
    if (t>=d && !emit.dragged[d]){ emit.dragged[d]=true; if(SND) SND.drag(); }
  }
}
