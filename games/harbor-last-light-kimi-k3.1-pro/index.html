<script type="module">
import * as THREE from 'three';

const TAU=Math.PI*2, LOOP=48;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mix=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const q=clamp((x-a)/(b-a));return q*q*(3-2*q)};
let seed=918273;
const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
const query=new URLSearchParams(location.search);
const frozenSeconds=query.has('t')?Number(query.get('t')):null;
const frozen=Number.isFinite(frozenSeconds);
const freezeT=frozen?((frozenSeconds%LOOP)+LOOP)%LOOP/LOOP:0;

const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance',precision:'highp'});
renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x020713,1);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x152840,.0017);
const camera=new THREE.PerspectiveCamera(40,16/9,.5,900);
camera.position.set(70,40,48);
camera.lookAt(-12,28,5);
camera.updateMatrixWorld();

const hemi=new THREE.HemisphereLight(0x91bfff,0x243022,1.25);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0b0,3);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-82,right:82,top:72,bottom:-72,near:1,far:290});
sun.shadow.bias=-.00028;
sun.shadow.normalBias=.075;
sun.shadow.radius=1;
sun.shadow.camera.updateProjectionMatrix();
sun.target.position.set(3,10,0);
scene.add(sun,sun.target);

function canvasTexture(kind,base){
  const c=document.createElement('canvas');c.width=c.height=16;
  const x=c.getContext('2d');const img=x.createImageData(16,16);const d=img.data;
  const rgb=[parseInt(base.slice(1,3),16),parseInt(base.slice(3,5),16),parseInt(base.slice(5,7),16)];
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){
    let n=(rnd()-.5)*24, mortar=false, plank=false;
    if(kind==='stone'){
      const row=Math.floor(j/4), off=(row&1)*4;
      mortar=(j%4===0)||((i+off)%8===0);
      if(mortar)n=-35+rnd()*10;
    }else if(kind==='timber'){
      plank=(i%4===0);if(plank)n=-48;
      n+=Math.sin(j*2.1+i*.4)*5;
    }else if(kind==='roof'){
      const row=Math.floor(j/4),off=(row&1)*2;
      mortar=(j%4===0)||((i+off)%4===0);
      if(mortar)n=-38;
      else n+=((i+off)%4===1?12:0);
    }else if(kind==='sand')n=(rnd()-.5)*30+(j%3===0?5:0);
    else if(kind==='grass')n=(rnd()-.5)*34+((i+j)%7===0?14:0);
    else if(kind==='plaster')n=(rnd()-.5)*16+((i===2&&j===3)?-18:0);
    const k=(j*16+i)*4;
    d[k]=clamp(rgb[0]+n,0,255);d[k+1]=clamp(rgb[1]+n*.92,0,255);d[k+2]=clamp(rgb[2]+n*.78,0,255);d[k+3]=255;
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.generateMipmaps=false;return t;
}
const mats={
  stone:new THREE.MeshStandardMaterial({map:canvasTexture('stone','#77776e'),roughness:.96}),
  terrace:new THREE.MeshStandardMaterial({map:canvasTexture('stone','#929087'),roughness:.96}),
  darkStone:new THREE.MeshStandardMaterial({map:canvasTexture('stone','#4d5452'),roughness:1}),
  timber:new THREE.MeshStandardMaterial({map:canvasTexture('timber','#725039'),roughness:.9}),
  darkWood:new THREE.MeshStandardMaterial({map:canvasTexture('timber','#3e3028'),roughness:.94}),
  plaster:new THREE.MeshStandardMaterial({map:canvasTexture('plaster','#c4bda5'),roughness:.95}),
  white:new THREE.MeshStandardMaterial({map:canvasTexture('plaster','#ddd9c7'),roughness:.82}),
  red:new THREE.MeshStandardMaterial({map:canvasTexture('plaster','#9d3d32'),roughness:.88}),
  roof:new THREE.MeshStandardMaterial({map:canvasTexture('roof','#8d4030'),roughness:.93}),
  brownRoof:new THREE.MeshStandardMaterial({map:canvasTexture('roof','#5d4134'),roughness:.95}),
  slate:new THREE.MeshStandardMaterial({map:canvasTexture('roof','#35404a'),roughness:.91}),
  sand:new THREE.MeshStandardMaterial({map:canvasTexture('sand','#a79770'),roughness:1}),
  grass:new THREE.MeshStandardMaterial({map:canvasTexture('grass','#526544'),roughness:1}),
  soil:new THREE.MeshStandardMaterial({map:canvasTexture('sand','#594b35'),roughness:1}),
  leaves:new THREE.MeshStandardMaterial({map:canvasTexture('grass','#405b3e'),roughness:1}),
  flower:new THREE.MeshStandardMaterial({color:0xa84d51,roughness:.9}),
  metal:new THREE.MeshStandardMaterial({color:0x252d30,roughness:.7,metalness:.35})
};
const batches=new Map();
function box(mat,x,y,z,sx,sy,sz,ry=0){
  const g=new THREE.BoxGeometry(sx,sy,sz);
  if(ry)g.rotateY(ry);g.translate(x,y,z);
  if(!batches.has(mat))batches.set(mat,[]);batches.get(mat).push(g);
}
function flushBlocks(){
  for(const [mat,list] of batches){
    const ps=[],ns=[],uv=[];
    for(const source of list){
      const g=source.index?source.toNonIndexed():source;
      ps.push(g.attributes.position.array);ns.push(g.attributes.normal.array);uv.push(g.attributes.uv.array);
    }
    const join=(arrs,Type)=>{const n=arrs.reduce((s,a)=>s+a.length,0),out=new Type(n);let o=0;for(const a of arrs){out.set(a,o);o+=a.length}return out};
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(join(ps,Float32Array),3));
    g.setAttribute('normal',new THREE.BufferAttribute(join(ns,Float32Array),3));
    g.setAttribute('uv',new THREE.BufferAttribute(join(uv,Float32Array),2));
    g.computeBoundingSphere();
    const mesh=new THREE.Mesh(g,mat);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
    for(const a of list)a.dispose();
  }
  batches.clear();
}
function groundY(x,z=0){
  if(x<-26)return 1;
  if(x>=44)return 18+Math.floor((x-44)/8)*2;
  if(x>=32)return 18;
  if(x>=21)return 15;
  if(x>=9)return 12;
  if(x>=-3)return 9;
  if(x>=-12)return 6;
  return 3;
}
function laneZ(x){return x>=-12?.58*x+8.5:1.54+(-12-x)*.78;}
const terraceRisers=[-12,-3,9,21,32];
const stairLanes=b=>b===-12?[laneZ(b),11]:[laneZ(b),-3,19];

// Five retained terraces descend westward to a stone harbour at the waterline.
for(let x=-28;x<=80;x+=4)for(let z=-64;z<=64;z+=4){
  let h=groundY(x+1.9,z);
  const edge=Math.sin(x*.31+z*.17)+Math.sin(z*.41-x*.09);
  if((x>76&&edge>0)||(z>58&&edge>-.4)||(z<-60&&edge>.2))continue;
  if(x<=-28&&edge>.15)continue;
  if(z<-34&&x>-2&&x<30)h=Math.max(h,12+Math.floor((30-Math.abs(z+45))*.12));
  const onLane=Math.abs(z-laneZ(x))<3.1||Math.abs(z+3)<1.8||Math.abs(z-19)<1.8;
  let top=x<-26?mats.sand:(x<-12?mats.stone:mats.grass);
  if(x>=-12&&onLane)top=mats.stone;
  else if(x>=-12&&Math.sin(x*.71+z*.43)>.86)top=mats.soil;
  box(x<-26?mats.sand:mats.stone,x,h*.5-.4,z,4,h+.8,4);
  box(top,x,h+.08,z,4,.32,4);
}
// Every riser is an exposed grey masonry wall with a cobbled wall-top alley.
for(const b of terraceRisers){
  const hi=groundY(b+1),lo=groundY(b-1),h=hi-lo,wallH=h+.65,lanes=stairLanes(b);
  for(let z=-56;z<=56;z+=4){
    if(lanes.some(l=>Math.abs(z-l)<3.1))continue;
    box(mats.terrace,b-.32,lo+wallH*.5,z,.75,wallH,4.08);
    box(mats.darkStone,b-.08,hi+.78,z,1.12,.34,4.08);
  }
  for(let z=-52;z<=52;z+=8){
    if(lanes.some(l=>Math.abs(z-l)<3.4))continue;
    box(mats.darkStone,b+.18,lo+(h+.95)*.5,z,1.15,h+.95,1.05);
  }
  for(let z=-36;z<=40;z+=2)box(mats.stone,b+1.25,hi+.25,z,1.55,.38,2.03);
}
// A rugged intertidal shoreline breaks the land/sea boundary into rocks and foam.
for(let i=0;i<165;i++){
  const x=-34+rnd()*16,z=-62+rnd()*124,s=.55+rnd()*3.1;
  if(Math.abs(z-11)<6&&x>-27)continue;
  box(i%7===0?mats.sand:mats.darkStone,x,.15+s*.28,z,s,s*(.45+rnd()*.45),s*(.65+rnd()*.75),rnd()*.65);
}
for(let i=0;i<52;i++){
  const x=-29+rnd()*9,z=-60+rnd()*120,s=1.1+rnd()*2.8;
  if(Math.abs(z-11)<7)continue;
  box(mats.darkStone,x,.8+rnd()*1.5,z,s,1.4+rnd()*3.4,s*.85,rnd()*.45);
}
// An exposed reef extends from the shore into the visible harbour mouth.
for(let i=0;i<7;i++){
  const x=-52-i*5,z=38-i*3.2,s=4.2+(i%3)*.8;
  box(mats.darkStone,x,s*.22,z,s,s*.72,s*.82,.18);
  box(mats.stone,x+.45,s*.58,z-.25,s*.55,s*.36,s*.5,-.12);
}
// Rocky headland beneath the lighthouse.
box(mats.darkStone,-5,9,-45,16,18,16);
for(let i=0;i<42;i++){
  const x=-17+rnd()*29,z=-57+rnd()*24,s=2+rnd()*4;
  box(mats.darkStone,x,4+rnd()*7,z,s,5+rnd()*9,s,rnd()*.35);
}
// A continuous diagonal stair lane bends onto the harbour quay.
for(let x=-24;x<=70;x+=1.1){
  const z=laneZ(x);
  if(terraceRisers.some(b=>Math.abs(x-b)<2.5))continue;
  box(mats.stone,x,groundY(x,z)+.25,z,1.16,.45,3.1);
}
// Two narrower cross-streets connect the staggered rows.
for(const z of [-3,19])for(let x=-20;x<=44;x+=1.6){
  if(terraceRisers.some(b=>Math.abs(x-b)<2.5))continue;
  box(mats.stone,x,groundY(x,z)+.25,z,1.66,.45,1.8);
}
for(const b of terraceRisers){
  for(const z of stairLanes(b)){
    const lo=groundY(b-3,z);
    for(let s=0;s<4;s++)box(mats.stone,b-1.5+s,lo+(s+1)*.375,z,1.02,(s+1)*.75,2.7);
  }
}
// Small cultivated plots break up the remaining grass.
function garden(x,z,w=4.5,d=3.5){
  const y=groundY(x,z)+.32;
  box(mats.soil,x,y,z,w,.35,d);
  for(const s of [-1,1]){box(mats.stone,x+s*w*.5,y+.25,z,.28,.45,d+.4);box(mats.stone,x,y+.25,z+s*d*.5,w,.45,.28)}
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)box((i+j)&1?mats.flower:mats.leaves,x+i*w*.25,y+.48,z+j*d*.25,.65,.55,.65);
}
garden(42,24,5,4);garden(25,53,5,4);garden(24,-34,4.5,4);
garden(13,32,4,3.5);garden(5,48,5,4);garden(1,-39,4,3.5);garden(-7,-28,4.5,3.5);

const windows=[],windowGlowLights=[];
function emissiveBox(x,y,z,sx,sy,sz,color=new THREE.Color(1,.4,.08)){
  const mat=new THREE.MeshBasicMaterial({color:color.clone(),toneMapped:false});
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);mesh.position.set(x,y,z);scene.add(mesh);return mesh;
}
function addWindow(x,y,z,sx,sy,sz,index){
  const w=emissiveBox(x,y,z,sx,sy,sz,new THREE.Color(0,0,0));
  w.userData.index=index;windows.push(w);return w;
}
// Two-block inhabited terrace podiums make every level legible from the hillside.
const terracePlatforms=[{x:38,w:10},{x:27,w:9},{x:15,w:10},{x:3,w:10},{x:-7.5,w:9}];
for(const p of terracePlatforms){
  const y=groundY(p.x),lz=laneZ(p.x);
  for(let z=-32;z<=60;z+=4){
    if(p.x===15&&z>=18&&z<=30)continue;
    if(Math.abs(z-lz)<2.8||Math.abs(z-19)<1.8||Math.abs(z+3)<1.8)continue;
    box(mats.terrace,p.x,y+1,z,p.w,2,4.05);
    box(mats.stone,p.x,y+2.08,z,p.w+.2,.25,4.05);
    if((z+32)%12===0)box(mats.darkStone,p.x+p.w*.5,y+1,z,.8,2.2,1.15);
  }
  for(const side of [-1,1])for(let s=0;s<3;s++)
    box(mats.stone,p.x,y+(s+1)/3,lz+side*(2.1+s*.65),4,(s+1)*2/3,.72);
}

const houseSpecs=[
  [38,46,8,7,0],[38,8,7,8,0],[38,-18,8,7,0],
  [27,44,7,7,1],[27,20,8,7,1],[27,0,7,8,0],[27,-22,8,7,1],
  [15,38,8,7,0],[15,10,7,7,1],[15,-12,8,7,2],
  [3,38,7,7,1],[3,2,8,7,0],[3,-8,7,8,1],[3,-30,8,7,0],
  [-9,42,7,7,1],[-9,32,8,7,2],[-9,-16,7,7,1],
  [38,-8,6,6,0],[38,-2,6,6,0],
  [3,32,5,5,0],[27,9,6,6,0],[27,-10,6,6,0],
  [15,50,6,6,0],[15,-24,6,6,0],[15,-2,6,5,0],
  [3,48,6,6,0],[3,15,5,5,0],[3,-19,6,6,0],
  [-9,52,6,6,0],[-9,-5,6,6,0],[-18,32,6,6,0],[-18,-22,6,6,0]
];
const chimneyBases=[];
houseSpecs.forEach(([x,z,w,d,alt],i)=>{
  const y=groundY(x,z)+(x>=-12?2:0)+.3,stoneH=2.7,upperH=x<34&&alt===1?4.9:2.5,roofY=y+stoneH+upperH;
  box(mats.stone,x,y-.25,z,w+1.2,.7,d+1.2);
  box(mats.stone,x,y+stoneH*.5,z,w,stoneH,d);
  box(i%3===0?mats.plaster:mats.timber,x,y+stoneH+upperH*.5,z,w+.25,upperH,d+.2);
  // Corner beams and the overhanging upper storey.
  for(const zz of [-1,1])for(const xx of [-1,1])box(mats.darkWood,x+xx*w*.5,y+stoneH+upperH*.5,z+zz*d*.5,.22,upperH+.2,.22);
  box(mats.darkWood,x,y+stoneH+.12,z,w+.6,.25,d+.55);
  if(upperH>3)box(mats.darkWood,x,y+stoneH+2.55,z,w+.5,.22,d+.45);
  const roofMat=[mats.roof,mats.brownRoof,mats.slate][i%3];
  for(let r=0;r<6;r++)box(roofMat,x,roofY+r*.36,z,Math.max(.75,w+1-r*(w/5.6)),.38,d+1.05);
  box(mats.darkWood,x,roofY+2.12,z,.42,.28,d+1.15);
  const cx=x+w*.22,cz=z-d*.19,cy=roofY+2.25;
  box(mats.stone,cx,cy,cz,1.05,3.2,1.05);box(mats.darkStone,cx,cy+1.65,cz,1.28,.28,1.28);
  chimneyBases.push(new THREE.Vector3(cx,cy+1.9,cz));
  // Door, lit upper windows, timber shutters.
  box(mats.darkWood,x+w*.5+.05,y+1.05,z,.12,2.1,1.15);
  addWindow(x+w*.5+.15,y+3.85,z-d*.22,.12,1.05,1.05,i*2);
  addWindow(x+w*.5+.15,y+3.85,z+d*.22,.12,1.05,1.05,i*2+1);
  if(upperH>3){
    addWindow(x+w*.5+.15,y+6.35,z-d*.22,.12,.9,.95,34+i*2);
    addWindow(x+w*.5+.15,y+6.35,z+d*.22,.12,.9,.95,35+i*2);
  }
  if(i%3===0){
    const light=new THREE.PointLight(0xff8740,0,7,2);
    light.position.set(x+w*.5+1.25,y+3.55,z);scene.add(light);
    windowGlowLights.push({light,index:i*2});
  }
  box(mats.darkWood,x+w*.5+.08,y+3.85,z-d*.22-.72,.13,1.25,.28);
  box(mats.darkWood,x+w*.5+.08,y+3.85,z+d*.22+.72,.13,1.25,.28);
  // Balcony, railings and flower box on the visible side.
  const bz=z+d*.5+.7,by=y+3.05;
  box(mats.darkWood,x,by,bz,w*.72,.22,1.45);
  box(mats.timber,x,by+.85,bz+.62,w*.72,.16,.16);
  for(let q=-2;q<=2;q++)box(mats.timber,x+q*w*.15,by+.45,bz+.62,.13,.85,.13);
  box(mats.darkWood,x,by+.35,bz+.8,w*.5,.42,.38);
  for(let q=-2;q<=2;q++)box(q%2?mats.flower:mats.leaves,x+q*w*.1,by+.65,bz+.8,.42,.35,.35);
});

// The small square opens below the diagonal lane, with a well and a block tree.
const squareY=groundY(11,25)+2.45;
box(mats.stone,11,squareY-1.5,25,9,3.2,10);
box(mats.stone,11,squareY-.2,25,9,.45,10);
for(const [dx,dz,sx,sz] of [[-1.1,0,.45,2.6],[1.1,0,.45,2.6],[0,-1.1,1.8,.45],[0,1.1,1.8,.45]])
  box(mats.stone,9.5+dx,squareY+.6,26.5+dz,sx,1.2,sz);
box(mats.darkWood,9.5,squareY+2.5,26.5,3.4,.3,3.4);
for(const dx of [-1.3,1.3])box(mats.timber,9.5+dx,squareY+1.7,26.5,.25,2.5,.25);
box(mats.timber,12,squareY+2,20.5,1,4,1);
for(const [dx,dy,dz,s] of [[0,4,0,4],[-1.8,3.7,.5,2.8],[1.7,4.3,-.4,3],[0,5.7,0,2.8],[.4,3.6,1.8,2.6]])
  box(mats.leaves,12+dx,squareY+dy,20.5+dz,s,s,s);

// Waterline harbour quay, with cargo and steps down to the lower pier.
box(mats.stone,-17,1.55,11,12,3.1,16);
box(mats.stone,-17,3.18,11,12,.3,16);
for(let s=0;s<4;s++)box(mats.stone,-22.5-s,2.85-s*.48,11,1.05,.42,4.2);
for(const [x,z] of [[-15,6],[-19,15],[-14,13],[-20,7]]){
  box(mats.timber,x,3.95,z,1.25,1.25,1.25);box(mats.darkWood,x,4.61,z,1.35,.12,1.35);
}
for(let i=0;i<7;i++){
  box(mats.darkWood,-20+i*.38,3.42,15.5,.11,.11,3.0,.16);
  box(mats.darkWood,-20,3.44,14.2+i*.38,3.0,.1,.1,-.12);
}

// Stone pier, crates, nets and mooring posts.
const pierY=1.35;
box(mats.stone,-45,pierY-1,11,54,2.2,5.8);
for(let x=-70;x<-18;x+=4)box(mats.darkStone,x,.15,8.7,.65,2.8,.65);
for(const [x,z] of [[-29,10],[-37,12],[-42,9],[-24,12],[-61,10],[-66,12]]){
  box(mats.timber,x,pierY+.65,z,1.25,1.25,1.25);
  box(mats.darkWood,x,pierY+1.32,z,1.35,.12,1.35);
}
for(let i=0;i<7;i++){
  box(mats.darkWood,-50+i*.42,pierY+.18,13.2,.12,.12,3.1,.18);
  box(mats.darkWood,-51,pierY+.2,12+i*.38,3.1,.1,.1,-.12);
}
for(const z of [8.4,13.6])for(const x of [-69,-53,-37,-22])box(mats.darkWood,x,pierY+.65,z,.42,1.5,.42);

const lanterns=[];
function addLantern(x,y,z,post=true){
  if(post){box(mats.metal,x,y-1.25,z,.18,2.5,.18);box(mats.metal,x,y+.32,z,.65,.16,.65)}
  const lamp=emissiveBox(x,y,z,.42,.58,.42,new THREE.Color(0,0,0));lanterns.push(lamp);return lamp;
}
addLantern(-23,pierY+2.8,8.5);addLantern(-68,pierY+2.8,13.5);addLantern(-15,6.1,17);
addLantern(7.5,squareY+2.8,28.5);addLantern(14.5,squareY+2.8,21.5);
addLantern(31,groundY(31,26.5)+2.8,26.5);
addLantern(8,groundY(8,13.1)+2.8,13.1);

  o.type='sine';o.frequency.setValueAtTime(1050,now);o.frequency.exponentialRampToValueAtTime(610,now+.42);o.frequency.exponentialRampToValueAtTime(860,now+.7);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.035,now+.08);g.gain.exponentialRampToValueAtTime(.0001,now+.8);o.connect(g).connect(master);o.start();o.stop(now+.85);
}
function updateAudio(t){
  if(!audio)return;const {ctx,wave,wind,cricketGain,tremGain}=audio,now=ctx.currentTime,se=sample(elevationKeys,t),night=sstep(-.12,-.3,se);
  wave.gain.setTargetAtTime(.11+.045*Math.sin(t*TAU*6),now,.25);wind.gain.setTargetAtTime(.018+night*.035,now,.4);cricketGain.gain.setTargetAtTime(night*.004,now,.2);tremGain.gain.setTargetAtTime(night*.003,now,.2);
  if(lastAudioT<.42&&t>=.42)bell();if(t<lastAudioT)lastAudioT=0;
  if(se>.02&&now>audio.nextGull){gull();audio.nextGull=now+4.5+rnd()*5}lastAudioT=t;
}
