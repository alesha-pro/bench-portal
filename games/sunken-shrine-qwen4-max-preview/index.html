<script type="module">
import * as THREE from 'three';

/* ============================== error guard ============================== */
window.__shrineErrors = [];
window.__shrineReady = false;
window.__shrineFrames = 0;
addEventListener('error', e => window.__shrineErrors.push(String(e.message)));
addEventListener('unhandledrejection', e => window.__shrineErrors.push(String(e.reason)));

/* ============================== constants ============================== */
const LOOP = 30, TAU = Math.PI * 2;
const BUF_H = 270;
const WATER_Y = 0.6;
const HOLE = { x: 7.5, z: -5.5 };
const POOL = { x: 4.0, z: 0.0, rx: 17.0, rz: 13.0 };
const ISLE = { x: 7.5, z: -3.5 };
const FALL = { x: 5.0, z: -2.2 };
const CAM_POS = new THREE.Vector3(-22, 15, 18);
const CAM_TARGET = new THREE.Vector3(3, 11.1, -1);
/* stair parameterization (shared by geometry + torches): descends from the camera ledge down the left wall to the pool shore */
const STAIR = { n:10, cx:i => -15 + Math.round(i*1.3), cz:i => -6 + Math.round(i*1.1), top:i => 9 - i };
const params = new URLSearchParams(location.search);
const FREEZE = params.has('t') ? parseFloat(params.get('t')) : null;

/* ============================== rng / noise ============================== */
function mulberry32(seed){ let a = seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const rng = mulberry32(20261115);
function hash2(x,y){ const n = Math.sin(x*127.1 + y*311.7)*43758.5453; return n - Math.floor(n); }
function hash3(x,y,z){ const n = Math.sin(x*127.1 + y*311.7 + z*74.7)*43758.5453; return n - Math.floor(n); }
function vnoise2(x,y){
  const ix=Math.floor(x), iy=Math.floor(y); let fx=x-ix, fy=y-iy;
  fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;
}
function fbm2(x,y){ return (vnoise2(x,y)*0.55 + vnoise2(x*2.1+5.2,y*2.1+1.3)*0.28 + vnoise2(x*4.3+9.1,y*4.3+3.7)*0.17); }
function vnoise3(x,y,z){
  const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z);
  let fx=x-ix, fy=y-iy, fz=z-iz;
  fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy); fz=fz*fz*(3-2*fz);
  const c000=hash3(ix,iy,iz),   c100=hash3(ix+1,iy,iz),   c010=hash3(ix,iy+1,iz),   c110=hash3(ix+1,iy+1,iz);
  const c001=hash3(ix,iy,iz+1), c101=hash3(ix+1,iy,iz+1), c011=hash3(ix,iy+1,iz+1), c111=hash3(ix+1,iy+1,iz+1);
  const x00=c000+(c100-c000)*fx, x10=c010+(c110-c010)*fx, x01=c001+(c101-c001)*fx, x11=c011+(c111-c011)*fx;
  const y0=x00+(x10-x00)*fy, y1=x01+(x11-x01)*fy;
  return y0+(y1-y0)*fz;
}
function fbm3(x,y,z){ return vnoise3(x,y,z)*0.65 + vnoise3(x*2.2+3.7,y*2.2+8.1,z*2.2+1.9)*0.35; }

/* ============================== pool / hole math (mirrored in GLSL) ============================== */
function poolE(x,z){
  const dx=(x-POOL.x)/POOL.rx, dz=(z-POOL.z)/POOL.rz;
  const wob = 0.10*Math.sin(x*0.7+z*0.5) + 0.06*Math.sin(z*1.1-x*0.4);
  return dx*dx+dz*dz+wob;
}
function poolDepth(x,z){ const e=poolE(x,z); return e>=1 ? 0 : 3.2*Math.pow(1-e,0.7); }
function holeR(ang){ return 4.0 + 0.7*Math.sin(ang*3+1.0) + 0.4*Math.sin(ang*5+0.6); }
function floorHeight(x,z){
  let h = 1 + Math.floor(fbm2(x*0.09+3.1, z*0.09+7.7)*1.4);
  const e = poolE(x,z);
  if(e < 1.0) h = Math.floor(WATER_Y - poolDepth(x,z));
  else if(e < 1.22) h = 1;
  return h;
}
function ceilHeight(x,z){
  const c = 23 + Math.floor(fbm2(x*0.07+11.2, z*0.07+5.4)*4.5);
  const d = Math.hypot(x-HOLE.x, z-HOLE.z);
  if(d < holeR(Math.atan2(z-HOLE.z, x-HOLE.x))) return 40;
  return c;
}
function interior(x,y,z){
  const nx=(x-2)/34, ny=(y-10)/22, nz=(z-1)/32;
  const d = nx*nx+ny*ny+nz*nz;
  const n = (fbm3(x*0.055,y*0.055,z*0.055)-0.5)*0.34;
  return d < 0.94 + n;
}

/* ============================== renderer ============================== */
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x05030d, 1);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070512);
scene.fog = new THREE.FogExp2(0x0a0716, 0.0016);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 220);
camera.position.copy(CAM_POS);
camera.lookAt(CAM_TARGET);

const reflCam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 220);

/* ============================== procedural 16x16 textures ============================== */
function makeTex(draw){
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const g = c.getContext('2d'); draw(g);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function px(g,x,y,r,gg,b,a=255){ g.fillStyle = `rgba(${r|0},${gg|0},${b|0},${a/255})`; g.fillRect(x,y,1,1); }
const texStone = makeTex(g => {
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const n = vnoise2(x*0.9+2.2, y*0.9+8.8);
    let v = 82 + n*34 + (hash2(x,y)-0.5)*18;
    if(hash2(x*3.1,y*7.7) > 0.93) v -= 30;
    px(g,x,y, v*0.96, v*0.94, v*1.10);
  }
  g.fillStyle='rgba(40,38,54,0.8)';
  g.fillRect(0,5,7,1); g.fillRect(9,11,7,1); g.fillRect(4,0,1,4); g.fillRect(12,12,1,4);
});
const texMoss = makeTex(g => {
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const n = vnoise2(x*0.9+2.2, y*0.9+8.8);
    let v = 82 + n*34 + (hash2(x,y)-0.5)*18;
    const m = vnoise2(x*0.55+13.7, y*0.55+4.2);
    if(m > 0.52){ const k = Math.min(1,(m-0.52)*3.4); px(g,x,y, v*0.96*(1-k)+62*k, v*0.94*(1-k)+118*k, v*1.10*(1-k)+52*k); }
    else px(g,x,y, v*0.96, v*0.94, v*1.10);
  }
});
const texCarved = makeTex(g => {
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const n = vnoise2(x*0.8+5.5, y*0.8+2.2);
    let v = 118 + n*26 + (hash2(x,y)-0.5)*12;
    px(g,x,y, v*1.04, v*0.99, v*0.88);
  }
  g.fillStyle='rgba(58,52,48,0.9)';
  g.fillRect(0,0,16,1); g.fillRect(0,15,16,1); g.fillRect(0,0,1,16); g.fillRect(15,0,1,16);
  g.fillRect(3,3,10,1); g.fillRect(3,12,10,1); g.fillRect(3,3,1,10); g.fillRect(12,3,1,10);
  g.fillStyle='rgba(70,64,58,0.85)';
  g.fillRect(6,6,4,4); g.fillRect(5,7,1,2); g.fillRect(10,7,1,2);
  g.fillStyle='rgba(160,155,140,0.6)'; g.fillRect(4,4,8,1);
});
const texGravel = makeTex(g => {
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const n = vnoise2(x*1.7+9.1, y*1.7+3.3);
    const h = hash2(x*1.3,y*2.1);
    let v = 74 + n*46 + (h-0.5)*26;
    const warm = h > 0.6 ? 10 : 0;
    px(g,x,y, v+warm, v*0.97+warm*0.6, v*0.92);
  }
});
const texRoots = makeTex(g => {
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const s = vnoise2(x*2.4+1.1, y*0.35+6.6);
    let v = 62 + s*40 + (hash2(x,y)-0.5)*14;
    px(g,x,y, v*1.18, v*0.86, v*0.62);
  }
  g.fillStyle='rgba(38,26,18,0.75)';
  g.fillRect(3,0,1,16); g.fillRect(9,0,1,16); g.fillRect(13,0,1,16);
});
const texLeaves = makeTex(g => {
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const n = vnoise2(x*1.3+4.4, y*1.3+7.7);
    const h = hash2(x*2.7,y*3.1);
    if(h > 0.88){ px(g,x,y,0,0,0,0); continue; }
    const v = 96 + n*70;
    px(g,x,y, v*0.62 + h*22, v*1.05, v*0.34);
  }
});

/* ============================== materials ============================== */
const MAT = { stone:0, mossy:1, carved:2, gravel:3, roots:4, leaves:5 };
const SH = {
  uT:            { value: 0 },
  uSunDir:       { value: new THREE.Vector3(0,1,0) },
  uSunColor:     { value: new THREE.Color(6,5.6,4.9) },
  uCloud:        { value: 1 },
  uShadowMap:    { value: null },
  uShadowMatrix: { value: new THREE.Matrix4() },
  uShadowTexel:  { value: 1/2048 },
  uBeamHit:      { value: new THREE.Vector2(7.5,-4) },
  uBeamR:        { value: 4.6 },
};
{ // fallback white shadow texture until first shadow render
  const d = new Uint8Array([255,255,255,255]);
  const t = new THREE.DataTexture(d,1,1,THREE.RGBAFormat);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.needsUpdate = true;
  SH.uShadowMap.value = t;
}
/* three r160: explicit GLSL3 shaders must declare their own fragment output */
const FRAG_OUT = `layout(location = 0) out highp vec4 pc_fragColor;
#define gl_FragColor pc_fragColor
`;
const GLSL_COMMON = `
uniform float uT;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform float uCloud;
uniform sampler2D uShadowMap;
uniform mat4 uShadowMatrix;
uniform float uShadowTexel;
uniform vec2 uBeamHit;
uniform float uBeamR;
const float TAU = 6.28318530718;
float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x+p.y)*p.z); }
float noise3(vec3 p){
  vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
  float a = mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y);
  float b = mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y);
  return mix(a,b,f.z);
}
float unpackD(vec4 v){ return dot(v, vec4(1.0/(256.0*256.0*256.0), 1.0/(256.0*256.0), 1.0/256.0, 1.0)) * (255.0/256.0); }
float shadowLit(vec3 wp){
  vec4 sc = uShadowMatrix * vec4(wp, 1.0);
  vec3 s = sc.xyz / sc.w;
  if(s.x < 0.002 || s.x > 0.998 || s.y < 0.002 || s.y > 0.998 || s.z > 0.998 || s.z < 0.0) return 1.0;
  float sum = 0.0;
  for(int i=0;i<4;i++){
    vec2 o = vec2((i==0||i==3) ? -1.0 : 1.0, (i<2) ? -1.0 : 1.0) * uShadowTexel * 1.3;
    sum += step(s.z - 0.0018, unpackD(texture(uShadowMap, s.xy + o)));
  }
  return sum * 0.25;
}
float caustic(vec2 p, float t){
  float a = t*TAU;
  vec2 q = p*0.85;
  float c1 = sin(q.x*2.3 + sin(q.y*1.9 + a*2.0)*1.4 + a);
  float c2 = sin(q.y*2.7 + sin(q.x*2.1 - a*3.0)*1.2 - a*2.0);
  float c3 = sin((q.x+q.y)*1.9 + a*4.0 + sin(q.x*1.3 - a)*0.8);
  float v = clamp(c1*c2*0.5 + 0.5 + c3*0.18, 0.0, 1.0);
  return pow(v, 7.0)*3.2;
}
`;
function injectCaustics(mat){
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, SH);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 swp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          swp = instanceMatrix * swp;
        #endif
        vWorldPos = (modelMatrix * swp).xyz;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;\n' + GLSL_COMMON)
      .replace('#include <opaque_fragment>', `
        {
          float cm = 1.0 - smoothstep(6.0, 16.0, length(vWorldPos.xz - vec2(4.0,-0.5)));
          cm *= smoothstep(14.0, 20.0, vWorldPos.y) * (1.0 - smoothstep(24.0, 29.0, vWorldPos.y));
          float bm = 1.0 - smoothstep(uBeamR, uBeamR + 7.0, length(vWorldPos.xz - uBeamHit));
          vec3 wn = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
          float facing = 0.3 + 0.7*abs(wn.y);
          outgoingLight += vec3(0.2, 0.55, 0.5) * caustic(vWorldPos.xz*0.8, uT) * cm * bm * facing * uCloud * 0.4;
        }
        #include <opaque_fragment>`);
  };
}
function injectLeafGlow(mat){
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, SH);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 swp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          swp = instanceMatrix * swp;
        #endif
        vWorldPos = (modelMatrix * swp).xyz;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;\n' + GLSL_COMMON)
      .replace('#include <opaque_fragment>', `
        {
          vec3 vd = normalize(vWorldPos - cameraPosition);
          float back = pow(max(dot(vd, uSunDir), 0.0), 3.0);
          float lit = shadowLit(vWorldPos);
          outgoingLight += vec3(0.45, 0.85, 0.22) * back * lit * uCloud * 1.5;
        }
        #include <opaque_fragment>`);
  };
}
const blockMats = [
  new THREE.MeshLambertMaterial({ map: texStone }),
  new THREE.MeshLambertMaterial({ map: texMoss }),
  new THREE.MeshLambertMaterial({ map: texCarved }),
  new THREE.MeshLambertMaterial({ map: texGravel }),
  new THREE.MeshLambertMaterial({ map: texRoots }),
  new THREE.MeshLambertMaterial({ map: texLeaves, alphaTest: 0.5, side: THREE.DoubleSide }),
];
injectCaustics(blockMats[0]); injectCaustics(blockMats[1]); injectCaustics(blockMats[2]); injectCaustics(blockMats[3]);
injectLeafGlow(blockMats[5]);

/* ============================== voxel cavern ============================== */
const extra = new Map();          // "x,y,z" -> mat
const key = (x,y,z) => x + ',' + y + ',' + z;
function addBox(x0,y0,z0,x1,y1,z1,m){ for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++) extra.set(key(x,y,z), m); }

/* ledge + stairs (camera side, left foreground) with a stepped retaining wall the torches mount on */
addBox(-27,9,15, -20,10,22, MAT.stone);
addBox(-27,10,15, -20,10,22, MAT.mossy);
for(let i=0;i<STAIR.n;i++){
  const top = STAIR.top(i), cx = STAIR.cx(i), cz = STAIR.cz(i);
  addBox(cx-1, Math.max(0,top-3), cz-1, cx+1, top-1, cz+1, MAT.stone);
  extra.set(key(cx-1, top-1, cz-1), MAT.mossy);
  extra.set(key(cx+1, top-1, cz+1), MAT.mossy);
  /* retaining wall on the stair (torch backdrop), tall enough to catch each torch's warm pool */
  if(i >= 2){
    addBox(cx-2, top-1, cz-1, cx-2, top+3, cz+1, MAT.stone);
    if(hash2(cx*1.3,cz*2.1) > 0.5) extra.set(key(cx-2, top+3, cz), MAT.mossy);
  }
}
/* island base (mossy rock rising from the pool bed) */
for(let x=3;x<=12;x++)for(let z=-8;z<=1;z++){
  const d = Math.hypot(x+0.5-ISLE.x, z+0.5-ISLE.z);
  if(d < 3.6){
    const bed = Math.floor(WATER_Y - poolDepth(x+0.5,z+0.5));
    const top = d < 2.0 ? 2 : 1;
    for(let y=bed;y<top;y++) extra.set(key(x,y,z), y===top-1 ? MAT.mossy : MAT.stone);
  }
}
/* tiered carved shrine platform + steps down to the water (the beam climbs these around t=20-26) */
addBox(4,-3,-7, 11,1,-4, MAT.stone);   // upper foundation
addBox(4,2,-7, 11,2,-4, MAT.carved);   // upper platform y2
addBox(4,-3,-4, 11,0,-2, MAT.stone);   // mid foundation
addBox(4,1,-4, 11,1,-2, MAT.carved);   // mid step y1
addBox(4,-3,-2, 11,-1,0, MAT.stone);   // low foundation
addBox(4,0,-2, 11,0,0, MAT.carved);    // low step y0 (waterline)
/* wall ledges for depth layers (keyed into the walls) */
addBox(-9,9,-31, 3,10,-26, MAT.stone);
addBox(19,14,-12, 34,15,-5, MAT.stone);
addBox(-33,7,-9, -25,8,3, MAT.stone);
/* mid-depth ledges protruding into the cavern */
addBox(-30,12,-18, -22,13,-10, MAT.stone);
/* left-shore ledge near the pool (revealed by torch warmth + beam bounce) */
addBox(-19,11,-9, -12,12,-2, MAT.stone);
addBox(-19,12,-9, -12,12,-2, MAT.mossy);
addBox(12,8,-26, 22,9,-20, MAT.stone);
addBox(-16,5,-24, -6,6,-20, MAT.mossy);
/* right-side rock buttresses + shore (mid-depth structure, faint warm bounce + crystal blue) */
addBox(16,0,-13, 23,7,-6, MAT.stone);
addBox(18,7,-11, 22,11,-7, MAT.stone);
addBox(19,11,-10, 21,13,-8, MAT.mossy);
addBox(21,0,2, 27,5,9, MAT.stone);
addBox(14,0,-3, 17,3,1, MAT.mossy);
addBox(24,5,4, 27,8,8, MAT.stone);
/* right + middle-background walls/ledges at three depths (cool fill + warm bounce near the hit) */
addBox(24,8,-16, 30,10,-8, MAT.stone);
addBox(26,10,-14, 29,11,-9, MAT.mossy);
addBox(28,4,-24, 34,16,-14, MAT.stone);
addBox(0,6,-26, 12,8,-20, MAT.stone);
addBox(-4,8,-30, 8,10,-26, MAT.stone);
addBox(-6,4,-31, 10,18,-27, MAT.stone);
/* nearer right + back-left structure to break the flat void at mid depth */
addBox(22,6,-2, 28,12,6, MAT.stone);
addBox(23,12,0, 27,13,5, MAT.mossy);
addBox(24,2,8, 30,14,14, MAT.stone);
addBox(-10,8,-24, 0,10,-18, MAT.stone);
addBox(-16,6,-28, -6,16,-24, MAT.stone);
/* left pool-shore buttresses (low, left of the pool edge so they frame without occluding the water) */
addBox(-16,1,-2, -11,3,4, MAT.stone);
addBox(-16,3,-2, -11,3,4, MAT.mossy);
addBox(-14,1,4, -10,3,8, MAT.stone);
addBox(-17,1,-8, -13,4,-4, MAT.stone);
addBox(-17,4,-8, -13,4,-4, MAT.mossy);
/* near foreground rock framing the edges (warm-lit left, dark silhouette right) */
addBox(-29,2,8, -24,16,15, MAT.stone);
addBox(-29,16,8, -24,16,15, MAT.mossy);
addBox(15,1,11, 21,15,17, MAT.stone);
addBox(13,4,13, 16,9,16, MAT.stone);
/* foreground shore boulders framing the edges (catch torch spill + bounce); centre kept low so the pool reads */
addBox(-14,2,4, -11,4,8, MAT.stone);
addBox(-14,4,4, -11,4,8, MAT.mossy);
addBox(-12,2,9, -9,3,12, MAT.gravel);
addBox(9,2,8, 13,4,12, MAT.stone);
addBox(9,4,8, 13,4,12, MAT.mossy);

        extra.set(key(cx+dx,y,cz+dz), m);
      }
    } else {
      extra.set(key(cx,y,cz), k===len-1 ? MAT.mossy : MAT.stone);
      if(rng()<0.4) extra.set(key(cx+1,y,cz), MAT.stone);          // rough side nubs
      if(rng()<0.4) extra.set(key(cx,y,cz-1), MAT.stone);
    }
  }
  return { x:cx+0.5, y:ch-len, z:cz+0.5 };

/* solid query with cache */
const solidCache = new Map();
function solidAt(x,y,z){
  if(x<-34||x>38||y<-6||y>36||z<-32||z>34) return -1;
  const k = key(x,y,z);
  if(solidCache.has(k)) return solidCache.get(k);
  let m;
  if(extra.has(k)) m = extra.get(k);
  else {
    const fh = floorHeight(x,z), ch = ceilHeight(x,z);
    const dh = Math.hypot(x+0.5-HOLE.x, z+0.5-HOLE.z);
    const inHole = dh < holeR(Math.atan2(z+0.5-HOLE.z, x+0.5-HOLE.x));
    if(y < fh){
      if(y === fh-1){
        const e = poolE(x+0.5,z+0.5);
        if(e < 1.22) m = MAT.gravel;
        else m = hash2(x*3.3,z*1.9) > 0.9 ? MAT.mossy : MAT.stone;
      } else m = MAT.stone;
    } else if(inHole){
      m = -1; /* open shaft to the sky — no ceiling cap */
    } else if(y >= ch){
      if(y === ch){
        const d = Math.hypot(x+0.5-HOLE.x, z+0.5-HOLE.z);
        m = (d < holeR(Math.atan2(z+0.5-HOLE.z,x+0.5-HOLE.x)) + 3.2 && hash2(x*2.1,z*3.7) > 0.55) ? MAT.roots : MAT.stone;
      } else m = MAT.stone;
    } else if(!interior(x,y,z)){
      const n = vnoise2(x*0.14+7.7, z*0.14+2.9);
      m = (y < 7 && n > 0.55) || (y < 12 && n > 0.78) ? MAT.mossy : MAT.stone;
    } else m = -1;
  }
  solidCache.set(k,m);
  return m;
}

function buildStaticInstanced(list, mat, geo){
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), S = new THREE.Vector3(), P = new THREE.Vector3();

    E.set(0, c[6]||0, 0); Q.setFromEuler(E);
    P.set(c[0],c[1],c[2]); S.set(c[3],c[4],c[5]);
    M.compose(P,Q,S); im.setMatrixAt(i,M);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  im.frustumCulled = false;
  scene.add(im);

}

    uniform float uT; varying vec2 vUv;
    const float TAU = 6.28318530718;
    float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

  const a = t*TAU; let idx = 0;

}

const GLSL_POOL = `
float poolE(vec2 p){
  vec2 d = (p - vec2(${POOL.x.toFixed(1)}, ${POOL.z.toFixed(1)})) / vec2(${POOL.rx.toFixed(1)}, ${POOL.rz.toFixed(1)});
  float wob = 0.10*sin(p.x*0.7+p.y*0.5) + 0.06*sin(p.y*1.1-p.x*0.4);
  return dot(d,d) + wob;
}
float poolDepth(vec2 p){ float e = poolE(p); return e >= 1.0 ? 0.0 : 3.2*pow(1.0-e, 0.7); }

  void main(){
    vec3 scene = texture(tScene, vUv).rgb;
    vec4 vol = texture(tVol, vUv);
    float ao = texture(tAO, vUv).r;
    gl_FragColor = vec4(scene*ao*vol.a + vol.rgb, 1.0);
  }`, { tScene:{value:sceneRT.texture}, tVol:{value:vol2RT.texture}, tAO:{value:aoRT.texture} });
/* --- HDR bloom: bright pass + wide separable blur, all at buffer res --- */
const brightMat = pass(`
  uniform sampler2D tSrc;
  varying vec2 vUv;
  void main(){
    vec3 c = texture(tSrc, vUv).rgb;
    float l = dot(c, vec3(0.299,0.587,0.114));
    float k = smoothstep(1.0, 1.7, l);
    gl_FragColor = vec4(c*k, 1.0);
  }`, { tSrc:{value:compRT.texture} });
const blurMat = pass(`
  uniform sampler2D tSrc;
  uniform vec2 uDir;
  varying vec2 vUv;
  void main(){
    vec3 sum = texture(tSrc, vUv).rgb*0.227027;
    sum += (texture(tSrc, vUv + uDir*1.3846).rgb + texture(tSrc, vUv - uDir*1.3846).rgb)*0.3162162;
    sum += (texture(tSrc, vUv + uDir*3.2308).rgb + texture(tSrc, vUv - uDir*3.2308).rgb)*0.0702703;
    sum += (texture(tSrc, vUv + uDir*5.1765).rgb + texture(tSrc, vUv - uDir*5.1765).rgb)*0.0162162;
    sum += (texture(tSrc, vUv + uDir*7.1220).rgb + texture(tSrc, vUv - uDir*7.1220).rgb)*0.0032432;
    gl_FragColor = vec4(sum, 1.0);
  }`, { tSrc:{value:bloomA.texture}, uDir:{value:new THREE.Vector2()} });
/* --- ACES + grade + 48-level Bayer quantize --- */
const toneMat = pass(`
  uniform sampler2D tComp, tBloom;
  uniform float uExposure;
  varying vec2 vUv;
  ${BAYER}
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
  }
  void main(){
    vec3 c = texture(tComp, vUv).rgb + texture(tBloom, vUv).rgb*0.95;
    c = aces(c*uExposure);
    c = pow(c, vec3(1.0/2.2));
    float l = dot(c, vec3(0.299,0.587,0.114));
    c = mix(c, c*vec3(0.90,0.94,1.14), (1.0-l)*0.38);
    c = mix(c, c*vec3(1.07,1.00,0.92), l*0.30);
    float b = bayer4(gl_FragCoord.xy);
    c = floor(c*47.0 + b)/47.0;
    gl_FragColor = vec4(c, 1.0);
  }`, { tComp:{value:compRT.texture}, tBloom:{value:bloomA.texture}, uExposure:{value:1.0} });
/* --- integer nearest upscale --- */
const upMat = pass(`
  uniform sampler2D tSrc;
  varying vec2 vUv;
  void main(){ gl_FragColor = texture(tSrc, vUv); }`, { tSrc:{value:finalRT.texture} });

/* ============================== resize ============================== */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  reflCam.aspect = w/h; reflCam.updateProjectionMatrix();
  bufH = BUF_H; bufW = Math.max(2, Math.round(BUF_H*w/h));
  scale = Math.max(1, Math.floor(Math.min(w/bufW, h/bufH)));
  offX = Math.floor((w - bufW*scale)/2);
  offY = Math.floor((h - bufH*scale)/2);
  for(const rt of [sceneRT,reflRT,volRT,vol2RT,aoRT,compRT,bloomA,bloomB,finalRT]) rt.setSize(bufW,bufH);
  volBlurMat.uniforms.uTexel.value.set(1/bufW,1/bufH);
  aoMat.uniforms.uTexel.value.set(1/bufW,1/bufH);
}
addEventListener('resize', resize);
resize();

/* ============================== audio (starts on first click) ============================== */
let audio = null;
function initAudio(){
  if(audio) return;
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0.55;
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp); comp.connect(ctx.destination);
  /* reverb from generated impulse */
  const irLen = ctx.sampleRate*2.6;
  const ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
  for(let ch=0;ch<2;ch++){ const d = ir.getChannelData(ch); for(let i=0;i<irLen;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/irLen, 2.4); }
  const rev = ctx.createConvolver(); rev.buffer = ir;
  const revGain = ctx.createGain(); revGain.gain.value = 0.5;
  rev.connect(revGain); revGain.connect(master);
  /* noise buffer */
  const nLen = ctx.sampleRate*2;
  const nBuf = ctx.createBuffer(1, nLen, ctx.sampleRate);
  const nd = nBuf.getChannelData(0); for(let i=0;i<nLen;i++) nd[i] = Math.random()*2-1;
  function noiseSrc(){ const s = ctx.createBufferSource(); s.buffer = nBuf; s.loop = true; s.start(); return s; }
  /* deep cave drone */
  const droneGain = ctx.createGain(); droneGain.gain.value = 0.10;
  const droneLp = ctx.createBiquadFilter(); droneLp.type='lowpass'; droneLp.frequency.value = 130;
  for(const f of [47.5, 71.3, 95.1]){
    const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = f<60 ? 0.5 : 0.22;
    o.connect(g); g.connect(droneLp); o.start();
  }
  droneLp.connect(droneGain); droneGain.connect(master); droneGain.connect(rev);
  const droneLfo = ctx.createOscillator(); droneLfo.frequency.value = 0.05;
  const droneLfoG = ctx.createGain(); droneLfoG.gain.value = 0.035;
  droneLfo.connect(droneLfoG); droneLfoG.connect(droneGain.gain); droneLfo.start();
  /* soft waterfall */
  const wf = noiseSrc();
  const wfBp = ctx.createBiquadFilter(); wfBp.type='bandpass'; wfBp.frequency.value = 950; wfBp.Q.value = 0.55;
  const wfG = ctx.createGain(); wfG.gain.value = 0.045;
  wf.connect(wfBp); wfBp.connect(wfG); wfG.connect(master); wfG.connect(rev);
  /* distant wind through the hole */
  const wind = noiseSrc();
  const windBp = ctx.createBiquadFilter(); windBp.type='bandpass'; windBp.frequency.value = 420; windBp.Q.value = 2.2;
  const windG = ctx.createGain(); windG.gain.value = 0.028;
  wind.connect(windBp); windBp.connect(windG); windG.connect(rev);
  const windLfo = ctx.createOscillator(); windLfo.frequency.value = 0.07;
  const windLfoG = ctx.createGain(); windLfoG.gain.value = 190;
  windLfo.connect(windLfoG); windLfoG.connect(windBp.frequency); windLfo.start();
  /* reverberant drips */
  function drip(){
    const t0 = ctx.currentTime + 0.02;
    const o = ctx.createOscillator(); o.type='sine';
    const f0 = 750 + Math.random()*700;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f0*0.32, t0+0.13);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.30);
    o.connect(g); g.connect(master); g.connect(rev);
    o.start(t0); o.stop(t0+0.35);
    setTimeout(drip, 900 + Math.random()*2600);
  }
  setTimeout(drip, 600);
  /* torch crackle */
  function crackle(){
    const t0 = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = nBuf;
    s.playbackRate.value = 0.8 + Math.random()*0.8;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2400;
    const g = ctx.createGain();
    const amp = 0.015 + Math.random()*0.05;
    g.gain.setValueAtTime(amp, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.02 + Math.random()*0.05);
    s.connect(hp); hp.connect(g); g.connect(master);
    s.start(t0, Math.random()*1.5, 0.09);
    setTimeout(crackle, 50 + Math.random()*240);
  }
  crackle();
  audio = ctx;
}
addEventListener('pointerdown', () => { initAudio(); if(audio && audio.state === 'suspended') audio.resume(); }, { once:false });

/* ============================== per-frame update ============================== */
const sunDir = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
const clipPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -WATER_Y + 0.03);
const reflTarget = new THREE.Vector3();
const _m4 = new THREE.Matrix4();
let firstFrame = true;

function cloudEnvelope(t){
  const inn = THREE.MathUtils.smoothstep(t, 0.545, 0.57);
  const out = 1 - THREE.MathUtils.smoothstep(t, 0.67, 0.695);
  return 1 - 0.6*inn*out;
}
function update(sec){
  const t = ((sec % LOOP) + LOOP) % LOOP / LOOP;
  const a = t*TAU;
  SH.uT.value = t;
  const cloud = cloudEnvelope(t);
  SH.uCloud.value = cloud;

  /* sun drift on a cosine: the bright pool slides water -> shrine steps -> back */
  sunDir.set(-0.02 + 0.10*Math.cos(a), 1.0, -0.084 + 0.05*Math.sin(a)).normalize();
  SH.uSunDir.value.copy(sunDir);
  sun.position.set(4,0,0).addScaledVector(sunDir, 85);
  sun.intensity = 6.0*cloud;
  SH.uSunColor.value.setRGB(1.0,0.94,0.82).multiplyScalar(6.0*cloud);

  /* beam hit point + warm bounce */
  const k = (24.4 - WATER_Y)/sunDir.y;
  hitPoint.set(HOLE.x - sunDir.x*k, WATER_Y, HOLE.z - sunDir.z*k);
  SH.uBeamHit.value.set(hitPoint.x, hitPoint.z);
  const onIsle = Math.hypot(hitPoint.x-ISLE.x, hitPoint.z-ISLE.z) < 2.9;
  bounce.position.set(hitPoint.x, (onIsle ? 3.2 : WATER_Y) + 0.5, hitPoint.z);
  bounce.intensity = 150*cloud*(0.85 + 0.15*Math.sin(a*3));

  /* torches */
  torches.forEach((T,i) => {
    const f = 1 + 0.22*Math.sin(a*13 + T.seed) + 0.14*Math.sin(a*29 + T.seed*2.3) + 0.09*Math.sin(a*47 + T.seed*4.1);
    torchLights[i].intensity = 20*f;
    flames[i].material.uniforms.uFlick.value = f;
  });
  mushMat.emissiveIntensity = 0.75 + 0.25*Math.sin(a*2);
  crysMat.emissiveIntensity = 0.9 + 0.2*Math.sin(a*3 + 1.7);
  mushLight.intensity = 4.5 + Math.sin(a*2)*1.2;

  updateVines(t);
  updateLeaves(t);
  updateBats(t);

  /* drips -> droplets + ripples */
  const rips = rippleUniform.value;
  for(let i=0;i<8;i++) rips[i].set(0,0,99,0);
  for(let i=0;i<dripSched.length;i++){
    const D = dripSched[i];
    const P = LOOP/D.k;
    const local = ((sec - D.phase) % P + P) % P;
    if(local < D.dur){
      dripPos[i*3] = D.tip.x; dripPos[i*3+1] = D.tip.y - 4.9*local*local; dripPos[i*3+2] = D.tip.z;
    } else { dripPos[i*3+1] = -100; }
    const age = ((sec - D.phase - D.dur) % P + P) % P;
    if(age < 5 && poolE(D.tip.x, D.tip.z) < 0.95 && i < 6) rips[i].set(D.tip.x, D.tip.z, age, 0.5);
  }
  rips[6].set(FALL.x, FALL.z, (t*12 % 1)*2.5, 0.4);
  rips[7].set(POOL.x-3, POOL.z+2, (t*7 % 1)*4.0, 0.22);
  dripGeo.attributes.position.needsUpdate = true;

  /* shadow matrices for custom passes */
  SH.uShadowMatrix.value.copy(sun.shadow.matrix);
  if(sun.shadow.map) SH.uShadowMap.value = sun.shadow.map.texture;

  /* reflection camera (mirror across water plane) */
  reflCam.position.copy(camera.position);
  reflCam.position.y = 2*WATER_Y - camera.position.y;
  reflCam.up.set(0,-1,0);
  reflTarget.copy(CAM_TARGET); reflTarget.y = 2*WATER_Y - CAM_TARGET.y;
  reflCam.lookAt(reflTarget);
  reflCam.updateMatrixWorld();
  waterMat.uniforms.uReflVP.value.multiplyMatrices(reflCam.projectionMatrix, reflCam.matrixWorldInverse);

  invProj.copy(camera.projectionMatrixInverse);
  invView.copy(camera.matrixWorld);
  return t;
}

function renderFrame(sec){
  update(sec);
  renderer.shadowMap.needsUpdate = true;

  /* 1. planar reflection at buffer resolution */
  water.visible = false;
  renderer.clippingPlanes = [clipPlane];
  renderer.setRenderTarget(reflRT);
  renderer.setClearColor(0x070512, 1);
  renderer.clear();
  renderer.render(scene, reflCam);
  renderer.clippingPlanes = [];
  water.visible = true;

  /* 2. main HDR scene */
  renderer.setRenderTarget(sceneRT);
  renderer.clear();
  renderer.render(scene, camera);

  /* 3. volumetric shaft + depth-aware blur */
  run(volMat, volRT);
  run(volBlurMat, vol2RT);

  /* 4. SSAO */
  run(aoMat, aoRT);

  /* 5. composite */
  run(compMat, compRT);

  /* 6. pixelated HDR bloom */
  run(brightMat, bloomA);
  blurMat.uniforms.tSrc.value = bloomA.texture;
  blurMat.uniforms.uDir.value.set(1.6/bufW, 0);
  run(blurMat, bloomB);
  blurMat.uniforms.tSrc.value = bloomB.texture;
  blurMat.uniforms.uDir.value.set(0, 1.6/bufH);
  run(blurMat, bloomA);

  /* 7. tonemap + grade + dither */
  run(toneMat, finalRT);

  /* 8. integer nearest upscale, letterboxed */
  renderer.setRenderTarget(null);
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.setScissor(0, 0, innerWidth, innerHeight);
  renderer.setClearColor(0x05030d, 1);
  renderer.clear();
  renderer.setViewport(offX, offY, bufW*scale, bufH*scale);
  renderer.setScissor(offX, offY, bufW*scale, bufH*scale);
  postQuad.material = upMat;
  renderer.render(postScene, postCam);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);

  if(firstFrame){ firstFrame = false; window.__shrineReady = true; }
  window.__shrineFrames++;
}

/* ============================== main loop ============================== */
const t0 = performance.now();
function tick(){
  const sec = FREEZE !== null ? FREEZE : (performance.now() - t0)/1000;
  renderFrame(sec);
}
renderer.setAnimationLoop(tick);
</script>
