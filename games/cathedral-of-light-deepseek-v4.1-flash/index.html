		varying vec2 vUv;
		void main() {
			vec3 c = texture2D( tInput, vUv ).rgb * 0.2270270270;
			c += texture2D( tInput, vUv + uDirection * 1.3846153846 ).rgb * 0.3162162162;
			c += texture2D( tInput, vUv - uDirection * 1.3846153846 ).rgb * 0.3162162162;
			c += texture2D( tInput, vUv + uDirection * 3.2307692308 ).rgb * 0.0702702703;
			c += texture2D( tInput, vUv - uDirection * 3.2307692308 ).rgb * 0.0702702703;
			gl_FragColor = vec4( c, 1.0 );
		}
	`
});

/* ---------------- final grade & screen-locked dither ---------------- */

const finalUniforms = {
	tInput: { value: null },
	tBloom: { value: null },
	tBayer: { value: bayerTexture },
	uExposure: { value: 1.80 },
	uResolution: { value: new THREE.Vector2(bufferWidth, bufferHeight) }
};

const finalMaterial = new THREE.ShaderMaterial({
	uniforms: finalUniforms,
	depthTest: false,
	depthWrite: false,
	vertexShader: `
		varying vec2 vUv;
		void main() { vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }
	`,
	fragmentShader: `
		uniform sampler2D tInput;
		uniform sampler2D tBloom;
		uniform sampler2D tBayer;
		uniform float uExposure;
		varying vec2 vUv;

		vec3 aces( vec3 x ) {
			return clamp( ( x * ( 2.51 * x + 0.03 ) ) / ( x * ( 2.43 * x + 0.59 ) + 0.14 ), 0.0, 1.0 );
		}

		float linearToSrgb( float x ) {
			return x <= 0.0031308 ? 12.92 * x : 1.055 * pow( x, 1.0 / 2.4 ) - 0.055;
		}

		void main() {
			vec3 color = texture2D( tInput, vUv ).rgb;
			vec3 bloom = texture2D( tBloom, vUv ).rgb;
			color += bloom * 0.78;
			color *= uExposure;

			float luma = dot( color, vec3( 0.2126, 0.7152, 0.0722 ) );
			vec3 cool = color * vec3( 0.86, 0.97, 1.09 );
			vec3 warm = color * vec3( 1.08, 1.005, 0.88 );
			color = mix( cool, warm, smoothstep( 0.10, 0.64, luma ) );
			float satLuma = dot( color, vec3( 0.2126, 0.7152, 0.0722 ) );
			color = mix( vec3( satLuma ), color, 1.30 );

			vec2 vq = ( vUv - 0.5 ) * vec2( 1.12, 1.0 );
			float vignette = 1.0 - 0.20 * smoothstep( 0.24, 0.92, length( vq ) );
			color *= vignette;

			color = aces( max( color, vec3( 0.0 ) ) );
			color = pow( color, vec3( 1.0 / 2.2 ) );
			color = max( color, vec3( 0.027 ) );
			color = min( color, vec3( 1.0 ) );

			float bayer = texture2D( tBayer, gl_FragCoord.xy / 4.0 ).r;
			color = floor( color * 47.0 + bayer ) / 47.0;
			gl_FragColor = vec4( color, 1.0 );
		}
	`
});

/* ---------------- nearest integer upscale, dark letterbox ---------------- */

const upscaleUniforms = {
	tInput: { value: null },
	uWindow: { value: new THREE.Vector2(1, 1) },
	uOffset: { value: new THREE.Vector2(0, 0) },
	uSize: { value: new THREE.Vector2(1, 1) }
};

const upscaleMaterial = new THREE.ShaderMaterial({
	uniforms: upscaleUniforms,
	depthTest: false,
	depthWrite: false,
	vertexShader: `
		varying vec2 vUv;
		void main() { vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }
	`,
	fragmentShader: `
		uniform sampler2D tInput;
		uniform vec2 uWindow;
		uniform vec2 uOffset;
		uniform vec2 uSize;
		varying vec2 vUv;
		void main() {
			vec2 px = gl_FragCoord.xy - uOffset;
			vec3 bar = vec3( 7.0, 18.0, 16.0 ) / 255.0;
			vec3 col = bar;
			if ( px.x >= 0.0 && px.y >= 0.0 && px.x < uSize.x && px.y < uSize.y ) {
				vec2 uv = ( px + 0.5 ) / uSize;
				col = texture2D( tInput, uv ).rgb;
			}
			gl_FragColor = vec4( col, 1.0 );
		}
	`
});


/* debug view of a single HDR target, used by automated checks */
const debugViewUniforms = { tInput: { value: null }, uScale: { value: 4.0 } };
const debugViewMaterial = new THREE.ShaderMaterial({
	uniforms: debugViewUniforms,
	depthTest: false,
	depthWrite: false,
	vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`,
	fragmentShader: `
		uniform sampler2D tInput;
		uniform float uScale;
		varying vec2 vUv;
		vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
		void main(){
			vec3 c = texture2D(tInput, vUv).rgb * uScale;
			c = pow(aces(max(c,0.0)), vec3(1.0/2.2));
			gl_FragColor = vec4(c,1.0);
		}
	`
});
function showTarget(texture, scale = 1.0) {
	debugViewUniforms.tInput.value = texture;
	debugViewUniforms.uScale.value = scale;
	renderer.setRenderTarget(null);
	renderer.setClearColor(0x000000, 1);
	renderer.setViewport(0, 0, windowWidth, windowHeight);
	renderer.clear();
	passQuad.material = debugViewMaterial;
	renderer.render(passScene, passCamera);
}

function bindTargets() {
	volumeUniforms.tScene.value = sceneTarget.texture;
	volumeUniforms.tDepth.value = sceneTarget.depthTexture;
	volumeBlurUniforms.tVolume.value = volumeTarget.texture;
	volumeBlurUniforms.tDepth.value = sceneTarget.depthTexture;
	litUniforms.tScene.value = sceneTarget.texture;
	litUniforms.tVolume.value = volumeBlurTarget.texture;
	litUniforms.tAO.value = aoTarget.texture;
	bloomThresholdUniforms.tInput.value = litTarget.texture;
	bloomBlurUniforms.tInput.value = bloomTargetA.texture;
	finalUniforms.tInput.value = litTarget.texture;
	finalUniforms.tBloom.value = bloomTargetB.texture;
	upscaleUniforms.tInput.value = ldrTarget.texture;
	aoUniforms.tDepth.value = sceneTarget.depthTexture;
}

function resizeRenderer() {
	windowWidth = Math.max(1, window.innerWidth);
	windowHeight = Math.max(1, window.innerHeight);
	renderer.setPixelRatio(1);
	renderer.setSize(windowWidth, windowHeight, false);

	camera.aspect = windowWidth / windowHeight;
	camera.updateProjectionMatrix();
	camera.updateMatrixWorld();
	camera.matrixWorldInverse.copy(camera.matrixWorld).invert();

	bufferHeight = 270;
	bufferWidth = Math.max(96, Math.round(BUFFER_HEIGHT * windowWidth / windowHeight));
	if (bufferWidth % 2 === 1) bufferWidth += 1;

	upscaleFactor = Math.max(1, Math.floor(Math.min(windowWidth / bufferWidth, windowHeight / bufferHeight)));
	const scaledW = bufferWidth * upscaleFactor;
	const scaledH = bufferHeight * upscaleFactor;
	upscaleUniforms.uWindow.value.set(windowWidth, windowHeight);
	upscaleUniforms.uOffset.value.set(
		Math.floor((windowWidth - scaledW) * 0.5),
		Math.floor((windowHeight - scaledH) * 0.5)
	);
	upscaleUniforms.uSize.value.set(scaledW, scaledH);

	const old = [sceneTarget, prevSceneTarget, volumeTarget, volumeBlurTarget, aoTarget, litTarget, bloomTargetA, bloomTargetB, ldrTarget];
	for (const t of old) disposeTarget(t);

	sceneTarget = makeTarget(bufferWidth, bufferHeight, { hdr: true, depth: true });
	prevSceneTarget = makeTarget(bufferWidth, bufferHeight, { hdr: true, depth: true });
	volumeTarget = makeTarget(bufferWidth, bufferHeight, { hdr: true });
	volumeBlurTarget = makeTarget(bufferWidth, bufferHeight, { hdr: true });
	aoTarget = makeTarget(bufferWidth, bufferHeight, { hdr: false });
	litTarget = makeTarget(bufferWidth, bufferHeight, { hdr: true });
	bloomTargetA = makeTarget(bufferWidth, bufferHeight, { hdr: true });
	bloomTargetB = makeTarget(bufferWidth, bufferHeight, { hdr: true });
	ldrTarget = makeTarget(bufferWidth, bufferHeight, { hdr: false });

	bindTargets();

	volumeUniforms.uResolution.value.set(bufferWidth, bufferHeight);
	aoUniforms.uResolution.value.set(bufferWidth, bufferHeight);
	volumeBlurUniforms.uTexel.value.set(1 / bufferWidth, 1 / bufferHeight);
	finalUniforms.uResolution.value.set(bufferWidth, bufferHeight);
	bloomBlurUniforms.uDirection.value.set(1 / bufferWidth, 0);

	aoUniforms.uInvProjection.value.copy(camera.projectionMatrixInverse);
	aoUniforms.uProjection.value.copy(camera.projectionMatrix);

	const viewProjection = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
	const invViewProjection = new THREE.Matrix4().copy(viewProjection).invert();
	volumeUniforms.uInvViewProjection.value.copy(invViewProjection);
	volumeUniforms.uCameraWorld.value.copy(camera.matrixWorld);
	volumeUniforms.uCameraPosition.value.copy(camera.position);

	waterUniforms.invProjection.value.copy(camera.projectionMatrixInverse);
	waterUniforms.projection.value.copy(camera.projectionMatrix);
	waterUniforms.cameraWorld.value.copy(camera.matrixWorld);
	waterUniforms.resolution.value.set(bufferWidth, bufferHeight);
	waterUniforms.cameraNear.value = camera.near;
	waterUniforms.cameraFar.value = camera.far;
	waterUniforms.viewProjection.value.copy(viewProjection);
	waterUniforms.viewMatrix.value.copy(camera.matrixWorldInverse);

	skyUniforms.uInvProjection.value.copy(camera.projectionMatrixInverse);
	skyUniforms.uCameraWorld.value.copy(camera.matrixWorld);

	renderer.setRenderTarget(prevSceneTarget);
	renderer.clear();
	renderer.setRenderTarget(sceneTarget);
	renderer.clear();
	renderer.setRenderTarget(null);
}

const shadowMatrix = new THREE.Matrix4();
const shadowBiasMatrix = new THREE.Matrix4().set(
	0.5, 0.0, 0.0, 0.5,
	0.0, 0.5, 0.0, 0.5,
	0.0, 0.0, 0.5, 0.5,
	0.0, 0.0, 0.0, 1.0
);
function updateShadowUniforms() {
	sunLight.shadow.camera.updateMatrixWorld();
	shadowMatrix.copy( shadowBiasMatrix )
		.multiply( sunLight.shadow.camera.projectionMatrix )
		.multiply( sunLight.shadow.camera.matrixWorldInverse );
	const m = shadowMatrix;
	const shadowTexture = sunLight.shadow.map ? sunLight.shadow.map.texture : shadowDepthTexture;
	volumeUniforms.tShadow.value = shadowTexture;
	volumeUniforms.uShadowMatrix.value.copy(m);
	dustMaterial.uniforms.uShadowMatrix.value.copy(m);
	dustMaterial.uniforms.uShadowDepth.value = shadowTexture;
	fallingMat.uniforms.uShadowMatrix.value.copy(m);
	fallingMat.uniforms.uShadowDepth.value = shadowTexture;
}

let frameIndex = 0;
let lastSceneInfo = null;

function renderFrame(phase) {
	updateShadowUniforms();

	/* water reads the previous buffer rather than the one being written */
	waterUniforms.tColor.value = prevSceneTarget.texture;
	waterUniforms.tDepth.value = prevSceneTarget.depthTexture;
	waterUniforms.tReflect.value = prevSceneTarget.texture;
	waterUniforms.tReflectDepth.value = prevSceneTarget.depthTexture;

	renderer.shadowMap.needsUpdate = true;
	renderer.setRenderTarget(sceneTarget);
	renderer.clear();
	renderer.render(scene, camera);
	lastSceneInfo = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, target: renderer.getRenderTarget() === sceneTarget, frame: frameIndex };

	if (!window.__skipAO) renderPass(aoMaterial, aoTarget);
	if (!window.__skipVolume) {
		renderPass(volumeMaterial, volumeTarget);
		renderPass(volumeBlurMaterial, volumeBlurTarget);
	}
	renderPass(litMaterial, litTarget);
	renderPass(bloomThresholdMaterial, bloomTargetA);
	bloomBlurUniforms.uDirection.value.set(1 / bufferWidth, 0);
	renderPass(bloomBlurMaterial, bloomTargetB);
	bloomBlurUniforms.tInput.value = bloomTargetB.texture;
	bloomBlurUniforms.uDirection.value.set(0, 1 / bufferHeight);
	renderPass(bloomBlurMaterial, bloomTargetA);
	bloomBlurUniforms.tInput.value = bloomTargetA.texture;
	bloomBlurUniforms.uDirection.value.set(1 / bufferWidth, 0);

	finalUniforms.tBloom.value = bloomTargetA.texture;
	renderPass(finalMaterial, ldrTarget);
	renderPass(upscaleMaterial, null);

	renderer.setRenderTarget(null);

	const swap = prevSceneTarget;
	prevSceneTarget = sceneTarget;
	sceneTarget = swap;
	waterUniforms.tColor.value = prevSceneTarget.texture;
	waterUniforms.tDepth.value = prevSceneTarget.depthTexture;
	waterUniforms.tReflect.value = prevSceneTarget.texture;
	waterUniforms.tReflectDepth.value = prevSceneTarget.depthTexture;
	bindTargets();
	frameIndex += 1;
}
/* ------------------------------------------------------------------
   Loop, resize, and the synthesized forest soundscape.
------------------------------------------------------------------- */

renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;

let audio = null;

function makeNoiseBuffer(ctx, seconds, brown) {
	const length = Math.floor(ctx.sampleRate * seconds);
	const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
	const data = buffer.getChannelData(0);
	let last = 0;
	for (let i = 0; i < length; i++) {
		const white = Math.random() * 2 - 1;
		if (brown) {
			last = (last + 0.018 * white) / 1.018;
			data[i] = last * 4.2;
		} else {
			data[i] = white;
		}
	}
	return buffer;
}

function birdCall(ctx, destination, when) {
	const notes = 2 + Math.floor(Math.random() * 3);
	const base = 1700 + Math.random() * 1600;
	for (let n = 0; n < notes; n++) {
		const start = when + n * (0.11 + Math.random() * 0.06);
		const osc = ctx.createOscillator();
		const gain = ctx.createGain();
		osc.type = 'sine';
		osc.frequency.setValueAtTime(base * (0.9 + Math.random() * 0.25), start);
		osc.frequency.exponentialRampToValueAtTime(base * (1.1 + Math.random() * 0.4), start + 0.07);
		osc.frequency.exponentialRampToValueAtTime(base * (0.82 + Math.random() * 0.15), start + 0.13);
		gain.gain.setValueAtTime(0.0001, start);
		gain.gain.exponentialRampToValueAtTime(0.06, start + 0.012);
		gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.15);
		osc.connect(gain);
		gain.connect(destination);
		osc.start(start);
		osc.stop(start + 0.18);
	}
}

function initAudio() {
	document.removeEventListener('pointerdown', initAudio, true);
	if (audio) return;
	try {
		const AC = window.AudioContext || window.webkitAudioContext;
		if (!AC) return;
		const ctx = new AC();
		const compressor = ctx.createDynamicsCompressor();
		compressor.threshold.value = -20;
		compressor.knee.value = 18;
		compressor.ratio.value = 3;
		compressor.attack.value = 0.08;
		compressor.release.value = 0.35;

		const master = ctx.createGain();
		master.gain.setValueAtTime(0.0001, ctx.currentTime);
		master.gain.exponentialRampToValueAtTime(0.72, ctx.currentTime + 2.4);
		compressor.connect(master);
		master.connect(ctx.destination);

		const windSource = ctx.createBufferSource();
		windSource.buffer = makeNoiseBuffer(ctx, 7.0, true);
		windSource.loop = true;
		const windFilter = ctx.createBiquadFilter();
		windFilter.type = 'lowpass';
		windFilter.frequency.value = 420;
		windFilter.Q.value = 0.38;
		const windGain = ctx.createGain();
		windGain.gain.value = 0.034;
		windSource.connect(windFilter);
		windFilter.connect(windGain);
		windGain.connect(compressor);
		windSource.start();

		const airSource = ctx.createBufferSource();
		airSource.buffer = makeNoiseBuffer(ctx, 5.0, false);
		airSource.loop = true;
		const airFilter = ctx.createBiquadFilter();
		airFilter.type = 'bandpass';
		airFilter.frequency.value = 1250;
		airFilter.Q.value = 0.55;
		const airGain = ctx.createGain();
		airGain.gain.value = 0.0085;
		airSource.connect(airFilter);
		airFilter.connect(airGain);
		airGain.connect(compressor);
		airSource.start();

		const streamSource = ctx.createBufferSource();
		streamSource.buffer = makeNoiseBuffer(ctx, 6.0, false);
		streamSource.loop = true;
		const streamHigh = ctx.createBiquadFilter();
		streamHigh.type = 'highpass';
		streamHigh.frequency.value = 420;
		const streamBand = ctx.createBiquadFilter();
		streamBand.type = 'bandpass';
		streamBand.frequency.value = 1750;
		streamBand.Q.value = 0.7;
		const streamGain = ctx.createGain();
		streamGain.gain.value = 0.020;
		const streamPan = ctx.createStereoPanner();
		streamPan.pan.value = -0.18;
		streamSource.connect(streamHigh);
		streamHigh.connect(streamBand);
		streamBand.connect(streamGain);
		streamGain.connect(streamPan);
		streamPan.connect(compressor);
		streamSource.start();

		// a low, filtered bed under the wind
		const drone = ctx.createOscillator();
		const droneGain = ctx.createGain();
		drone.type = 'sine';
		drone.frequency.value = 54;
		droneGain.gain.value = 0.0032;
		drone.connect(droneGain);
		droneGain.connect(compressor);
		drone.start();

		const birdBus = ctx.createGain();
		birdBus.gain.value = 0.8;
		birdBus.connect(compressor);

		audio = {
			ctx,
			master,
			windGain,
			windFilter,
			airGain,
			streamGain,
			birdBus,
			lastGust: -1
		};

		if (ctx.state === 'suspended') ctx.resume().catch(() => {});
		const schedule = () => {
			const delay = 5200 + Math.random() * 11500;
			setTimeout(() => {
				if (!audio) return;
				if (audio.ctx.state === 'running') birdCall(audio.ctx, audio.birdBus, audio.ctx.currentTime + 0.06);
				schedule();
			}, delay);
		};
		schedule();
		setTimeout(() => {
			if (audio && audio.ctx.state === 'running') birdCall(audio.ctx, audio.birdBus, audio.ctx.currentTime + 0.1);
		}, 2300);
	} catch (err) {
		audio = null;
	}
}

document.addEventListener('pointerdown', initAudio, true);

function updateAudio(gust) {
	if (!audio) return;
	const target = 0.012 + gust * 0.060;
	if (Math.abs(target - audio.lastGust) > 0.0025) {
		const now = audio.ctx.currentTime;
		audio.windGain.gain.setTargetAtTime(target, now, 0.32);
		audio.windFilter.frequency.setTargetAtTime(300 + gust * 420, now, 0.45);
		audio.streamGain.gain.setTargetAtTime(0.014 + gust * 0.010, now, 0.5);
		audio.lastGust = target;
	}
}

/* ------------------------------------------------------------------ */

const startTime = performance.now();
let paused = false;

function animate(now) {
	requestAnimationFrame(animate);
	if (paused) return;

	const elapsed = (now - startTime) * 0.001;
	const phase = (elapsed % LOOP_SECONDS) / LOOP_SECONDS;

	updateAtmosphere(phase);
	updateDeer(phase);
	updateButterflies(phase);
	updateBird(phase);
	updateFalling(phase);
	volumeUniforms.uPhase.value = phase;
	updateAudio(sharedUniforms.uGust.value);
	renderFrame(phase);
}

resizeRenderer();
updateAtmosphere(0);
updateDeer(0);
updateButterflies(0);
updateBird(0);
updateFalling(0);
volumeUniforms.uPhase.value = 0;

window.addEventListener('resize', () => {
	resizeRenderer();
});

requestAnimationFrame(animate);

/* Small, non-visual window handle used by the automated render checks. */
window.__cathedral = {
	THREE,
	renderer,
	scene,
	camera,
	palette,
	sharedUniforms,
	setPaused(v) { paused = !!v; },
	renderer,
	renderSceneTo(target) {
		const t = target || sceneTarget;
		renderer.setRenderTarget(t);
		renderer.setClearColor(0x071210, 1);
		renderer.clear();
		renderer.render(scene, camera);
	},
	get renderFrameRef() { return renderFrame; },
	renderDirect() {
		renderer.setRenderTarget(null);
		renderer.setClearColor(0x102030, 1);
		renderer.clear();
		renderer.render(scene, camera);
	},
	volumeUniforms,
	waterUniforms,
	litUniforms,
	finalUniforms,
	bloomThresholdUniforms,
	sunLight,
	hemisphereLight,
	blockLists,
	blockMaterials,
	worldRoot,
	scene,
	camera,
	textures,
	get currentSceneTarget() { return sceneTarget; },
	get currentPreviousTarget() { return prevSceneTarget; },
	litTarget,
	get currentVolumeTarget() { return volumeTarget; },
	get currentVolumeBlurTarget() { return volumeBlurTarget; },
	get audioReady() { return !!audio && audio.ctx.state === 'running'; },
	get currentAOTarget() { return aoTarget; },
	ldrTarget,
	showTarget,
	readPixel(target, x, y) {
		const px = new Uint8Array(4);
		renderer.readRenderTargetPixels(target, x, y, 1, 1, px);
		return Array.from(px);
	},
	get lastSceneInfo() { return lastSceneInfo; },
	get frame() { return frameIndex; },
	get info() {
		return {
			buffer: [bufferWidth, bufferHeight],
			calls: renderer.info.render.calls,
			triangles: renderer.info.render.triangles,
			points: renderer.info.render.points
		};
	}
};
	</script>
