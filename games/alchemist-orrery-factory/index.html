function drawObj(o,p,view,proj,lv,eye,coreColor,accentColor,t){gl.uniformMatrix4fv(p===sceneP?su.model:du.model,false,o.model);gl.uniformMatrix4fv(p===sceneP?su.lightVP:du.lightVP,false,lv);if(p===sceneP){gl.uniformMatrix4fv(su.view,false,view);gl.uniformMatrix4fv(su.proj,false,proj);gl.uniformMatrix3fv(su.normal,false,normalMat(o.model));gl.uniform3fv(su.eye,eye);gl.uniform3fv(su.core,[0,.03,0]);gl.uniform3fv(su.coreColor,coreColor);gl.uniform3fv(su.accent,lightPos);gl.uniform3fv(su.accentColor,accentColor);gl.uniform3fv(su.mat,o.color);gl.uniform1f(su.metal,o.metal);gl.uniform1f(su.rough,o.rough);gl.uniform1f(su.emit,o.emit);gl.uniform1f(su.glass,o.glass);gl.uniform1f(su.time,t);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,shadowTex);gl.uniform1i(su.shadow,0)}gl.bindVertexArray(o.mesh.vao);gl.drawElements(gl.TRIANGLES,o.mesh.count,gl.UNSIGNED_INT,0)}
function frame(now){objects.length=fixedObjectCount;resize();let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused)elapsed+=dt;let t=elapsed,auto=now>manualUntil?1:0;if(!paused&&auto&&drag!=='camera')yaw+=dt*(Math.PI*2/40);let cam=[dist*Math.sin(yaw)*Math.cos(pitch),.05+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch)],view=look(cam,[0,-.19,0]),proj=persp(Math.PI/4,canvas.width/canvas.height,.1,30),lightVP=mul(persp(Math.PI*.62,1,.08,8),look([0,.06,0],[0,-.55,0],[0,0,1]));
// Animate orbital armature without mutating the engraved static base.
const dynamic=[];for(const pl of planets){let a=pl.a+t*(.35+pl.r*.17),b=[Math.cos(a)*pl.r,Math.sin(a*.61)*.09,Math.sin(a)*pl.r],w=transform(mul(inner,rotY(t*.22)),b);let radial=norm(w);let start=radial.map(q=>q*.25);dynamic.push({rod:[start,w],pos:w,pl})}
gl.bindFramebuffer(gl.FRAMEBUFFER,shadowF);gl.viewport(0,0,SH,SH);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.useProgram(depthP);for(const o of objects)if(o.cast)drawObj(o,depthP,null,null,lightVP,null,null,null,t);
gl.bindFramebuffer(gl.FRAMEBUFFER,sceneF);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.018,.021,.029,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(sceneP);gl.uniform3fv(su.core,[0,.03,0]);let pre=presets[mode];gl.uniform3fv(su.coreColor,pre.c);gl.uniform3fv(su.accentColor,pre.a);
for(const o of objects)drawObj(o,sceneP,view,proj,lightVP,cam,pre.c,pre.a,t);
// Animated planetary arms and jewel worlds.
const dynamicStart=objects.length;
for(const x of dynamic){rod(x.rod[0],x.rod[1],.006,PALEGOLD);let p=x.pl;sph(x.pos,p.size,p.color,p.glass?.16:.7,p.glass?.08:.22,0,p.glass);sph(x.pos.map(q=>q*1.075),p.size*.16,[1,.91,.68],.25,.12,1.2)}
// Bright suspended star, nested flare rings, and ember motes.
sph([0,.03,0],.14,pre.core,.12,.12,2.7);for(let i=0;i<3;i++){let rr=.19+i*.025;ring(rr,.004,mul(rotY(t*(i%2?-.35:.42)),rotX(i*.71)),pre.core,.3)}
const emberData=[];for(let i=0;i<34;i++){let a=i*2.399+t*(.09+(i%5)*.014),r=.83+(i%7)*.035,y=-.03+Math.sin(a*2+t*.6)*(.07+(i%3)*.025);emberData.push({pos:[Math.cos(a)*r,y,Math.sin(a)*r],color:pre.core.map(c=>c*.55),size:8+(i%4)*1.5})}
// A small indicator is intentionally visible only while adjusting the accent.
if(lightMode||drag==='light'){sph(lightPos,.025,[.62,.84,1],.12,.18,2);rod(lightPos,[lightPos[0],lightPos[1]-.12,lightPos[2]],.003,[.35,.46,.62],.2)}
for(let i=dynamicStart;i<objects.length;i++)drawObj(objects[i],sceneP,view,proj,lightVP,cam,pre.c,pre.a,t);
const viewProj=mul(proj,view),pointValues=new Float32Array(emberData.length*7);for(let i=0;i<emberData.length;i++){let q=i*7;pointValues.set(emberData[i].pos,q);pointValues.set(emberData[i].color,q+3);pointValues[q+6]=emberData[i].size}if(!window.emberBuffer){window.emberVao=gl.createVertexArray();window.emberBuffer=gl.createBuffer();gl.bindVertexArray(window.emberVao);gl.bindBuffer(gl.ARRAY_BUFFER,window.emberBuffer);gl.bufferData(gl.ARRAY_BUFFER,pointValues.byteLength,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,28,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,28,12);gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,28,24)}gl.bindBuffer(gl.ARRAY_BUFFER,window.emberBuffer);gl.bufferSubData(gl.ARRAY_BUFFER,0,pointValues);gl.useProgram(pointP);gl.uniformMatrix4fv(U(pointP,'viewProj'),false,viewProj);gl.bindVertexArray(window.emberVao);gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);gl.drawArrays(gl.POINTS,0,emberData.length);gl.depthMask(true);gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.disable(gl.DEPTH_TEST);gl.useProgram(postP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,colorTex);gl.uniform1i(U(postP,'src'),0);gl.uniform2f(U(postP,'px'),1/canvas.width,1/canvas.height);gl.bindVertexArray(quad);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame)}
gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearDepth(1);requestAnimationFrame(frame);
})();
