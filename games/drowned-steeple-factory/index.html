<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DROWNED STEEPLE</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#060912;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}
  #hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;pointer-events:none;color:rgba(196,210,232,.46);
    font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;animation:hf 6s ease forwards}
  #lightui{position:fixed;left:50%;top:22px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;pointer-events:none;
    background:rgba(6,9,18,.66);border:1px solid rgba(176,198,228,.18);color:rgba(222,232,248,.8);
    font:10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;opacity:0;transition:opacity .35s ease}
  @keyframes hf{0%,66%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">DRAG ORBIT · SCROLL ZOOM · 1/2/3 STORM · RIGHT DRAG / L LIGHT · SPACE PAUSE · R RESET</div>
<div id="lightui">LIGHT</div>
<script>
'use strict';
// ---------- GL setup ----------
const cv=document.getElementById('c'),gl=cv.getContext('webgl2',{antialias:false,alpha:false});
const hint=document.getElementById('hint'),lightui=document.getElementById('lightui');
if(!gl){hint.textContent='WEBGL2 UNAVAILABLE';hint.style.animation='none';throw new Error('WebGL2 unavailable')}
function compile(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  return p;
}
// fullscreen triangle-strip quad, attribute 0 = clip-space xy
const quad=gl.createVertexArray();gl.bindVertexArray(quad);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
function resize(){
  const d=Math.min(devicePixelRatio||1,2),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
}
addEventListener('resize',resize);resize();

// ---------- state ----------
const TAU=Math.PI*2,ORBIT=TAU/40,clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=(a,b,dt,k)=>a+(b-a)*(1-Math.exp(-dt/k));
// storm presets: 1 calm mist, 2 steady rain, 3 heavy squall
const PRESETS=[{storm:0,rain:.08,mist:.85,wind:.25,flash:0},
               {storm:.45,rain:.6,mist:.45,wind:.6,flash:.1},
               {storm:1,rain:1,mist:.7,wind:1,flash:.55}];
const TGT=2.6;                                                            // orbit centre (0,TGT,0): the belfry, so the whole steeple fits at HOME
const HOME={yaw:.6,pitch:.14,dist:10,lyaw:2,lpitch:.55,preset:0};          // lamp 80 deg left of the HOME view: key on the left face, right face in shadow
const S={yaw:HOME.yaw,pitch:HOME.pitch,dist:HOME.dist,tyaw:HOME.yaw,tpitch:HOME.pitch,tdist:HOME.dist,auto:1,
         lyaw:HOME.lyaw,lpitch:HOME.lpitch,tlyaw:HOME.lyaw,tlpitch:HOME.lpitch,preset:HOME.preset,paused:false,t:0};
const M={...PRESETS[S.preset]};      // eased preset values actually fed to the shaders
const K={};                           // held keys
let drag=0,px=0,py=0,lightTimer=0;    // drag: 0 none, 1 orbit, 2 light
const lightDir=()=>{const cp=Math.cos(S.lpitch);return[cp*Math.cos(S.lyaw),Math.sin(S.lpitch),cp*Math.sin(S.lyaw)]};
function lightUI(){
  const deg=a=>Math.round(((a%TAU)+TAU)%TAU*180/Math.PI);
  lightui.textContent='LIGHT '+deg(S.tlyaw)+'\u00b0 / '+Math.round(S.tlpitch*180/Math.PI)+'\u00b0';
  lightui.style.opacity=1;clearTimeout(lightTimer);lightTimer=setTimeout(()=>lightui.style.opacity=0,900);
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  drag=(e.button===2||e.shiftKey)?2:1;px=e.clientX;py=e.clientY;
  cv.setPointerCapture(e.pointerId);cv.classList.add('drag');
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(drag===1){S.tyaw-=dx*.005;S.tpitch=clamp(S.tpitch+dy*.004,-.04,1.25)}
  else{S.tlyaw-=dx*.006;S.tlpitch=clamp(S.tlpitch+dy*.006,.06,1.4);lightUI()}
});
const endDrag=()=>{drag=0;cv.classList.remove('drag')};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{
  e.preventDefault();S.tdist=clamp(S.tdist*Math.exp(e.deltaY*.0012),3.5,22);
},{passive:false});
addEventListener('keydown',e=>{
  const k=e.code;K[k]=true;if(e.repeat)return;
  if(k==='Digit1'||k==='Digit2'||k==='Digit3')S.preset=+k.slice(-1)-1;
  else if(k==='Space'){S.paused=!S.paused;e.preventDefault()}
  else if(k==='KeyR')Object.assign(S,{tyaw:HOME.yaw,tpitch:HOME.pitch,tdist:HOME.dist,tlyaw:HOME.lyaw,tlpitch:HOME.lpitch,preset:HOME.preset});
});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;endDrag()});

// ---------- per-frame state update: call update(dt) from the render loop ----------
function update(dt){
  dt=clamp(dt,0,.05);
  // auto-orbit fades out while dragging/paused and eases back in on release/resume
  S.auto=ease(S.auto,(drag===1||S.paused)?0:1,dt,drag===1 ? .04 : 1.6);
  if(!S.paused)S.t+=dt;                                     // scene time freezes on pause
  if(drag!==1&&!S.paused)S.tyaw+=ORBIT*S.auto*dt;           // one full turn per 40 s
  if(Math.abs(S.tyaw)>TAU){const w=Math.sign(S.tyaw)*TAU;S.tyaw-=w;S.yaw-=w}
  S.yaw=ease(S.yaw,S.tyaw,dt,.1);S.pitch=ease(S.pitch,S.tpitch,dt,.1);S.dist=ease(S.dist,S.tdist,dt,.14);
  if(K.KeyL){S.tlyaw+=.9*dt;lightUI()}                      // L held: sweep lantern azimuth
  S.lyaw=ease(S.lyaw,S.tlyaw,dt,.12);S.lpitch=ease(S.lpitch,S.tlpitch,dt,.12);
  const P=PRESETS[S.preset];for(const k in M)M[k]=ease(M[k],P[k],dt,1.1);   // blend storm preset
}

// ---------- shaders (WebGL2 / GLSL ES 3.00): one full-screen quad, whole scene raymarched ----------
const VS_QUAD = `#version 300 es
layout(location=0) in vec2 p; out vec2 vUv; void main(){ vUv=p*.5+.5; gl_Position=vec4(p,0,1); }`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv; uniform vec2 uRes; uniform float uTime, uStorm, uRain, uMist, uWind, uFlash; uniform vec3 uEye, uFwd, uRight, uUp, uLampDir; layout(location=0) out vec4 fragColor; layout(location=1) out vec4 fragDepth;   // fragDepth: view depth along uFwd / 48, read back by the sprite pass

// ---- hashing & smooth value noise ----
float hash21(vec2 p){
  p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y);
}
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i),           b=hash21(i+vec2(1,0)),
        c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=.5; }
  return v;
}

// ---- sky: #0a1224 zenith, misty horizon, drifting moonlit clouds, soft moon halo, lightning tint ----
vec3 sky(vec3 rd, float t){
  float h=max(rd.y,0.);
  vec3 col=mix(vec3(.14,.18,.25),vec3(.039,.071,.141),pow(h,.45));     // misty horizon -> deep navy zenith
  vec3 moonDir=normalize(vec3(-.35,.42,-.83));                          // low moon, often behind the tower
  float md=max(dot(rd,moonDir),0.);
  float mv=1.-uStorm*.75;                                               // the storm veils the moon
  col+=vec3(.55,.62,.80)*pow(md,12.)*.35*mv;                            // wide soft halo
  col+=vec3(.92,.95,1.)*pow(md,900.)*2.5*mv;                            // moon core
  vec2 cp=rd.xz/max(rd.y,.07);                                          // clouds projected on a slab
  float cl=fbm(cp*1.1+vec2(t*.01*(1.+uWind*3.),t*.004));                // drifting with the wind
  cl=smoothstep(.32,.9,cl);
  vec3 cc=mix(vec3(.05,.065,.11),vec3(.40,.46,.58),pow(md,3.)*.9*mv+.12);   // moonlit rims
  col=mix(col,cc,cl*smoothstep(0.,.3,rd.y)*.8);
  col+=vec3(.6,.68,1.)*uFlash*(.2+.8*cl)*smoothstep(-.05,.15,rd.y);     // lightning tints the cloud deck
  return col;
}

// ---- water: analytic sum of directional sine waves. Derivatives are exact, so there is NO ----
// ---- grid/tile noise that could alias at grazing (low horizon) angles. far in [0,1] = distance blend ----
vec3 waveNormal(vec2 p, float t, float far){
  vec2 g=vec2(0.);                                                      // slope dh/dx, dh/dz
  for(int i=0;i<7;i++){
    float fi=float(i);
    float an=fi*2.399+.7;                                               // golden-angle spread of directions
    vec2 d=vec2(cos(an),sin(an));
    float k=.35*pow(1.55,fi);                                           // wavenumber: 18 m swell down to <1 m chop
    float amp=.3*pow(.72,fi)*(1.+uStorm*.9)/(1.+far*fi*fi*.7);          // short chop fades with distance
    float w=sqrt(9.81*k)*(1.+uWind*.25);                                // deep-water dispersion
    g+=d*(amp*k*cos(dot(p,d)*k-w*t+fi*1.7));
  }
  // fine chop (0.8 m / 0.5 m facets) only near the camera: it shatters the moon path into glitter instead of one smooth blob,
  // and fades out long before the facets could reach pixel size at grazing angles
  float fc=1./(1.+far*9.);
  for(int i=7;i<9;i++){
    float fi=float(i), an=fi*2.399+.7; vec2 d=vec2(cos(an),sin(an));
    float k=.35*pow(1.55,fi), amp=.3*pow(.72,fi)*(1.+uStorm*.9)*fc, w=sqrt(9.81*k)*(1.+uWind*.25);
    g+=d*(amp*k*cos(dot(p,d)*k-w*t+fi*1.7));
  }
  g*=mix(1.,.35,far);                                                   // calmer far field
  return normalize(vec3(-g.x,1.,-g.y));
}

// expanding concentric raindrop rings: smoothstep ring * exp(-d*d*k) envelope; returns a slope
vec2 ripples(vec2 p, float t){
  vec2 g=vec2(0.);
  for(int L=0;L<3;L++){
    float fl=float(L);
    vec2 q=p*(1.3+fl*.7)+fl*vec2(13.7,5.3);
    vec2 id=floor(q), f=fract(q)-.5;
    for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
      vec2 o=vec2(float(x),float(y)), cid=id+o;
      float h=hash21(cid), h2=hash21(cid+19.19);
      vec2 dv=f-(o+vec2(h,h2)-.5); float d=length(dv)+1e-4;             // vector to the drop centre
      float lt=mod(t+h*9.,1.2+h2*1.8);                                  // time since the last drop here
      float ring=1.-smoothstep(0.,.09,abs(d-lt*1.5));                   // thin expanding ring
      g+=(dv/d)*ring*exp(-d*d*6.)*exp(-lt*2.2)*smoothstep(0.,.05,lt);
    }
  }
  return g;
}
// ---- exact box SDF ----
float sdBox(vec3 p, vec3 b){
  vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);
}

// ---- lantern centre: slow pendulum swing inside the open belfry, pivot on the ceiling at y=3.35 ----
vec3 lanternPos(float t){
  float s=sin(t*.9);                                                        // +-0.1 sway along x (cage edge stays 8 cm clear of the posts)
  return vec3(s*.1,2.72+.003*s*s,sin(t*.53+1.7)*.012);                      // lifts slightly at the extremes
}

// ---- drowned steeple. returns vec2(distance, matId): 1 stone, 2 wet moss, 3 slate, 4 iron, 5 flame ----
vec2 mapTower(vec3 p, float t){
  float h=clamp((p.y+1.2)/4.75,0.,1.), w=mix(.62,.5,h);                     // shaft half-width tapers with height
  // square shaft from the drowned base (y=-1.2) to the cornice (y=3.55) with a faint block relief
  float d=sdBox(vec3(p.x,p.y-1.175,p.z),vec3(w-.015,2.36,w-.015))-.015-.008*noise(vec2(p.y*14.,p.x*3.1+p.z*4.3));
  // four corner buttresses in a diagonal frame (u towards the corner): slimmer higher up, sloped weathered tops
  float u=(abs(p.x)+abs(p.z))*.70711, v=(abs(p.x)-abs(p.z))*.70711, pr=mix(.2,.07,h);
  float bu=sdBox(vec3(u-1.4142*w-pr*.5+.06,p.y-.45,v),vec3(pr*.5+.06,1.65,.13-.035*h));
  d=min(d,max(bu,p.y-2.14+(u-1.4142*w)*1.6));
  // string course at the belfry floor + two-step cornice under the spire
  d=min(d,sdBox(p-vec3(0.,2.08,0.),vec3(.55,.045,.55)));
  d=min(d,min(sdBox(p-vec3(0.,3.39,0.),vec3(.54,.04,.54)),sdBox(p-vec3(0.,3.5,0.),vec3(.62,.05,.62))));
  // lancet profile = rectangle + two-arc pointed head; s.x = along-face coordinate of the X faces, s.y = of the Z faces
  vec2 s=vec2(abs(p.z),abs(p.x));
  vec2 rec=min(max(s-.12,abs(p.y-.98)-.28),max(length(vec2(s.x+.12,p.y-1.25)),length(vec2(abs(s.x-.12),p.y-1.25)))-.18);
  d=max(d,-max(rec.x,w-.07-abs(p.x)));                                      // blind recesses, 7 cm deep
  d=max(d,-max(rec.y,w-.07-abs(p.z)));
  // open belfry: tall lancet openings (y 2.2..3.26) cut clean through the X and Z faces, leaving 4 corner posts
  vec2 op=min(max(s-.29,abs(p.y-2.58)-.38),max(length(vec2(s.x+.29,p.y-2.96)),length(vec2(abs(s.x-.29),p.y-2.96)))-.42);
  d=max(d,-min(op.x,op.y));
  // steep slate spire (y 3.55..5.9): four-sided pyramid with a faint concave flare, iron spike + ball finial
  float m=max(abs(p.x),abs(p.z)), spr=max((pow(max(m,.02)/.64,.88)*2.35+p.y-5.9)*.24,3.55-p.y);   // 3.55-p.y: keep the pyramid only ABOVE the cornice
  vec3 f=p-vec3(0.,5.95,0.);
  float fin=min(sdBox(f-vec3(0.,-.06,0.),vec3(.012,.28,.012)),length(f)-.045);   // spike runs down into the spire tip; ball rests on the apex
  // hanging lantern: frame tilted about the ceiling pivot so chain + cage swing as one pendulum
  vec3 lp=lanternPos(t), q=p-vec3(0.,3.35,0.);
  float an=atan(lp.x,.63), ca=cos(an), sa=sin(an);
  q.xy=mat2(ca,-sa,sa,ca)*q.xy;
  vec3 c=q-vec3(0.,-.63,0.);                                                // cage centre
  float iron=min(sdBox(q,vec3(.05,.025,.05)),sdBox(q-vec3(0.,-.18,0.),vec3(.011,.18,.011)));   // ceiling bracket + chain
  iron=min(iron,min(sdBox(c-vec3(0.,-.16,0.),vec3(.1,.014,.1)),sdBox(c-vec3(0.,.15,0.),vec3(.105,.012,.105)))); // base + crown plates
  iron=min(iron,sdBox(vec3(abs(c.x)-.085,c.y,abs(c.z)-.085),vec3(.009,.15,.009)));            // four corner posts
  iron=min(iron,max(length(max(abs(c.xz)-.088,0.))-.007,abs(c.y)-.007));                     // mid ring
  iron=min(iron,max((length(c.xz)*.95+c.y-.27)*.72,.15-c.y));                                // pyramid cap
  iron=min(iron,fin);                                                                        // spire finial joins the ironwork
  float core=sdBox(c-vec3(0.,-.02,0.),vec3(.05,.085,.05))-.012;              // glass housing = the flame
  // materials: wet moss band around the waterline (y -0.2..0.55) with a ragged edge
  float my=p.y+(noise(vec2(p.y*5.,p.x*6.1+p.z*7.3))-.5)*.16;
  vec2 res=vec2(d,mix(1.,2.,step(.5,smoothstep(-.2,-.1,my)*(1.-smoothstep(.5,.6,my)))));
  if(spr<res.x)res=vec2(spr,3.);
  if(iron<res.x)res=vec2(iron,4.);
  if(core<res.x)res=vec2(core,5.);
  return res;
}

// ---- normal by tetrahedron gradient (4 taps). eps .0015 for shading; ~1.5 px for the rim so hard edges read as a line, not beads ----
vec3 towerNormal(vec3 p, float t, float eps){
  vec2 e=vec2(1.,-1.)*eps;
  return normalize(e.xyy*mapTower(p+e.xyy,t).x+e.yyx*mapTower(p+e.yyx,t).x+e.yxy*mapTower(p+e.yxy,t).x+e.xxx*mapTower(p+e.xxx,t).x);
}
// ---- sphere-trace the steeple: up to 80 steps, far plane 45. returns vec2(distance, matId), matId 0 = miss ----
vec2 traceTower(vec3 ro, vec3 rd, float t){
  float d=0.;
  for(int i=0;i<80;i++){
    vec2 h=mapTower(ro+rd*d,t);
    if(h.x<.001*d+.0005)return vec2(d,h.y);
    if((d+=h.x*.9)>45.)break;                                              // 0.9: never step over the thin ironwork
  }
  return vec2(45.,0.);
}

// ---- steeple shading: weathered grey-blue stone, wet sheen + moss at the waterline; lantern, moon, lamp, lightning ----
// uLampDir = unit vector from the scene TOWARDS the viewer's lamp (key + rim), e.g. normalize(uEye+vec3(0,1.5,0))
vec3 shadeTower(vec3 p, vec3 n, float matId, vec3 rd, float t){
  vec3 v=-rd, lp=lanternPos(t); vec2 uv=abs(n.y)>.7?p.xz:(abs(n.x)>.7?p.zy:p.xy);   // face-aligned coords for the mottling
  float m1=fbm(uv*2.6), m2=fbm(uv*9.+7.3), gr=noise(uv*60.);
  float course=floor(p.y*3.2);                                                 // ashlar: 31 cm courses, vertical joints staggered every other course
  float joint=max(smoothstep(.42,.5,abs(fract(p.y*3.2)-.5)),smoothstep(.46,.5,abs(fract(uv.x*1.6+.5*mod(course,2.))-.5)));
  vec3 alb=mix(vec3(.22,.25,.29),vec3(.44,.47,.52),m1*.65+m2*.35)+gr*.04;   // weathered grey-blue stone
  alb*=(1.-.22*smoothstep(.3,.8,fbm(uv*1.1+31.)))*(1.-.28*joint);   // damp patches + mortar courses
  float wet=1.-smoothstep(-.05,1.3,p.y), rough=mix(.85,.3,wet), spec=.06+.3*wet, env=.16*wet;   // wetter towards the water
  alb=mix(alb*(1.-.45*wet),vec3(.07,.11,.045),(1.-smoothstep(.5,1.05,p.y))*.55*m1);   // wet stone darkens; algae creep up from the moss band
  if(matId>1.5){                                                           // 2 wet moss band
    alb=mix(vec3(.05,.10,.03),vec3(.15,.22,.06),m1*.6+m2*.4)+gr*.02; rough=.42; spec=.4; env=.1;
    alb*=mix(.5,1.,smoothstep(-.8,.1,p.y));                                // olive-brown where it dips under the surface
  }
  if(matId>2.5){                                                           // 3 wet slate
    alb=mix(vec3(.08,.095,.12),vec3(.18,.20,.24),m2)*(1.-.3*smoothstep(.44,.5,abs(fract(p.y*6.)-.5))); rough=.45; spec=.32; env=.09;   // tile courses
  }
  if(matId>3.5){                                                           // 4 iron with rust patches
    alb=mix(vec3(.08,.085,.095),vec3(.26,.13,.06),smoothstep(.55,.78,m2)); rough=.3; spec=.85; env=.12;
  }
  if(matId>4.5){                                                           // 5 flame = emissive, unlit
    float fl=.8+.2*sin(t*21.+sin(t*9.1)*2.5)*sin(t*5.3);                   // irregular flicker
    return mix(vec3(1.,.36,.08),vec3(1.,.62,.22),clamp((lp.y+.12-p.y)/.2,0.,1.))*1.55*fl;   // amber: hot enough to bloom, not so hot the tone curve clips it to white
  }
  // lights: warm lantern (soft-wrapped, inverse-square, flickering, confined to the belfry) + cool moon / lamp / lightning
  vec3 ld=lp-p; float dl=length(ld); ld/=max(dl,1e-4); float gate=smoothstep(1.75,2.15,p.y), at=1.4/(1.+dl*dl*.5)*gate;
  float flick=.84+.12*sin(t*13.7)*sin(t*7.3+1.1)+.06*sin(t*29.+1.9), mv=1.-uStorm*.75;
  vec3 lamp=normalize(uLampDir), bolt=normalize(vec3(.3,.9,.2)), moonDir=vec3(-.352,.423,-.835);
  float shin=mix(90.,5.,rough*rough), norm=(shin+8.)/25.;                  // normalised blinn-phong lobe sized by roughness
  vec3 warm=vec3(1.,.56,.2)*clamp(dot(n,ld)*.55+.45,0.,1.)*flick*at;
  vec3 cool=vec3(.50,.58,.78)*max(dot(n,moonDir),0.)*.8*mv+vec3(.85,.94,1.)*max(dot(n,lamp),0.)*.64;
  float cav=clamp(mapTower(p+n*.1,t).x/.1,0.,1.), open_=clamp(mapTower(p+n*.5,t).x/.5,0.,1.);   // 1-tap cavity + how much of the sky the point sees
  vec3 dome=vec3(.50,.52,.55)*(.6+.4*n.y)*mix(.35,1.,open_);                // moonlit sky dome, near-neutral grey: the stone must not melt into the blue sky
  vec3 col=alb*(dome+warm+cool+vec3(.75,.85,1.)*max(dot(n,bolt),0.)*uFlash*1.6);   // sky dome + diffuse
  col+=spec*norm*(vec3(1.,.6,.25)*pow(max(dot(n,normalize(ld+v)),0.),shin)*flick*at*1.6
                +vec3(.8,.88,1.)*(pow(max(dot(n,normalize(moonDir+v)),0.),shin)*.6*mv+pow(max(dot(n,normalize(lamp+v)),0.),shin)*.45)
