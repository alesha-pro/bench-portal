function texture(size, paint, repeat=false){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d',{alpha:true}); paint(x,size);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.generateMipmaps=false;
  if(repeat) t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

  x.putImageData(im,0,0);
}

// ---------- Materials and gentle PSX vertex/UV treatment ----------
const psxGrid={value:new THREE.Vector2(854,480)};
function psx(mat,affine=true){
  mat.onBeforeCompile=shader=>{
    shader.uniforms.uPSXGrid=psxGrid;
    shader.vertexShader='uniform vec2 uPSXGrid; varying vec2 vPSXUv; varying float vPSXW;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <project_vertex>',`#include <project_vertex>
      vec2 psxNdc=gl_Position.xy/gl_Position.w;
      psxNdc=floor(psxNdc*uPSXGrid*0.5+0.5)/(uPSXGrid*0.5);
      gl_Position.xy=psxNdc*gl_Position.w;
      #ifdef USE_MAP
      vPSXUv=uv*gl_Position.w; vPSXW=gl_Position.w;
      #endif`);
    shader.fragmentShader='varying vec2 vPSXUv; varying float vPSXW;\n'+shader.fragmentShader;
    if(affine) shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`
      #ifdef USE_MAP
      vec4 sampledDiffuseColor=texture2D(map,vPSXUv/vPSXW);
      diffuseColor*=sampledDiffuseColor;
      #endif`);
  };
  mat.customProgramCacheKey=()=> 'ninth-psx-'+affine;
  return mat;
}
function standard(map,color=0xffffff,rough=.85,extra={}){return psx(new THREE.MeshStandardMaterial({map,color,roughness:rough,metalness:0,...extra}));}

function mesh(geo,mat,parent=scene,cast=true,receive=true){const m=new THREE.Mesh(geo,mat);m.castShadow=cast;m.receiveShadow=receive;parent.add(m);return m;}
function box(w,h,d,mat,x,y,z,parent=scene,cast=true,receive=true){const m=mesh(new THREE.BoxGeometry(w,h,d),mat,parent,cast,receive);m.position.set(x,y,z);return m;}
function rounded(w,h,d,r,mat,x,y,z,parent=scene){const m=mesh(new RoundedBoxGeometry(w,h,d,1,r),mat,parent);m.position.set(x,y,z);return m;}
function cyl(rt,rb,h,n,mat,x,y,z,parent=scene){const m=mesh(new THREE.CylinderGeometry(rt,rb,h,n,1,false),mat,parent);m.position.set(x,y,z);return m;}
function rod(a,b,r,mat,parent=scene,n=6){const d=new THREE.Vector3().subVectors(b,a),m=cyl(r,r,d.length(),n,mat,0,0,0,parent);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m;}

// Batch immobile opaque detail without freezing any animated transform.
function mergeStatic(root,exclusions=new Set()){
  root.updateWorldMatrix(true,true);
  const inverse=root.matrixWorld.clone().invert(),batches=new Map(), originals=[];
  function collect(o){
    if(exclusions.has(o))return;
    if(o.isMesh&&!o.isInstancedMesh&&!o.isSkinnedMesh&&o.visible&&o.geometry&&!Array.isArray(o.material)&&!o.material.transparent&&!o.customDepthMaterial){
      const key=o.material.uuid+'/'+o.castShadow+'/'+o.receiveShadow;
      if(!batches.has(key))batches.set(key,{material:o.material,cast:o.castShadow,receive:o.receiveShadow,geometries:[]});
      const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
      g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inverse,o.matrixWorld));
      for(const name of Object.keys(g.attributes))if(!['position','normal','uv'].includes(name))g.deleteAttribute(name);
      if(!g.attributes.normal)g.computeVertexNormals();
      if(!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
      batches.get(key).geometries.push(g);originals.push(o);
    }
    for(const child of o.children)collect(child);
  }
  collect(root);
  const merged=[];
  for(const b of batches.values()){
    if(b.geometries.length<2){for(const g of b.geometries)g.dispose();continue;}
    const geometry=mergeGeometries(b.geometries,false);
    for(const g of b.geometries)g.dispose();
    if(!geometry)throw new Error('Static geometry batch failed');
    const m=mesh(geometry,b.material,root,b.cast,b.receive);merged.push(m);
  }
  // Remove only originals belonging to batches that were actually merged.
  for(const o of originals){
    const key=o.material.uuid+'/'+o.castShadow+'/'+o.receiveShadow;
    if((batches.get(key)?.geometries.length||0)>1){o.parent.remove(o);o.geometry.dispose();}
  }
  return merged;
}
