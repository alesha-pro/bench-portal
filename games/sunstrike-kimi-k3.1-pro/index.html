// Periodic 3D noise: the 64-cell translation in twenty seconds is exactly seamless.

noiseTex.format=THREE.RedFormat;

noiseTex.minFilter=noiseTex.magFilter=THREE.LinearFilter;
noiseTex.wrapS=noiseTex.wrapT=noiseTex.wrapR=THREE.RepeatWrapping;
noiseTex.unpackAlignment=1;
noiseTex.needsUpdate=true;
// A periodic 22³ source resampled into the same 64³ domain: cloud billows are
// almost exactly three times broader, without changing the established scroll.
const LS=22,ld=new Uint8Array(LS*LS*LS),cd=new Uint8Array(NS*NS*NS);
for(let z=0;z<LS;z++)for(let y=0;y<LS;y++)for(let x=0;x<LS;x++){
  const sx=Math.floor(x*NS/LS),sy=Math.floor(y*NS/LS),sz=Math.floor(z*NS/LS);
  ld[x+y*LS+z*LS*LS]=nd[sx+sy*NS+sz*NS*NS];

for(let z=0;z<NS;z++)for(let y=0;y<NS;y++)for(let x=0;x<NS;x++){
  const fx=x*LS/NS,fy=y*LS/NS,fz=z*LS/NS,ix=Math.floor(fx),iy=Math.floor(fy),iz=Math.floor(fz);
  const tx=fx-ix,ty=fy-iy,tz=fz-iz;let v=0;
  for(let dz=0;dz<2;dz++)for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
    const w=(dx?tx:1-tx)*(dy?ty:1-ty)*(dz?tz:1-tz);
    v+=ld[(ix+dx)%LS+((iy+dy)%LS)*LS+((iz+dz)%LS)*LS*LS]*w;

const cloudNoiseTex=new THREE.Data3DTexture(cd,NS,NS,NS);
cloudNoiseTex.format=THREE.RedFormat;cloudNoiseTex.type=THREE.UnsignedByteType;
cloudNoiseTex.minFilter=cloudNoiseTex.magFilter=THREE.LinearFilter;
cloudNoiseTex.wrapS=cloudNoiseTex.wrapT=cloudNoiseTex.wrapR=THREE.RepeatWrapping;
cloudNoiseTex.unpackAlignment=1;cloudNoiseTex.needsUpdate=true;

const sunElevation=12*Math.PI/180;
const sunDir=new THREE.Vector3(-0.86*Math.cos(sunElevation),Math.sin(sunElevation),-0.40*Math.cos(sunElevation)).normalize();
const sunColor=new THREE.Color(1.0,0.73,0.43);

const volumeGLSL=/* glsl */`
precision highp float;
precision highp sampler3D;
uniform sampler3D uNoise;
uniform float uScroll;
uniform float uBurn;
uniform vec3 uSunDir;
uniform vec3 uJetPos;
uniform mat3 uJetInv;
uniform float uDebug;
const float PI=3.141592653589793;
const float RE=6371000.0;
const float RA=6471000.0;
const vec3 BR=vec3(5.8e-6,13.5e-6,33.1e-6);
const vec3 BM=vec3(3.8e-6);

float bayer4(vec2 fc){
  ivec2 p=ivec2(mod(fc,4.0));
  mat4 m=mat4(0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);
  return (m[p.x][p.y]+0.5)/16.0;
}
float hg(float c,float g){
  float g2=g*g;
  return (1.0-g2)/(4.0*PI*pow(max(0.001,1.0+g2-2.0*g*c),1.5));
}
vec2 atmIntersect(vec3 p,vec3 d){
  float b=dot(p,d), c=dot(p,p)-RA*RA;
  float h=b*b-c;
  if(h<0.0) return vec2(-1.0);
  h=sqrt(h);
  return vec2(max(0.0,-b-h),max(0.0,-b+h));
}
// Single-scattering atmosphere with Rayleigh and Mie optical depth.
vec3 atmosphere(vec3 rd){
  vec3 p0=vec3(0.0,RE+650.0,0.0);
  vec2 hit=atmIntersect(p0,rd);
  if(hit.y<=0.0) return vec3(0.002,0.004,0.012);
  float span=hit.y-hit.x;
  float ds=span/10.0;
  float odR=0.0,odM=0.0;
  vec3 sumR=vec3(0.0),sumM=vec3(0.0);
  for(int i=0;i<10;i++){
    vec3 p=p0+rd*(hit.x+(float(i)+0.5)*ds);
    float h=max(0.0,length(p)-RE);
    float dR=exp(-h/8000.0)*ds;
    float dM=exp(-h/1200.0)*ds;
    odR+=dR;odM+=dM;
    vec2 lh=atmIntersect(p,uSunDir);
    float ls=lh.y/4.0;
    float lR=0.0,lM=0.0;
    for(int j=0;j<4;j++){
      vec3 lp=p+uSunDir*((float(j)+0.5)*ls);
      float lhgt=max(0.0,length(lp)-RE);
      lR+=exp(-lhgt/8000.0)*ls;
      lM+=exp(-lhgt/1200.0)*ls;
    }
    vec3 tau=BR*(odR+lR)+BM*(odM+lM)*1.11;
    vec3 trans=exp(-tau);
    sumR+=trans*dR;
    sumM+=trans*dM;
  }
  float mu=dot(rd,uSunDir);
  float pr=3.0/(16.0*PI)*(1.0+mu*mu);
  float pm=hg(mu,0.76);
  vec3 col=(sumR*BR*pr+sumM*BM*pm)*11.0;
  float disk=smoothstep(cos(0.0049),cos(0.00425),mu);
  col+=vec3(3.0,2.0,1.0)*disk;
  float peach=exp(-abs(rd.y)*12.0)*smoothstep(-0.12,0.02,rd.y);
  col=mix(col,col*vec3(1.05,0.78,1.02),peach*0.55);
  return max(col,vec3(0.0));
}
float noise3(vec3 p){return texture(uNoise,p).r;}
float fbm(vec3 p){
  float f=0.57*noise3(p);
  p=p*2.0+vec3(17.0,9.0,13.0);f+=0.28*noise3(p);
  p=p*2.0+vec3(8.0,21.0,5.0);f+=0.15*noise3(p);
  return f;
}
float fbm4(vec3 p){
  float f=0.66*noise3(p);
  p=p*2.0+vec3(17.0,9.0,13.0);f+=0.22*noise3(p);
  p=p*2.0+vec3(8.0,21.0,5.0);f+=0.085*noise3(p);
  p=p*2.0+vec3(11.0,3.0,19.0);f+=0.035*noise3(p);
  return f;
}
// Continuous warped sea surface; also used for smooth horizon occlusion, never a sine/lattice.
vec3 seaData(vec3 q){
  vec3 seaQ=vec3(q.x,3.17,q.z);
  vec2 warp=vec2(noise3(seaQ*0.015625+vec3(1.0,3.0,7.0)),noise3(seaQ*0.03125+vec3(8.0,2.0,4.0)));
  vec3 sp=vec3(q.x+(warp.x-0.5)*1.4,3.17+(noise3(seaQ*0.015625+vec3(5.0,11.0,2.0))-0.5)*1.4,q.z+(warp.y-0.5)*1.8);
  float seaNoise=fbm4(sp*0.015625);
  float large=noise3(sp*0.015625+vec3(2.0,13.0,6.0));
  float gapNoise=noise3(sp*0.015625+vec3(14.0,6.0,9.0));
  float gapDrop=1.0-smoothstep(0.24,0.44,gapNoise);
  float seaTop=-132.0+seaNoise*175.0+(large-0.5)*75.0-gapDrop*65.0;
  float deepTop=-118.0+noise3(sp*0.03125+vec3(19.0,7.0,3.0))*30.0;
  return vec3(seaTop,large,deepTop);
}
float cloudField(vec3 p,bool lightLod,bool skipSea,out vec4 seaInfo){
  vec3 q=p*0.011+vec3(13.1,7.7,-uScroll);
  vec2 cellSize=vec2(4.0,4.0);
  vec2 id=floor(q.xz/cellSize);
  vec2 f=fract(q.xz/cellSize)-0.5;
  float base=lightLod?noise3(q*0.25):fbm(q*0.25);
  float towerD=0.0;
  vec2 dir=sign(f);
  vec2 offsets[4];offsets[0]=vec2(0.0);offsets[1]=vec2(dir.x,0.0);offsets[2]=vec2(0.0,dir.y);offsets[3]=dir;
  // Four neighbouring height-profile towers overlap into broad, merged cumulus groups.
  for(int k=0;k<4;k++){
    vec2 cid=id+offsets[k];
    float r=noise3(vec3(cid.x/16.0,3.17,cid.y/16.0));
    float towerActive=smoothstep(0.60,0.70,r);
    if(towerActive<0.001)continue;
    float r2=noise3(vec3(cid.x/16.0+4.2,8.31,cid.y/16.0));
    float r3=noise3(vec3(cid.x/16.0+9.7,1.23,cid.y/16.0));
    float towerTop=240.0+900.0*pow(r3,3.0); // 300–1200 m above the flat cloud base at -60 m.
    if(p.y>towerTop+130.0)continue;
    float height01=clamp((p.y+60.0)/(towerTop+60.0),0.0,1.0);
    float crown=smoothstep(0.28,0.82,height01);
    vec2 center=offsets[k]+(vec2(r,r2)-0.5)*0.16;
    vec2 meander=vec2(noise3(vec3(cid.x/16.0,height01*0.25+4.7,cid.y/16.0)),noise3(vec3(cid.x/16.0+8.3,height01*0.25+9.1,cid.y/16.0)))-0.5;
    center+=meander*0.22*crown;
    float radius=0.55+r2*0.35;
    float profile=1.0+0.62*crown; // Wide flat base with a much broader rounded crown.
    float radial=length((f-center)/vec2(radius,radius*1.12))/profile;
    float lumps=noise3(vec3(q.x*0.50,p.y*0.004+r3*3.0,q.z*0.50));
    radial+=(lumps-0.5)*0.18*crown;
    float top=towerTop+(lumps-0.5)*60.0-radial*radial*(100.0+(towerTop-240.0)*0.16);
    float vertical=(1.0-smoothstep(top-22.0,top+10.0,p.y))*smoothstep(-64.0,-56.0,p.y);
    float radialMask=1.0-smoothstep(0.90,1.04,radial+(base-0.5)*0.12);
    towerD+=(0.010+max(0.0,base-0.30)*0.85)*vertical*radialMask*towerActive*1.05;
  }
  towerD=min(towerD,0.32)*(0.72+0.56*base);
  float corridor=smoothstep(180.0,340.0,abs(p.x+5.0));
  towerD*=corridor;
  if(lightLod){
    // Off-screen cumulus banks cut the low sun into real marched crepuscular shafts.
    vec3 s1=(p-vec3(-590.0,240.0,-760.0))/vec3(130.0,100.0,180.0);
    vec3 s2=(p-vec3(-800.0,300.0,-860.0))/vec3(150.0,115.0,170.0);
    towerD+=(1.0-smoothstep(0.55,1.10,length(s1)))*0.75;
    towerD+=(1.0-smoothstep(0.50,1.10,length(s2)))*0.65;
  }
  float d=towerD;seaInfo=vec4(-1000.0,0.0,-1000.0,0.0);
  if(!skipSea){
    vec3 sd=seaData(q);
    float seaTop=sd.x;
    float seaVertical=smoothstep(-175.0,-145.0,p.y)*(1.0-smoothstep(seaTop-18.0,seaTop+10.0,p.y));
    float coverage=smoothstep(0.38,0.58,sd.y);
    float seaD=0.38*seaVertical*coverage;
    float deepVertical=smoothstep(-175.0,-150.0,p.y)*(1.0-smoothstep(sd.z-10.0,sd.z+6.0,p.y));
    float deepD=0.18*deepVertical;
    seaD=max(seaD,deepD);
    seaInfo=vec4(seaTop,sd.y,sd.z,seaD);
    d=max(towerD,seaD);
  }
  if(!lightLod){
    float detail=noise3(q*0.50+vec3(3.0,11.0,7.0));
    float edge=smoothstep(0.005,0.055,towerD)*(1.0-smoothstep(0.12,0.27,towerD));
    d=max(0.0,d-(detail-0.42)*0.006*edge);
    // Static world-space condensation wisps; no time-varying noise or wake density.
    vec3 w=p-vec3(-1.0,15.0,-105.0);
    float wisp=exp(-dot(w*vec3(0.035,0.065,0.012),w*vec3(0.035,0.065,0.012)));
    d+=wisp*max(0.0,noise3(q*1.0)-0.30)*0.24;
  }
  return d;
}
float cloudField(vec3 p,bool lightLod){vec4 seaInfo;return cloudField(p,lightLod,false,seaInfo);}
float cloudNoSea(vec3 p,bool lightLod){vec4 seaInfo;return cloudField(p,lightLod,true,seaInfo);}
float jetOcccluder(vec3 p){
  vec3 q=uJetInv*(p-uJetPos);
  vec3 e=q/vec3(5.9,1.45,7.4);
  return exp(-dot(e,e)*2.0)*1.8;
}
float hazeField(vec3 p){
  float nearWisp=0.0;
  vec3 q=p*vec3(0.010,0.025,0.003)+vec3(2.0,5.0,-uScroll);
  nearWisp=max(0.0,noise3(q)-0.64)*0.002*exp(-abs(p.y)*0.035)*smoothstep(80.0,5.0,abs(p.z));
  float highNoise=0.35+1.30*noise3(p*0.000052+vec3(2.0,5.0,7.0));
  return 0.000013*exp(-max(p.y+45.0,0.0)*0.012)+nearWisp
    +0.000012*highNoise*smoothstep(-20.0,60.0,p.y)*(1.0-smoothstep(350.0,700.0,p.y));
}
vec2 boxRange(vec3 ro,vec3 rd){
  vec3 b0=vec3(-2200.0,-180.0,-1900.0),b1=vec3(2200.0,1350.0,100.0);
  vec3 inv=1.0/rd;
  vec3 a=(b0-ro)*inv,b=(b1-ro)*inv;
  vec3 mn=min(a,b),mx=max(a,b);
  return vec2(max(max(mn.x,mn.y),mn.z),min(min(mx.x,mx.y),mx.z));
}
float stepJitter(float base,int step){return fract(base+float(step)*0.61803398875);}
vec3 marchVolume(vec3 ro,vec3 rd,float jitter,out float firstT,out float volumeTrans,out float cloudOptical){
  vec3 sky=atmosphere(rd);
  cloudOptical=0.0;
  if(uDebug>0.5&&uDebug<1.5){firstT=1e6;volumeTrans=1.0;return sky;}
  if(uDebug>1.5&&uDebug<2.5)sky=vec3(0.004,0.006,0.015);
  if(uDebug>3.5&&uDebug<4.5){vec3 nq=(ro+rd*420.0)*0.011+vec3(13.1,3.17,-uScroll);firstT=1e6;volumeTrans=1.0;return vec3(fbm4(nq*0.015625));}
  if(uDebug>2.5&&uDebug<3.5){firstT=1e6;float probe=cloudField(ro+rd*420.0,false);volumeTrans=1.0;return vec3(probe*2.0,probe*1.4,probe);}
  vec3 zenith=atmosphere(vec3(0.0,1.0,0.0));
  vec3 ambient=zenith*0.16+vec3(0.020,0.035,0.115);
  vec3 color=vec3(0.0),trans=vec3(1.0);
  vec2 range=boxRange(ro,rd);

  firstT=1e6;volumeTrans=1.0;
  if(farT<=nearT)return sky;
  float nearSpan=min(120.0,(farT-nearT)*0.35),nearDt=nearSpan/12.0;
  float seaA=(55.0-ro.y)/min(rd.y,-0.0001),seaB=(-175.0-ro.y)/min(rd.y,-0.0001);
  bool seaRay=rd.y<-0.015&&max(seaA,seaB)>nearT&&min(seaA,seaB)<farT;
  float seaEntry=clamp(min(seaA,seaB),nearT,farT);
  if(seaRay)farT=clamp(max(seaA,seaB),nearT,farT);
  float preCount=(seaRay&&seaEntry-nearT>1.0)?16.0:0.0;
  float mu=dot(rd,uSunDir);
  float phase=(0.56*hg(mu,0.8)+0.32*hg(mu,-0.3)+0.035)/(1.0+1.8*pow(max(mu,0.0),4.0));
  vec3 gold=vec3(8.2,5.6,2.75);
  for(int i=0;i<48;i++){
    float dt,t;
    if(seaRay){
      if(float(i)<preCount){
        float u=(float(i)+0.5+(jitter-0.5)*0.65)/preCount;
        t=nearT+u*(seaEntry-nearT);dt=(seaEntry-nearT)/preCount;
      }else{
        float localI=float(i)-preCount,count=48.0-preCount;
        float u=(localI+0.5+(jitter-0.5)*0.65)/count;
        t=seaEntry+u*(farT-seaEntry);dt=(farT-seaEntry)/count;
      }
    }else{
      float localI=i<12?float(i):float(i-12);
      float u=(localI+0.5+(jitter-0.5)*0.65)/(i<12?12.0:36.0);
      if(i<12){t=nearT+u*nearSpan;dt=nearDt;}
      else{

        t=nearT+nearSpan+span*u*u;
        dt=span*(2.0*localI+1.0)/1296.0;

    }
    vec3 baseP=ro+rd*t;
    float baseCloud=cloudField(baseP,false);
    if((!seaRay||baseP.y>=25.0)&&baseCloud>0.00001){
      float q1=dt*0.1699905218,q2=dt*0.4305681558;
      baseCloud=0.3260725774*(cloudField(baseP-rd*q1,false)+cloudField(baseP+rd*q1,false))

    bool seaSub=seaRay&&baseP.y<25.0;

    if(seaSub){
      float offset=0.0,weight=1.0;
      if(sub==0){offset=-0.4305681558;weight=0.1739274226;}
      else if(sub==1){offset=-0.1699905218;weight=0.3260725774;}
      else if(sub==2){offset=0.1699905218;weight=0.3260725774;}
      else{offset=0.4305681558;weight=0.1739274226;}
      p=baseP+rd*(offset*dt);cloud=cloudField(p,false);sampleDt=dt*weight;

      float seaLightZone=1.0-smoothstep(-20.0,60.0,p.y);

      float jetShadow=smoothstep(9.0,2.5,perp)*smoothstep(0.0,8.0,along)*smoothstep(360.0,60.0,along);

  volumeUniforms.uCamBasis.value.setFromMatrix4(camera.matrixWorld);
  tmpV.copy(camera.position).addScaledVector(sunDir,2000).project(camera);
  volumeUniforms.uSunScreen.value.set(tmpV.x*0.5+0.5,tmpV.y*0.5+0.5);
  burnerUniforms.uTime.value=phase*TAU;burnerUniforms.uBurn.value=st.burn;
  for(const flame of flames){flame.scale.y=.20+st.burn*.80;flame.position.z=6.32+4.5*flame.scale.y;}
  vaporUniforms.uStrength.value=clamp(st.highG*.65+st.burst*.75);
  coneVapor.material=vaporMat;coneVapor.visible=st.burst>.015;wingVapor.visible=st.highG>.015;
  nozzleGlow.color.setRGB(1.2+st.burn*3.8,.20+st.burn*1.10,.035+st.burn*0.30);
  for(const a of ailerons)a.pivot.rotation.x=(Math.sin(st.rollP*Math.PI)*.42)*a.s*(st.rollP>0&&st.rollP<1?1:0)+st.bank*.12*a.s;
  for(const s of stabilators)s.pivot.rotation.x=-st.highG*.20-st.burn*.28;
  const gp=st.rollP,rollActive=(gp>0&&gp<1)?Math.pow(Math.sin(gp*Math.PI),.65):0;
  const starPulse=Math.exp(-Math.pow((gp-.5)/.14,2));
  const sweepZ=mix(-5.5,2.5,smoother(gp));
  const localView=jet.worldToLocal(camera.position.clone()).normalize();
  const localSun=sunDir.clone().applyQuaternion(st.q.clone().invert());
  const half=localSun.add(localView).normalize();
  const radial=new THREE.Vector2(half.x,half.y);
  if(radial.length()<.12)radial.set(localView.x,localView.y);
  radial.normalize();
  const bodyRadius=.40+.32*smooth(-5.5,-1.8,sweepZ);
  glintBody.u.value=rollActive*1.2+starPulse*8.0;
  glintLeft.u.value=rollActive*2.4*Math.pow(Math.max(0,Math.sin(gp*TAU+.5)),2);
  glintRight.u.value=rollActive*2.4*Math.pow(Math.max(0,Math.sin(gp*TAU+2.6)),2);
  glintBody.m.position.set(radial.x*(bodyRadius+.08),radial.y*(bodyRadius+.08),sweepZ);
  fuselageStreak.visible=rollActive>.01;
  fuselageStreak.position.set(radial.x*bodyRadius,radial.y*bodyRadius,sweepZ);
  streakMat.opacity=rollActive*(.90-.55*starPulse);
  for(const w of wingStreaks){
    const phase=w.s<0?.5:2.6,intensity=rollActive*(.28+.72*Math.pow(Math.max(0,Math.sin(gp*TAU+phase)),2));
    w.m.visible=intensity>.015;w.mat.opacity=intensity*.90;
  }
  for(const g of [glintBody,glintLeft,glintRight])g.m.lookAt(camera.position);
  glintBody.m.getWorldPosition(tmpV2).project(camera);
  finalMat.uniforms.uGlint.value.set(tmpV2.x*0.5+0.5,tmpV2.y*0.5+0.5,rollActive*0.15+starPulse*1.25);
  wingVapor.lookAt(camera.position);
  updateTrail(st);

  const nozzleWorld=[];
  for(const s of [-1,1]){
    const p=new THREE.Vector3(s*.72,-.08,6.5).applyMatrix4(jet.matrixWorld),behind=new THREE.Vector3(s*.72,-.08,12).applyMatrix4(jet.matrixWorld);
    const pr=p.clone().project(camera),br=behind.project(camera);
    nozzleWorld.push({p,pr,br});
  }
  for(let i=0;i<2;i++){
    const n=nozzleWorld[i],h=heatMat.uniforms.uHeat.value[i],d=heatMat.uniforms.uHeatDir.value[i];
    h.set(n.pr.x*.5+.5,n.pr.y*.5+.5,.024+st.burn*.025,(.12+st.burn*.88)*(n.pr.z<1?1:0));
    d.set((n.br.x-n.pr.x)*.5,(n.br.y-n.pr.y)*.5).normalize();
  }
  heatMat.uniforms.uTime.value=phase*TAU;heatMat.uniforms.uStreak.value=reduced?0:close*.85;

  if(frame%6===0||frozen!==null&&frame<2){
    envBox.position.copy(st.pos);cubeCamera.position.copy(st.pos);envBox.updateMatrixWorld(true);
    renderer.autoClear=true;cubeCamera.update(renderer,envScene);renderer.autoClear=false;
  }

  renderer.setRenderTarget(cloudRT);renderer.clear(true,true,true);renderer.render(cloudScene,postCamera);
  renderer.setRenderTarget(sceneRT);renderer.clear(true,true,true);renderer.render(jetScene,camera);
  quad.material=heatMat;renderer.setRenderTarget(heatRT);renderer.render(postScene,postCamera);
  quad.material=brightMat;renderer.setRenderTarget(bloomA);renderer.render(postScene,postCamera);
  for(let i=0;i<2;i++){
    quad.material=blurMat;blurMat.uniforms.tInput.value=bloomA.texture;blurMat.uniforms.uDir.value.set(1.25/bufW,0);renderer.setRenderTarget(bloomB);renderer.render(postScene,postCamera);
    blurMat.uniforms.tInput.value=bloomB.texture;blurMat.uniforms.uDir.value.set(0,1.25/bufH);renderer.setRenderTarget(bloomA);renderer.render(postScene,postCamera);
  }
  quad.material=finalMat;renderer.setRenderTarget(finalRT);renderer.render(postScene,postCamera);
  quad.material=cloudFinalMat;renderer.setRenderTarget(cloudFinalRT);renderer.render(postScene,postCamera);
  quad.material=screenMat;renderer.setRenderTarget(null);renderer.render(postScene,postCamera);
  updateAudio(st);
  frame++;lastPhase=phase;
  if(frame===3)window.__SUNSTRIKE_READY__=true;
  requestAnimationFrame(render);
}
window.__SUNSTRIKE_READY__=false;
window.__SUNSTRIKE__={get time(){return frozen===null?lastPhase*LOOP:frozen},get buffer(){return[bufW,bufH]},get cloudBuffer(){return[cloudW,cloudH]},get scale(){return scale},renderer};
requestAnimationFrame(render);
</script>
