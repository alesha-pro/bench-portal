<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="bird" viewBox="0 0 32 32"><path d="m3 10 10 5-4-12 12 11 7-4-3 7-5 3-5 9-1-9z" fill="currentColor"/><path d="m9 3 7 14 5-3m-5 3-2 3m2-3 4 3" fill="none" stroke="#b7452d" stroke-width="1"/></symbol>
  <symbol id="vol" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13 0q3 3 0 6m3-9q6 6 0 12"/></symbol>
  <symbol id="mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13 1 5 5m0-5-5 5"/></symbol>
  <symbol id="expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
  <symbol id="orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-30 12 12)"/><path d="m16.5 3.8 3 .8-.6 3M11 12h2"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3.2"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 10 7-10 7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="foldIcon" viewBox="0 0 24 24"><path d="m3 17 4-11 14 2-5 11zM7 6l9 13 5-11z"/></symbol>
  <symbol id="emberIcon" viewBox="0 0 24 24"><path d="M13 3c2 6-3 7-1 10 2-1 3-3 4-4 5 6 3 12-4 12C5 21 4 16 7 12c0 3 1 3 2 4-1-6 5-8 4-13z"/></symbol>
</svg>
<header class="mast">
 <div class="brand"><span class="brandmark"><svg><use href="#bird"/></svg></span><span>Fold Atelier</span></div>
 <div class="mast-actions"><button id="sound" type="button" aria-pressed="false"><svg><use href="#mute"/></svg><span>Sound off</span></button><span class="divider"></span><button id="full" type="button" aria-label="Toggle fullscreen" title="Fullscreen"><svg><use href="#expand"/></svg></button></div>
</header>
<main>
 <section id="stage" aria-label="Interactive origami phoenix over a mountain shrine">
   <canvas id="scene" aria-label="Orbit the three-dimensional paper sculpture"></canvas>
   <div class="scrim"></div>
   <div class="exhibit-title"><div class="kicker"><i></i> Burning Fold Rebirth</div><h1>The Origami<br><em>Phoenix</em></h1>
   <div class="signature" lang="ja"><b>折</b><span>不死鳥</span></div></div>
   <div class="chapter-detail"><span class="chapter-index" id="chapterIndex">III</span><span id="chapterName">Ascension</span></div>
   <div class="orbit-note"><svg><use href="#orbit"/></svg><span>Drag to orbit <i>·</i> Scroll to zoom</span></div>
 </section>
 <section class="desk" aria-label="Scene controls">
    <div class="control-row">
      <div class="autocell"><button type="button" id="auto" aria-label="Auto Showcase (30s)" aria-pressed="true" title="Pause auto showcase"><svg><use href="#pause"/></svg></button><div><span class="label">Playback</span><strong>Auto showcase</strong></div></div>
      <div class="slidercell"><div class="label-line"><label for="fold"><svg><use href="#foldIcon"/></svg>Fold progress</label><output id="foldOut" for="fold">100%</output></div><input type="range" min="0" max="100" value="100" id="fold" aria-label="Fold progress from flat sheet to soaring phoenix"></div>
      <div class="slidercell"><div class="label-line"><label for="ember"><svg><use href="#emberIcon"/></svg>Ember intensity</label><output id="emberOut" for="ember">75%</output></div><input type="range" min="0" max="100" value="75" id="ember"></div>
      <div class="stylecell"><label class="label" for="paper">Paper style</label><div class="select-wrap"><span id="swatch"></span><select id="paper"><option>Crimson &amp; Gold Leaf</option><option>Ivory &amp; Ink Calligraphy</option><option>Obsidian &amp; Neon Copper</option></select><svg><use href="#chev"/></svg></div></div>
    </div>
    <div class="timeline"><div class="timelabel"><span class="live-dot"></span>Cycle</div><div class="chapters" aria-label="Showcase chapters">
      <button data-start="0" data-end="3"><i></i><span>01</span> The sheet</button><button data-start="3" data-end="12"><i></i><span>02</span> Folding</button><button data-start="12" data-end="23"><i></i><span>03</span> Ascension</button><button data-start="23" data-end="30"><i></i><span>04</span> Rebirth</button>
    </div><div class="clock"><time id="clock">00:15</time><span>/</span>00:30</div></div>
 </section>
</main>
<audio id="audio" preload="none" loop src="./assets/score.m4a"></audio>
<script type="module" src="./src/main.js"></script>
</body></html>
