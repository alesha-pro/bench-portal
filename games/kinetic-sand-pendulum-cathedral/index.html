<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#151817" />
    <title>The Sacred Pendulum · Meridian</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171917'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23d6b781'/%3E%3Cpath d='m20 5-8 18 5 3 2-5Z' fill='%23d6b781'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <svg class="defs" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="mark" viewBox="0 0 40 40">
          <g fill="none" stroke="currentColor">
            <circle cx="20" cy="20" r="16" stroke-width="1.15" />
            <ellipse
              cx="20"
              cy="20"
              rx="10"
              ry="16"
              transform="rotate(34 20 20)"
              stroke-width=".8"
            />
            <path d="M3 26.8 36 12M24 3l-6.5 20" stroke-width="1.1" />
            <path d="m18.1 20.8 2.5 5-4 3.4-1.6-5Z" fill="currentColor" />
          </g>
        </symbol>
        <symbol id="sound" viewBox="0 0 24 24">
          <path d="M3 10h4l5-4v12l-5-4H3zM16 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" />
        </symbol>
        <symbol id="mute" viewBox="0 0 24 24">
          <path d="M3 10h4l5-4v12l-5-4H3zM16 9l6 6m0-6-6 6" />
        </symbol>
        <symbol id="tune" viewBox="0 0 24 24">
          <path d="M3 7h9m4 0h5M3 17h3m4 0h11" />
          <circle cx="14" cy="7" r="2" />
          <circle cx="8" cy="17" r="2" />
        </symbol>
        <symbol id="rotunda" viewBox="0 0 24 24">
          <path d="m2 9 10-6 10 6ZM4 11v8m5-8v8m6-8v8m5-8v8M2 21h20" />
        </symbol>
        <symbol id="overhead" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7" />
          <circle cx="12" cy="12" r="2.5" />
          <path d="M12 2v4m0 12v4M2 12h4m12 0h4" />
        </symbol>
        <symbol id="macro" viewBox="0 0 24 24">
          <path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5M6 12h12m-6-6v12" />
        </symbol>
        <symbol id="rake" viewBox="0 0 24 24">
          <path d="m5 20 9-9m-5-4 8 8m-8-8 3-3m0 6 3-3m0 6 3-3m0 6 3-3" />
        </symbol>
        <symbol id="expand-icon" viewBox="0 0 24 24">
          <path d="M9 3H3v6m12-6h6v6m0 6v6h-6M3 15v6h6" />
        </symbol>
        <symbol id="orbit" viewBox="0 0 24 24">
          <ellipse cx="12" cy="13" rx="9" ry="5" transform="rotate(-24 12 13)" />
          <path d="m5 5 2 3-3 1" />
          <circle cx="12" cy="12" r="1.2" />
        </symbol>
        <symbol id="play" viewBox="0 0 24 24">
          <path d="m8 4 11 8-11 8z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="pause" viewBox="0 0 24 24">
          <path d="M8 5v14m8-14v14" stroke-width="3" />
        </symbol>
        <symbol id="timer" viewBox="0 0 24 24">
          <circle cx="12" cy="13.5" r="7" />
          <path d="M9 2h6m-3 0v4m0 3v5l3 2" />
        </symbol>
      </defs>
    </svg>
    <header class="mast">
      <div class="mast-inner">
        <div class="brand">
          <svg aria-hidden="true"><use href="#mark" /></svg><span>Meridian</span>
        </div>
        <div class="division">Kinetic observatory</div>
        <button id="audio" class="audio" aria-pressed="false">
          <svg><use href="#mute" /></svg><span>Sound off</span>
        </button>
      </div>
    </header>
    <main>
      <div class="intro">
        <div>
          <div class="kicker"><span></span> Harmonic studies</div>
          <h1>The Sacred <em>Pendulum</em></h1>
          <p>Lissajous Sand Sanctuary</p>
        </div>
        <div class="live"><i></i> Live simulation</div>
      </div>
      <div class="desk">
        <section class="theatre" aria-label="Pendulum viewer">
          <div class="imagewell" id="imagewell">
            <canvas id="scene" aria-label="Live three-dimensional sand sanctuary"></canvas>
            <div class="view-name">
              <svg><use id="viewicon" href="#rotunda" /></svg
              ><span id="viewtext">Rotunda Sunbeam</span>
            </div>
            <button id="expand" class="expand" aria-label="Enter fullscreen" title="Fullscreen">
              <svg><use href="#expand-icon" /></svg>
            </button>
            <div id="loading">Opening the sanctuary…</div>
          </div>
          <div class="transport">
            <button id="showcase" aria-pressed="false" title="Toggle the 30-second auto showcase">
              <span class="play"
                ><svg><use id="playicon" href="#play" /></svg></span
              ><span>Auto showcase</span>
            </button>
            <input
              type="range"
              min="0"
              max="30"
              value="0"
              step="0.01"
              id="timeline"
              aria-label="Showcase time"
            />
            <span class="clock"><b id="clock">00:00</b> / 00:30</span>
          </div>
        </section>
        <aside class="instrument" aria-label="Instrument controls">
          <div class="panel-h">
            <h2>Instrument</h2>
            <svg><use href="#tune" /></svg>
          </div>
          <fieldset>
            <legend>Harmonic ratio</legend>
            <div id="ratios" class="ratios"></div>
          </fieldset>
          <div class="energy">
            <label for="energy">Swing energy</label
            ><output id="energyvalue" for="energy">76%</output>
          </div>
          <input
            type="range"
            id="energy"
            min="10"
            max="100"
            value="76"
            aria-label="Pendulum swing energy"
          />
          <div class="rule"></div>
          <fieldset>
            <legend>Camera preset</legend>
            <div id="cameras" class="cameras"></div>
          </fieldset>
          <button id="reset">
            <svg><use href="#rake" /></svg><span>Reset smooth sand</span>
          </button>
        </aside>
      </div>
      <footer>
        <div>
          <svg><use href="#orbit" /></svg> Drag to orbit <i></i> Scroll to zoom
        </div>
        <div class="field"><span></span> Heightfield <b>1536 × 1536</b></div>
      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
