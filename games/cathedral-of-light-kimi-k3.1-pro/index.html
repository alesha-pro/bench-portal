<title>The Cathedral of Light — Living Day & Night</title>
<style>
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:rgb(3,6,6)}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  :root{color-scheme:dark;--gold:#f2ce72;--teal:#62c7c4;--ink:#07171b;--line:#21454a;--muted:#8ca8a7}
  #settings,#showSettings{font-family:"Courier New",ui-monospace,monospace}
  #settings{position:fixed;z-index:5;right:18px;top:18px;width:350px;max-height:calc(100vh - 36px);overflow-y:auto;box-sizing:border-box;padding:22px 20px 18px;color:#d5e4dd;background:linear-gradient(145deg,rgba(8,29,33,.97),rgba(5,18,24,.95));border:1px solid #35676a;box-shadow:0 12px 45px #0009,inset 0 0 35px #173f3922;backdrop-filter:blur(10px);user-select:none;scrollbar-width:thin;scrollbar-color:#396d6d #081a1e}
  #settings.hidden{display:none}#settings *{box-sizing:border-box}
  #hideSettings{position:absolute;right:9px;top:7px;border:0;background:none;color:#7ca5a3;font-size:22px;padding:2px 7px;cursor:pointer}
  .brand{padding-right:28px;margin-bottom:18px}.brand-title{color:var(--gold);font-weight:bold;font-size:22px;letter-spacing:4px;line-height:1}.brand-sub{margin-top:8px;color:#78c6c1;font-size:12px;letter-spacing:5px;line-height:1.55}
  #soundButton{position:absolute;right:20px;top:62px;border:1px solid #72d5cc;border-radius:6px;background:#5ec9c3;color:#082629;font-weight:bold;padding:9px 12px;font-size:12px;cursor:pointer;box-shadow:0 0 18px #5ec9c322}
  .section{padding-top:17px;margin-top:17px;border-top:1px solid #29494d}.section-title{display:flex;align-items:center;gap:12px;color:#58c4c0;font-size:12px;font-weight:bold;letter-spacing:4px;margin-bottom:18px}.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#244b4d,transparent)}
  .control{margin:0 0 17px}.control-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:14px}.control-head output{color:var(--gold);font-weight:bold;font-size:13px;white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:4px;margin:8px 0;background:linear-gradient(90deg,#2d6c6c,#163c43);border:0;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border:1px solid #ffe19a;border-radius:1px;background:var(--gold);box-shadow:0 0 10px #f2ce7244;cursor:ew-resize}input[type=range]::-moz-range-thumb{width:17px;height:17px;border:1px solid #ffe19a;border-radius:1px;background:var(--gold);cursor:ew-resize}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin:12px 0 17px;font-size:14px}.toggle{position:relative;width:42px;height:23px;display:inline-block}.toggle input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}.toggle-track{position:absolute;inset:0;pointer-events:none;border:1px solid #397072;border-radius:14px;background:#102f36;cursor:pointer;transition:.18s}.toggle-track:after{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;border-radius:50%;background:#8eaaa8;transition:.18s}.toggle input:checked+.toggle-track{background:#397f7c;border-color:#75c9bc}.toggle input:checked+.toggle-track:after{transform:translateX(19px);background:var(--gold)}
  select{width:100%;padding:10px 12px;color:#d8e7df;background:#0a252c;border:1px solid #3b7171;border-radius:5px;font:13px "Courier New",monospace;outline:none;cursor:pointer}
  button{font-family:"Courier New",monospace}.action{width:100%;border:1px solid #37686b;border-radius:5px;background:#0b2930;color:#d6e6de;padding:11px 12px;font-weight:bold;font-size:13px;cursor:pointer;transition:.15s}.action:hover{border-color:#70bab5;background:#12363b}.action:active{transform:translateY(1px)}.action.gold{color:var(--gold);border-color:#625f3f}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.button-grid+.action{margin-bottom:0}
  .help{border-top:1px solid #29494d;margin-top:20px;padding-top:15px;color:#6f9797;font-size:11px;line-height:1.8}.help b{color:#65c4be;font-weight:normal}
  #showSettings{display:none;position:fixed;z-index:5;right:16px;top:16px;padding:11px 15px;color:var(--gold);background:#09242bea;border:1px solid #4c8581;border-radius:4px;font-weight:bold;letter-spacing:2px;cursor:pointer}#showSettings.visible{display:block}
  @media(max-width:600px){#settings{right:8px;top:8px;width:min(350px,calc(100vw - 16px));max-height:calc(100vh - 16px);padding:18px}.brand-title{font-size:19px}#soundButton{top:58px}.control-head{font-size:13px}}

<body>
<aside id="settings" aria-label="Scene settings">
  <button id="hideSettings" aria-label="Hide settings">×</button>
  <div class="brand"><div class="brand-title">CATHEDRAL</div><div class="brand-sub">OF LIGHT ·<br>INTERACTIVE</div></div>
  <button id="soundButton">SOUND OFF</button>
  <section class="section"><div class="section-title">LIGHT</div>
    <div class="control"><div class="control-head"><label for="sunElevation">Sun elevation</label><output id="sunElevationValue">14°</output></div><input id="sunElevation" type="range" min="-20" max="85" step="1" value="14"></div>
    <div class="control"><div class="control-head"><label for="sunAzimuth">Sun azimuth</label><output id="sunAzimuthValue">33°</output></div><input id="sunAzimuth" type="range" min="0" max="360" step="1" value="33"></div>
    <div class="control"><div class="control-head"><label for="sunIntensity">Sun intensity</label><output id="sunIntensityValue">3.40</output></div><input id="sunIntensity" type="range" min="0" max="6" step="0.05" value="3.4"></div>
    <div class="control"><div class="control-head"><label for="skyAmbient">Sky ambient</label><output id="skyAmbientValue">0.85</output></div><input id="skyAmbient" type="range" min="0.1" max="2" step="0.01" value="0.85"></div>
  </section>
  <section class="section"><div class="section-title">ATMOSPHERE</div>
    <div class="control"><div class="control-head"><label for="mistDensity">Mist density</label><output id="mistDensityValue">0.15</output></div><input id="mistDensity" type="range" min="0" max="0.6" step="0.01" value="0.15"></div>
    <div class="control"><div class="control-head"><label for="shaftIntensity">Shaft intensity</label><output id="shaftIntensityValue">1.00</output></div><input id="shaftIntensity" type="range" min="0" max="2" step="0.05" value="1"></div>
    <div class="control"><div class="control-head"><label for="windStrength">Wind strength</label><output id="windStrengthValue">1.00</output></div><input id="windStrength" type="range" min="0" max="2.5" step="0.05" value="1"></div>
  </section>
  <section class="section"><div class="section-title">RENDER</div>
    <div class="control"><div class="control-head"><label for="exposure">Exposure</label><output id="exposureValue">1.02</output></div><input id="exposure" type="range" min="0.4" max="2.5" step="0.01" value="1.02"></div>
    <div class="control"><div class="control-head"><label for="bloomGlow">Bloom glow</label><output id="bloomGlowValue">0.90</output></div><input id="bloomGlow" type="range" min="0" max="2" step="0.05" value="0.9"></div>
    <div class="control"><div class="control-head"><label for="pixelHeight">Pixel height (quality)</label></div><select id="pixelHeight"><option value="180">180p · retro</option><option value="240">240p · chunky</option><option value="270" selected>270p · cathedral</option><option value="360">360p · fine</option><option value="540">540p · ultra</option></select></div>
    <div class="toggle-row"><label for="pixelDither">Pixel dither</label><label class="toggle"><input id="pixelDither" type="checkbox" checked><span class="toggle-track"></span></label></div>
  </section>
  <section class="section"><div class="section-title">TIME &amp; LIFE</div>
    <div class="control"><div class="control-head"><label for="timeSpeed">Time speed</label><output id="timeSpeedValue">1.00</output></div><input id="timeSpeed" type="range" min="0" max="4" step="0.05" value="1"></div>
    <div class="toggle-row"><label for="autoCycle">Auto day cycle</label><label class="toggle"><input id="autoCycle" type="checkbox" checked><span class="toggle-track"></span></label></div>
    <div class="toggle-row"><label for="pauseLoop">Pause loop</label><label class="toggle"><input id="pauseLoop" type="checkbox"><span class="toggle-track"></span></label></div>
    <div class="control"><div class="control-head"><label for="dustAmount">Dust &amp; pollen</label><output id="dustAmountValue">1.00</output></div><input id="dustAmount" type="range" min="0" max="2" step="0.05" value="1"></div>
  </section>
  <section class="section"><div class="section-title">CAMERA</div>
    <div class="control"><div class="control-head"><label for="fov">Field of view</label><output id="fovValue">35°</output></div><input id="fov" type="range" min="25" max="80" step="1" value="35"></div>
    <div class="toggle-row"><label for="autoOrbit">Auto-orbit drift</label><label class="toggle"><input id="autoOrbit" type="checkbox"><span class="toggle-track"></span></label></div>
    <button class="action" id="resetViewButton">Reset view</button>
  </section>
  <section class="section"><div class="section-title">ACTIONS</div>
    <div class="button-grid"><button class="action" id="randomize">Randomize</button><button class="action" id="resetAll">Reset all</button></div>
    <button class="action gold" id="savePng">Save PNG</button>
  </section>
  <div class="help"><b>drag</b> orbit · <b>wheel</b> zoom · <b>right-drag</b> pan<br>WASD move · Q/E down/up · N next time · H panel<br>Every slider re-lights the forest live.</div>
</aside>
<button id="showSettings">SETTINGS</button>
<script type="module">
import * as THREE from 'three';

// THE CATHEDRAL OF LIGHT — all dimensions are in forest blocks.
const TAU = Math.PI * 2;
const LOOP_SECONDS = 30;
const DAY_SECONDS = 120;
let dayOffset=.012,bufferH=270;
const defaults={sunElevation:14,sunAzimuth:33,sunIntensity:3.4,skyAmbient:.85,mistDensity:.15,shaftIntensity:1,windStrength:1,exposure:1.02,bloomGlow:.9,pixelHeight:270,pixelDither:true,timeSpeed:1,autoCycle:true,dustAmount:1,fov:35,autoOrbit:false};
const settings={...defaults};
const byId=id=>document.getElementById(id);
const DARKEST = new THREE.Color().setRGB(0.012,0.022,0.024);
let seed = 0x71c4a31;
function rand(){ seed = (Math.imul(seed,1664525) + 1013904223) >>> 0; return seed / 4294967296; }
function hash3(x,y,z){ let h = Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul(z|0,2147483647); h = Math.imul(h ^ (h >>> 13),1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const smooth = (a,b,x) => { const q=clamp((x-a)/(b-a),0,1); return q*q*(3-2*q); };

const renderer = new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance',stencil:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setClearColor(DARKEST,1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = true;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.12,240);
camera.position.set(0,2.65,14);
camera.lookAt(0.35,1.95,-18);
camera.updateMatrixWorld();

// Dependency-free orbit, dolly, pan, walking and touch controls.
const homeTarget=new THREE.Vector3(.35,1.95,-18),homeOffset=camera.position.clone().sub(homeTarget);
const homeRadius=homeOffset.length(),homeTheta=Math.atan2(homeOffset.x,homeOffset.z),homePhi=Math.acos(homeOffset.y/homeRadius);
let orbitTheta=homeTheta,orbitPhi=homePhi,orbitRadius=homeRadius;
let goalTheta=homeTheta,goalPhi=homePhi,goalRadius=homeRadius;
const orbitTarget=homeTarget.clone(),goalTarget=homeTarget.clone();
const pressed=new Set(),pointers=new Map();
let pinchDistance=0,pinchX=0,pinchY=0,previousFrameMs=null,animationMs=0,paused=false;
const moveKeys=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyQ','KeyE']);
function clampViewTarget(){
  goalTarget.x=clamp(goalTarget.x,-35,35);goalTarget.y=clamp(goalTarget.y,.8,16);goalTarget.z=clamp(goalTarget.z,-62,20);
}
function resetView(){
  goalTheta=homeTheta;goalPhi=homePhi;goalRadius=homeRadius;goalTarget.copy(homeTarget);
}
function panView(dx,dy){
  const amount=goalRadius*.00125;
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  goalTarget.addScaledVector(right,-dx*amount).addScaledVector(up,dy*amount);clampViewTarget();
}
function updateInteractiveCamera(dt){
  if(settings.autoOrbit&&pointers.size===0&&!paused)goalTheta+=dt*.055;
  const distance=Math.max(2,orbitRadius*.22)*dt;
  const forward=new THREE.Vector3(-Math.sin(orbitTheta),0,-Math.cos(orbitTheta));
  const right=new THREE.Vector3(Math.cos(orbitTheta),0,-Math.sin(orbitTheta));
  if(pressed.has('KeyW')||pressed.has('ArrowUp'))goalTarget.addScaledVector(forward,distance);
  if(pressed.has('KeyS')||pressed.has('ArrowDown'))goalTarget.addScaledVector(forward,-distance);
  if(pressed.has('KeyD')||pressed.has('ArrowRight'))goalTarget.addScaledVector(right,distance);
  if(pressed.has('KeyA')||pressed.has('ArrowLeft'))goalTarget.addScaledVector(right,-distance);
  if(pressed.has('KeyE'))goalTarget.y+=distance;
  if(pressed.has('KeyQ'))goalTarget.y-=distance;
  clampViewTarget();
  const blend=1-Math.exp(-dt*14);
  orbitTheta+=(goalTheta-orbitTheta)*blend;orbitPhi+=(goalPhi-orbitPhi)*blend;orbitRadius+=(goalRadius-orbitRadius)*blend;
  orbitTarget.lerp(goalTarget,blend);
  const sp=Math.sin(orbitPhi);
  camera.position.set(orbitTarget.x+orbitRadius*sp*Math.sin(orbitTheta),orbitTarget.y+orbitRadius*Math.cos(orbitPhi),orbitTarget.z+orbitRadius*sp*Math.cos(orbitTheta));
  camera.lookAt(orbitTarget);
}
const controlCanvas=renderer.domElement;
controlCanvas.addEventListener('contextmenu',e=>e.preventDefault());
controlCanvas.addEventListener('wheel',e=>{
  e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;
  goalRadius=clamp(goalRadius*Math.exp(clamp(e.deltaY*unit,-240,240)*.0015),3.5,70);
},{passive:false});
controlCanvas.addEventListener('pointerdown',e=>{
  controlCanvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:e.button,shift:e.shiftKey});
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];pinchDistance=Math.hypot(a.x-b.x,a.y-b.y);pinchX=(a.x+b.x)*.5;pinchY=(a.y+b.y)*.5;
  }
});
controlCanvas.addEventListener('pointermove',e=>{
  const old=pointers.get(e.pointerId);if(!old)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:old.button,shift:e.shiftKey});
  if(pointers.size===1){
    const dx=e.clientX-old.x,dy=e.clientY-old.y;
    if(old.button===2||old.shift||e.shiftKey)panView(dx,dy);
    else{goalTheta-=dx*.005;goalPhi=clamp(goalPhi-dy*.005,.18,1.55);}
  }else if(pointers.size===2){
    const [a,b]=[...pointers.values()],distance=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)*.5,cy=(a.y+b.y)*.5;
    if(distance>1&&pinchDistance>1)goalRadius=clamp(goalRadius*pinchDistance/distance,3.5,70);
    panView(cx-pinchX,cy-pinchY);pinchDistance=distance;pinchX=cx;pinchY=cy;
  }
});
function releasePointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchDistance=0;}
controlCanvas.addEventListener('pointerup',releasePointer);
controlCanvas.addEventListener('pointercancel',releasePointer);
controlCanvas.addEventListener('lostpointercapture',releasePointer);
controlCanvas.addEventListener('dblclick',resetView);
function jumpDayPart(){
  const current=((animationMs*.001/DAY_SECONDS+dayOffset)%1+1)%1;
  const phases=[.012,.25,.485,.75];
  let next=phases.find(p=>p>current+.025);
  if(next===undefined)next=phases[0]+1;
  dayOffset+=next-current;settings.autoCycle=true;byId('autoCycle').checked=true;
}
addEventListener('keydown',e=>{
  if(e.code==='KeyH'&&!e.repeat){toggleSettings();e.preventDefault();return;}
  if(e.target.closest&&e.target.closest('#settings'))return;
  if(moveKeys.has(e.code)){pressed.add(e.code);e.preventDefault();}
  if(e.code==='Space'&&!e.repeat){paused=!paused;byId('pauseLoop').checked=paused;e.preventDefault();}
  if(e.code==='KeyR'&&!e.repeat)resetView();
  if(!e.repeat&&(e.code==='BracketLeft'||e.code==='BracketRight')){dayOffset+=e.code==='BracketLeft'?-1/24:1/24;settings.autoCycle=true;byId('autoCycle').checked=true;e.preventDefault();}
  if(e.code==='KeyN'&&!e.repeat)jumpDayPart();
});
addEventListener('keyup',e=>pressed.delete(e.code));
addEventListener('blur',()=>{pressed.clear();pointers.clear();pinchDistance=0;});

const sun = new THREE.DirectionalLight(0xffd39a,2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.00016;
sun.shadow.normalBias = 0.025;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 130;
sun.shadow.map = new THREE.WebGLRenderTarget(2048,2048,{
  minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,
  format:THREE.RGBAFormat,type:THREE.UnsignedByteType,depthBuffer:true,stencilBuffer:false
});
sun.shadow.map.depthTexture = new THREE.DepthTexture(2048,2048,THREE.UnsignedIntType);
sun.shadow.map.depthTexture.format = THREE.DepthFormat;
sun.shadow.map.depthTexture.minFilter = THREE.NearestFilter;
sun.shadow.map.depthTexture.magFilter = THREE.NearestFilter;
scene.add(sun,sun.target);
const hemi = new THREE.HemisphereLight(0x8ab6c5,0x23372c,0.75);
scene.add(hemi);

// Deterministic 16×16 painted texels. No image assets and no mipmaps.
function texture16(kind,palette){
  const c=document.createElement('canvas'); c.width=c.height=16;
  const g=c.getContext('2d',{alpha:true});
  const image=g.createImageData(16,16);
  const cols=palette.map(s=>new THREE.Color(s).convertLinearToSRGB());
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    const i=(x+y*16)*4, h=hash3(x,y,kind.length*97);
    let col=cols[Math.floor(h*cols.length)%cols.length], a=255;
    if(kind==='bark'){
      const stripe=(x+Math.floor(Math.sin(y*.8)*1.5))%5;
      col=cols[stripe===0?0:stripe===1?Math.min(1,cols.length-1):Math.min(2,cols.length-1)];
      if(h>.93) col=cols[0];
    }else if(kind==='grass'){
      col=cols[(Math.floor(h*cols.length)+(y%5===0?1:0))%cols.length];
      if((x*3+y*5)%17===0) col=cols[0];
    }else if(kind==='moss'){
      col=cols[Math.floor((.65*h+.35*(Math.sin(x*.7)+Math.cos(y*.9)+2)/4)*cols.length)%cols.length];
    }else if(kind==='dirt'){
      col=cols[Math.floor(h*cols.length)%cols.length];
      if(h>.9) col=cols[0];
    }else if(kind==='stone'){
      const crack=((x+y*2)%11===0)||((x*3-y)%19===0);
      col=cols[crack?0:Math.floor(h*cols.length)%cols.length];
    }else if(kind==='leaves'){
      const hole=((x-4)*(x-4)+(y-11)*(y-11)<4)||((x-12)*(x-12)+(y-4)*(y-4)<3)||(h>.91)||((x+y*3)%29===0);
      if(hole) a=0; else col=cols[Math.floor(h*cols.length)%cols.length];
    }else if(kind==='fern'){
      a=0; const stem=Math.abs(x-8)<1 && y>2;
      const frond=(y>3 && y<15 && Math.abs(x-(8+Math.sin(y*.65)*4))<1.4)||(y>5&&y<14&&Math.abs(x-(8-Math.sin(y*.58)*5))<1.2);
      if(stem||frond){a=255;col=cols[Math.floor(h*cols.length)%cols.length];}
    }else if(kind==='blade'){
      a=0; if((Math.abs(x-4-(y>>2))<1)||(Math.abs(x-11+(y>>2))<1)||(Math.abs(x-8)<1&&y>4)){a=255;col=cols[Math.floor(h*cols.length)%cols.length];}
    }else if(kind==='flower'){
      a=0; if((Math.abs(x-8)<1&&y>6)||((x-8)*(x-8)+(y-4)*(y-4)<10)||((x-5)*(x-5)+(y-11)*(y-11)<3)){a=255;col=y<7?cols[0]:cols[Math.min(1,cols.length-1)];}
    }else if(kind==='hide'){
      col=cols[Math.floor(h*cols.length)%cols.length];
      if(y%7===0&&h>.5) col=cols[0];
    }
    image.data[i]=Math.round(clamp(col.r,0,1)*255);
    image.data[i+1]=Math.round(clamp(col.g,0,1)*255);
    image.data[i+2]=Math.round(clamp(col.b,0,1)*255);
    image.data[i+3]=a;
  }
  g.putImageData(image,0,0);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.generateMipmaps=false; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
const tex={
  bark:texture16('bark',['#30291e','#493b27','#655035','#756143']),
  grass:texture16('grass',['#203c27','#315634','#476c3c','#5d7d43','#77934f']),
  moss:texture16('moss',['#1d3c2c','#2e5938','#477344','#6b8d4a']),
  dirt:texture16('dirt',['#382f25','#514334','#6b5840','#826b49']),

const shadowGLSL=`

const skyGLSL=`

  vec3 ro=vec3(0.0,EARTH_R+900.0,0.0);

  if(hit.x>hit.y)return vec3(0.015,0.035,0.04);
  float march=hit.y/10.0;
  vec3 betaR=vec3(5.8e-6,13.5e-6,33.1e-6);

    float lm=sphereHit(p,sunDir,ATM_R).y/4.0;
    float lr=0.0,lmi=0.0;
    for(int j=0;j<4;j++){

uniform vec3 uMoonDir;
uniform float uDaylight,uNight;

function blockMaterial(map,{leaf=0,uvScale=2,caustics=0,doubleSide=false}={}){

      uniform float uLeaf;
      varying vec2 vUv;varying vec3 vWorld;varying vec3 vNormal;varying vec3 vTint;
      ${windGLSL}
      void main(){
        mat4 im=mat4(1.0);

          im=instanceMatrix;
        #endif
        vec4 wp=modelMatrix*im*vec4(position,1.0);
        wp.xyz=forestWind(wp.xyz,position,uLeaf);
        vWorld=wp.xyz;vUv=uv;
        vNormal=normalize(mat3(modelMatrix)*mat3(im)*normal);
        vTint=vec3(1.0);

      uniform sampler2D uMap;uniform float uLeaf,uUvScale,uCaustics,uLoop,uDaylight;
      uniform vec3 uSunDir,uLightDir,uSunColor,uSkyColor,uGroundColor,uFogColor;
      varying vec2 vUv;varying vec3 vWorld;varying vec3 vNormal;varying vec3 vTint;
      ${shadowGLSL}
      float caustic(vec2 p,float a){

  blurMat.uniforms.tColor.value=bloomB.texture;blurMat.uniforms.uDirection.value.set(0,1/bufferH);pass(blurMat,bloomA);
  blurMat.uniforms.tColor.value=bloomA.texture;blurMat.uniforms.uDirection.value.set(1.5/bufferW,0);pass(blurMat,bloomB);
  blurMat.uniforms.tColor.value=bloomB.texture;blurMat.uniforms.uDirection.value.set(0,1.5/bufferH);pass(blurMat,bloomA);
  finalMat.uniforms.tBloom.value=bloomA.texture;

  renderer.setRenderTarget(null);renderer.setViewport(0,0,innerWidth,innerHeight);renderer.setScissorTest(false);
  renderer.setClearColor(DARKEST,1);renderer.clear(true,true,false);
  renderer.setViewport(viewX,viewY,bufferW*upscale,bufferH*upscale);
  quad.material=finalMat;renderer.render(postScene,postCamera);
}
requestAnimationFrame(renderFrame);
</script>
