/* ============================== UTILS ============================== */
function mulberry(seed){ let a = seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
const R = mulberry(19870914);
const clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const TAU=Math.PI*2, DEG=Math.PI/180;

// keyframe environment track: array of [hour, values...], smoothstep interp
function makeTrack(keys){
  return function(h, out){
    h = clamp(h, keys[0][0], keys[keys.length-1][0]);
    let i=0; while(i<keys.length-2 && h>keys[i+1][0]) i++;
    const a=keys[i], b=keys[i+1];
    const span=(b[0]-a[0])||1; let t=(h-a[0])/span; t=t*t*(3-2*t);
    for(let k=1;k<a.length;k++) out[k-1]=lerp(a[k],b[k],t);
    return out;
  };
}
function hexLerp(a,b,t,out){ out.setHex(a); out.lerp(_tmpC.setHex(b),t); return out; }
const _tmpC=new THREE.Color();

// color-aware track over key objects {h, cols:{name:hex,...}, nums:{name:v,...}}
function makeEnv(keys){
  keys.forEach(k=>{ for(const n in k.cols) k.cols[n]=new THREE.Color(k.cols[n]); });
  return function(h, out){
    h=clamp(h,keys[0].h,keys[keys.length-1].h);
    let i=0; while(i<keys.length-2 && h>keys[i+1].h) i++;
    const a=keys[i], b=keys[i+1];
    let t=(h-a.h)/((b.h-a.h)||1); t=t*t*(3-2*t);
    for(const n in a.cols){ out.cols[n].copy(a.cols[n]).lerp(b.cols[n],t); }
    for(const n in a.nums){ out.nums[n]=lerp(a.nums[n],b.nums[n],t); }
    return out;
  };
}

/* ============================== TEXTURES ============================== */
function makeTex(w,h,fn,{srgb=true,repeat=true}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); fn(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.generateMipmaps=false;
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  return t;
}
function noiseFill(g,w,h,base,vary,seed=1,alpha=255){
  const rnd=mulberry(seed);
  const img=g.createImageData(w,h); const d=img.data;
  for(let i=0;i<w*h;i++){
    const v=(rnd()*2-1)*vary;
    d[i*4]=clamp(base[0]+v,0,255); d[i*4+1]=clamp(base[1]+v,0,255);
    d[i*4+2]=clamp(base[2]+v,0,255); d[i*4+3]=alpha;
  }
  g.putImageData(img,0,0);
}
function blotch(g,w,h,n,col,rMin,rMax,seed){
  const rnd=mulberry(seed);
  for(let i=0;i<n;i++){
    g.fillStyle=col; g.globalAlpha=0.04+rnd()*0.1;
    const r=rMin+rnd()*(rMax-rMin);
    g.fillRect(rnd()*w, rnd()*h, r, r*(0.5+rnd()));
  }
  g.globalAlpha=1;
}

// breathing + slow gaze drift
const camBase = camera.position.clone();
function cameraSway(t){
  camera.position.set(
    camBase.x + Math.sin(t*0.41)*0.004,
    camBase.y + Math.sin(t*0.83)*0.0035,
    camBase.z);
  const yaw = Math.sin(t*0.061)*0.028 - 0.095;      // ±~3° slow gaze, window slightly right of centre
  const pitch = -0.175 + Math.sin(t*0.043+1.7)*0.022;
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

/* ============================== PSX INJECTION ============================== */
// snap clip-space verts to a virtual 480-line grid + affine texture mapping
function psxify(mat, {affine=true}={}){
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh)=>{
    if(prev) prev(sh);
    sh.uniforms.uSnapGrid = GU.uSnapGrid;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform vec2 uSnapGrid;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        gl_Position.xy = (floor(gl_Position.xy / gl_Position.w * uSnapGrid + 0.5) / uSnapGrid) * gl_Position.w;
        ${affine?'#ifdef USE_MAP\n vMapUv *= gl_Position.w;\n#endif':''}`);
    if(affine){
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <map_fragment>', `#ifdef USE_MAP
 vec2 psxAffineUv = vMapUv * gl_FragCoord.w;
 #define vMapUv psxAffineUv
 #include <map_fragment>
 #undef vMapUv
#endif`);
    }
  };
  mat.customProgramCacheKey = ()=>'psx'+(affine?'a':'');
  return mat;
}
// subtle static vertex wobble for hand-built props
function jitter(geo, amt, seed=7){
  const rnd=mulberry(seed); const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    p.setXYZ(i, p.getX(i)+(rnd()-0.5)*amt, p.getY(i)+(rnd()-0.5)*amt, p.getZ(i)+(rnd()-0.5)*amt);
  }
  geo.computeVertexNormals();
  return geo;
}
function std(opts){ return psxify(new THREE.MeshStandardMaterial(Object.assign({flatShading:true},opts))); }

/* ============================== SKY ============================== */
const skyU = {
  uSunDir:{value:new THREE.Vector3(0,0.2,1)},
  uZen:{value:new THREE.Color(0x7ba0cf)},
  uHor:{value:new THREE.Color(0xe0cba8)},
  uSunCol:{value:new THREE.Color(0xffe8c8)},
  uSunI:{value:2.5},
  uHaze:{value:1.0},
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(2600, 24, 12),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:skyU,
    vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vDir;
      uniform vec3 uSunDir,uZen,uHor,uSunCol; uniform float uSunI,uHaze;
      void main(){
        vec3 d=normalize(vDir);
        float sd=dot(d,uSunDir);
        float horiz=pow(1.0-clamp(d.y,0.0,1.0),2.6);
        vec3 col=mix(uZen,uHor,horiz)*0.60;
        // wide warm mie halo (dusty late-summer air)
        float g=0.72;
        float mie=(1.0-g*g)/pow(1.0+g*g-2.0*g*sd,1.5);
        mie=min(mie,5.0);
        col+=uSunCol*mie*0.045*uHaze;
        // low warm glow around sun near horizon
        col+=uSunCol*pow(max(sd,0.0),6.0)*0.10*uHaze*horiz;
        // sun disc (HDR, feeds bloom)
        float disc=smoothstep(0.99900,0.99960,sd);
        col+=uSunCol*disc*0.55*max(uSunI,0.0);
        // ground haze below horizon
        col*=mix(0.55,1.0,smoothstep(-0.25,0.0,d.y));
        gl_FragColor=vec4(col,1.0);
      }`
  }));
sky.frustumCulled=false;
scene.add(sky);

const FACADE_HASH = `
  float bfhash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
`;
function facadeTex(cols,rows,base,seamCol,seed){
  return makeTex(128,128,(g,w,h)=>{
    noiseFill(g,w,h,base,9,seed);
    blotch(g,w,h,20,'#8f8468',3,12,seed+1);
    // panel seams
    g.fillStyle=seamCol;
    for(let x=0;x<w;x+=Math.round(w/cols/2)) g.fillRect(x,0,1,h);
    for(let y=0;y<h;y+=Math.round(h/rows)) g.fillRect(0,y,w,1);
    // windows: cut alpha holes with pale frames
    const cw=w/cols, ch=h/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const wx=c*cw+cw*0.22, wy=r*ch+ch*0.2, ww=cw*0.62, wh=ch*0.60;
      g.fillStyle='rgba(220,214,196,0.9)'; g.fillRect(wx-1,wy-1,ww+2,wh+2);
      g.save(); g.globalAlpha=0; g.clearRect(wx,wy,ww,wh); g.restore();
    }
  });
}
function facadeMat(map,cols,rows,seed){
  const m=std({map,roughness:0.95});
  const prev=m.onBeforeCompile;
  m.onBeforeCompile=(sh)=>{
    prev(sh);
    sh.uniforms.uWinLit=GU.uWinLit; sh.uniforms.uTime=GU.uTime;
    sh.uniforms.uSunDirView=GU.uSunDirView; sh.uniforms.uSunColor=GU.uSunColor;
    sh.uniforms.uSunI=GU.uSunI;
    sh.uniforms.uSeed={value:seed}; sh.uniforms.uWinGrid={value:new THREE.Vector2(cols,rows)};
    sh.uniforms.uGlintI=GU.uGlintI;
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform float uWinLit,uTime,uSeed,uSunI,uGlintI;uniform vec2 uWinGrid;uniform vec3 uSunDirView,uSunColor;'+FACADE_HASH)
      .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
      {
        float wm=1.0-diffuseColor.a; diffuseColor.a=1.0;
        vec2 cell=floor(vMapUv*uWinGrid);
        float rndC=bfhash(cell+uSeed);
        float lit=step(1.0-uWinLit,rndC);
        lit*=step(0.18,bfhash(cell+floor(uTime*1.7)+uSeed*3.1)); // fast-forward flicker
        vec3 wc=mix(vec3(1.0,0.62,0.25),vec3(0.55,0.68,1.0),step(0.88,bfhash(cell+3.7+uSeed)));
        totalEmissiveRadiance+=wc*lit*wm*1.5;
        // sun flashes in opposite windows
        vec3 V=normalize(vViewPosition);
        float gl=pow(max(dot(reflect(-V,normal),uSunDirView),0.0),18.0);
        gl*=step(0.55,bfhash(cell+9.3+uSeed))*uSunI*uGlintI;
        totalEmissiveRadiance+=uSunColor*gl*wm*1.6;
      }`);
  };
  m.customProgramCacheKey=()=>'psxfacade';
  return m;

// reusable balconies + laundry for a block face (local +z face)
function addBalconies(x,z,w,floors,ry,seed){
  const g=new THREE.Group(); g.position.set(x,GY,z); g.rotation.y=ry;
  const railM=std({color:0x5a564c,roughness:0.8,metalness:0.3});
  const glassCols=[0x8aa89a,0xb89a5a,0x9aa4ae,0x7a8a9a]; // mint / ochre / grey glazing
  const rnd=mulberry(seed);
  const bg=[];
  const ncol=Math.max(3,Math.round(w/12));
  for(let f=0;f<floors;f++) for(let e=0;e<ncol;e++){
    const bx=-w/2+6+e*(w-12)/Math.max(1,ncol-1)+(rnd()-0.5)*0.5, by=2.2+f*2.9, bz=6.05;
    const parts=[];
    parts.push(new THREE.BoxGeometry(3.1,0.14,1.1).translate(bx,by,bz));
    parts.push(new THREE.BoxGeometry(3.1,0.9,0.06).translate(bx,by+0.5,bz+0.52));
    if(rnd()<0.55){ // glazed
      const gc=glassCols[(rnd()*glassCols.length)|0];
      bg.push({g:new THREE.BoxGeometry(3.0,1.1,0.9).translate(bx,by+0.62,bz),c:gc});
    }
    const mm=new THREE.Mesh(mergeGeometries(parts),railM);
    mm.castShadow=true; g.add(mm);
    if(rnd()<0.18){ // laundry
      for(let li=0;li<2;li++){
        const lau=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.5),
          std({color:[0xc8b8a8,0x9a4a3a,0x5a7a8a,0xd0c890][(rnd()*4)|0],side:THREE.DoubleSide,roughness:1}));
        lau.position.set(bx-0.8+li*1.4,by+0.55,bz+0.6);
        FLAP.push({obj:lau,phase:rnd()*TAU});
        g.add(lau);
      }
    }
  }
  for(const b of bg){
    const mm=new THREE.Mesh(b.g,std({color:b.c,roughness:0.4,metalness:0.2}));
    mm.castShadow=true; g.add(mm);
  }
  district.add(g);
}

const DRAGS=[4,18,31,44,53];
function dragPulse(t){
  let p=0;
  for(const d of DRAGS){ const k=t-d; if(k>0&&k<3.5) p=Math.max(p,Math.exp(-k*1.9)*sstep(0,0.12,k)); }
  return p;
}
function cigState(t){
  const burn=clamp((t-2)/52,0,1);
  const len=lerp(0.085,0.035,burn);
  paperMesh.scale.y=len/0.085; paperMesh.position.z=-len/2;
  // ash grows between flicks (flick at 26)
  const sinceFlick=t<26?t-2:t-26;
  const ashLen=clamp(0.003+sinceFlick*0.00045,0.003,0.014);
  ashMesh.scale.y=ashLen/0.012; ashMesh.position.z=-len-0.004-ashLen/2;

const GradeShader={
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uCell:{value:2},uFade:{value:1}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec2 vUv;
    uniform sampler2D tDiffuse; uniform float uTime,uCell,uFade;
    float B2(vec2 a){ a=floor(a); return fract(a.x/2.0+a.y*a.y*0.75); }
    float bayer4(vec2 p){ return B2(0.5*p)*0.25+B2(p); }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec3 c=texture2D(tDiffuse,vUv).rgb;
      float luma=dot(c,vec3(0.299,0.587,0.114));
      // warm grade: shadows lifted toward brown, highlights toward amber
      c+=vec3(0.030,0.016,0.006)*(1.0-smoothstep(0.0,0.45,luma));
      c=mix(c,c*vec3(1.06,0.99,0.90)+vec3(0.02,0.008,0.0),smoothstep(0.55,1.0,luma)*0.6);
      // vignette
      vec2 q=vUv-0.5; c*=1.0-dot(q,q)*0.55;
      // film grain
      c+=(hash(vUv*vec2(1920.0,1080.0)+fract(uTime)*7.0)-0.5)*0.028;
      // 15-bit colour through 4x4 ordered dither
      float d=(bayer4(gl_FragCoord.xy/uCell)-0.5);
      c=floor(c*31.0+0.5+d*0.9)/31.0;
      c*=uFade;
      gl_FragColor=vec4(c,1.0);
    }`
};

const Snd={

    const wg=this.windGain=C.createGain(); wg.gain.value=0.035;
    wind.connect(wf); wf.connect(wg); wg.connect(M); wind.start();

    const cf=C.createBiquadFilter(); cf.type='bandpass'; cf.frequency.value=1300; cf.Q.value=0.6;

    const u=pg.userData;
    const cyc=(t+u.phase*3)%17;
    const fly=sstep(0,1.4,cyc)*(1-sstep(5.5,8.5,cyc));
    const a=t*(1.2+fly*1.5)+u.phase;
    const r=u.r*(1+fly*1.6);
    pg.position.set(u.cx+Math.cos(a)*r, GY+0.4+fly*7+Math.sin(t*3+u.phase)*0.2, u.cz+Math.sin(a)*r);
    pg.rotation.y=-a; pg.rotation.z=Math.sin(t*(8+fly*16)+u.phase)*(0.15+fly*0.5);
  }
  for(const cl of clouds){
    cl.position.x+=cl.userData.sp*dt*(FREEZE_T!==null?0:1);
    if(cl.position.x>1000) cl.position.x=-1000;
    cl.material.color.copy(Cc.hor).lerp(_c.setHex(0xffffff),0.35);
  }
  // TPP steam plume, fast billow, sun-lit
  {
    const back=clamp(_sunDir.z,0,1); // sun behind the stacks from our view
    for(const s of plumeSprites){
      const u=s.userData;
      const life=((t*u.sp*3.0+u.off*7.0)%1);
      s.position.set(u.sx+Math.sin(u.wob+life*9.0)*7+life*36, GY+88+life*95, -570+life*14);
      const sc=28+life*125; s.scale.set(sc,sc*0.8,1);
      s.material.opacity=0.34*(1-life)*(0.7+0.3*Math.sin(u.wob+t*2.0));
      s.material.color.copy(Cc.sun).lerp(_c.setHex(0xd8ccc4),0.35+0.35*(1-back));
    }
  }
  // sound events
  if(FREEZE_T===null&&Snd.on){
    for(const d of DRAGS){
      if(crossed(t,d)){ Snd.crackle(); Snd.breath(false); }
      if(crossed(t,d+2.3)){ Snd.breath(true); }
    }
    if(crossed(t,26.35)) Snd.tap();
    Snd.dayAmt=sstep(6.5,8.5,h)*(1-sstep(19.0,20.5,h));
    Snd.dayGain.gain.setTargetAtTime(0.014*Snd.dayAmt,Snd.ctx.currentTime,0.8);
  }
  // fade to black 57-60, quick fade-in at loop start
  grade.uniforms.uFade.value=(t<2?sstep(0,2,t):1)*(t>57?1-sstep(57,59.6,t):1);
  grade.uniforms.uTime.value=wt;
  // debug isolation: ?dbg=nohemi,nosun,nolamp,noember,nopost
  const DBG=((new URLSearchParams(location.search)).get('dbg')||'');
  if(DBG.includes('nohemi')) hemi.intensity=0;
  if(DBG.includes('nosun')){ sunNear.intensity=0; sunFar.intensity=0; }
  if(DBG.includes('nolamp')) lampLight.intensity=0;
  if(DBG.includes('noember')) emberLight.intensity=0;
  if(DBG.includes('noglint')) GU.uGlintI.value=0;
  if(DBG.includes('nobloom')) bloom.strength=0;
  if(DBG.includes('nobeam')){ beamU.uBeamI.value=0; dustPts.material.uniforms.uBeamI.value=0; }
  if(DBG.includes('nosmoke')){ wisp.visible=false; exhale.visible=false; }
  if(DBG.includes('noglass')) glassM.opacity=0;
  if(DBG.includes('noroom')) room.visible=false;
  if(DBG.includes('hand')&&!handG._dbgDone){
    handG._dbgDone=true;
    scene.attach(handG);
  }
  if(DBG.includes('hand')){
    handG.position.set(0.0,1.30,-0.35);
    camera.position.set(0.13,1.47,0.03);
    camera.lookAt(-0.02,1.26,-0.50);
    hemi.intensity=1.2; amb.intensity=0.8; sunNear.intensity=2.5; sunNear.position.set(2,3,1);
  }
  composer.render();
  prevT=t;
}
setupPost(innerWidth,innerHeight);
applySize();
addEventListener('resize',applySize);
animate();
</script>
