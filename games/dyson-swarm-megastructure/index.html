<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0d10" />
    <title>Dyson Swarm · Heliograph Observatory</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23efb967' stroke-width='2'/%3E%3Cpath d='m4 25 24-18' stroke='%23efb967' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas
      id="space"
      aria-label="Interactive three-dimensional Dyson swarm and orbital shipyards"
    ></canvas>
    <svg class="defs" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="logo" viewBox="0 0 42 42">
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="21" cy="21" r="12" />
            <ellipse cx="21" cy="21" rx="20" ry="6.8" transform="rotate(-42 21 21)" />
            <path d="M6 35 35 6" />
            <circle cx="21" cy="21" r="3.4" fill="currentColor" stroke="none" />
          </g>
        </symbol>
        <symbol id="sliders" viewBox="0 0 24 24">
          <path d="M3 7h5m5 0h8M3 17h11m5 0h2" />
          <circle cx="10.5" cy="7" r="2.5" />
          <circle cx="16.5" cy="17" r="2.5" />
        </symbol>
        <symbol id="bolt" viewBox="0 0 24 24"><path d="m14 2-9 12h6l-1 8 9-13h-6z" /></symbol>
        <symbol id="expand" viewBox="0 0 24 24">
          <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" />
        </symbol>
        <symbol id="sound" viewBox="0 0 24 24">
          <path d="m3 9 4 0 5-4v14l-5-4H3zM16 9q3 3 0 6m2-9q6 6 0 12" />
        </symbol>
        <symbol id="mute" viewBox="0 0 24 24">
          <path d="m3 9 4 0 5-4v14l-5-4H3zM16 9l5 6m0-6-5 6" />
        </symbol>
        <symbol id="orbit" viewBox="0 0 24 24">
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-35 12 12)" />
          <circle cx="12" cy="12" r="6" />
        </symbol>
        <symbol id="dock" viewBox="0 0 24 24">
          <path d="m4 19 2-13h12l2 13M4 19h16M6 6l12 0-5 5H9zm3 9 7-3-2 4H8z" />
        </symbol>
        <symbol id="wide" viewBox="0 0 24 24">
          <path d="M4 9V5h4m8 0h4v4M4 15v4h4m8 0h4v-4" />
          <circle cx="12" cy="12" r="3.2" />
        </symbol>
        <symbol id="play" viewBox="0 0 24 24">
          <path d="m7 4 12 8-12 8z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="pause" viewBox="0 0 24 24">
          <path d="M8 5v14m8-14v14" stroke-width="3" />
        </symbol>
        <symbol id="drag" viewBox="0 0 24 24">
          <ellipse cx="12" cy="13" rx="6" ry="8" />
          <path d="M12 5v7" />
        </symbol>
      </defs>
    </svg>
    <div id="hud">
      <header>
        <div class="brand">
          <svg><use href="#logo" /></svg><strong>Heliograph</strong><i></i
          ><span>Orbital Observatory</span>
        </div>
        <div class="header-right">
          <span class="status"><b></b>Live simulation</span><i></i
          ><button
            class="icon"
            id="audio"
            title="Enable soundtrack"
            aria-label="Enable soundtrack"
            aria-pressed="false"
          >
            <svg><use href="#mute" /></svg></button
          ><button class="icon" id="fullscreen" title="Full screen" aria-label="Full screen">
            <svg><use href="#expand" /></svg>
          </button>
        </div>
      </header>
      <main>
        <div class="field-id">
          <span class="cross"></span> <b>DS–01</b> <span class="soft">/</span>
          <span id="collectorCount"></span>
        </div>
        <aside class="deck" id="deck">
          <button id="fold" aria-expanded="true" aria-controls="deckBody">
            <span
              ><svg><use href="#sliders" /></svg>Control deck</span
            ><span id="foldMark">−</span>
          </button>
          <div id="deckBody">
            <div class="control">
              <label for="completion"
                >Swarm completion <output id="completionVal">74%</output></label
              ><input
                type="range"
                id="completion"
                min="10"
                max="95"
                value="74"
                aria-valuetext="74%"
              />
              <div class="ends"><span>10% Sparse</span><span>95% Enclosed megastructure</span></div>
            </div>
            <div class="control">
              <label for="activity"
                >Solar flare activity <output id="activityVal">68%</output></label
              ><input type="range" id="activity" min="0" max="100" value="68" />
              <div class="ends"><span>Quiescent</span><span>Volatile</span></div>
            </div>
            <button id="surge">
              <svg><use href="#bolt" /></svg><span>Power beam surge</span
              ><span class="arrow">↗</span>
            </button>
            <div class="section-label">Camera presets</div>
            <div class="presets">
              <button data-mode="macro" aria-pressed="true">
                <svg><use href="#orbit" /></svg>Macro Ring &amp; Star<span></span>
              </button>
              <button data-mode="ship" aria-pressed="false">
                <svg><use href="#dock" /></svg>Shipyard Gantry Flyby<span></span>
              </button>
              <button data-mode="wide" aria-pressed="false">
                <svg><use href="#wide" /></svg>Distant Scale Wide<span></span>
              </button>
            </div>
          </div>
        </aside>
        <div class="caption">
          <div class="category"><i></i>Stellar megastructures</div>
          <h1>Dyson Swarm</h1>
          <p>Harvesting a Dying Star</p>
        </div>
        <div class="orbit-hint">
          <svg><use href="#drag" /></svg>Drag to orbit <b>·</b> Scroll to zoom
        </div>
      </main>
      <footer>
        <button id="showcase" aria-label="Auto Showcase (30s)" aria-pressed="false">
          <span class="play-box"
            ><svg><use href="#play" /></svg></span
          ><span>Auto showcase <small>30s</small></span>
        </button>
        <div class="transport">
          <input
            type="range"
            aria-label="Showcase timeline"
            id="timeline"
            min="0"
            max="30"
            step=".01"
            value="0"
          />
          <div class="chapters">
            <span>Shipyard</span><span>Power relay</span><span>Swarm reveal</span>
          </div>
        </div>
        <div class="clock"><strong id="clock">00:00</strong> <span>/ 00:30</span></div>
      </footer>
    </div>
    <div id="loading">Calibrating observatory…</div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
