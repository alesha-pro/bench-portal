    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtCausticRead.tex);
    gl.uniform1i(uCausticAccum['uCausticNew'], 0);
    gl.uniform1i(uCausticAccum['uCausticPrev'], 1);
    const motionSpeed = Math.hypot(
      candles[0].vx, candles[0].vz, candles[1].vx, candles[1].vz, candles[2].vx, candles[2].vz
    ) + Math.abs(pourVel) * 4.0;
    const causticAlpha = frameCounter < 3 ? 1.0 : clamp(0.24 + motionSpeed * 0.25, 0.24, 0.72);
    gl.uniform1f(uCausticAccum['uBlendAlpha'], causticAlpha);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Swap caustic temporal ping-pong
    { const tmp = rtCausticRead; rtCausticRead = rtCausticWrite; rtCausticWrite = tmp; }

    // Combine Lit Splats + Caustic Buffer into rtSceneA BEFORE Glass Ray-Tracing
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtSceneA.fbo);
    gl.useProgram(progSceneCombine);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtSplatColor.tex);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtCausticRead.tex);
    gl.uniform1i(uSceneCombine['uSplatColorTex'], 0);
    gl.uniform1i(uSceneCombine['uCausticTex'], 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // -----------------------------------------------------------------------
    // PASS 4: Analytic Ray-Traced Hero Glass & Wine (Back-to-Front over Bounds)
    // -----------------------------------------------------------------------
    const vesselOrder = [0, 1, 2].sort((a, b) => {
      const da = Math.hypot(uVesselsFlat[a * 4] - camEye[0], uVesselsFlat[a * 4 + 2] - camEye[2]);
      const db = Math.hypot(uVesselsFlat[b * 4] - camEye[0], uVesselsFlat[b * 4 + 2] - camEye[2]);
      return db - da; // furthest vessel first so nearer vessel refracts it!
    });

    for (let k = 0; k < 3; k++) {
      const vIdx = vesselOrder[k];
      // Copy current scene rtSceneA -> rtSceneB, then ray-trace vessel over its screen bounds into rtSceneB
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, rtSceneA.fbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, rtSceneB.fbo);
      gl.blitFramebuffer(0, 0, TARGET_W, TARGET_H, 0, 0, TARGET_W, TARGET_H, gl.COLOR_BUFFER_BIT, gl.NEAREST);

      gl.bindFramebuffer(gl.FRAMEBUFFER, rtSceneB.fbo);
      gl.viewport(0, 0, TARGET_W, TARGET_H);
      gl.useProgram(progGlass);

      const bounds = computeVesselScreenBounds(vIdx);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, rtSceneA.tex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, rtSplatDepth.tex);

      gl.uniform1i(uGlass['uSceneTex'], 0);
      gl.uniform1i(uGlass['uSplatDepthTex'], 1);
      gl.uniform4f(uGlass['uBoundsUV'], bounds[0], bounds[1], bounds[2], bounds[3]);
      gl.uniformMatrix4fv(uGlass['uInvViewProj'], false, mInvViewProj);
      gl.uniformMatrix4fv(uGlass['uViewProj'], false, mViewProj);
      gl.uniformMatrix4fv(uGlass['uView'], false, mView);
      gl.uniform2fv(uGlass['uScreenSnap'], screenSnap);
      gl.uniform3fv(uGlass['uCamPos'], camEye);
      gl.uniform1i(uGlass['uVesselIdx'], vIdx);
      gl.uniform3fv(uGlass['uWickPos[0]'], uWickPosFlat);
      gl.uniform3fv(uGlass['uFlameLean[0]'], uFlameLeanFlat);
      gl.uniform3fv(uGlass['uLightPos[0]'], uLightPosFlat);
      gl.uniform3fv(uGlass['uLightCol[0]'], uLightColFlat);
      gl.uniform3fv(uGlass['uFlameLit'], uFlameLitVec);
      gl.uniform4fv(uGlass['uVessels[0]'], uVesselsFlat);
      gl.uniform3fv(uGlass['uWineLevels'], uWineLevelsVec);
      gl.uniform2f(uGlass['uWineSlosh'], sloshX, sloshZ);
      gl.uniform1f(uGlass['uTime'], nowSec);

      gl.bindVertexArray(emptyVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 6);

      const tmp = rtSceneA; rtSceneA = rtSceneB; rtSceneB = tmp;
    }

    // -----------------------------------------------------------------------
    // PASS 5: 640x360 HDR Bloom (Flame Halos & Facet/Rim Glints BEFORE Palette)
    // -----------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomExtract.fbo);
    gl.viewport(0, 0, TARGET_W, TARGET_H);
    gl.useProgram(progBloomExtract);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtSceneA.tex);
    gl.uniform1i(uBloomExtract['uHdrTex'], 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Fine 640x360 separable blur (crisp glint glow)
    gl.useProgram(progBloomBlur);
    gl.uniform1i(uBloomBlur['uTex'], 0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomTemp.fbo);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomExtract.tex);
    gl.uniform2f(uBloomBlur['uDir'], 1.0 / TARGET_W, 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomFine.fbo);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomTemp.tex);
    gl.uniform2f(uBloomBlur['uDir'], 0.0, 1.0 / TARGET_H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Wide 320x180 separable blur (soft warm Caravaggio flame halo)
    gl.viewport(0, 0, 320, 180);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomWideTmp.fbo);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomFine.tex);
    gl.uniform2f(uBloomBlur['uDir'], 1.6 / 320.0, 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomWide.fbo);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomWideTmp.tex);
    gl.uniform2f(uBloomBlur['uDir'], 0.0, 1.6 / 180.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // -----------------------------------------------------------------------
    // PASS 6: 640x360 48-Colour Palette Snap & Light 4x4 Ordered Bayer Dither
    // -----------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtPaletted.fbo);
    gl.viewport(0, 0, TARGET_W, TARGET_H);
    gl.useProgram(progPaletteDither);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtSceneA.tex);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomFine.tex);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomWide.tex);
    gl.uniform1i(uPaletteDither['uHdrTex'], 0);
    gl.uniform1i(uPaletteDither['uBloomFineTex'], 1);
    gl.uniform1i(uPaletteDither['uBloomWideTex'], 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // -----------------------------------------------------------------------
    // PASS 7: Integer NearestFilter Upscale (x3 on 1080p+) + Letterbox
    // -----------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.031, 0.023, 0.039, 1.0); // #08060a letterbox frame
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.viewport(viewRect.physX, viewRect.physY, viewRect.physW, viewRect.physH);
    gl.useProgram(progUpscale);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtPaletted.tex);
    gl.uniform1i(uUpscale['uPalettedTex'], 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(renderFrame);
  }

  // Expose internal diagnostic API for automated visual & FPS verification (zero UI)
  window.__SCENE__ = {
    getStats: () => ({
      fps: fpsSmooth,
      frames: frameCounter,
      splatCount,
      photonCount: PHOTON_COUNT,
      pourRatio: currentPourRatio,
      wineLevels: Array.from(uWineLevelsVec),
      candles: candles.map(c => ({ x: c.x, y: c.y, z: c.z, lit: c.lit })),
      scale: viewRect.scale
    }),
    setPreset: (name) => {
      programmaticOverride = true;
      lastInputTime = performance.now() * 0.001;
      if (name === 'default') {
        programmaticOverride = false;
        const pos = [[-0.62, -0.96], [0.68, -0.96], [-1.76, 0.08]];
        pos.forEach(([x, z], i) => {
          candles[i].x = x; candles[i].z = z; candles[i].y = getTableSurfaceY(x, z);
          candles[i].lit = 1; candles[i].targetLit = 1;
        });
      } else if (name === 'behind_decanter') {
        // Candle directly behind decanter belly: ruby glowing rim & big red caustic pool forward!
        const pos = [[-0.60, -0.88], [0.64, -0.96], [1.58, -0.45]];
        pos.forEach(([x, z], i) => {
          candles[i].x = x; candles[i].z = z; candles[i].y = getTableSurfaceY(x, z);
          candles[i].lit = 1; candles[i].targetLit = 1;
        });
      } else if (name === 'side_triple') {
        // Candles to the left/back-left side: 3 well-separated candles casting long overlapping triple shadows, each with red caustic!
        const pos = [[-1.52, -0.92], [-1.96, -0.32], [-1.62, 0.28]];
        pos.forEach(([x, z], i) => {
          candles[i].x = x; candles[i].z = z; candles[i].y = getTableSurfaceY(x, z);
          candles[i].lit = 1; candles[i].targetLit = 1;
        });
      } else if (name === 'one_candle_chiaroscuro') {
        // Single candle left: hard Caravaggio chiaroscuro, deep plum shadow, glass lit from one side!
        const pos = [[-1.68, -0.18], [0.82, -1.08], [1.62, 0.25]];
        pos.forEach(([x, z], i) => {
          candles[i].x = x; candles[i].z = z; candles[i].y = getTableSurfaceY(x, z);
          candles[i].lit = (i === 0 ? 1 : 0);
          candles[i].targetLit = (i === 0 ? 1 : 0);
        });
      }
    },
    setPour: (r) => { targetPourRatio = clamp(r, 0.04, 0.96); },
    triggerDraught: () => { draughtStartTime = performance.now() * 0.001; },
    samplePalettedStats: () => {
      const buf = new Uint8Array(TARGET_W * TARGET_H * 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, rtPaletted.fbo);
      gl.readPixels(0, 0, TARGET_W, TARGET_H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      const colors = new Set();
      let pureBlackCount = 0;
      for (let i = 0; i < buf.length; i += 4) {
        const key = (buf[i] << 16) | (buf[i + 1] << 8) | buf[i + 2];
        colors.add(key);
        if (buf[i] === 0 && buf[i + 1] === 0 && buf[i + 2] === 0) pureBlackCount++;
      }
      return { uniqueColors: colors.size, pureBlackCount };
    }
  };

  requestAnimationFrame(renderFrame);
})();
</script>
