function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20261115);
const R = (a=1,b)=> b===undefined ? rng()*a : a+rng()*(b-a);

/* ---------------- day loop: 48 s, time-warped ---------------- */

// [tStart,tEnd, solarHourStart,solarHourEnd]  noon 12% | golden+sunset 30% | blue 20% | night 25% | dawn 13%
const SEG = [[0,0.12,10.5,16.7],[0.12,0.42,16.7,18.15],[0.42,0.62,18.15,18.75],[0.62,0.87,18.75,27],[0.87,1.0,27,34.5]];
function solarHours(t){
  t = ((t % 1) + 1) % 1;
  for (const s of SEG){ if (t >= s[0] && t < s[1]){ const f=(t-s[0])/(s[1]-s[0]); return s[2]+f*(s[3]-s[2]); } }
  return SEG[0][2];
}
const MAX_EL = 1.08; // ~62 deg noon altitude
function bodyDir(h){ // sun path; moon uses h+12
  const el = Math.sin((h-6)/12*Math.PI)*MAX_EL;
  const az = 0.26 + (h-6)/12*Math.PI;
  return new THREE.Vector3(Math.cos(az)*Math.cos(el), Math.sin(el), Math.sin(az)*Math.cos(el));
}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------------- procedural 16x16 textures ---------------- */
function makeTex(draw){
  const cv=document.createElement('canvas'); cv.width=16; cv.height=16;
  const g=cv.getContext('2d'); draw(g);
  const tx=new THREE.CanvasTexture(cv);
  tx.magFilter=THREE.NearestFilter; tx.minFilter=THREE.NearestFilter;
  tx.generateMipmaps=false; tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}
function px(g,x,y,c){g.fillStyle=c;g.fillRect(x,y,1,1);}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*f),0,255);gg=clamp(Math.round(gg*f),0,255);b=clamp(Math.round(b*f),0,255);
  return `rgb(${r},${gg},${b})`;
}

/* ---------------- geometry batching (blocks, uv in meters/4) ---------------- */
class Batch {
  constructor(){ this.p=[]; this.n=[]; this.u=[]; }
  geo(geo, mat4, uvScale=1){
    const g = geo.index ? geo.toNonIndexed() : geo;
    g.applyMatrix4(mat4);
    const pos=g.attributes.position, nor=g.attributes.normal, uv=g.attributes.uv;
    for(let i=0;i<pos.count;i++){
      this.p.push(pos.getX(i),pos.getY(i),pos.getZ(i));
      this.n.push(nor.getX(i),nor.getY(i),nor.getZ(i));
      this.u.push(uv.getX(i)*uvScale, uv.getY(i)*uvScale);
    }
    if (g!==geo) g.dispose();
  }
  box(w,h,d,x,y,z,rotY=0,uvMul=1){
    const g=new THREE.BoxGeometry(w,h,d);
    const uv=g.attributes.uv;
    // faces: +x,-x (d,h) | +y,-y (w,d) | +z,-z (w,h)
    const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for(let f=0;f<6;f++)for(let v=0;v<4;v++){
      const i=f*4+v;
      uv.setXY(i, uv.getX(i)*dims[f][0]/4*uvMul, uv.getY(i)*dims[f][1]/4*uvMul);
    }
    const m=new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),
      new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),rotY), new THREE.Vector3(1,1,1));
    this.geo(g,m); g.dispose();
  }
  build(mat,cast=true,recv=true){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));
    const m=new THREE.Mesh(g,mat); m.castShadow=cast; m.receiveShadow=recv;
    return m;
  }
}
const batches={};
function B(key){ if(!batches[key]) batches[key]=new Batch(); return batches[key]; }
function box(key,w,h,d,x,y,z,rotY=0){ B(key).box(w,h,d,x,y,z,rotY); }
// gable roof prism: ridge along local Z, cross-section triangle in XY
function prismGeo(w,h,d){
  const hw=w/2,hd=d/2;
  const A=[-hw,0,-hd],Bp=[hw,0,-hd],C=[0,h,-hd],D=[-hw,0,hd],E=[hw,0,hd],F=[0,h,hd];
  const tris=[ A,Bp,C,  E,D,F,            // gables
    A,C,F, A,F,D,                        // left slope
    C,Bp,E, C,E,F,                       // right slope
    D,E,Bp, D,Bp,A ];                    // bottom
  const pos=[],nor=[],uv=[];
  const nrm=(a,b,c)=>{const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
    const l=Math.hypot(...n);return [n[0]/l,n[1]/l,n[2]/l];};
  for(let t=0;t<tris.length;t+=3){
    const a=tris[t],b=tris[t+1],c=tris[t+2],n=nrm(a,b,c);
    for(const p of [a,b,c]){ pos.push(...p); nor.push(...n); uv.push((p[0]+p[2])*0.25+0.5,(p[1]+p[2])*0.25); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  return g;
}
function roof(key,w,h,d,x,y,z,rotY=0){
  const m=new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),rotY),new THREE.Vector3(1,1,1));
  B(key).geo(prismGeo(w,h,d),m);
}
function cyl(key,rt,rb,h,seg,x,y,z){
  const g=new THREE.CylinderGeometry(rt,rb,h,seg);
  const uv=g.attributes.uv;
  const circ=2*Math.PI*(rt+rb)/2;
  for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*circ/4, uv.getY(i)*h/4);
  const m=new THREE.Matrix4().makeTranslation(x,y,z);
  B(key).geo(g,m); g.dispose();
}

/* ---------------- coast & terrain ---------------- */

  let c = -20 + 2.5*Math.sin(z*0.1+1.7);
  const head = smooth(-50,-34,z)*(1-smooth(-30,-22,z)); // rocky headland to the north-west
  c -= 11*head;
  return c;
}

const SQUARE = {x0:1.5,x1:13.5,z0:5,z1:12.5,y:9};
const LIGHTHOUSE = {x:-26, z:-38, y:6};
function padH(x,z){
  for(const h of HOUSES){
    if (Math.abs(x-h[0])<h[3]/2+1.4 && Math.abs(z-h[2])<h[4]/2+1.4) return h[1];
  }
  if (x>SQUARE.x0&&x<SQUARE.x1&&z>SQUARE.z0&&z<SQUARE.z1) return SQUARE.y;
  if (x>-19&&x<-12&&z>1.5&&z<9.5) return 1.2;
  if (Math.hypot(x-LIGHTHOUSE.x,z-LIGHTHOUSE.z)<4.5) return LIGHTHOUSE.y;
  return null;
}
function terrainH(x,z){
  const pad = padH(x,z); if (pad!==null) return pad;
  const c = coastX(z);
  if (x < c) return -2.5;
  const n = 0.3*Math.sin(x*0.35+z*0.21)+0.18*Math.sin(x*0.13-z*0.47);
  let h;
  if (x < -14) h = 1;
  else if (x < -11) h = 2.6; // boat-house bench between shore and lower terrace
  else if (x < -1) h = 4.5;
  else if (x < 2) h = lerp(4.5,9,(x+1)/3);
  else if (x < 11) h = 9;
  else if (x < 14) h = lerp(9,14,(x-11)/3);
  else h = 14;
  const hd = Math.hypot(x-LIGHTHOUSE.x, z-LIGHTHOUSE.z);
  h += 5.5*Math.exp(-hd*hd/150);           // headland rock
  h += 2.0*Math.exp(-((x-40)**2+(z-26)**2)/120); // camera hill
  return h + n;

  const cd=0.5*Math.exp(-0.24)*(1-night), cdt=[0.55,0.62,0.78], cda=[0.0036,0.0156,0.024];
  for(let c=0;c<3;c++) hz[c]=hz[c]*(1-cd)+(hz[c]*cdt[c]+cda[c])*cd;
  const ag=smooth(-7,-1,elDeg)*(1-smooth(-1,2,elDeg));
  const shH=Math.hypot(sunDir.x,sunDir.z)||1, fH=Math.hypot(fwdH.x,fwdH.z)||1;
  const azp=Math.pow(Math.max((fwdH.x*sunDir.x+fwdH.z*sunDir.z)/(shH*fH),0),3);
  const agv=ag*azp*Math.exp(-0.03*6);
  hz[0]+=0.32*agv; hz[1]+=0.13*agv; hz[2]+=0.17*agv;
  for(let c=0;c<3;c++) hz[c]*=1-0.35*ag*azp*0.4;
  const zen = atmoJS([0,1,0],[sunDir.x,sunDir.y,sunDir.z],skyI,tint);
  const nb=[0.010*night,0.017*night,0.040*night];
  scene.fog.color.setRGB(clamp(hz[0]+nb[0],0,1),clamp(hz[1]+nb[1],0,1),clamp(hz[2]+nb[2],0,1));
  const amb=[lerp(zen[0],hz[0],0.65)*(1.6+0.9*dusk)+nb[0]*2, lerp(zen[1],hz[1],0.65)*(1.6+0.9*dusk)+nb[1]*2, lerp(zen[2],hz[2],0.65)*(1.6+0.9*dusk)+nb[2]*2];
  hemi.color.setRGB(clamp(amb[0],0,1),clamp(amb[1],0,1),clamp(amb[2],0,1));
  hemi.groundColor.setRGB(0.20*day+0.03*night,0.185*day+0.04*night,0.15*day+0.07*night);
  hemi.intensity = 0.5+2.2*day+0.5*dusk+0.35*night;
  state.letterbox.setRGB(clamp(zen[0]*0.22+0.004,0,1),clamp(zen[1]*0.22+0.006,0,1),clamp(zen[2]*0.22+0.013,0,1));
  state.exposure = lerp(1.30 - 0.12*dusk, 2.40, night);
  // sea key colour: plausible sea tone so transparent blends over water read correctly
  const deep=[0.006*(0.25+0.75*day),0.026*(0.25+0.75*day),0.040*(0.25+0.75*day)];
  WATER_KEY.value.setRGB(deep[0]*0.65+hz[0]*0.30+amb[0]*0.05, deep[1]*0.65+hz[1]*0.30+amb[1]*0.05, deep[2]*0.65+hz[2]*0.30+amb[2]*0.05);
  MAT.water.color.copy(WATER_KEY.value);

  // sky uniforms
  skyUniforms.uSunDir.value.copy(sunDir);
  skyUniforms.uMoonDir.value.copy(moonDir);
  skyUniforms.uSunI.value = sharedU.uSunI.value = skyI;
  skyUniforms.uNight.value = night;
  skyUniforms.uStarFade.value = smooth(-2.5,-6.5,elDeg);
  skyUniforms.uMoonVis.value = smooth(0.0,0.05,moonDir.y);
  skyUniforms.uPhase.value = PH;
  // cloud lighting colour: aerosol-tinted sun, allowed to burn from below after sunset
  const burn = smooth(-9,-3,elDeg)*(1-0.55*night);
  const mag = smooth(-1,-6,elDeg)*(1-smooth(-6,-8,elDeg));
  const ci = 3.2*(0.35+0.65*smooth(-6,2,elDeg))*burn*(0.5+0.5/state.exposure)*(1.0+0.5*(1.0-smooth(0,4,elDeg)));
  skyUniforms.uCloudSun.value.setRGB(tint[0]*(1+0.14*mag)*ci, tint[1]*(1-0.16*mag)*ci, tint[2]*(1+0.10*mag)*ci);
  skyUniforms.uCloudAmb.value.setRGB(zen[0]*0.5+0.02*night,zen[1]*0.5+0.025*night,zen[2]*0.5+0.05*night);
  skyUniforms.uCloudFade.value = 1-0.45*night;
  if(DBG===8) skyUniforms.uCloudFade.value = 0;

  // emissives: windows one by one, fixed order
  for(const w of windows){
    const onH = 17.9 + w.order*0.022;
    const offH = 5.6 + w.order*0.012;
    w.mesh.visible = (h24>=onH || h24<=offH);
  }
  const fl = 0.95+0.04*Math.sin(PH*90)+0.02*Math.sin(PH*211+1.3);
  MATwin.color.setRGB(3.6*fl,2.4*fl,1.05*fl);
  MATlantern.color.setRGB(4.4*fl,3.0*fl,1.2*fl);
  for(const lm of lanternMeshes) lm.visible = state.lanternF>0.05;
  const flick = i => 0.82+0.18*Math.sin(PH*67+i*2.1)+0.08*Math.sin(PH*149+i*5.7);
  streetLights.forEach((l,i)=>{ l.intensity = state.lanternF*6.5*flick(i); });
  pierLight.intensity = state.lanternF*7.5*flick(3);
  {
    const EU=sharedU.uEmit.value;
    EU[0].set(lampPos.x,lampPos.y,lampPos.z, night*2.2);
    for(let i=0;i<3;i++){ const p=streetLightPos[i]; if(p) EU[1+i].set(p.x,p.y,p.z,state.lanternF*1.1); else EU[1+i].w=0; }
    EU[4].set(pierLightPos.x,pierLightPos.y,pierLightPos.z, state.lanternF*1.0);
    boatLight.getWorldPosition(_v3);
    EU[5].set(_v3.x,_v3.y,_v3.z, state.lanternF*0.9);
    EU[6].set(HOUSES[0][0],HOUSES[0][1]+3.4,HOUSES[0][2], state.lanternF*0.5);
    EU[7].set(HOUSES[6][0],HOUSES[6][1]+3.4,HOUSES[6][2], state.lanternF*0.5);
  }
  boatLight.intensity = state.lanternF*4.5*flick(5);
  returnBoat.userData.lamp.visible = state.lanternF>0.05;
  for(const b of mooredBoats) b.userData.lamp.visible = state.lanternF>0.05;
  // lighthouse beam
  const baz = PH*6;
  state.beamDir.set(Math.cos(baz),-0.03,Math.sin(baz)).normalize();
  beamSpot.target.position.copy(lampPos).addScaledVector(state.beamDir,120);
  beamSpot.target.updateMatrixWorld();
  beamSpot.intensity = night*900;
  if (lampCoreMesh) lampCoreMesh.visible = night>0.02;

  // boats
  const [bx,bz]=boatPose(t);
  const [bx2,bz2]=boatPose((t+0.002)%1);
  const dx=bx2-bx, dz=bz2-bz, sp=Math.hypot(dx,dz);
  returnBoat.position.set(bx, 0.05+0.12*Math.sin(PH*10+1), bz);
  const sailH=Math.atan2(-dz,dx);
  returnBoat.rotation.y = lerp(Math.PI/2, sailH, smooth(0.02,0.12,sp));
  returnBoat.rotation.z = 0.04*Math.sin(PH*8);
  for(const b of mooredBoats){
    b.position.y = 0.05+0.1*Math.sin(PH*8+b.userData.phase);
    b.rotation.z = 0.035*Math.sin(PH*7+b.userData.phase);
  }

  // gulls
  for(const g of gulls){
    const u=g.userData;
    const a = PH*u.k+u.ph;
    const px=u.cx+Math.cos(a)*u.r, pz=u.cz+Math.sin(a)*u.r*0.7;
    const py=u.h+Math.sin(a*2+u.ph)*1.4;
    const a2=a+0.02;
    g.position.set(px,py,pz);
    g.rotation.y=Math.atan2(Math.cos(a2)*u.r-Math.cos(a)*u.r, Math.sin(a2)*u.r*0.7-Math.sin(a)*u.r*0.7);
    g.rotation.z=0.18*Math.sin(a);
    const glide=smooth(0.15,0.75,Math.sin(PH*5+u.ph*3));
    const flap=Math.sin(PH*46+u.ph)*lerp(0.12,0.85,glide);
    u.wl.rotation.z=flap; u.wr.rotation.z=-flap;
    const s=day; g.visible=s>0.03; g.scale.setScalar(Math.max(s,0.001));
  }
  // villagers
  for(const v of villagers){
    const u=v.userData;
    let d=((t*u.laps*u.total+u.off)%u.total+u.total)%u.total;
    let i=0; while(d>u.lens[i]){ d-=u.lens[i]; i=(i+1)%u.lens.length; }
    const a=u.path.pts[i], b=u.path.pts[(i+1)%u.path.pts.length];
    const f=d/u.lens[i];
    v.position.set(lerp(a[0],b[0],f), u.path.y+0.03*Math.abs(Math.sin(PH*60+u.bobPh)), lerp(a[1],b[1],f));
    v.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1]);
    const out = day>0.18 || u.carrier;
    v.visible=out;
    u.lamp.visible = state.lanternF>0.1 && u.carrier;
  }
  // smoke
  const rate=0.45+0.55*Math.max(night, smooth(15,18,h24)*(1-smooth(20,22,h24)));
  const rim = dusk*0.85;
  const rimCol = sunCol;
  for(const sp of smokePuffs){
    const u=sp.userData;
    const age=((t*3+u.seed)%1+1)%1;
    const rise=age*7.5;
    const drift=age*age*4.5;
    const curl=Math.sin(age*9+u.curl)*0.7*age;
    sp.position.set(u.src.x+drift+curl, u.src.y+rise, u.src.z+Math.cos(age*7+u.curl)*0.5*age+age*1.2);
    const sc=0.28+age*1.0;
    sp.scale.set(sc*0.75,sc*1.7,1);
    sp.material.rotation=u.curl+age*2.0;
    sp.material.opacity=(1-age)*0.16*rate;
    const c=sp.material.color;
    const g0=0.66*(1-0.6*night);
    const rc=[lerp(sunCol.r,0.5,night),lerp(sunCol.g,0.6,night),lerp(sunCol.b,0.9,night)];
    const rim2=dusk*0.85+night*0.30;
    c.setRGB(lerp(g0,rc[0]*1.25,rim2), lerp(g0,rc[1]*1.25,rim2), lerp(g0+0.02,rc[2]*1.25,rim2));
  }
  waterUniforms.uPhase.value=PH;
}

/* ---------------- renderer & post pipeline ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping;
renderer.autoClear=true;

const BUF_H = 270;
let BUF_W = 480;
const RT = {};
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2));
postQuad.frustumCulled=false;
postScene.add(postQuad);
const POST_VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;

const depthMat = new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking});
const sunShadowRT = new THREE.WebGLRenderTarget(2048,2048,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});

// shared uniforms (camera is static)
const sharedU = {
  tDepth:{value:null},
  uInvProj:{value:new THREE.Matrix4()},
  uProj:{value:new THREE.Matrix4()},
  uCamWorld:{value:new THREE.Matrix4()},
  uViewMat:{value:new THREE.Matrix4()},
  uCamPos:{value:camera.position.clone()},
  uSunTint:SUN_TINT, uKey:WATER_KEY,
  uNear:{value:camera.near}, uFar:{value:camera.far},
  uRes:{value:new THREE.Vector2(480,270)},
  uPhase:{value:0},
  uSunDir:{value:new THREE.Vector3()},
  uMoonDir:{value:new THREE.Vector3()},
  uLightDir:{value:new THREE.Vector3()},
  uLightColor:{value:new THREE.Color()},
  uSunI:{value:24},
  uNight:{value:0}, uDay:{value:1},
  uAmbient:{value:new THREE.Color()},
  uShadowTex:{value:sunShadowRT.texture},
  uShadowMatrix:{value:shadowMatrix},
  uBeamDir:{value:new THREE.Vector3(1,0,0)},
  uLampPos:{value:lampPos.clone()},
  uSmoke:{value:[new THREE.Vector4(),new THREE.Vector4(),new THREE.Vector4(),new THREE.Vector4()]},
  uFoamRocks:{value:foamRocks.concat(Array(Math.max(0,12-foamRocks.length)).fill(new THREE.Vector4(0,0,0,0))).slice(0,12)},
  uEmit:{value:Array.from({length:8},()=>new THREE.Vector4(0,0,0,0))},
};
for(let i=0;i<Math.min(4,smokeSources.length);i++){
  sharedU.uSmoke.value[i].set(smokeSources[i].x,smokeSources[i].y,smokeSources[i].z,1);
}
const GLSL_COMMON = `
  uniform sampler2D tDepth;
  uniform mat4 uInvProj,uProj,uCamWorld,uViewMat;
  uniform vec3 uCamPos;
  uniform float uNear,uFar;
  uniform vec2 uRes;
  float linDepth(float d){ return (2.0*uNear*uFar)/(uFar+uNear-(2.0*d-1.0)*(uFar-uNear)); }
  vec3 viewPos(vec2 uv){
    float d=texture2D(tDepth,uv).x;
    vec4 vp=uInvProj*vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
    return vp.xyz/vp.w;
  }
  vec3 worldPos(vec2 uv){ return (uCamWorld*vec4(viewPos(uv),1.0)).xyz; }
  float unpackD(vec4 v){ return dot(v, vec4(1.0, 1.0/255.0, 1.0/65025.0, 1.0/16581375.0)); }
  float bayer2(vec2 p){ return mod(p.x*2.0+p.y*3.0,4.0); }
  float bayer4(vec2 p){ vec2 q=floor(mod(p,4.0)); return (4.0*bayer2(mod(q,2.0))+bayer2(floor(q/2.0)))/16.0; }
` + HASH_GLSL;
function makeRT(w,h,depth,linear){
  const rt=new THREE.WebGLRenderTarget(Math.max(2,w),Math.max(2,h),{
    type:THREE.HalfFloatType,
    minFilter:linear?THREE.LinearFilter:THREE.NearestFilter,
    magFilter:linear?THREE.LinearFilter:THREE.NearestFilter,
    depthBuffer:!!depth
  });
  if(depth){ rt.depthTexture=new THREE.DepthTexture(Math.max(2,w),Math.max(2,h)); rt.depthTexture.type=THREE.UnsignedIntType; }
  return rt;
}
function buildTargets(){
  for(const k of Object.keys(RT)){ if(RT[k]&&RT[k].dispose) RT[k].dispose(); }
  RT.hdrA = makeRT(BUF_W,BUF_H,true);
  RT.ssao = makeRT(BUF_W,BUF_H);
  RT.ssaoB = makeRT(BUF_W,BUF_H);
  RT.surf = makeRT(BUF_W,BUF_H);
  RT.water = makeRT(BUF_W,BUF_H);
  RT.vol = makeRT(BUF_W,BUF_H);
  RT.volB = makeRT(BUF_W,BUF_H);
  RT.comb = makeRT(BUF_W,BUF_H);
  RT.b0a = makeRT(BUF_W>>1,BUF_H>>1,false,true);
  RT.b0b = makeRT(BUF_W>>1,BUF_H>>1,false,true);
  RT.b1a = makeRT(BUF_W>>2,BUF_H>>2,false,true);
  RT.b1b = makeRT(BUF_W>>2,BUF_H>>2,false,true);
  RT.b2a = makeRT(BUF_W>>3,BUF_H>>3,false,true);
  RT.b2b = makeRT(BUF_W>>3,BUF_H>>3,false,true);

  sharedU.uRes.value.set(BUF_W,BUF_H);
}
function pass(mat,target){
  postQuad.material=mat;
  renderer.setRenderTarget(target);
  renderer.render(postScene,postCam);
}
function postMat(fs,extra){
  return new THREE.ShaderMaterial({
    uniforms:Object.assign({},sharedU,extra||{}),
    vertexShader:POST_VS, fragmentShader:fs,
    depthTest:false, depthWrite:false, extensions:{derivatives:true}

}

/* ---- SSAO (12 samples, screen-locked) ---- */
const ssaoMat = postMat(GLSL_COMMON + `
  varying vec2 vUv;
  void main(){
    float d=texture2D(tDepth,vUv).x;
    if(d>=0.9999){ gl_FragColor=vec4(1.0); return; }
    vec3 p=viewPos(vUv);
    vec3 n=normalize(cross(dFdx(p),dFdy(p)));
    if(n.z<0.0) n=-n;
    float rot=hash21(vUv*uRes)*6.28318;
    float ao=0.0;
    float rad=1.25;
    vec3 tg=normalize(abs(n.z)<0.98?cross(n,vec3(0.0,0.0,1.0)):vec3(1.0,0.0,0.0));
    vec3 bt=cross(n,tg);
    for(int i=0;i<12;i++){
      float fi=float(i);
      float ang=fi*2.39996+rot;
      float rr=(fi+0.7)/12.0;
      vec3 dir=vec3(cos(ang)*sqrt(rr),sin(ang)*sqrt(rr),sqrt(max(1.0-rr,0.05)));
      vec3 sp=p+(tg*dir.x+bt*dir.y+n*dir.z)*rad*(0.25+0.75*rr);
      vec4 clip=uProj*vec4(sp,1.0);
      vec2 suv=clip.xy/clip.w*0.5+0.5;
      if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0) continue;
      float sd=linDepth(texture2D(tDepth,suv).x);
      float spz=-sp.z;
      float occ=step(sd+0.07,spz);
      occ*=smoothstep(rad*2.2,rad*0.4,abs(sd-spz));
      ao+=occ;
    }
    ao=1.0-(ao/12.0)*0.92;
    gl_FragColor=vec4(vec3(ao),1.0);
  }`);
const ssaoBlurMat = postMat(GLSL_COMMON + `
  varying vec2 vUv; uniform sampler2D tSrc;
  void main(){
    float dc=linDepth(texture2D(tDepth,vUv).x);
    vec4 sum=texture2D(tSrc,vUv); float w=1.0;
    for(int i=0;i<4;i++){
      vec2 off=(i==0)?vec2(1.5,0.0):(i==1)?vec2(-1.5,0.0):(i==2)?vec2(0.0,1.5):vec2(0.0,-1.5);
      vec2 uv=vUv+off/uRes;
      float ds=linDepth(texture2D(tDepth,uv).x);
      float wt=exp(-abs(dc-ds)*0.9);
      sum+=texture2D(tSrc,uv)*wt; w+=wt;
    }
    gl_FragColor=sum/w;
  }`,{tSrc:{value:null}});
const aoApplyMat = postMat(`
  varying vec2 vUv; uniform sampler2D tScene,tAO; uniform vec3 uKey;
  void main(){
    vec3 c=texture2D(tScene,vUv).rgb;
    if(distance(c,uKey)<0.02){ gl_FragColor=vec4(c,1.0); return; } // keep water key exact for the SSR pass
    float ao=texture2D(tAO,vUv).r;
    float lum=dot(c,vec3(0.299,0.587,0.114));
    float prot=1.0/(1.0+max(lum-1.2,0.0)*0.8);
    c*=mix(1.0,ao,0.85*prot);
    gl_FragColor=vec4(c,1.0);
  }`,{tScene:{value:null},tAO:{value:null}});

/* ---- volumetrics: 48-step march through the sun shadow map ---- */
const volMat = postMat(GLSL_COMMON + ATMO_GLSL + `
  varying vec2 vUv;
  uniform sampler2D uShadowTex;
  uniform mat4 uShadowMatrix;
  uniform vec3 uLightDir,uLightColor,uAmbient,uBeamDir,uLampPos;
  uniform float uPhase,uNight;
  uniform vec4 uSmoke[4];
  float coastXs(float z){
    float c=-20.0+2.5*sin(z*0.1+1.7);
    float head=smoothstep(-50.0,-34.0,z)*(1.0-smoothstep(-30.0,-22.0,z));
    return c-11.0*head;
  }
  float density(vec3 p){
    float c=coastXs(p.z);
    float sea=1.0-smoothstep(c-2.0,c+16.0,p.x);
    float d=0.010*exp(-max(p.y,0.0)/7.0)*sea + 0.0045*exp(-max(p.y,0.0)/11.0)*(1.0-0.5*sea);
    d*=0.7+0.6*vnoise(p*0.06+vec3(cos(uPhase*2.0)*8.0,0.0,sin(uPhase*3.0)*8.0));
    for(int i=0;i<4;i++){
      if(uSmoke[i].w<0.5) continue;
      vec3 lp=p-uSmoke[i].xyz;
      if(lp.y>0.0 && lp.y<9.0){
        float bend=lp.y*lp.y*0.055;
        float cx=uSmoke[i].x+bend+sin(lp.y*0.8+uPhase*4.0+float(i)*2.1)*0.12*lp.y;
        float cz=uSmoke[i].z+lp.y*0.16;
        float rad=0.5+lp.y*0.24;

        float pl=smoothstep(rad,rad*0.25,r)*(1.0-lp.y/9.0);
        pl*=0.55+0.45*vnoise(p*0.9+vec3(0.0,-uPhase*3.0,0.0));
        d+=pl*0.34;
      }
    }
    return d;
  }
  float shadowVis(vec3 p){
    vec4 su=uShadowMatrix*vec4(p,1.0);
    vec3 uv=su.xyz/su.w;
    if(uv.x<0.002||uv.x>0.998||uv.y<0.002||uv.y>0.998||uv.z>0.998) return 1.0;
    float sd=unpackD(texture2D(uShadowTex,uv.xy));
    return step(sd+0.0022,uv.z);
  }
  void main(){
    float d=texture2D(tDepth,vUv).x;
    float maxDist=(d>=0.9999)?170.0:min(linDepth(d),170.0);
    vec4 vp=uInvProj*vec4(vUv*2.0-1.0,1.0,1.0);
    vec3 rd=normalize(mat3(uCamWorld)*normalize(vp.xyz/vp.w));
    float jit=(bayer4(gl_FragCoord.xy)+0.5)/48.0;

    float g=0.7;

/* ---- sea: screen-space reflections + sky fallback, fresnel, glitter, foam ---- */
const waterMat = postMat(GLSL_COMMON + ATMO_GLSL + `
  varying vec2 vUv;
  uniform sampler2D tScene;
  uniform vec3 uSunDir,uMoonDir,uLightDir,uLightColor,uAmbient,uSunTint,uKey;
  uniform float uPhase,uNight,uDay,uSunI;
  uniform vec4 uFoamRocks[12];
  uniform vec4 uEmit[8];
  float coastXs(float z){
    float c=-20.0+2.5*sin(z*0.1+1.7);
    float head=smoothstep(-50.0,-34.0,z)*(1.0-smoothstep(-30.0,-22.0,z));
    return c-11.0*head;
  }
  bool isKey(vec3 c){ return distance(c,uKey)<0.02; }
  void main(){
    vec3 base=texture2D(tScene,vUv).rgb;
    float d=texture2D(tDepth,vUv).x;
    vec3 p=worldPos(vUv);
    if(d>=0.9999){
      if(!isKey(base)){ gl_FragColor=vec4(base,1.0); return; }
      p=uCamPos+normalize(p-uCamPos)*3000.0; p.y=0.0; // sea beyond depth precision: analytic far point
    } else if(linDepth(d)>2500.0) p=vec3(p.x,0.0,p.z); // far-clip depth precision: keep the sea plane flat
    if(abs(p.y)>0.65 || !isKey(base)){ gl_FragColor=vec4(base,1.0); return; }
    vec2 q=p.xz;
    float dfade=exp(-length(p-uCamPos)*0.012); // calm the far sea so dither reads as clean bands
    float amp=mix(0.0,1.0,dfade);
    // directional swells travelling toward the shore (+x), two scales + cross-swell
    float w1=dot(q,vec2(0.94,0.34)), w2=dot(q,vec2(0.80,-0.60)), w3=dot(q,vec2(0.55,0.83));
    float h1=cos(w1*0.35-uPhase*6.0), h2=cos(w2*0.85-uPhase*9.0), h3=cos(w3*0.18-uPhase*4.0);
    float dx=amp*(0.0526*h1+0.068*h2+0.0059*h3)+dfade*dfade*(0.05*(vnoise(vec3(q*1.7,3.3))-0.5)+0.04*cos(w2*2.1-uPhase*11.0));
    float dz=amp*(0.0190*h1-0.051*h2+0.0089*h3)+dfade*dfade*(0.05*(vnoise(vec3(q*1.7+9.1,7.7))-0.5)+0.04*cos(w1*2.3+uPhase*10.0));
    vec3 N=normalize(vec3(-dx,1.0,-dz));
    vec3 V=normalize(uCamPos-p);
    vec3 R=reflect(-V,N);
    float fres=0.02+0.98*pow(1.0-max(dot(N,V),0.0),5.0);
    // screen-space reflection march
    vec3 refl=vec3(-1.0); vec2 hitUv=vec2(0.5);

    vec3 deep=vec3(0.006,0.026,0.040)*(0.25+0.75*uDay)+uAmbient*0.02*uDay;
    float depW=asin(clamp(V.y,0.0,1.0));
    vec3 skyDir=normalize(mix(R,vec3(-V.x,0.0015,-V.z),smoothstep(0.02,0.004,depW)));
    vec3 skyRefl=atmo(skyDir,uSunDir,uSunI,uSunTint)+vec3(0.010,0.017,0.040)*uNight;
    vec3 skyReflH=atmo(vec3(skyDir.x,0.0015,skyDir.z),uSunDir,uSunI,uSunTint)+vec3(0.010,0.017,0.040)*uNight;

    skyRefl=mix(skyRefl,skyRefl*(uSunTint*1.7+vec3(0.25,0.08,0.12)),0.75*hfW);
    float hlw=dot(skyRefl,vec3(0.333));
    float dayG=smoothstep(2.0,10.0,elW);
    skyRefl=mix(skyRefl,vec3(hlw)*vec3(0.72,0.86,1.18),0.70*exp(-max(skyDir.y,0.008)*10.0)*(0.35+0.65*dayG)*(1.0-uNight));
    skyRefl+=vec3(0.06,0.10,0.18)*exp(-max(skyDir.y,0.008)*5.0)*dayG;
    skyRefl=mix(vec3(dot(skyRefl,vec3(0.333))),skyRefl,1.0+0.60*dayG);
    skyRefl*=mix(vec3(1.0),vec3(0.60,0.78,1.55),0.9*dayG);
    skyRefl=mix(skyRefl,skyRefl*vec3(0.55,0.62,0.78)+vec3(0.006,0.026,0.040)*0.6,0.5*exp(-max(skyDir.y,0.008)*8.0)*(1.0-uNight));
    float agW=smoothstep(-7.0,-1.0,elW)*(1.0-smoothstep(-1.0,2.0,elW));
    float azpW=pow(max(dot(normalize(vec3(skyDir.x,0.0,skyDir.z)),normalize(vec3(uSunDir.x,0.0,uSunDir.z))),0.0),3.0);

      vec3 d=normalize(E.xyz-p);

      float st=pow(max(dot(Rc,dc),0.0),250.0);
      st*=(0.45+0.55*vnoise(vec3(q*2.3,5.5)))*smoothstep(0.02,0.12,dfade);

      vec4 cp=uProj*uViewMat*vec4(E.xyz*vec3(1.0,-1.0,1.0),1.0);

      }

    // screen-locked pixel sparkles, densest where the mirror ray aligns with the sun
    vec3 vh=normalize(vec3(-V.x,0.0,-V.z));
    vec3 lh=normalize(vec3(uLightDir.x,0.0001,uLightDir.z));
    float azd=acos(clamp(dot(vh,lh),-1.0,1.0));
    float fall=exp(-pow(azd/0.035,2.0));
    float sp=pow(max(dot(R,uLightDir),0.0),160.0);
    float patchN=smoothstep(0.45,0.75,vnoise(vec3(q*2.2,7.0)));
    float mask=step(0.55,hash21(gl_FragCoord.xy));
    float tw=0.35+0.65*(0.5+0.5*sin(uPhase*24.0+hash21(gl_FragCoord.xy+7.0)*6.2831));

    float crest=smoothstep(0.86,0.98,0.5+0.5*h1)*0.025*(0.3+0.7*uDay)*smoothstep(0.4,0.7,vnoise(vec3(q*0.5,2.2)));

  }`,{tScene:{value:null}});

/* ---- bloom chain (pixelated, at buffer resolution) ---- */
const brightMat = postMat(`
  varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uTexel;
  void main(){
    vec3 c=(texture2D(tSrc,vUv+uTexel*vec2(-0.5,-0.5)).rgb+texture2D(tSrc,vUv+uTexel*vec2(0.5,-0.5)).rgb+

const blurMat = postMat(`
  varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uDir;
  void main(){
    vec3 c=texture2D(tSrc,vUv).rgb*0.227027;
    c+=texture2D(tSrc,vUv+uDir*1.0).rgb*0.1945946;
    c+=texture2D(tSrc,vUv-uDir*1.0).rgb*0.1945946;
    c+=texture2D(tSrc,vUv+uDir*2.0).rgb*0.1216216;
    c+=texture2D(tSrc,vUv-uDir*2.0).rgb*0.1216216;
    c+=texture2D(tSrc,vUv+uDir*3.0).rgb*0.054054;
    c+=texture2D(tSrc,vUv-uDir*3.0).rgb*0.054054;
    c+=texture2D(tSrc,vUv+uDir*4.0).rgb*0.016216;
    c+=texture2D(tSrc,vUv-uDir*4.0).rgb*0.016216;

const copyMat = postMat(`varying vec2 vUv; uniform sampler2D tSrc; void main(){ gl_FragColor=texture2D(tSrc,vUv); }`,{tSrc:{value:null}});
const combMat = postMat(`
  varying vec2 vUv; uniform sampler2D tScene,tVol;
  void main(){
    vec4 v=texture2D(tVol,vUv);
    gl_FragColor=vec4(texture2D(tScene,vUv).rgb*v.a+v.rgb,1.0);
  }`,{tScene:{value:null},tVol:{value:null}});

/* ---- final: bloom add, ACES, exposure, teal/orange grade, sRGB, 48-level Bayer quantize, integer upscale ---- */
const finalU = {
  tFinal:{value:null}, uB0:{value:null}, uB1:{value:null}, uB2:{value:null},
  uExposure:{value:1}, uLetterbox:{value:new THREE.Color(0.01,0.015,0.03)},
  uBufRes:{value:new THREE.Vector2(480,270)},
  uScale:{value:1}, uOffset:{value:new THREE.Vector2(0,0)}, uDbg:{value:0},
};
const finalMat = new THREE.ShaderMaterial({
  uniforms:Object.assign({},sharedU,finalU),
  vertexShader:POST_VS, depthTest:false, depthWrite:false,
  fragmentShader:`
    varying vec2 vUv;
    uniform sampler2D tFinal,uB0,uB1,uB2;
    uniform sampler2D tDepth;
    uniform float uExposure,uScale,uDbg;
    uniform vec3 uLetterbox;
    uniform vec2 uBufRes,uOffset;
    float bayer2(vec2 p){ return mod(p.x*2.0+p.y*3.0,4.0); }
    float bayer4(vec2 p){ vec2 q=floor(mod(p,4.0)); return (4.0*bayer2(mod(q,2.0))+bayer2(floor(q/2.0)))/16.0; }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
    void main(){
      vec2 rel=(gl_FragCoord.xy-uOffset)/uScale;
      if(rel.x<0.0||rel.y<0.0||rel.x>=uBufRes.x||rel.y>=uBufRes.y){
        gl_FragColor=vec4(uLetterbox,1.0); return;
      }
      vec2 uv=(floor(rel)+0.5)/uBufRes;
      if(uDbg>3.5){ float dd=texture2D(tDepth,uv).x; gl_FragColor=vec4(vec3(dd),1.0); return; }
      vec3 c=texture2D(tFinal,uv).rgb;
      c+=texture2D(uB0,uv).rgb*0.50+texture2D(uB1,uv).rgb*0.35+texture2D(uB2,uv).rgb*0.28;
      c*=uExposure;
      c=aces(c);
      float l=dot(c,vec3(0.299,0.587,0.114));
      c*=mix(vec3(0.93,1.01,1.08),vec3(1.0),l);     // teal shadows
      c*=mix(vec3(1.0),vec3(1.06,1.0,0.94),l*0.8);  // warm highlights
      c=pow(c,vec3(1.0/2.2));
      float b=bayer4(floor(rel));
      c=floor(c*47.0+b)/47.0;
      gl_FragColor=vec4(c,1.0);
    }`
});

/* ---------------- resize ---------------- */
function resize(){
  const w=Math.max(2,innerWidth), h=Math.max(2,innerHeight);
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  BUF_W=Math.max(2,Math.round(BUF_H*w/h));
  buildTargets();
  sharedU.uInvProj.value.copy(camera.projectionMatrixInverse);
  sharedU.uProj.value.copy(camera.projectionMatrix);
  sharedU.uCamWorld.value.copy(camera.matrixWorld);
  sharedU.uViewMat.value.copy(camera.matrixWorld).invert();
  finalU.uBufRes.value.set(BUF_W,BUF_H);
  const s=Math.max(1,Math.floor(Math.min(w/BUF_W,h/BUF_H)));
  finalU.uScale.value=s;
  finalU.uOffset.value.set(Math.floor((w-BUF_W*s)/2),Math.floor((h-BUF_H*s)/2));
  brightMat.uniforms.uTexel.value.set(1/BUF_W,1/BUF_H);
}
addEventListener('resize',resize);

/* ---------------- sound (starts on first click) ---------------- */
let audioNodes=null, gullTimer=2.5, cricketTimer=0, prevH24=12;
function buildAudio(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const dd=nb.getChannelData(0); for(let i=0;i<dd.length;i++) dd[i]=Math.random()*2-1;
  const noise=()=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;s.start();return s;};
  const w1=noise(); const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300; lp.Q.value=0.5;
  const wg=ctx.createGain(); wg.gain.value=0.42;
  w1.connect(lp); lp.connect(wg); wg.connect(master);
  const lfo=ctx.createOscillator(); lfo.frequency.value=0.08; const lg=ctx.createGain(); lg.gain.value=0.22;
  lfo.connect(lg); lg.connect(wg.gain); lfo.start();
  const w2=noise(); const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=850; bp.Q.value=0.7;
  const hg=ctx.createGain(); hg.gain.value=0.07; w2.connect(bp); bp.connect(hg); hg.connect(master);
  const lfo2=ctx.createOscillator(); lfo2.frequency.value=0.063; const lg2=ctx.createGain(); lg2.gain.value=0.045;
  lfo2.connect(lg2); lg2.connect(hg.gain); lfo2.start();
  const wn=noise(); const wf=ctx.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=480; wf.Q.value=0.4;
  const windG=ctx.createGain(); windG.gain.value=0; wn.connect(wf); wf.connect(windG); windG.connect(master);
  const co=ctx.createOscillator(); co.type='sine'; co.frequency.value=4250;
  const cg=ctx.createGain(); cg.gain.value=0; co.connect(cg); cg.connect(master); co.start();
  return {ctx,master,wg,hg,windG,cg};
}
function gullCry(){
  const {ctx,master}=audioNodes; const t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(1180,t); o.frequency.exponentialRampToValueAtTime(860,t+0.45);
  const vib=ctx.createOscillator(); vib.frequency.value=32; const vg=ctx.createGain(); vg.gain.value=55;
  vib.connect(vg); vg.connect(o.frequency);
  const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=2.5;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.10,t+0.06); g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); vib.start(t); o.stop(t+0.6); vib.stop(t+0.6);
}
function bell(){
  const {ctx,master}=audioNodes; const t=ctx.currentTime;
  [[494,0.20],[1244,0.09],[2640,0.045],[3980,0.025]].forEach(([f,a])=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); g.gain.setValueAtTime(a,t); g.gain.exponentialRampToValueAtTime(0.0001,t+5.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+5.6);
  });
}
function updateAudio(dt){
  if(!audioNodes) return;
  const s=state, t=audioNodes.ctx.currentTime;
  audioNodes.windG.gain.setTargetAtTime(0.03+0.14*s.night,t,0.5);
  cricketTimer-=dt;
  if(s.night>0.3 && cricketTimer<=0){
    const g=audioNodes.cg.gain;
    for(let k=0;k<3;k++){ g.setValueAtTime(0.026*s.night,t+k*0.16); g.setValueAtTime(0.0001,t+k*0.16+0.07); }
    cricketTimer=0.55+Math.random()*0.5;
  }
  gullTimer-=dt;
  if(s.day>0.5 && gullTimer<=0){ gullCry(); gullTimer=3+Math.random()*6; }
  const h24=((s.h%24)+24)%24;
  if(prevH24<17.9 && h24>=17.9 && h24<20) bell();
  prevH24=h24;
}
addEventListener('pointerdown',()=>{
  if(!audioNodes){ try{ audioNodes=buildAudio(); }catch(e){} }
  else if(audioNodes.ctx.state==='suspended'){ audioNodes.ctx.resume(); }
});

/* ---------------- frame loop ---------------- */
const shadowHide=[sky,water,...smokePuffs,...gulls];
let last=performance.now()/1000, frames=0;
function blurStep(src,dst,horiz){
  blurMat.uniforms.tSrc.value=src.texture;
  blurMat.uniforms.uDir.value.set(horiz?1/src.width:0, horiz?0:1/src.height);
  pass(blurMat,dst);
}
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now()/1000;
  const dt=Math.min(now-last,0.1); last=now;
  if(!FREEZE) simTime+=dt;
  const t=(((simTime%LOOP)+LOOP)%LOOP)/LOOP;
  updateWorld(t);
  sharedU.uPhase.value=state.phase;
  sharedU.uSunDir.value.copy(state.sunDir);
  sharedU.uMoonDir.value.copy(state.moonDir);
  sharedU.uLightDir.value.copy(state.lightDir);
  sharedU.uLightColor.value.copy(state.lightColor);
  sharedU.uNight.value=state.night;
  sharedU.uDay.value=state.day;
  sharedU.uAmbient.value.copy(hemi.color).multiplyScalar(hemi.intensity);
  sharedU.uBeamDir.value.copy(state.beamDir);
  finalU.uExposure.value=state.exposure;
  finalU.uDbg.value = DBG===4 ? 4 : 0;
  finalU.uLetterbox.value.copy(state.letterbox);
  // sun/moon shadow depth (for volumetrics)
  const vis=shadowHide.map(o=>o.visible);
  shadowHide.forEach(o=>o.visible=false);
  renderer.setRenderTarget(sunShadowRT);
  renderer.setClearColor(0xffffff,1); renderer.clear();
  scene.overrideMaterial=depthMat;
  renderer.render(scene,shadowCam);
  scene.overrideMaterial=null;
  shadowHide.forEach((o,i)=>o.visible=vis[i]);
  // main HDR render
  renderer.setRenderTarget(RT.hdrA);
  renderer.setClearColor(0x000000,1);
  renderer.render(scene,camera);
  // post chain, all at buffer resolution
  pass(ssaoMat,RT.ssao);
  ssaoBlurMat.uniforms.tSrc.value=RT.ssao.texture; pass(ssaoBlurMat,RT.ssaoB);
  aoApplyMat.uniforms.tScene.value=RT.hdrA.texture; aoApplyMat.uniforms.tAO.value=RT.ssaoB.texture; pass(aoApplyMat,RT.surf);
  waterMat.uniforms.tScene.value=RT.surf.texture; pass(waterMat,RT.water);
  pass(volMat,RT.vol);
  volBlurMat.uniforms.tSrc.value=RT.vol.texture; pass(volBlurMat,RT.volB);
  combMat.uniforms.tScene.value=RT.water.texture; combMat.uniforms.tVol.value=RT.volB.texture; pass(combMat,RT.comb);
  brightMat.uniforms.tSrc.value=RT.comb.texture; pass(brightMat,RT.b0a);
  blurStep(RT.b0a,RT.b0b,true); blurStep(RT.b0b,RT.b0a,false);
  copyMat.uniforms.tSrc.value=RT.b0a.texture; pass(copyMat,RT.b1a);
  blurStep(RT.b1a,RT.b1b,true); blurStep(RT.b1b,RT.b1a,false);
  copyMat.uniforms.tSrc.value=RT.b1a.texture; pass(copyMat,RT.b2a);
  blurStep(RT.b2a,RT.b2b,true); blurStep(RT.b2b,RT.b2a,false);
  finalMat.uniforms.tFinal.value = DBG===1 ? RT.surf.texture : DBG===2 ? RT.hdrA.texture : DBG===3 ? RT.water.texture : RT.comb.texture;
  finalMat.uniforms.uB0.value=RT.b0a.texture;
  finalMat.uniforms.uB1.value=RT.b1a.texture;
  finalMat.uniforms.uB2.value=RT.b2a.texture;
  pass(finalMat,null);
  updateAudio(dt);
  frames++;
  if(frames===2) window.__HARBOR_READY__=true;
}
resize();
requestAnimationFrame(frame);
</script>
